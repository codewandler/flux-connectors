name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Note: deliberately NOT setting `RUSTFLAGS: -D warnings` globally — that would also deny warnings
  # in third-party dependencies, breaking CI on any upstream warning or new rustc lint. Warning
  # enforcement for our own code lives in the clippy step below (`-- -D warnings`).

jobs:
  check:
    name: build · test · clippy · fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Rust toolchain
        # Pinned, not `stable`: every Rust release ships new clippy lints that `-D warnings`
        # promotes to errors, so a floating CI toolchain breaks on code that is clean locally.
        # To bump: change the version here, run clippy/fmt locally on that same version, fix, commit.
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          # `master` above pins the action's *code* to a commit; the toolchain the tag used to encode
          # is an explicit — and, at this SHA, required — input.
          toolchain: "1.97.0"
          components: rustfmt, clippy

      - name: Cache cargo
        # `cache-bin` defaults to `true` at this SHA, so `$CARGO_HOME/bin` — and therefore the
        # `cargo-nextest` the next step installs — is restored with the rest of the cargo cache.
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      # The test runner is a pinned tool, exactly like the toolchain above (C-543). The version is
      # the one `.config/nextest.toml` requires, and that file refuses an older one (exit 92) —
      # nextest only *warns* on a configuration key it does not recognise, so without the pin the
      # same config could quietly mean two different things on two machines.
      #
      # `cargo install` rather than a prebuilt-binary action: it builds from the same crates.io
      # source the workspace already trusts and adds no fourth third-party action to the job that
      # decides whether a pull request merges. The cost is honest — a cold cache pays a source
      # build here — which is why the step is guarded and why `cache-bin` above matters.
      # `taiki-e/install-action` would make this a few seconds; that trade is recorded in C-543
      # and is one line to change if the cold-cache cost outweighs the narrower trust surface.
      - name: Install cargo-nextest
        # The guard reads the `release:` line, not the first one: `cargo nextest --version` prints
        # `cargo-nextest 0.9.143 (60fa45f63 2026-08-04)` there, so an exact-line match against the
        # version alone never matches and the step would reinstall on every run.
        run: |
          if ! cargo nextest --version 2>/dev/null | grep -qx "release: 0.9.143"; then
            cargo install cargo-nextest --locked --version 0.9.143
          fi
          cargo nextest --version

      # `--locked` here, not on the build/test steps below: it makes a stale or hand-edited
      # `Cargo.lock` an obvious, named failure rather than something cargo silently repairs, while
      # the gate commands stay byte-identical to the ones in AGENTS.md's dev loop.
      - name: Fetch locked dependencies
        run: cargo fetch --locked

      - name: Build
        run: cargo build --workspace

      # `cargo test` runs one test *binary* at a time — since C-533 that is nine integration
      # binaries plus the per-crate unit tests, serialised. nextest schedules every test as its own
      # process across every core instead.
      #
      # `--no-fail-fast` is the one thing this step did NOT say before C-543, while AGENTS.md
      # § Validation has required it throughout — plain `cargo test --workspace` stops at the first
      # failing binary, so this job could report one failure where the tree had several. A provider
      # story is EXPECTED to leave nine whole-catalogue staleness tests red, spread across the
      # workspace, and the documented workflow is to report that complete named list from ONE run.
      # For nextest the flag restates its own default; it is spelled out because that is the flag
      # the documentation names, and `.config/nextest.toml` pins the default behind it.
      - name: Test
        run: cargo nextest run --workspace --no-fail-fast

      # nextest executes test binaries; a doc-test is compiled and run by rustdoc, so nextest runs
      # none of the workspace's 12. They stay in the gate under their own name — otherwise adopting
      # a faster runner would have silently shrunk what this job verifies, which is the failure mode
      # C-543 exists to avoid rather than to cause.
      - name: Doc-tests
        run: cargo test --workspace --doc

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Format
        run: cargo fmt --all --check

  connector-secrets-targets:
    name: connector-secrets · ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
          - aarch64-unknown-linux-gnu
          - x86_64-unknown-linux-gnu
          - x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Rust toolchain and target
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: "1.97.0"
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: connector-secrets-${{ matrix.target }}

      # Cross-compilation covers the target-specific backend and every integration-test consumer.
      # It does not replace native security and durability execution below.
      - name: Check the public crate surface
        run: cargo check --locked -p codewandler-connector-secrets --all-targets --target ${{ matrix.target }}

  connector-secrets-native:
    name: connector-secrets · native ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: "1.97.0"

      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: connector-secrets-native-${{ matrix.target }}

      # A target check cannot prove native durability or security behaviour. Refuse any runner image
      # whose architecture drifts from the triple this matrix row claims to exercise.
      - name: Assert the runtime host triple
        shell: bash
        run: |
          actual="$(rustc -vV | sed -n 's/^host: //p')"
          test "$actual" = "${{ matrix.target }}"

      # This full native suite executes the durable backend, prepared-transaction crash/recovery and
      # lease fixtures, concurrency, bounds, migration, and the platform owner/DACL/link refusals.
      - name: Test the durable backend natively
        run: cargo test --locked -p codewandler-connector-secrets

      # Creating a genuinely foreign-owned fixture needs privilege. The test is ignored in the
      # ordinary package suite and refuses to run unless it is root, so every native Unix row runs
      # both fixtures explicitly instead of turning missing ownership evidence into a silent skip.
      - name: Refuse a foreign Unix owner without repair
        if: runner.os != 'Windows'
        shell: bash
        run: |
          sudo env \
            "PATH=$PATH" \
            "CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}" \
            "RUSTUP_HOME=${RUSTUP_HOME:-$HOME/.rustup}" \
            cargo test --locked -p codewandler-connector-secrets --lib \
              file::tests::a_foreign_owned_store_is_refused_without_repair -- --ignored --exact
          sudo env \
            "PATH=$PATH" \
            "CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}" \
            "RUSTUP_HOME=${RUSTUP_HOME:-$HOME/.rustup}" \
            cargo test --locked -p codewandler-connector-secrets --lib \
              file::tests::a_foreign_owned_directory_is_refused_without_repair -- --ignored --exact

  host-page:
    name: the host's operator page
    runs-on: ubuntu-latest
    # C-239. `crates/connectors-api/src/index.html` is ~260 lines of JavaScript, and until this job
    # existed nothing could execute it: C-234's security review ran 16 mutations and M15 — drawing
    # the developer sign-in unconditionally — stayed green for exactly that reason, while AGENTS.md
    # requires a failing-first test for a behavioural change.
    #
    # Its own job, not a step in `check`: it needs Node rather than a Rust toolchain, and the four
    # gate commands in `check` must stay the ones a developer runs locally. The Rust half of the
    # same story — that every `Wiring` variant's token is one the page knows — is an ordinary
    # integration test and runs in `check` with everything else.
    #
    # Deliberately not the same job as `web/`'s suite: that tree is the public site, this one is the
    # loopback host, and the two have separate dependency trees on purpose.
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Node
        # The same pin `pages.yml` already carries, and pinned for the same reason the Rust
        # toolchain is: a moving version turns someone else's release into our red build.
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: crates/connectors-api/ui/package-lock.json

      # `npm ci`, not `npm install`: the committed lockfile is what makes the tree CI resolves the
      # same one a developer ran the suite against.
      - name: Install the harness dependency
        run: npm ci
        working-directory: crates/connectors-api/ui

      - name: Test the page
        run: npm test
        working-directory: crates/connectors-api/ui

  web:
    name: site · build · test
    runs-on: ubuntu-latest
    # The public site's gate. `AGENTS.md` §Validation has documented it as
    # `npm ci && npm run build && npm test` for a long time; until C-240 no workflow ran the third
    # command, so `web/test/explorer.test.mjs` — 32 assertions covering the honesty rules, the
    # no-JavaScript guarantees, the architecture guards and the layout regressions — ran only when a
    # person remembered. It was green throughout, which is exactly the problem: nothing would have
    # said otherwise.
    #
    # WHY HERE AND NOT IN `pages.yml`, which already installs Node and builds the site:
    #
    #   1. This workflow is the one whose entire job is to say "do not merge this". `pages.yml`
    #      exists to produce and publish an artifact, and its build job gates pull requests as a
    #      documented add-on. A gate should not be a side effect of the deploy path's trigger list:
    #      whoever narrows `pages.yml` later — to fix a deployment concern, with no thought of tests —
    #      would silently take the web gate with it.
    #   2. Failure attribution. A red step inside `pages.yml`'s build job could be a test failure or
    #      Pages plumbing (`upload-pages-artifact`, the repository's Pages source setting). Its own
    #      job here means the site's tests fail under their own name.
    #   3. It makes the workflow mirror `AGENTS.md` §Validation, which describes exactly two gates:
    #      the Rust one and the Node one. Both now live in `ci.yml`.
    #
    # The cost is honest and accepted: the site is built twice per pull request, here and in
    # `pages.yml`. That is roughly ten seconds of `vitepress build` on a warm npm cache, and buying
    # trigger-independence with it is worth it. `pages.yml` is deliberately left alone.
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Node toolchain
        # Pinned for the same reason the Rust toolchain above is pinned, and matching the version
        # `pages.yml` builds with — a gate that runs on a different Node than the deploy path can
        # pass on a site that then fails to publish.
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # `npm ci`, not `npm install`: it installs exactly the committed lockfile and fails when
      # package.json and the lockfile disagree, instead of quietly resolving something else.
      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Build site
        run: npm run build
        working-directory: web

      # ORDER IS LOAD-BEARING, and it is the whole trap of this story. The suite asserts against the
      # *rendered* site in `web/.vitepress/dist` — deep-linkable operation pages, content that
      # survives without JavaScript, layout read out of the emitted stylesheet. Run it before the
      # build and it reports 19 of 32 failing, every one of them a page that was never rendered
      # rather than a defect. Measured on 2026-08-01 at cecf320: 13 pass, 19 fail, the first being
      # `.vitepress/dist/operations/airtable-record-get.html was not built`.
      #
      # So this step must stay after "Build site" and in the same job. Splitting it into a job of its
      # own would need the dist tree carried across as an artifact, which buys nothing.
      # `web/test/ci_gate.test.mjs` asserts this ordering so a future edit cannot quietly undo it.
      - name: Test site
        run: npm test
        working-directory: web

  package:
    name: crates.io dry run
    runs-on: ubuntu-latest
    # A publish is the one irreversible thing this repository can do, and a packaging error —
    # a missing `description`, a `readme` that points nowhere, a file the package excludes, a
    # dependency without a version — is only visible at `cargo publish` time. Catching it here means
    # catching it on a pull request rather than at the moment a version number is burning.
    #
    # Its own job, not a step in `check`: it needs the registry and a full verify build per crate,
    # and the four gate commands above must stay the ones a developer runs locally.
    #
    # This uploads nothing. The real publish lives in `.github/workflows/crates-io.yml` and runs on a
    # version tag only.
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: "1.97.0"

      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Show the derived publish order
        run: bash scripts/publish-crates-io.sh --print-order

      # `--dry-run` packages and verifies every crate in the closure in one cargo invocation, so each
      # is built against the others' freshly packaged copies — the situation the real publish creates
      # one crate at a time. See the comment in the script for why it is not a loop.
      - name: Package and verify the crates.io closure
        run: bash scripts/publish-crates-io.sh --dry-run
