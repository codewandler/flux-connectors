name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Note: deliberately NOT setting `RUSTFLAGS: -D warnings` globally — that would also deny warnings
  # in third-party dependencies, breaking CI on any upstream warning or new rustc lint. Warning
  # enforcement for our own code lives in the clippy step below (`-- -D warnings`).

jobs:
  check:
    name: build · test · clippy · fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Rust toolchain
        # Pinned, not `stable`: every Rust release ships new clippy lints that `-D warnings`
        # promotes to errors, so a floating CI toolchain breaks on code that is clean locally.
        # To bump: change the version here, run clippy/fmt locally on that same version, fix, commit.
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          # `master` above pins the action's *code* to a commit; the toolchain the tag used to encode
          # is an explicit — and, at this SHA, required — input.
          toolchain: "1.97.0"
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      # `--locked` here, not on the build/test steps below: it makes a stale or hand-edited
      # `Cargo.lock` an obvious, named failure rather than something cargo silently repairs, while
      # the four gate commands stay byte-identical to the ones in AGENTS.md's dev loop.
      - name: Fetch locked dependencies
        run: cargo fetch --locked

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: cargo test --workspace

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Format
        run: cargo fmt --all --check

  web:
    name: site · build · test
    runs-on: ubuntu-latest
    # The public site's gate. `AGENTS.md` §Validation has documented it as
    # `npm ci && npm run build && npm test` for a long time; until C-240 no workflow ran the third
    # command, so `web/test/explorer.test.mjs` — 32 assertions covering the honesty rules, the
    # no-JavaScript guarantees, the architecture guards and the layout regressions — ran only when a
    # person remembered. It was green throughout, which is exactly the problem: nothing would have
    # said otherwise.
    #
    # WHY HERE AND NOT IN `pages.yml`, which already installs Node and builds the site:
    #
    #   1. This workflow is the one whose entire job is to say "do not merge this". `pages.yml`
    #      exists to produce and publish an artifact, and its build job gates pull requests as a
    #      documented add-on. A gate should not be a side effect of the deploy path's trigger list:
    #      whoever narrows `pages.yml` later — to fix a deployment concern, with no thought of tests —
    #      would silently take the web gate with it.
    #   2. Failure attribution. A red step inside `pages.yml`'s build job could be a test failure or
    #      Pages plumbing (`upload-pages-artifact`, the repository's Pages source setting). Its own
    #      job here means the site's tests fail under their own name.
    #   3. It makes the workflow mirror `AGENTS.md` §Validation, which describes exactly two gates:
    #      the Rust one and the Node one. Both now live in `ci.yml`.
    #
    # The cost is honest and accepted: the site is built twice per pull request, here and in
    # `pages.yml`. That is roughly ten seconds of `vitepress build` on a warm npm cache, and buying
    # trigger-independence with it is worth it. `pages.yml` is deliberately left alone.
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Node toolchain
        # Pinned for the same reason the Rust toolchain above is pinned, and matching the version
        # `pages.yml` builds with — a gate that runs on a different Node than the deploy path can
        # pass on a site that then fails to publish.
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # `npm ci`, not `npm install`: it installs exactly the committed lockfile and fails when
      # package.json and the lockfile disagree, instead of quietly resolving something else.
      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Build site
        run: npm run build
        working-directory: web

      # ORDER IS LOAD-BEARING, and it is the whole trap of this story. The suite asserts against the
      # *rendered* site in `web/.vitepress/dist` — deep-linkable operation pages, content that
      # survives without JavaScript, layout read out of the emitted stylesheet. Run it before the
      # build and it reports 19 of 32 failing, every one of them a page that was never rendered
      # rather than a defect. Measured on 2026-08-01 at cecf320: 13 pass, 19 fail, the first being
      # `.vitepress/dist/operations/airtable-record-get.html was not built`.
      #
      # So this step must stay after "Build site" and in the same job. Splitting it into a job of its
      # own would need the dist tree carried across as an artifact, which buys nothing.
      # `web/test/ci_gate.test.mjs` asserts this ordering so a future edit cannot quietly undo it.
      - name: Test site
        run: npm test
        working-directory: web

  package:
    name: crates.io dry run
    runs-on: ubuntu-latest
    # A publish is the one irreversible thing this repository can do, and a packaging error —
    # a missing `description`, a `readme` that points nowhere, a file the package excludes, a
    # dependency without a version — is only visible at `cargo publish` time. Catching it here means
    # catching it on a pull request rather than at the moment a version number is burning.
    #
    # Its own job, not a step in `check`: it needs the registry and a full verify build per crate,
    # and the four gate commands above must stay the ones a developer runs locally.
    #
    # This uploads nothing. The real publish lives in `.github/workflows/crates-io.yml` and runs on a
    # version tag only.
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: "1.97.0"

      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Show the derived publish order
        run: bash scripts/publish-crates-io.sh --print-order

      # `--dry-run` packages and verifies every crate in the closure in one cargo invocation, so each
      # is built against the others' freshly packaged copies — the situation the real publish creates
      # one crate at a time. See the comment in the script for why it is not a loop.
      - name: Package and verify the crates.io closure
        run: bash scripts/publish-crates-io.sh --dry-run
