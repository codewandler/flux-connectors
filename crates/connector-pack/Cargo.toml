[package]
name = "codewandler-connector-pack"
description = "Projects catalogue operations onto flux ToolSpecs and installs them as a Tool pack."
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
readme = "README.md"
documentation = "https://docs.rs/codewandler-connector-pack"
keywords = ["flux", "connector", "tools", "agent", "api"]
categories = ["api-bindings", "web-programming"]

[lib]
# Pinned so the published package name and the crate name are independent. The package is
# `codewandler-*` on crates.io (C-195); the crate every dependent and every one of this
# crate's own integration tests writes is `connector_pack`. Without this, renaming the package
# silently renames the crate and breaks every `use` of it.
name = "connector_pack"
path = "src/lib.rs"

[dependencies]
# The input is the catalogue, not the loader: no code in this crate reads a provider file, and there
# is no edge to `connector-spec` for one to arrive through.
#
# **Its tests do read `providers/*.toml`, and the sentence here used to deny it** (C-232).
# `tests/request.rs` builds each operation's configuration from the `[[config]]` blocks a provider
# declares, because deriving it from the pack's own scan instead is the defect that let eight
# uncallable operations ship. Those declarations reach no artifact until C-87 publishes the
# configuration surface, so the provider file is the only place they exist — and the test reads it
# with a small fail-closed line reader rather than a `toml` dependency, precisely so the dependency
# claim above stays a true statement about this manifest. `dependency_fence.rs` is what holds it.
catalog.workspace = true

# **The published address vocabulary** (C-523). `HttpsOrigin` is the one grammar that has to mean the
# same thing in three programs — the compiler that validates a declared origin, this pack, which
# turns a supplied one into a request destination and a permission subject, and Exchange, which
# persists and approves a proposal. This edge is what replaces the runtime copy of that grammar that
# used to live in `request.rs`; it reaches *down*, into a crate that holds no parser, no client and
# no compiler, and it is already in the publish closure through `connector-secrets`, so it grows
# what ships by nothing.
connector-address.workspace = true

# The credential port (C-116). `SecretStore` is consumed, never redefined, and C-90's
# `CredentialRef`/`Layout` come through it rather than from a second addressing scheme.
#
# **This edge is allowed here and forbidden from `connector-cli`.** The fence
# (`crates/connector-cli/tests/dependency_fence.rs`) is about the *compiler* crates, whose offline
# guarantee a Vault client would quietly end. The pack is the host-facing surface: it is where a
# credential is supposed to be resolved.
#
# No feature is named, and that is the point rather than an omission: `connector-secrets` declares
# `default = []`, so `vault` — and with it `reqwest` — stays off unless a *host* asks for it. This
# edge therefore links no HTTP client, and the pack still opens no socket. Spelling
# `default-features = false` here would be a no-op cargo warns about, and would read as a guarantee
# this manifest is not the one making.
connector-secrets.workspace = true

# **The plan-deriving core** (C-538). `resolve`/`project`/`pack` below are a thin wrapper over it:
# the request template is read, the slots are checked and the credentials are placed there, and this
# crate adds the flux `Tool` projection, the registry admission and the dispatch. The edge reaches
# *down*, into a crate that links no engine and opens no socket, and it is already in the publish
# closure through this crate, so it grows what ships by one deliberate package.
connector-resolve.workspace = true

# The flux side of the seam. `flux-spec` owns `ToolSpec` and its vocabulary; `flux-runtime` owns
# the `Tool` trait and the registry a host installs into. Deliberately *not* `flux-sdk`: the pack
# must be usable from a bare `ToolRegistry`, and the SDK is the host's choice, not ours.
flux-core.workspace = true
flux-lang.workspace = true
flux-runtime.workspace = true
flux-spec.workspace = true

async-trait.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
# Driving `Tool::execute` needs a `ToolContext`, and a `ToolContext` needs an `Arc<System>` over a
# workspace root. Test-only: no shipped code here links `flux-system`, and the pack still reaches the
# filesystem through nothing.
flux-system.workspace = true
# A runtime for the async `Tool::execute`. `rt` + `macros` only.
tokio = { workspace = true, features = ["rt", "macros"] }
