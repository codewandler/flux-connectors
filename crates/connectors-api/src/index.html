<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>connectors-api</title>
<style>
  :root {
    --bg: #fbfbfa; --panel: #fff; --ink: #1a1a19; --muted: #6b6b66;
    --line: #e4e4e0; --accent: #2f6f4f; --warn: #8a4b2a; --code: #f4f4f1;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161614; --panel: #1e1e1b; --ink: #ececea; --muted: #9a9a93;
      --line: #33332e; --accent: #7fb894; --warn: #d09a72; --code: #24241f;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif;
  }
  header {
    padding: 1rem 1.25rem; border-bottom: 1px solid var(--line);
    display: flex; align-items: baseline; gap: .75rem; flex-wrap: wrap;
  }
  header h1 { font-size: 1rem; margin: 0; font-weight: 650; }
  header .note { color: var(--warn); font-size: .8rem; }
  main { display: grid; grid-template-columns: minmax(240px, 320px) 1fr; gap: 0; min-height: calc(100vh - 57px); }
  @media (max-width: 720px) { main { grid-template-columns: 1fr; } }
  #list { border-right: 1px solid var(--line); overflow-y: auto; max-height: calc(100vh - 57px); }
  #detail { padding: 1.25rem; overflow-y: auto; max-height: calc(100vh - 57px); }
  .conn {
    padding: .6rem .9rem; border-bottom: 1px solid var(--line); cursor: pointer;
    display: flex; align-items: center; gap: .5rem;
  }
  .conn:hover { background: var(--panel); }
  .conn.on { background: var(--panel); box-shadow: inset 3px 0 0 var(--accent); }
  .conn .name { font-weight: 550; }
  .conn .count { color: var(--muted); font-size: .8rem; margin-left: auto; }
  /* The three states an operator can be in, and a fourth for "some of it". A connector with
     nothing to supply must not look like one that has been left unconfigured forever, so
     `no-credential-required` gets a filled mark of its own rather than the empty one. */
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--line); flex: none; }
  .dot.wired { background: var(--accent); }
  .dot.partly-wired { background: var(--accent); opacity: .45; }
  .dot.no-credential-required { background: var(--muted); }
  .state { font-size: .78rem; }
  .op.uncallable .id { opacity: .55; }
  .op .needs { font-size: .7rem; color: var(--warn); margin-left: .4rem; }
  h2 { font-size: 1.1rem; margin: 0 0 .2rem; }
  .muted { color: var(--muted); }
  .sub { color: var(--muted); font-size: .85rem; margin-bottom: 1rem; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: .9rem; margin-bottom: 1rem; }
  section h3 { font-size: .78rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 .6rem; }
  code, pre, input, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .82rem; }
  pre { background: var(--code); padding: .7rem; border-radius: 6px; overflow-x: auto; margin: 0; }
  input, select {
    font: inherit; padding: .35rem .5rem; border: 1px solid var(--line);
    border-radius: 5px; background: var(--bg); color: var(--ink); width: 100%;
  }
  button {
    font: inherit; font-size: .85rem; padding: .35rem .8rem; border-radius: 5px;
    border: 1px solid var(--accent); background: var(--accent); color: var(--bg);
    cursor: pointer; font-weight: 550;
  }
  button.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
  button:disabled { opacity: .5; cursor: default; }
  .row { display: flex; gap: .5rem; align-items: center; margin-bottom: .5rem; }
  .row label { flex: 0 0 12rem; font-size: .82rem; }
  table { width: 100%; border-collapse: collapse; font-size: .85rem; }
  td, th { text-align: left; padding: .3rem .4rem; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 550; font-size: .78rem; }
  .op { padding: .45rem .5rem; border-bottom: 1px solid var(--line); cursor: pointer; display: flex; gap: .5rem; align-items: baseline; }
  .op:hover { background: var(--code); }
  .op .id { font-family: ui-monospace, monospace; font-size: .82rem; }
  .op .risk { font-size: .7rem; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); margin-left: auto; }
  .err { color: var(--warn); white-space: pre-wrap; }
  .ok { color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>connectors-api</h1>
  <span class="muted" id="counts"></span>
  <span class="note">Real calls, real credentials. Held in memory only.</span>
  <span class="muted" id="who"></span>
</header>
<main>
  <div id="list"></div>
  <div id="detail"><p class="muted">Pick a connector.</p></div>
</main>

<script>
const $ = (s, r = document) => r.querySelector(s);
const el = (t, props = {}, ...kids) => {
  const n = Object.assign(document.createElement(t), props);
  for (const k of kids.flat()) n.append(k?.nodeType ? k : document.createTextNode(k));
  return n;
};
const api = async (method, path, body) => {
  const r = await fetch(path, {
    method,
    headers: body === undefined ? {} : { 'content-type': 'application/json' },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  if (r.status === 204) return null;
  const text = await r.text();
  let data; try { data = JSON.parse(text); } catch { data = { error: text }; }
  if (!r.ok) throw new Error(data.error ?? text);
  return data;
};

let connectors = [], current = null;

// The three answers to "is there anything for me to do here?", plus the partial one. Keyed by the
// server's own `wiring` token — the same vocabulary the published catalogue uses for the third
// state (`no-credential-required`, C-206), so the two surfaces cannot drift into two spellings.
//
// The one this page exists for is the third: before C-212 a connector whose vendor needs no
// credential was drawn exactly like one nobody had configured, so an operator went looking for a
// token that does not exist.
const WIRING = {
  'no-credential-required': c => ['ok', 'Nothing to supply — this connector needs no credential.'],
  'wired':       c => ['ok',    `Ready — all ${c.operation_count} operations are callable.`],
  'partly-wired':c => ['muted', `${c.callable_operations} of ${c.operation_count} operations are callable. `
                              + `The rest need a credential you have not supplied.`],
  'not-wired':   c => ['muted', `Nothing is callable yet — supply a credential below.`],
};
const wiringOf = c => (WIRING[c.wiring] ?? (() => ['muted', c.wiring]))(c);

async function load() {
  connectors = await api('GET', '/v1/connectors');
  const ops = connectors.reduce((n, c) => n + c.operation_count, 0);
  $('#counts').textContent = `${connectors.length} connectors · ${ops} operations`;
  renderList();
}

function renderList() {
  const list = $('#list');
  list.replaceChildren(...connectors.map(c => {
    const node = el('div', { className: 'conn' + (current === c.id ? ' on' : ''), title: wiringOf(c)[1] },
      el('span', { className: 'dot ' + c.wiring }),
      el('span', { className: 'name' }, c.vendor),
      el('span', { className: 'count' },
        c.wiring === 'no-credential-required' || c.wiring === 'wired'
          ? String(c.operation_count)
          : `${c.callable_operations}/${c.operation_count}`));
    node.onclick = () => show(c.id);
    return node;
  }));
}

async function show(id) {
  current = id;
  renderList();
  const c = await api('GET', `/v1/connectors/${id}`);
  const d = $('#detail');
  d.replaceChildren();
  const [tone, sentence] = wiringOf(c);
  d.append(el('h2', {}, c.vendor), el('div', { className: 'sub' }, c.description),
    el('p', { className: 'state ' + tone, style: 'margin:-.7rem 0 1rem' }, sentence));

  // --- credentials -------------------------------------------------------
  const creds = el('section', {}, el('h3', {}, 'Credentials'));
  if (!c.credentials.length) {
    // Which is the whole point of the third state: "declares none" is a fact about the connector,
    // and on its own it does not tell an operator whether that is good news.
    creds.append(el('p', { className: c.wiring === 'no-credential-required' ? 'ok' : 'muted' },
      c.wiring === 'no-credential-required'
        ? 'This connector declares none, and needs none. There is nothing for you to supply.'
        : 'This connector declares none.'));
  }
  for (const cr of c.credentials) {
    const input = el('input', { type: 'password', placeholder: cr.stored ? '•••••••• stored' : 'paste value' });
    const status = el('span', { className: cr.stored ? 'ok' : 'muted' }, cr.stored ? 'stored' : 'not set');
    const save = el('button', {}, 'Save');
    save.onclick = async () => {
      if (!input.value) return;
      save.disabled = true;
      try {
        await api('PUT', `/v1/credentials/${c.id}/${cr.name}`, { value: input.value });
        input.value = ''; status.textContent = 'stored'; status.className = 'ok';
        await load();
      } catch (e) { status.textContent = e.message; status.className = 'err'; }
      save.disabled = false;
    };
    creds.append(
      el('div', { className: 'row' }, el('label', {}, cr.name), input, save, status),
      el('div', { className: 'muted mono', style: 'margin:-.25rem 0 .6rem 12.5rem;font-size:.75rem' },
        (cr.address ?? 'no address — connector declares no authority') + ' · ' + cr.placement
        + (cr.needs_username ? ' · needs a username via config' : '')));
  }
  d.append(creds);

  // --- configuration -----------------------------------------------------
  const tpl = [...c.base_url.matchAll(/\{(\w+)\}/g)].map(m => m[1]);
  if (tpl.length || c.credentials.some(cr => cr.needs_username) || c.settings.length) {
    const cfg = el('section', {}, el('h3', {}, 'Configuration'),
      el('p', { className: 'muted', style: 'margin-top:-.3rem;font-size:.82rem' },
        `Base URL: ${c.base_url}`));
    const kind = el('select', {}, el('option', { value: 'endpoint' }, 'endpoint'),
                                   el('option', { value: 'username' }, 'username'));
    const service = el('input', { value: 'default', placeholder: 'service' });
    const field = el('input', { value: tpl[0] ?? '', placeholder: 'field name' });
    const out = el('span', { className: 'muted' });
    const set = el('button', {}, 'Bind');

    // --- a closed set renders as a choice, not as a text box (C-225) --------
    //
    // The catalogue publishes the permitted values for a slot whose answer an operator cannot
    // discover — New Relic's two region hosts, Intercom's three. Rendering those as free text is
    // the whole defect: a wrong region is a 401 on every call, indistinguishable from a bad key,
    // so the operator rotates a credential that was never wrong. The server refuses a value
    // outside the set too; this is the half that stops it being entered.
    const choicesFor = () => (c.config_choices ?? []).find(e =>
      e.service === service.value && e.kind === kind.value && e.name === field.value);
    const text = el('input', { placeholder: 'value' });
    const select = el('select', {});
    const slot = el('div', { style: 'flex:1' });
    let value = text;
    const drawValue = () => {
      const closed = choicesFor();
      if (closed) {
        // Labelled, because `api.eu.newrelic.com` is not what an operator knows about their
        // account — "European Union" is. The value is what reaches the wire.
        select.replaceChildren(...closed.choices.map(ch => el('option', { value: ch.value }, ch.label)));
        value = select;
      } else {
        value = text;
      }
      slot.replaceChildren(value);
      hint.textContent = closed
        ? `${closed.label} — one of ${closed.choices.length}; anything else is refused`
        : '';
    };
    const hint = el('span', { className: 'muted', style: 'font-size:.75rem' });
    for (const control of [kind, service, field]) control.oninput = drawValue;
    kind.onchange = drawValue;

    set.onclick = async () => {
      try {
        await api('PUT', `/v1/config/${c.id}/${service.value}/${kind.value}/${field.value}`, { value: value.value });
        out.textContent = 'bound'; out.className = 'ok'; show(c.id);
      } catch (e) { out.textContent = e.message; out.className = 'err'; }
    };
    drawValue();
    cfg.append(el('div', { className: 'row' }, kind, service, field, slot, set, out),
               el('div', { className: 'row' }, hint));
    if (c.settings.length) {
      cfg.append(el('table', {}, el('tbody', {}, ...c.settings.map(([k, v]) =>
        el('tr', {}, el('td', { className: 'mono' }, k), el('td', { className: 'mono' }, v))))));
    }
    d.append(cfg);
  }

  // --- operations --------------------------------------------------------
  // The honest unit is the operation, so each one says for itself whether it can be called and,
  // when it cannot, which credential is missing. `requires` is an OR over mechanisms, each an AND
  // of names that must travel together, so it is rendered as such rather than flattened.
  const opsSection = el('section', {}, el('h3', {}, `Operations · ${c.callable_operations} of ${c.operation_count} callable`));
  const holder = el('div', {}, el('span', { className: 'muted' }, 'loading…'));
  opsSection.append(holder);
  d.append(opsSection);
  const details = await Promise.all(c.operations.map(o => api('GET', `/v1/operations/${o.id}`)));
  holder.replaceChildren(...details.map((o, i) => {
    const w = c.operations[i];
    const node = el('div', { className: 'op' + (w.callable ? '' : ' uncallable') },
      el('span', { className: 'id' }, o.tool),
      w.callable ? '' : el('span', { className: 'needs' },
        'needs ' + w.requires.map(m => m.join(' + ')).join(' or ')),
      el('span', { className: 'muted', style: 'font-size:.8rem' }, o.description),
      el('span', { className: 'risk' }, o.risk));
    node.onclick = () => playground(o, opsSection);
    return node;
  }));
}

async function playground(op, after) {
  let panel = $('#play');
  if (panel) panel.remove();
  panel = el('section', { id: 'play' }, el('h3', {}, 'Run ' + op.tool));
  const params = el('input', { value: '{}', className: 'mono' });
  const run = el('button', {}, 'Send');
  const out = el('pre', {}, '');
  run.onclick = async () => {
    run.disabled = true; out.textContent = 'sending…'; out.className = '';
    try {
      const body = JSON.parse(params.value || '{}');
      const r = await api('POST', `/v1/operations/${op.id}/execute`, body);
      out.textContent = r.content;
      out.className = r.is_error ? 'err' : '';
    } catch (e) { out.textContent = e.message; out.className = 'err'; }
    run.disabled = false;
  };
  panel.append(
    el('p', { className: 'muted', style: 'margin-top:-.3rem;font-size:.82rem' }, op.description),
    el('div', { className: 'row' }, el('label', {}, 'parameters (JSON)'), params, run),
    out,
    el('details', {}, el('summary', { className: 'muted', style: 'font-size:.8rem;cursor:pointer' },
      'the Flux this was compiled from'), el('pre', {}, op.flux)));
  after.after(panel);
}

// Sign-in gates everything below, so the page asks who is asking before it asks for anything else.
// The states, and each is a real one an operator lands in:
//   - no door at all   → say which environment variables to set, and where to register
//   - a door, not signed in → a button per door that actually exists
//   - signed in        → the catalogue, scoped to that account's tenant
//
// `status.dev` (C-234) is the *same* value the server built its route table from, so the page can
// never offer a button that would 404. The dev button is drawn only when it is true; on an ordinary
// host this branch produces nothing at all.
async function start() {
  const status = await api('GET', '/auth/status');

  if (status.dev) {
    $('header .note').textContent =
      'DEV MODE — authentication is disabled. Loopback only. Not a real account.';
  }

  if (!status.configured && !status.dev) {
    $('#who').textContent = 'sign-in not configured';
    // `textContent` on a <pre>, never innerHTML: the message is server-composed, but a page that
    // renders server strings as markup is one server change away from being an XSS sink.
    $('#detail').replaceChildren(
      el('p', { className: 'err' }, 'Google sign-in is not set up yet.'),
      el('pre', { textContent: status.setup ?? '' }));
    return;
  }

  if (!status.signed_in) {
    $('#who').textContent = 'not signed in';
    const doors = [el('p', { className: 'muted' },
      'Connectors and credentials belong to the signed-in account.')];

    if (status.configured) {
      const button = el('button', {}, 'Sign in with Google');
      button.onclick = () => { window.location.href = '/auth/signin'; };
      doors.push(button);
    }

    if (status.dev) {
      // Labelled so it cannot be mistaken for the real sign-in: it says what it is, it says the
      // account is fake, and it is styled as a secondary action rather than the primary one.
      const dev = el('button', { className: 'ghost' },
        'Sign in as DEVELOPER — fake account, no Google, dev mode only');
      dev.onclick = async () => {
        // A POST rather than a link, for the reason `/auth/signout` is one: a route that changes
        // state must not be reachable from a cross-site top-level GET.
        await fetch('/auth/dev', { method: 'POST', redirect: 'manual' });
        window.location.reload();
      };
      doors.push(dev);
      doors.push(el('p', { className: 'err', style: 'font-size:.82rem' },
        'The developer sign-in exists because this host was started with --dev. '
        + 'It authenticates nobody. Its tenant is dev-local and it can see no real account’s data.'));
    }

    if (!status.configured) {
      doors.push(
        el('p', { className: 'muted', style: 'font-size:.82rem;margin-top:1rem' },
          'Google sign-in is not set up. To use a real account instead:'),
        el('pre', { textContent: status.setup ?? '' }));
    }

    $('#detail').replaceChildren(...doors);
    return;
  }

  const account = status.account ?? {};
  const out = el('button', {}, 'Sign out');
  out.onclick = async () => {
    // A form POST rather than a link: sign-out changes state, and `SameSite=Lax` lets a
    // cross-site *GET* carry the cookie while a cross-site POST does not.
    await fetch('/auth/signout', { method: 'POST', redirect: 'manual' });
    window.location.reload();
  };
  $('#who').replaceChildren(
    document.createTextNode(`${account.email ?? account.name ?? account.subject} · tenant ${account.tenant} `),
    out);

  await load();
}

start().catch(e => { $('#detail').replaceChildren(el('p', { className: 'err' }, e.message)); });
</script>
</body>
</html>
