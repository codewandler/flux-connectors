<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>connectors-api</title>
<style>
  :root {
    --bg: #fbfbfa; --panel: #fff; --ink: #1a1a19; --muted: #6b6b66;
    --line: #e4e4e0; --accent: #2f6f4f; --warn: #8a4b2a; --code: #f4f4f1;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161614; --panel: #1e1e1b; --ink: #ececea; --muted: #9a9a93;
      --line: #33332e; --accent: #7fb894; --warn: #d09a72; --code: #24241f;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif;
  }
  header {
    padding: 1rem 1.25rem; border-bottom: 1px solid var(--line);
    display: flex; align-items: baseline; gap: .75rem; flex-wrap: wrap;
  }
  header h1 { font-size: 1rem; margin: 0; font-weight: 650; }
  header .note { color: var(--warn); font-size: .8rem; }
  main { display: grid; grid-template-columns: minmax(260px, 340px) 1fr; gap: 0; min-height: calc(100vh - 57px); }
  @media (max-width: 720px) { main { grid-template-columns: 1fr; } }
  #rail { border-right: 1px solid var(--line); display: flex; flex-direction: column; max-height: calc(100vh - 57px); }
  #controls { padding: .6rem .7rem; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: .45rem; }
  #controls .bands { display: flex; gap: .3rem; flex-wrap: wrap; }
  #controls button { font-size: .74rem; padding: .2rem .5rem; }
  #controls button.on { border-color: var(--accent); color: var(--accent); }
  #showing { color: var(--muted); font-size: .74rem; }
  #list { overflow-y: auto; }
  #detail { padding: 1.25rem; overflow-y: auto; max-height: calc(100vh - 57px); }
  .conn {
    padding: .6rem .9rem; border-bottom: 1px solid var(--line); cursor: pointer;
    display: flex; align-items: center; gap: .5rem;
  }
  .conn:hover { background: var(--panel); }
  .conn.on { background: var(--panel); box-shadow: inset 3px 0 0 var(--accent); }
  .conn .name { font-weight: 550; }
  .conn .count { color: var(--muted); font-size: .8rem; margin-left: auto; }
  /* The four states an operator can be in, and a fifth for "some of it". A connector with
     nothing to supply must not look like one that has been left unconfigured forever, so
     `no-credential-required` gets a filled mark of its own rather than the empty one — and
     `no-credential` (C-235), where there is equally nothing to supply and the connector does not
     work either, gets a hollow one, so it reads as neither of its two neighbours. */
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--line); flex: none; }
  .dot.wired { background: var(--accent); }
  .dot.partly-wired { background: var(--accent); opacity: .45; }
  .dot.no-credential-required { background: var(--muted); }
  .dot.no-credential { background: transparent; border: 1px solid var(--warn); }
  .state { font-size: .78rem; }
  .op.uncallable .id { opacity: .55; }
  .op .needs { font-size: .7rem; color: var(--warn); }
  h2 { font-size: 1.1rem; margin: 0 0 .2rem; }
  .muted { color: var(--muted); }
  .sub { color: var(--muted); font-size: .85rem; margin-bottom: 1rem; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: .9rem; margin-bottom: 1rem; }
  section h3 { font-size: .78rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 .6rem; }
  code, pre, input, textarea, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .82rem; }
  pre { background: var(--code); padding: .7rem; border-radius: 6px; overflow-x: auto; margin: 0; }
  input, select, textarea {
    font: inherit; padding: .35rem .5rem; border: 1px solid var(--line);
    border-radius: 5px; background: var(--bg); color: var(--ink); width: 100%;
  }
  textarea { resize: vertical; line-height: 1.45; }
  button {
    font: inherit; font-size: .85rem; padding: .35rem .8rem; border-radius: 5px;
    border: 1px solid var(--accent); background: var(--accent); color: var(--bg);
    cursor: pointer; font-weight: 550;
  }
  button.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
  button:disabled { opacity: .5; cursor: default; }
  .row { display: flex; gap: .5rem; align-items: center; margin-bottom: .5rem; flex-wrap: wrap; }
  .row label { flex: 0 0 12rem; font-size: .82rem; }
  table { width: 100%; border-collapse: collapse; font-size: .85rem; }
  td, th { text-align: left; padding: .3rem .4rem; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 550; font-size: .78rem; }
  /* One service's operations. `service` is the addressing level C-49 established: contentful's
     `delivery` and `management` are two APIs against two different spaces, and a flat list of ~30
     rows says nothing about which call goes where. */
  .service { margin-bottom: .8rem; }
  .service h4 {
    font-size: .74rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted);
    margin: 0 0 .2rem; display: flex; gap: .4rem; align-items: baseline; flex-wrap: wrap;
  }
  .op { padding: .45rem .5rem; border-bottom: 1px solid var(--line); cursor: pointer; display: flex; gap: .5rem; align-items: baseline; flex-wrap: wrap; }
  .op:hover { background: var(--code); }
  .op .id { font-family: ui-monospace, monospace; font-size: .82rem; }
  .op .desc { font-size: .8rem; flex: 1 1 14rem; }
  .op .meta { margin-left: auto; display: flex; gap: .4rem; align-items: baseline; flex-wrap: wrap; }
  .risk, .chip { font-size: .7rem; letter-spacing: .03em; color: var(--muted); }
  .risk { text-transform: uppercase; }
  .chip { border: 1px solid var(--line); border-radius: 4px; padding: 0 .25rem; }
  /* An absence the host stated, drawn as an absence. Never the warning colour: "this catalogue
     does not carry that field" is not a defect in the connector — see `published` below. */
  .unpublished { color: var(--muted); font-style: italic; opacity: .8; }
  .response { display: flex; flex-direction: column; gap: .4rem; }
  .response-status { font-weight: 600; font-size: .85rem; }
  .response-headers summary { cursor: pointer; color: var(--muted); font-size: .78rem; }
  .err { color: var(--warn); white-space: pre-wrap; }
  .ok { color: var(--accent); }
  /* **Layout hygiene, borrowed rather than rediscovered.** `OperationRow.vue`'s comment records
     what the absence of these three rules cost the site: a grid or flex child defaults to
     `min-width: auto` and refuses to shrink below its content, and a path like
     `/v0/{baseId}/{tableIdOrName}/{recordId}` offers no break opportunity — so every row forced its
     track wider than the viewport and the page scrolled sideways by ~193px. `min-width: 0` on the
     children, `flex-wrap: wrap` on the rows above, `overflow-wrap: anywhere` on the strings that
     have nowhere to break. */
  main > *, #rail > *, .row > *, .op > *, .conn > *, .response > * { min-width: 0; }
  .mono, code, pre, .op .id, .op .desc, .addr, .response-status { overflow-wrap: anywhere; }
</style>
</head>
<body>
<header>
  <h1>connectors-api</h1>
  <span class="muted" id="counts"></span>
  <span class="note">Real calls, real credentials. Held in memory only.</span>
  <span class="muted" id="who"></span>
</header>
<main>
  <div id="rail">
    <div id="controls"></div>
    <div id="list"></div>
  </div>
  <div id="detail"><p class="muted">Pick a connector.</p></div>
</main>

<script>
const $ = (s, r = document) => r.querySelector(s);
const el = (t, props = {}, ...kids) => {
  const n = Object.assign(document.createElement(t), props);
  for (const k of kids.flat()) n.append(k?.nodeType ? k : document.createTextNode(k));
  return n;
};
const api = async (method, path, body) => {
  const r = await fetch(path, {
    method,
    headers: body === undefined ? {} : { 'content-type': 'application/json' },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  if (r.status === 204) return null;
  const text = await r.text();
  let data; try { data = JSON.parse(text); } catch { data = { error: text }; }
  if (!r.ok) throw new Error(data.error ?? text);
  return data;
};

let connectors = [], current = null, query = '', band = 'all';

// **A field the host did not publish is not a fact about the connector** (C-408).
//
// `web/data/catalog.mts` spells this `Published<T> = T | null | undefined` with one predicate over
// it, because a source that omits a key and a source that writes `null` are saying the same thing
// and no consumer should have to know which its source chose. The public explorer learned the cost
// from a second consumer: flux-exchange's console publishes no `auth`, so `ProviderCard` rendered
// "not configured" in the danger colour on every card — a red claim that service never made.
//
// This is the other surface that reads a catalogue, so it is the other surface with the mistake
// available, and it has no second consumer to find it. Hence the same rule, drawn muted and never
// in the warning colour: an absence the source stated is not a defect.
const UNPUBLISHED = 'not published';
const published = v => v !== null && v !== undefined && v !== '';
const fact = (value, className = '') => published(value)
  ? el('span', { className }, String(value))
  : el('span', {
      className: 'unpublished',
      title: 'The host served no value for this field. That is a fact about the catalogue, not about the connector.',
    }, UNPUBLISHED);
const joined = (value, separator = ' · ') =>
  published(value) && value.length ? value.join(separator) : null;

// The four answers to "is there anything for me to do here?", plus the partial one. Keyed by the
// server's own `wiring` token — the same vocabulary the published catalogue uses for the two
// no-credential states (`no-credential-required` and `no-credential`, C-206), so the two surfaces
// cannot drift into two spellings.
//
// The one this page exists for is `no-credential-required`: before C-212 a connector whose vendor
// needs no credential was drawn exactly like one nobody had configured, so an operator went looking
// for a token that does not exist.
//
// `no-credential` is C-235's, and it is the pair's other half. The two tokens differ by one word
// and mean opposite things about whether the connector works, which is why the *sentences* below
// carry the difference rather than the tokens being re-spelled to look less alike — one vocabulary
// across the catalogue and the host is worth more than a UI-local rename.
const WIRING = {
  'no-credential-required': c => ['ok', 'Nothing to supply — this connector needs no credential.'],
  'no-credential': c => ['muted', 'Nothing to supply, and nothing to do — this connector\'s credential '
                              + 'cannot be held safely here yet, so its calls are refused by the vendor.'],
  'wired':       c => ['ok',    `Ready — all ${c.operation_count} operations are callable.`],
  'partly-wired':c => ['muted', `${c.callable_operations} of ${c.operation_count} operations are callable. `
                              + `The rest need a credential you have not supplied.`],
  'not-wired':   c => ['muted', `Nothing is callable yet — supply a credential below.`],
};
const wiringOf = c => (WIRING[c.wiring] ?? (() => ['muted', c.wiring]))(c);

// **Which connectors the rail is showing** — the operator's real first question at 54 of them.
//
// Keyed on the host's own `wiring` tokens rather than on a second classification, for the reason
// the sentences above are: two surfaces describing one fact, joined by a string neither declares to
// the other. *"Which of these still need setup"* is `not-wired` and `partly-wired` — the two states
// where there is work an operator can actually do; `no-credential` is deliberately not one of them,
// because there is nothing they can do about it, and putting it in the setup list is how somebody
// spends an afternoon looking for freshdesk's token.
const BANDS = [
  ['all', 'All', () => true],
  ['setup', 'Needs setup', c => c.wiring === 'not-wired' || c.wiring === 'partly-wired'],
  ['ready', 'Ready', c => c.wiring === 'wired' || c.wiring === 'no-credential-required'],
  ['blocked', 'Blocked', c => c.wiring === 'no-credential'],
];

// **SEARCH, and a knowing duplicate.** `web/data/catalog.mts` already has `narrowView`, `facet`,
// `serviceFacet` and `sortOperations` as pure functions over the catalogue shape, and this page
// hand-rolls the subset it needs instead. That is deliberate and it is C-236 phase 1: this file has
// no build step, no npm and no module system, so importing them is not available to it, and porting
// the components here would make both this story and C-238 harder. **C-238 deletes this half.**
// Nobody should defend the duplication on its merits — it is scaffolding with an owner.
//
// What a person actually types is a connector name, a vendor, or an operation id they know from a
// tool call. All three are indexed; the id is the one a vendor-keyed search would miss, and it is
// the one an operator has in front of them when something failed.
const index = new Map();
const indexOf = c => [
  c.id, c.vendor, c.description,
  ...(c.operations ?? []).flatMap(o => [o.id, o.tool, o.service, o.description]),
].filter(published).join(' ').toLowerCase();

async function load() {
  connectors = await api('GET', '/v1/connectors');
  index.clear();
  for (const c of connectors) index.set(c.id, indexOf(c));
  const ops = connectors.reduce((n, c) => n + c.operation_count, 0);
  $('#counts').textContent = `${connectors.length} connectors · ${ops} operations`;
  renderControls();
  renderList();
}

/** The rail's controls, built once — a signed-out page has nothing to search. */
function renderControls() {
  const controls = $('#controls');
  if ($('#search')) return;
  const search = el('input', {
    id: 'search', type: 'search', autocomplete: 'off',
    placeholder: 'Search connectors, vendors, operations',
  });
  search.oninput = () => { query = search.value; renderList(); };
  const bands = el('div', { className: 'bands' });
  for (const [key, label] of BANDS) {
    const button = el('button', { className: 'ghost' + (band === key ? ' on' : '') }, label);
    button.onclick = () => {
      band = key;
      for (const other of bands.children) other.className = 'ghost';
      button.className = 'ghost on';
      renderList();
    };
    bands.append(button);
  }
  controls.replaceChildren(search, bands, el('div', { id: 'showing' }));
}

/** The connectors the current search and band admit, in the catalogue's own order. */
function matching() {
  const holds = (BANDS.find(entry => entry[0] === band) ?? BANDS[0])[2];
  const needle = query.trim().toLowerCase();
  return connectors.filter(c =>
    holds(c) && (!needle || (index.get(c.id) ?? '').includes(needle)));
}

function renderList() {
  const list = $('#list');
  const shown = matching();
  const counter = $('#showing');
  if (counter) {
    counter.textContent = shown.length === connectors.length
      ? `${connectors.length} connectors`
      : `${shown.length} of ${connectors.length} connectors`;
  }
  list.replaceChildren(...shown.map(c => {
    const node = el('div', { className: 'conn' + (current === c.id ? ' on' : ''), title: wiringOf(c)[1] },
      el('span', { className: 'dot ' + c.wiring }),
      el('span', { className: 'name' }, c.vendor),
      el('span', { className: 'count' },
        c.wiring === 'no-credential-required' || c.wiring === 'wired'
          ? String(c.operation_count)
          : `${c.callable_operations}/${c.operation_count}`));
    node.onclick = () => show(c.id);
    return node;
  }));
}

// **Why an operation cannot be called, in the vocabulary the host sent** (C-235).
//
// An empty `requires` has two opposite meanings and the token is what separates them, so the token
// is what this reads. The page used to render the empty list straight into `'needs ' + ''` — the
// word "needs" with nothing after it — for every one of freshdesk's operations, which an operator
// quite reasonably reads as *nothing is needed*. That is the exact conclusion C-235 exists to stop
// them drawing: the request goes out unauthenticated and the vendor refuses it.
const REQUIREMENT = {
  'no-credential': () => 'credential withheld — this repository does not hold what the vendor '
                       + 'wants, so the call is refused',
  'no-credential-required': () => null,
};
const requirementOf = o => {
  const stated = REQUIREMENT[o.requirement];
  if (stated) return stated(o);
  if (o.callable) return null;
  // `requires` is an OR over mechanisms, each an AND of credentials that must travel together, so
  // it is rendered as such rather than flattened.
  const ways = (o.requires ?? []).map(m => m.join(' + ')).join(' or ');
  return ways ? 'needs ' + ways : 'needs a credential this connector does not name';
};

async function show(id) {
  current = id;
  renderList();
  const c = await api('GET', `/v1/connectors/${id}`);
  const d = $('#detail');
  d.replaceChildren();
  const [tone, sentence] = wiringOf(c);
  d.append(el('h2', {}, c.vendor), el('div', { className: 'sub' }, fact(c.description)),
    el('p', { className: 'state ' + tone, style: 'margin:-.7rem 0 1rem' }, sentence));

  // --- credentials -------------------------------------------------------
  const creds = el('section', {}, el('h3', {}, 'Credentials'));
  if (!c.credentials.length) {
    // Which is the whole point of the two no-credential states: "declares none" is a fact about the
    // connector, and on its own it does not tell an operator whether that is good news. C-235 is
    // what lets this say which — before it, the host could not tell either.
    const declaresNone = {
      'no-credential-required': ['ok', 'This connector declares none, and needs none. There is nothing for you to supply.'],
      'no-credential': ['muted', 'This connector declares none because its credential cannot be held safely here yet. '
                               + 'There is nothing for you to supply, and its calls will be refused until that changes.'],
    }[c.wiring] ?? ['muted', 'This connector declares none.'];
    creds.append(el('p', { className: declaresNone[0] }, declaresNone[1]));
  }
  for (const cr of c.credentials) {
    const input = el('input', { type: 'password', placeholder: cr.stored ? '•••••••• stored' : 'paste value' });
    const status = el('span', { className: cr.stored ? 'ok' : 'muted' }, cr.stored ? 'stored' : 'not set');
    const save = el('button', {}, 'Save');
    save.onclick = async () => {
      if (!input.value) return;
      save.disabled = true;
      try {
        await api('PUT', `/v1/credentials/${c.id}/${cr.name}`, { value: input.value });
        input.value = ''; status.textContent = 'stored'; status.className = 'ok';
        await load();
      } catch (e) { status.textContent = e.message; status.className = 'err'; }
      save.disabled = false;
    };
    // **The other half of storing one.** `DELETE /v1/credentials/{provider}/{credential}` has been
    // served since C-203 and nothing on this page could reach it, so an operator could put a
    // credential in and not take it back out — on the one surface whose whole job is holding them.
    const remove = el('button', { className: 'ghost' }, 'Remove');
    remove.disabled = !cr.stored;
    remove.onclick = async () => {
      remove.disabled = true;
      try {
        await api('DELETE', `/v1/credentials/${c.id}/${cr.name}`);
        await load();
        await show(c.id);
      } catch (e) {
        status.textContent = e.message; status.className = 'err';
        remove.disabled = false;
      }
    };
    creds.append(
      el('div', { className: 'row' }, el('label', {}, cr.name), input, save, remove, status),
      el('div', { className: 'muted mono addr', style: 'margin:-.25rem 0 .6rem 12.5rem;font-size:.75rem' },
        (cr.address ?? 'no address — connector declares no authority') + ' · ' + cr.placement
        + (cr.needs_username ? ' · needs a username via config' : '')));
  }
  d.append(creds);

  // --- configuration -----------------------------------------------------
  const tpl = [...(c.base_url ?? '').matchAll(/\{(\w+)\}/g)].map(m => m[1]);
  if (tpl.length || c.credentials.some(cr => cr.needs_username) || c.settings.length) {
    const cfg = el('section', {}, el('h3', {}, 'Configuration'),
      el('p', { className: 'muted', style: 'margin-top:-.3rem;font-size:.82rem' },
        'Base URL: ', fact(c.base_url, 'mono')));
    const kind = el('select', {}, el('option', { value: 'endpoint' }, 'endpoint'),
                                   el('option', { value: 'username' }, 'username'));
    const service = el('input', { value: 'default', placeholder: 'service' });
    const field = el('input', { value: tpl[0] ?? '', placeholder: 'field name' });
    const out = el('span', { className: 'muted' });
    const set = el('button', {}, 'Bind');

    // --- a closed set renders as a choice, not as a text box (C-225) --------
    //
    // The catalogue publishes the permitted values for a slot whose answer an operator cannot
    // discover — New Relic's two region hosts, Intercom's three. Rendering those as free text is
    // the whole defect: a wrong region is a 401 on every call, indistinguishable from a bad key,
    // so the operator rotates a credential that was never wrong. The server refuses a value
    // outside the set too; this is the half that stops it being entered.
    const choicesFor = () => (c.config_choices ?? []).find(e =>
      e.service === service.value && e.kind === kind.value && e.name === field.value);
    const text = el('input', { placeholder: 'value' });
    const select = el('select', {});
    const slot = el('div', { style: 'flex:1' });
    let value = text;
    const drawValue = () => {
      const closed = choicesFor();
      if (closed) {
        // Labelled, because `api.eu.newrelic.com` is not what an operator knows about their
        // account — "European Union" is. The value is what reaches the wire.
        select.replaceChildren(...closed.choices.map(ch => el('option', { value: ch.value }, ch.label)));
        value = select;
      } else {
        value = text;
      }
      slot.replaceChildren(value);
      hint.textContent = closed
        ? `${closed.label} — one of ${closed.choices.length}; anything else is refused`
        : '';
    };
    const hint = el('span', { className: 'muted', style: 'font-size:.75rem' });
    for (const control of [kind, service, field]) control.oninput = drawValue;
    kind.onchange = drawValue;

    set.onclick = async () => {
      try {
        await api('PUT', `/v1/config/${c.id}/${service.value}/${kind.value}/${field.value}`, { value: value.value });
        out.textContent = 'bound'; out.className = 'ok'; show(c.id);
      } catch (e) { out.textContent = e.message; out.className = 'err'; }
    };
    drawValue();
    cfg.append(el('div', { className: 'row' }, kind, service, field, slot, set, out),
               el('div', { className: 'row' }, hint));
    if (c.settings.length) {
      cfg.append(el('table', {}, el('tbody', {}, ...c.settings.map(([k, v]) =>
        el('tr', {}, el('td', { className: 'mono' }, k), el('td', { className: 'mono' }, v))))));
    }
    d.append(cfg);
  }

  // --- operations --------------------------------------------------------
  // **No request is made here, and that is the story** (C-237). This list used to run
  // `Promise.all(c.operations.map(o => api('GET', '/v1/operations/' + o.id)))` — one request per
  // operation in the connector, ~30 for the largest, to read `tool`, `description` and `risk`.
  // C-212 added `requires` and `callable` to `operations[]` *specifically* so that would not be
  // needed and this page kept doing it anyway; C-237 put the other five fields there too, so
  // opening a connector costs nothing beyond the connector itself. The one request left is the one
  // an operator asks for: expanding an operation fetches its Flux and its parameter schema, which
  // are the two things the list deliberately does not carry.
  //
  // The honest unit is still the operation: each says for itself whether it can be called and, when
  // it cannot, why — in the host's own vocabulary, via `requirementOf`.
  const opsSection = el('section', {}, el('h3', {}, `Operations · ${c.callable_operations} of ${c.operation_count} callable`));
  const services = new Map();
  for (const o of c.operations ?? []) {
    const key = published(o.service) ? o.service : '';
    if (!services.has(key)) services.set(key, []);
    services.get(key).push(o);
  }
  // `default` first — it is the service an operation belongs to unless its connector says
  // otherwise — then alphabetically, so `delivery` and `management` sit in a stable order.
  const order = ([a], [b]) => (a === 'default' ? -1 : b === 'default' ? 1 : a.localeCompare(b));
  for (const [service, ops] of [...services].sort(order)) {
    const group = el('div', { className: 'service' });
    group.dataset.service = service;
    group.append(el('h4', {},
      service === '' ? fact(null) : service,
      el('span', { className: 'chip' }, `${ops.length}`)));
    for (const o of [...ops].sort((a, b) => (a.tool ?? a.id).localeCompare(b.tool ?? b.id))) {
      const needs = requirementOf(o);
      const node = el('div', { className: 'op' + (o.callable ? '' : ' uncallable') });
      node.dataset.operation = o.id;
      node.append(
        el('span', { className: 'id' }, published(o.tool) ? o.tool : o.id),
        fact(o.description, 'muted desc'),
        needs ? el('span', { className: 'needs' }, needs) : '',
        el('span', { className: 'meta' },
          fact(o.risk, 'risk'),
          fact(o.idempotency, 'chip'),
          fact(joined(o.hosts), 'chip')));
      node.onclick = () => expand(o, opsSection);
      group.append(node);
    }
    opsSection.append(group);
  }
  d.append(opsSection);
}

/** The one per-operation request the console makes, and only for an operation somebody opened. */
async function expand(operation, after) {
  const open = $('#play');
  if (open) open.remove();
  const detail = await api('GET', `/v1/operations/${operation.id}`);
  playground(detail, after);
}

/**
 * Format whatever a vendor returned as a body. JSON is indented; anything else is left alone.
 */
const formatBody = body => typeof body === 'string' ? body : JSON.stringify(body, null, 2);

/**
 * **The response, read rather than dumped.**
 *
 * `exec::Outcome::content` is the JSON-encoded `{status, headers, body}` flux's `http.request` made
 * canonical in C-403, and this page wrote the whole document into one `<pre>`. Splitting it is a
 * read, never a rewrite: **the redactor's output passes through unchanged**, because it is what
 * stops a vendor echoing a token onto this surface, and a page that re-serialised it would be a
 * second rendering the redactor never saw.
 *
 * A response that is not that document is shown whole. Dropping what could not be parsed is how an
 * operator stops trusting the panel, and the thing most likely to arrive in an unexpected shape is
 * a failure — the one they most need to read.
 */
function renderResponse(out, outcome) {
  out.replaceChildren();
  out.className = 'response' + (outcome.is_error ? ' err' : '');
  const content = outcome.content ?? '';
  let document_ = null;
  try {
    const parsed = JSON.parse(content);
    if (parsed && typeof parsed === 'object' && 'status' in parsed) document_ = parsed;
  } catch { /* not the canonical document — shown whole below */ }

  if (!document_) {
    out.append(el('pre', { className: 'response-body' }, content));
    return;
  }
  const headers = Object.entries(document_.headers ?? {});
  out.append(
    el('div', { className: 'response-status ' + (document_.status < 400 ? 'ok' : 'err') },
      `HTTP ${document_.status}`),
    el('details', { className: 'response-headers' },
      el('summary', {}, `${headers.length} response headers`),
      el('pre', {}, headers.map(([name, value]) => `${name}: ${value}`).join('\n'))),
    el('pre', { className: 'response-body' }, formatBody(document_.body)));
}

/**
 * **The rehearsed request — what this call would send, without sending it.**
 *
 * `POST /v1/operations/{id}/dry-run` is C-145's seam: it reaches no socket and reads no secret,
 * placing each declared credential's *reference* where its value would go. So it answers before a
 * token exists, which is exactly when an operator most needs *"why will this not work"* answered.
 * The refusals are the valuable half and are shown verbatim — `crates/connectors-api/tests/dry_run.rs`
 * holds them to naming the field, its service and the operation, which is what this copy promises.
 */
function renderRehearsal(out, rehearsal) {
  const request = rehearsal.request ?? {};
  const headers = Object.entries(request.headers ?? {});
  const credentials = rehearsal.credentials ?? [];
  out.replaceChildren(
    el('div', { className: 'response-status' }, 'Not sent — this is the request it would build'),
    el('pre', { className: 'response-body' },
      `${request.method ?? ''} ${request.url ?? ''}\n`
      + headers.map(([name, value]) => `${name}: ${value}`).join('\n')
      + (published(request.body) ? `\n\n${request.body}` : '')),
    el('p', { className: 'muted', style: 'font-size:.78rem;margin:.2rem 0 0' },
      credentials.length
        ? credentials.map(c => `${c.credential} → ${c.place} ${c.target}`).join(' · ')
          + ' — shown as a reference; no stored value was read'
        : 'This call carries no credential.'));
}

function playground(op, after) {
  const panel = el('section', { id: 'play' }, el('h3', {}, 'Run ' + (published(op.tool) ? op.tool : op.id)));
  const run = el('button', {}, 'Send');
  const rehearse = el('button', { className: 'ghost' }, 'Dry run');
  const out = el('div', { className: 'response' });
  const problem = el('p', { className: 'err', style: 'font-size:.82rem;margin:.2rem 0' });

  // **The raw body is the source of truth, and it is a textarea** (C-237). It was a single-line
  // `<input value="{}">`, which cannot hold a real body, and whatever was in it went out unparsed —
  // so a missing brace was diagnosed by the vendor, as a 400 about a document it never received.
  const params = el('textarea', { className: 'mono', rows: 8, spellcheck: false });
  params.value = '{}';

  const parse = () => {
    const text = params.value.trim() || '{}';
    try { return { body: JSON.parse(text) }; }
    catch (e) { return { error: e.message }; }
  };
  const validate = () => {
    const result = parse();
    problem.textContent = result.error ? `That is not valid JSON — ${result.error}` : '';
    run.disabled = Boolean(result.error);
    rehearse.disabled = Boolean(result.error);
    return result;
  };
  params.oninput = validate;

  // **A schema-driven form, with no codegen.** `input_schema` is `connector_pack::project`'s
  // answer, which is flux's own `OpSpec::lower` — the same schema a model is handed. A composite op
  // declaration has no optional-parameter concept, so **every declared parameter is required by
  // construction** and the form is flat: one control per property, no optionality logic to get
  // wrong. The controls write into the textarea rather than replacing it, so the raw-JSON escape
  // hatch stays the thing that is sent.
  const properties = op.input_schema?.properties ?? {};
  const names = Object.keys(properties);
  const controls = new Map();
  const compose = () => {
    const draft = {};
    for (const [name, control] of controls) {
      if (control.value === '') continue;
      const declared = properties[name]?.type;
      // A `string` slot is taken literally — a JSON parse would turn the ticket subject `123` into
      // a number. Anything else is read as JSON and falls back to the text as typed.
      if (declared === 'string') { draft[name] = control.value; continue; }
      try { draft[name] = JSON.parse(control.value); }
      catch { draft[name] = control.value; }
    }
    params.value = JSON.stringify(draft, null, 2);
    validate();
  };
  const form = el('div', {});
  for (const name of names) {
    const declared = properties[name] ?? {};
    const control = el('input', { placeholder: declared.type ?? 'value' });
    control.oninput = compose;
    controls.set(name, control);
    form.append(el('div', { className: 'row' },
      el('label', { className: 'mono' }, name),
      control,
      el('span', { className: 'muted', style: 'font-size:.75rem;flex:1 1 8rem' },
        [declared.type, declared.description].filter(published).join(' — '))));
  }

  run.onclick = async () => {
    const result = validate();
    if (result.error) return;
    run.disabled = true;
    out.replaceChildren(el('span', { className: 'muted' }, 'sending…'));
    try {
      const r = await api('POST', `/v1/operations/${op.id}/execute`, result.body);
      renderResponse(out, r);
    } catch (e) {
      out.replaceChildren(el('pre', { className: 'response-body err' }, e.message));
    }
    run.disabled = false;
  };

  rehearse.onclick = async () => {
    const result = validate();
    if (result.error) return;
    rehearse.disabled = true;
    out.replaceChildren(el('span', { className: 'muted' }, 'rehearsing…'));
    try {
      renderRehearsal(out, await api('POST', `/v1/operations/${op.id}/dry-run`, result.body));
    } catch (e) {
      // The refusal *is* the answer here: `MissingConfig` names the unbound field and its service,
      // `MissingCredential` names the address to store a value at. Shown as written.
      out.replaceChildren(el('pre', { className: 'response-body err' }, e.message));
    }
    rehearse.disabled = false;
  };

  panel.append(
    el('p', { className: 'muted', style: 'margin-top:-.3rem;font-size:.82rem' }, fact(op.description)),
    el('div', { className: 'row' },
      el('span', { className: 'chip' }, published(op.service) ? op.service : UNPUBLISHED),
      el('span', { className: 'risk' }, published(op.risk) ? op.risk : UNPUBLISHED),
      el('span', { className: 'chip' }, published(op.idempotency) ? op.idempotency : UNPUBLISHED),
      el('span', { className: 'chip' }, joined(op.hosts) ?? UNPUBLISHED)),
    names.length
      ? el('p', { className: 'muted', style: 'font-size:.78rem;margin:.4rem 0 .2rem' },
          `${names.length} declared parameter${names.length === 1 ? '' : 's'}, all required`)
      : el('p', { className: 'muted', style: 'font-size:.78rem;margin:.4rem 0 .2rem' },
          'This operation declares no parameters.'),
    form,
    el('div', { className: 'row' }, el('label', {}, 'parameters (JSON)'), params),
    problem,
    el('div', { className: 'row' }, run, rehearse,
      el('span', { className: 'muted', style: 'font-size:.75rem' },
        'A dry run builds the request and stops. It reaches no vendor and reads no stored value.')),
    out,
    el('details', {}, el('summary', { className: 'muted', style: 'font-size:.8rem;cursor:pointer' },
      'the Flux this was compiled from'), el('pre', {}, published(op.flux) ? op.flux : UNPUBLISHED)));
  after.after(panel);
}

// Sign-in gates everything below, so the page asks who is asking before it asks for anything else.
// The states, and each is a real one an operator lands in:
//   - no door at all   → say which environment variables to set, and where to register
//   - a door, not signed in → a button per door that actually exists
//   - signed in        → the catalogue, scoped to that account's tenant
//
// `status.dev` (C-234) is the *same* value the server built its route table from, so the page can
// never offer a button that would 404. The dev button is drawn only when it is true; on an ordinary
// host this branch produces nothing at all.
async function start() {
  const status = await api('GET', '/auth/status');

  if (status.dev) {
    $('header .note').textContent =
      'DEV MODE — authentication is disabled. Loopback only. Not a real account.';
  }

  if (!status.configured && !status.dev) {
    $('#who').textContent = 'sign-in not configured';
    // `textContent` on a <pre>, never innerHTML: the message is server-composed, but a page that
    // renders server strings as markup is one server change away from being an XSS sink.
    $('#detail').replaceChildren(
      el('p', { className: 'err' }, 'Google sign-in is not set up yet.'),
      el('pre', { textContent: status.setup ?? '' }));
    return;
  }

  if (!status.signed_in) {
    $('#who').textContent = 'not signed in';
    const doors = [el('p', { className: 'muted' },
      'Connectors and credentials belong to the signed-in account.')];

    if (status.configured) {
      const button = el('button', {}, 'Sign in with Google');
      button.onclick = () => { window.location.href = '/auth/signin'; };
      doors.push(button);
    }

    if (status.dev) {
      // Labelled so it cannot be mistaken for the real sign-in: it says what it is, it says the
      // account is fake, and it is styled as a secondary action rather than the primary one.
      const dev = el('button', { className: 'ghost' },
        'Sign in as DEVELOPER — fake account, no Google, dev mode only');
      dev.onclick = async () => {
        // A POST rather than a link, for the reason `/auth/signout` is one: a route that changes
        // state must not be reachable from a cross-site top-level GET.
        await fetch('/auth/dev', { method: 'POST', redirect: 'manual' });
        window.location.reload();
      };
      doors.push(dev);
      doors.push(el('p', { className: 'err', style: 'font-size:.82rem' },
        'The developer sign-in exists because this host was started with --dev. '
        + 'It authenticates nobody. Its tenant is dev-local and it can see no real account’s data.'));
    }

    if (!status.configured) {
      doors.push(
        el('p', { className: 'muted', style: 'font-size:.82rem;margin-top:1rem' },
          'Google sign-in is not set up. To use a real account instead:'),
        el('pre', { textContent: status.setup ?? '' }));
    }

    $('#detail').replaceChildren(...doors);
    return;
  }

  const account = status.account ?? {};
  const out = el('button', {}, 'Sign out');
  out.onclick = async () => {
    // A form POST rather than a link: sign-out changes state, and `SameSite=Lax` lets a
    // cross-site *GET* carry the cookie while a cross-site POST does not.
    await fetch('/auth/signout', { method: 'POST', redirect: 'manual' });
    window.location.reload();
  };
  $('#who').replaceChildren(
    document.createTextNode(`${account.email ?? account.name ?? account.subject} · tenant ${account.tenant} `),
    out);

  await load();
}

start().catch(e => { $('#detail').replaceChildren(el('p', { className: 'err' }, e.message)); });
</script>
</body>
</html>
