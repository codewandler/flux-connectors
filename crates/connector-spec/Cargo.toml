[package]
name = "codewandler-connector-spec"
description = "The connector IR and its two front-ends: provider TOML and OpenAPI ingest. Performs no network IO."
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
readme = "README.md"
documentation = "https://docs.rs/connector-spec"
keywords = ["flux", "connector", "openapi", "ir", "codegen"]
categories = ["api-bindings", "development-tools"]

[lib]
# Pinned so the published package name and the crate name are independent. The package is
# `codewandler-*` on crates.io (C-195); the crate every dependent and every one of this
# crate's own integration tests writes is `connector_spec`. Without this, renaming the package
# silently renames the crate and breaks every `use` of it.
name = "connector_spec"
path = "src/lib.rs"

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_norway.workspace = true
toml.workspace = true
sha2.workspace = true
indexmap.workspace = true
