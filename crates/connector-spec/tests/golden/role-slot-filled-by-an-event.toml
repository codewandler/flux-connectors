# C-120: only an *operation* fills a role slot. This service has an event named `models.list`, which
# shares the member namespace and matches the slot's spelling — but an event is emitted into no
# module at all, so satisfying `llm_catalogue` with one would publish a live-listing capability that
# nothing can call. An event dressed up as a pollable op is the thing this repository refuses.
id = "acme"
vendor = "Acme"
base_url = "https://api.acme.example"

[[services]]
name = "models"
description = "The model catalogue."
roles = ["llm_catalogue"]

[[operations]]
id = "acme-models-fetch"
service = "models"
method = "GET"
direction = "read"
path = "/v1/models"
description = "Fetch the models."
risk = "low"
idempotency = "idempotent"

[[events]]
name = "models.list"
service = "models"
description = "The vendor announces a change to the model list."
