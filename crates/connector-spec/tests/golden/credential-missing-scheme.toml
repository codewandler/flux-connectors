# A credential that does not say how it reaches the wire. Defaulting to `bearer` here would send a
# secret in the wrong shape without anyone deciding to.
id = "zendesk"
base_url = "https://acme.zendesk.com"

[[auth]]
name = "zendesk.api_token"
env = ["ZENDESK_API_TOKEN"]

[[operations]]
id = "zendesk.test"
method = "GET"
direction = "read"
path = "/api/v2/users/me.json"
risk = "low"
idempotency = "idempotent"
auth = [{ credentials = ["zendesk.api_token"] }]
