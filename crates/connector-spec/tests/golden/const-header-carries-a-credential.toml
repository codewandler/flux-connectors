# A constant request header is a **literal in a committed artifact** — it reaches generated Flux, the
# manifest and the public catalogue verbatim — so it is the one field in this schema where a
# credential would be written down rather than referenced. Every spelling of that is refused (C-55):
# the header the `$auth` seam owns, the header a declared credential is injected into, a value that
# is a token, and a value naming the environment variable one resolves from.
id = "vendor"
base_url = "https://api.vendor.example"

[const_headers]
"Authorization" = "Bearer sk-live-not-a-real-token"
"X-Api-Key" = "VENDOR_API_KEY"

[[auth]]
name = "vendor.api_key"
scheme = { header = { name = "X-Api-Key" } }
env = ["VENDOR_API_KEY"]

[[operations]]
id = "vendor-thing-list"
method = "GET"
direction = "read"
path = "/v1/things"
description = "List things."
risk = "low"
idempotency = "idempotent"

[operations.params.const_headers]
"X-Tenant" = "${VENDOR_TENANT}"
