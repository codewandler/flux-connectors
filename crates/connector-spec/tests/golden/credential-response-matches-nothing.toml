# A declared location that resolves to nothing protects nothing — and it is the shape a vendor
# rename takes, so it is refused loudly rather than ignored.
#
# Two things are wrong here and both are reported: `ApiToken` is singular where the response spells
# it `ApiTokens`, and `Servers` is walked without the `*` that says "every element of an array".
# A silent no-op would read as protection while being none, which is worse than absence.
id = "postmark"
base_url = "https://api.postmarkapp.com"

[[operations]]
id = "postmark-server-list"
method = "GET"
direction = "read"
path = "/servers"
risk = "low"
idempotency = "idempotent"
auth = []
credential_response = ["/Servers/*/ApiToken", "/Servers/ApiTokens"]

[operations.response_schema]
type = "object"
required = ["Servers"]
properties = { Servers = { type = "array", items = { type = "object", properties = { ApiTokens = { type = "array", items = { type = "string" } } } } } }
