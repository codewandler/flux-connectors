# C-430's gate, proved on the operation that motivated it rather than on an invention.
#
# This is `postmark-server-list` as v0.9.0 actually shipped it — same path, same response shape —
# reinstated with the one thing the shipped file had no way to say: that `ApiTokens` is a
# credential. Saying it is what refuses the build.
#
# The pointer walks **into an array of objects**. `ApiTokens` sits under `Servers[]`, not at the
# response root, and that nesting is the case a hand-run one-level scan over `properties` missed on
# its first pass — it found three violations and not this one. `*` is "every element of an array".
id = "postmark"
base_url = "https://api.postmarkapp.com"

[[operations]]
id = "postmark-server-list"
method = "GET"
direction = "read"
path = "/servers"
description = "List every server on this account"
risk = "low"
idempotency = "idempotent"
auth = []
credential_response = ["/Servers/*/ApiTokens"]

[operations.response_schema]
type = "object"
required = ["TotalCount", "Servers"]
properties = { TotalCount = { type = "integer" }, Servers = { type = "array", items = { type = "object", required = ["ID", "Name"], properties = { ID = { type = "integer" }, Name = { type = "string" }, ApiTokens = { type = "array", items = { type = "string" }, description = "ACCOUNT-PRIVILEGED. This server's own live Server Token(s), in plaintext" } } } } }
