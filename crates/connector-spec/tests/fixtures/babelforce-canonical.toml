# The canonical babelforce surface — 397 operations, selected.
#
# **This is a test fixture, not a shipped provider.** `providers/babelforce.toml` still ships nine
# operations; widening it is C-417's, and this file is the measurement C-417 is planning against:
# what it actually costs, in lines a human reads, to select every operation manager-sdk exposes.
#
# The five documents declare 398 operations. The surface is 397: `POST /api/v1/webhook/zendesk`
# (`operationId` `zendesk`) is a receiver babelforce calls *into*, not a call anyone makes, and it is
# excluded here by path rather than by an exclusion list — `task-automation`'s other 30 operations
# are all under `/api/v3`, so stating that prefix says what is wanted instead of what is not.
#
# The shape is three declarations doing all the work:
#
#   * `[patch.naming]`  — one rule, so 397 `rename =` lines become one line plus the pins that hold
#     a shipped name still.
#   * `[[patch.select]]` — one per (document, method class), because `risk` is a claim about damage
#     and the reads and the deletes under one prefix are not one claim. Thirteen statements.
#   * `[[patch.operations]]` — the exceptions, and only the exceptions: the nine curated operations
#     that stay exposed to a model, and the one `operationId` two documents both declare.

id = "babelforce"
authority = "com.babelforce.api"
vendor = "Babelforce"
base_url = "https://services.babelforce.com"
description = "Babelforce cloud contact centre — the canonical operation surface"

[[services]]
name = "manager"
description = "The manager API: agents, calls, sessions, and account administration"

[[services]]
name = "auth"
description = "OAuth token endpoints"

[[services]]
name = "user"
description = "The signed-in user and the accounts they can reach"

[[services]]
name = "task-automation"
description = "Task automation: submission, scripts, secrets and metrics"

[[services]]
name = "task-schedule"
description = "Scheduled tasks"

[[auth]]
name = "babelforce.access_token"
scheme = "bearer"
env = ["BABELFORCE_ACCESS_TOKEN"]
description = "SSO-issued babelforce access token, minted outside flux and supplied through the environment"

[[spec]]
path = "specs/babelforce/manager-2026-07-10.openapi.yaml"
service = "manager"

[[spec]]
path = "specs/babelforce/auth-2026-06-25.openapi.yaml"
service = "auth"

[[spec]]
path = "specs/babelforce/user-2026-06-25.openapi.yaml"
service = "user"

[[spec]]
path = "specs/babelforce/task-automation-2026-06-25.openapi.yaml"
service = "task-automation"

[[spec]]
path = "specs/babelforce/task-schedule-2026-06-25.openapi.yaml"
service = "task-schedule"

# ---------------------------------------------------------------------------------------------
# Naming — one rule, nine pins.
#
# The rule derives `listReportingCalls` into `babelforce-list-reporting-calls`. The pins hold the
# nine ids `providers/babelforce.toml` already publishes: those are a public contract and must not
# move because a rule arrived underneath them.
# ---------------------------------------------------------------------------------------------

[patch.naming]
rule = "kebab"
prefix = "babelforce"

[patch.naming.pin]
listAgents = "babelforce-agent-list"
getAgent = "babelforce-agent-get"
updateAgentStatus = "babelforce-agent-status-update"
listReportingCalls = "babelforce-call-list"
getCall = "babelforce-call-get"
hangupCall = "babelforce-call-hangup"
setCallSessionVariables = "babelforce-call-session-set"
getSessionVariables = "babelforce-session-get"
updateSessionVariables = "babelforce-session-update"

# ---------------------------------------------------------------------------------------------
# Selection — thirteen statements for 397 operations.
#
# Split by method class rather than by resource, because what a selector *states* is a damage claim:
# `risk = "destructive"` over 50 DELETEs is one reviewable line, and the same line over the reads
# beside them would be a lie. Reads state nothing at all — a method that changes nothing has no
# damage claim to get wrong, and takes the only values a read can have.
#
# `expose = false` throughout: 397 operations catalogued and callable, and the nine below are the
# only ones that reach a model. Several hundred tools is not a catalogue.
# ---------------------------------------------------------------------------------------------

[[patch.select]]
service = "manager"
path_prefix = "/api/v2"
methods = ["GET"]
expose = false

[[patch.select]]
service = "manager"
path_prefix = "/api/v2"
methods = ["POST", "PUT", "PATCH"]
risk = "high"
idempotency = "non_idempotent"
expose = false

[[patch.select]]
service = "manager"
path_prefix = "/api/v2"
methods = ["DELETE"]
risk = "destructive"
idempotency = "non_idempotent"
expose = false

[[patch.select]]
service = "auth"
path_prefix = "/oauth"
methods = ["GET"]
expose = false

# `POST /oauth/token` mints a credential and `POST /oauth/revoke` destroys one; neither is a call a
# model makes, and both are stated rather than swept in with the manager writes.
[[patch.select]]
service = "auth"
path_prefix = "/oauth"
methods = ["POST"]
risk = "high"
idempotency = "non_idempotent"
expose = false

[[patch.select]]
service = "user"
path_prefix = "/api/v2/user"
methods = ["GET"]
expose = false

[[patch.select]]
service = "user"
path_prefix = "/api/v2/user"
methods = ["POST"]
risk = "high"
idempotency = "non_idempotent"
expose = false

# `/api/v3` and not the whole document: `POST /api/v1/webhook/zendesk` is a receiver, and the
# scope constraint excludes it. Stating the prefix that holds the other 30 says what is wanted.
[[patch.select]]
service = "task-automation"
path_prefix = "/api/v3"
methods = ["GET"]
expose = false

[[patch.select]]
service = "task-automation"
path_prefix = "/api/v3"
methods = ["POST", "PUT", "PATCH"]
risk = "high"
idempotency = "non_idempotent"
expose = false

[[patch.select]]
service = "task-automation"
path_prefix = "/api/v3"
methods = ["DELETE"]
risk = "destructive"
idempotency = "non_idempotent"
expose = false

[[patch.select]]
service = "task-schedule"
path_prefix = "/api/v3"
methods = ["GET"]
expose = false

[[patch.select]]
service = "task-schedule"
path_prefix = "/api/v3"
methods = ["POST"]
risk = "high"
idempotency = "non_idempotent"
expose = false

[[patch.select]]
service = "task-schedule"
path_prefix = "/api/v3"
methods = ["DELETE"]
risk = "destructive"
idempotency = "non_idempotent"
expose = false

# ---------------------------------------------------------------------------------------------
# Exceptions — ten blocks, and every one of them says something a selector cannot.
#
# Nine are the curated operations that reach a model as tools; their ids come from the pins above,
# so each block states only the exception it is here for. The tenth breaks a collision: `getUser` is
# declared by `manager-2026-07-10` and by `user-2026-06-25` as two different requests, and a pin is
# keyed by `operationId` alone, so the one that moves is named by the block that can state a
# `service`.
# ---------------------------------------------------------------------------------------------

[[patch.operations]]
service = "manager"
select = "listAgents"
expose = true

[[patch.operations]]
service = "manager"
select = "getAgent"
expose = true

[[patch.operations]]
service = "manager"
select = "updateAgentStatus"
expose = true

[[patch.operations]]
service = "manager"
select = "listReportingCalls"
expose = true

[[patch.operations]]
service = "manager"
select = "getCall"
expose = true

[[patch.operations]]
service = "manager"
select = "hangupCall"
risk = "destructive"
expose = true

[[patch.operations]]
service = "manager"
select = "setCallSessionVariables"
expose = true

[[patch.operations]]
service = "manager"
select = "getSessionVariables"
expose = true

[[patch.operations]]
service = "manager"
select = "updateSessionVariables"
expose = true

[[patch.operations]]
service = "user"
select = "getUser"
rename = "babelforce-user-me-get"
