[package]
name = "codewandler-connector-catalog"
description = "Every generated connector operation, embedded at compile time and queryable by key."
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
readme = "README.md"
documentation = "https://docs.rs/codewandler-connector-catalog"
keywords = ["flux", "connector", "catalog", "api", "codegen"]
categories = ["api-bindings", "data-structures"]

# The package carries the `connector-` prefix the workspace uses on the registry; the library is
# `catalog`, so consumers write `catalog::operation(…)`. Same split as the `codewandler-flux-lang`
# / `flux_lang` pin in the root manifest.
[lib]
name = "catalog"
path = "src/lib.rs"

# One dependency, and it is catalogue data rather than machinery (C-537): the reader crate carries
# the embedded catalog pack — every provider's canonical document in one versioned, digest-checked
# file — and itself resolves nothing. This crate re-exports it as `catalog::reader`, which is the
# shim role Decision 0022 assigns it; the `&'static` tables below remain the storage of the legacy
# API until C-540. The catalog is otherwise what it always was: data plus lookups over it, with
# nothing to parse at runtime.
[dependencies]
catalog-reader.workspace = true

[dev-dependencies]
# The parse-and-analyze gate (C-11) applied to each embedded operation on its own. A dev-dependency
# only: a consumer of the catalog never needs flux-lang to read the text out of it.
flux-lang.workspace = true
