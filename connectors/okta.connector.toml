generator = "flux-connectors 0.17.0"
connector = "okta"
gid = "com.okta.api:v1"
vendor = "Okta"
description = "Okta identity management: read users and groups in an org, read a user's group memberships, and deactivate a user"
runtime = "http"
base_url = "https://{domain}/api/v1"
api_version = "v1"
module = "okta.flux"
operations = ["okta-user-list", "okta-user-get", "okta-group-list", "okta-user-group-list", "okta-user-deactivate"]

[operation_semantic_effects]
