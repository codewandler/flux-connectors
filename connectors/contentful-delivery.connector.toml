# Generated by flux-connectors 0.25.0 — do not edit.
# Auth is assembled by the host resolver (`connector-pack`); this manifest becomes a projection of the catalog artifact (C-534).
generator = "flux-connectors 0.25.0"
connector = "contentful"
service = "delivery"
vendor = "Contentful"
description = "Contentful headless CMS: read published content from the Content Delivery API, and create and publish entries through the Content Management API — two different hosts and two different tokens for one vendor"
runtime = "http"
base_url = "https://cdn.contentful.com/spaces/{space_id}/environments/{environment_id}"
module = "contentful-delivery.flux"
operations = ["contentful-entry-get", "contentful-entries-list", "contentful-asset-get"]
verify = "contentful-entries-list"

[operation_directions]
contentful-asset-get = "read"
contentful-entries-list = "read"
contentful-entry-get = "read"

[operation_semantic_effects]
contentful-asset-get = []
contentful-entries-list = []
contentful-entry-get = []

[[auth]]
name = "contentful.delivery_token"
scheme = "bearer"
env = ["CONTENTFUL_DELIVERY_TOKEN"]
description = "Contentful Content Delivery API (CDA) access token, sent as a bearer. Read-only: published content in one space only, and only the Delivery API accepts it"

[[auth]]
name = "contentful.management_token"
scheme = "bearer"
env = ["CONTENTFUL_MANAGEMENT_TOKEN"]
description = "Contentful Content Management API (CMA) access token, sent as a bearer. Read and write in one space; the Delivery API rejects it. Required only for contentful-entry-create and contentful-entry-publish — every read above uses the Delivery token instead"

[[default_auth]]
credentials = ["contentful.delivery_token"]

[[config]]
name = "delivery_space_id"
service = "delivery"
label = "Contentful space ID"
help = "Found on the space's Settings > General settings page in the Contentful web app. Identifies which space the delivery token reads from"
example = "a1b2c3d4e5f6"
docs_url = "https://www.contentful.com/developers/docs/references/authentication/"
binds = "endpoint.space_id"
level = "connection"

[[config]]
name = "delivery_environment_id"
service = "delivery"
label = "Contentful environment"
help = "The environment within the space to read from — commonly `master` unless this space uses staged environments"
example = "master"
docs_url = "https://www.contentful.com/developers/docs/concepts/multiple-environments/"
binds = "endpoint.environment_id"
level = "connection"

[[config]]
name = "delivery_token"
service = "delivery"
label = "Contentful Delivery API token"
help = "Create a Content Delivery API access token in the space under Settings > API keys. Read-only: published content in this space only"
format = "token"
secret = true
docs_url = "https://www.contentful.com/developers/docs/references/authentication/"
binds = "credential.contentful.delivery_token"
level = "connection"
