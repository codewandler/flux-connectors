# Generated by flux-connectors 0.18.0 — do not edit.
# Auth and the `http_hosts` allowlist land in C-10.
generator = "flux-connectors 0.18.0"
connector = "zendesk"
gid = "com.zendesk.api:v2"
vendor = "Zendesk"
description = "Zendesk Support ticketing: search, read and update tickets and comments; inspect audits, incremental exports and custom-object definitions"
runtime = "http"
base_url = "https://{subdomain}.zendesk.com"
api_version = "v2"
module = "zendesk.flux"
operations = ["zendesk-ticket-audit-list", "zendesk-incremental-ticket-list", "zendesk-incremental-user-list", "zendesk-incremental-organization-list", "zendesk-incremental-ticket-event-list", "zendesk-custom-object-list", "zendesk-ticket-recent-list", "zendesk-view-ticket-list", "zendesk-user-show", "zendesk-organization-show", "zendesk-group-list", "zendesk-ticket-field-list", "zendesk-ticket-form-list", "zendesk-custom-status-list", "zendesk-test", "zendesk-ticket-search", "zendesk-ticket-show", "zendesk-ticket-comment-list", "zendesk-ticket-update"]
verify = "zendesk-test"

[operation_semantic_effects]
zendesk-custom-object-list = []
zendesk-custom-status-list = []
zendesk-group-list = []
zendesk-incremental-organization-list = []
zendesk-incremental-ticket-event-list = []
zendesk-incremental-ticket-list = []
zendesk-incremental-user-list = []
zendesk-organization-show = []
zendesk-test = []
zendesk-ticket-audit-list = []
zendesk-ticket-comment-list = []
zendesk-ticket-field-list = []
zendesk-ticket-form-list = []
zendesk-ticket-recent-list = []
zendesk-ticket-search = []
zendesk-ticket-show = []
zendesk-ticket-update = []
zendesk-user-show = []
zendesk-view-ticket-list = []

[[auth]]
name = "zendesk.api_token"
scheme = "basic"
env = ["ZENDESK_API_TOKEN"]
user_env = ["ZENDESK_USER"]
user_suffix = "/token"
description = "Zendesk API token; the user half is the agent email with Zendesk's /token marker"

[[auth]]
name = "zendesk.messaging_key"
scheme = "basic"
env = ["ZENDESK_MESSAGING_KEY_SECRET"]
user_env = ["ZENDESK_MESSAGING_KEY_ID"]
description = "App-scoped Zendesk Messaging API key id and secret"

[[default_auth]]
credentials = ["zendesk.api_token"]

[[config]]
name = "subdomain"
label = "Zendesk subdomain"
help = "The part of your Zendesk URL before `.zendesk.com` — if you sign in at `acme.zendesk.com`, this is `acme`"
example = "acme"
format = "subdomain"
docs_url = "https://support.zendesk.com/hc/en-us/articles/4409381383578"
binds = "endpoint.subdomain"
level = "connection"

[[config]]
name = "email"
label = "Agent email"
help = "The email of the Zendesk agent whose API token you are using. Zendesk sends it as the username half of the request, with its own `/token` marker appended — you do not type that part"
example = "agent@acme.com"
format = "email"
binds = "username.zendesk.api_token"
level = "connection"

[[config]]
name = "api_token"
label = "API token"
help = "Create one under Admin Center → Apps and integrations → Zendesk API. Zendesk shows it once"
format = "token"
secret = true
docs_url = "https://support.zendesk.com/hc/en-us/articles/4408889192858"
binds = "credential.zendesk.api_token"
level = "connection"
