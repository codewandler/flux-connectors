# Generated by flux-connectors 0.25.0 — do not edit.
# Auth is assembled by the host resolver (`connector-pack`); this manifest becomes a projection of the catalog artifact (C-534).
generator = "flux-connectors 0.25.0"
connector = "confluence"
gid = "com.atlassian.confluence:v2"
vendor = "Confluence"
description = "Confluence Cloud wiki: find spaces, list the pages in one, read a page's metadata, publish a new page, and comment on one. Page and comment *content* cannot be read back — see the connector's notes"
runtime = "http"
base_url = "https://{site}.atlassian.net/wiki"
api_version = "v2"
module = "confluence.flux"
operations = ["confluence-space-list", "confluence-space-get", "confluence-space-pages", "confluence-page-get", "confluence-page-create", "confluence-comment-add"]
verify = "confluence-space-list"

[operation_directions]
confluence-comment-add = "write"
confluence-page-create = "write"
confluence-page-get = "read"
confluence-space-get = "read"
confluence-space-list = "read"
confluence-space-pages = "read"

[operation_semantic_effects]
confluence-comment-add = []
confluence-page-create = []
confluence-page-get = []
confluence-space-get = []
confluence-space-list = []
confluence-space-pages = []

[[auth]]
name = "confluence.api_token"
scheme = "basic"
env = ["CONFLUENCE_API_TOKEN"]
user_env = ["CONFLUENCE_USER"]
description = "Atlassian API token; the user half is the account email that minted it. This is the same token a Jira connection uses, but it is stored at a separate address and must be supplied again"

[[default_auth]]
credentials = ["confluence.api_token"]

[[config]]
name = "site"
label = "Atlassian site name"
help = "The part of your Confluence URL before `.atlassian.net` — if you sign in at `acme.atlassian.net/wiki`, this is `acme`. It is the same site name as your Jira connection, if you have one"
example = "acme"
format = "subdomain"
docs_url = "https://support.atlassian.com/confluence-cloud/docs/what-is-confluence-cloud/"
binds = "endpoint.site"
level = "connection"

[[config]]
name = "email"
label = "Atlassian account email"
help = "The email of the account that minted the API token. It travels as the username half of the request"
example = "you@acme.com"
format = "email"
binds = "username.confluence.api_token"
level = "connection"

[[config]]
name = "api_token"
label = "API token"
help = "Create one at id.atlassian.com under Security → API tokens. Atlassian shows it once. This is the same kind of token a Jira connection uses — and if you already made one for Jira, that token works here too, but it has to be pasted again: the two connections store it separately"
format = "token"
secret = true
docs_url = "https://id.atlassian.com/manage-profile/security/api-tokens"
binds = "credential.confluence.api_token"
level = "connection"
