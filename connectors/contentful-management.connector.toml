# Generated by flux-connectors 0.23.0 — do not edit.
# Auth is assembled by the host resolver (`connector-pack`); this manifest becomes a projection of the catalog artifact (C-534).
generator = "flux-connectors 0.23.0"
connector = "contentful"
service = "management"
vendor = "Contentful"
description = "Contentful headless CMS: read published content from the Content Delivery API, and create and publish entries through the Content Management API — two different hosts and two different tokens for one vendor"
runtime = "http"
base_url = "https://api.contentful.com/spaces/{space_id}/environments/{environment_id}"
module = "contentful-management.flux"
operations = ["contentful-entry-create", "contentful-entry-publish"]

[operation_directions]
contentful-entry-create = "write"
contentful-entry-publish = "write"

[operation_semantic_effects]
contentful-entry-create = []
contentful-entry-publish = []

[[auth]]
name = "contentful.delivery_token"
scheme = "bearer"
env = ["CONTENTFUL_DELIVERY_TOKEN"]
description = "Contentful Content Delivery API (CDA) access token, sent as a bearer. Read-only: published content in one space only, and only the Delivery API accepts it"

[[auth]]
name = "contentful.management_token"
scheme = "bearer"
env = ["CONTENTFUL_MANAGEMENT_TOKEN"]
description = "Contentful Content Management API (CMA) access token, sent as a bearer. Read and write in one space; the Delivery API rejects it. Required only for contentful-entry-create and contentful-entry-publish — every read above uses the Delivery token instead"

[[default_auth]]
credentials = ["contentful.delivery_token"]

[[config]]
name = "management_space_id"
service = "management"
label = "Contentful space ID"
help = "Found on the space's Settings > General settings page in the Contentful web app. Identifies which space the management token writes to"
example = "a1b2c3d4e5f6"
docs_url = "https://www.contentful.com/developers/docs/references/content-management-api/"
binds = "endpoint.space_id"
level = "connection"

[[config]]
name = "management_environment_id"
service = "management"
label = "Contentful environment"
help = "The environment within the space to write to — commonly `master` unless this space uses staged environments"
example = "master"
docs_url = "https://www.contentful.com/developers/docs/concepts/multiple-environments/"
binds = "endpoint.environment_id"
level = "connection"

[[config]]
name = "management_token"
service = "management"
label = "Contentful Management API token"
help = "Create a Content Management API token (a Personal Access Token) in the space under Settings > API keys > Content management tokens. Grants create and publish access in this space — never reuse the Delivery token here"
format = "token"
secret = true
docs_url = "https://www.contentful.com/developers/docs/references/content-management-api/"
binds = "credential.contentful.management_token"
level = "connection"
