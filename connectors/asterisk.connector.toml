description = "Receive the complete stream of events for an ARI Stasis application"
transport = "socket"
events = ["device-state-changed", "playback-started", "playback-continuing", "playback-finished", "recording-started", "recording-finished", "recording-failed", "application-move-failed", "application-registered", "application-unregistered", "application-replaced", "bridge-created", "bridge-destroyed", "bridge-merged", "bridge-blind-transfer", "bridge-attended-transfer", "bridge-video-source-changed", "channel-created", "channel-destroyed", "channel-entered-bridge", "channel-left-bridge", "channel-state-change", "channel-dtmf-received", "channel-dialplan", "channel-caller-id", "channel-userevent", "channel-hangup-request", "channel-varset", "channel-tone-detected", "channel-talking-started", "channel-talking-finished", "channel-hold", "channel-unhold", "contact-status-change", "endpoint-state-change", "dial", "stasis-end", "stasis-start", "text-message-received", "channel-connected-line", "peer-status-change", "channel-transfer", "rest-response", "call-broadcast", "call-claimed"]
payload_root = true

[channels.connect]
path = "/events"

[channels.connect.query]
app = "{app}"
subscribeAll = "{subscribe_all}"

[[channels.connect.auth]]
credentials = ["asterisk.password"]

[channels.verification]
kind = "connection"
verified = true

[channels.discriminator]
source = "body"
name = "type"
