[[auth]]
name = "asterisk.password"
scheme = "basic"
env = ["ASTERISK_ARI_PASSWORD"]
user_env = ["ASTERISK_ARI_USERNAME"]
description = "Asterisk ARI Basic authentication password, paired with the deployment's ARI username"

[[default_auth]]
credentials = ["asterisk.password"]

[[config]]
name = "host"
label = "Asterisk host"
help = "The hostname of the TLS-enabled Asterisk HTTP service without a scheme, port, or `/ari`"
example = "pbx.example.com"
binds = "endpoint.host"
level = "connection"

[[config]]
name = "username"
label = "ARI username"
help = "The username configured for ARI in Asterisk's `ari.conf`"
example = "flux"
binds = "username.asterisk.password"
level = "connection"

[[config]]
name = "password"
label = "ARI password"
help = "The password configured beside the ARI username in Asterisk's `ari.conf`"
format = "token"
secret = true
binds = "credential.asterisk.password"
level = "connection"

[[config]]
name = "app"
label = "Stasis application"
help = "The ARI Stasis application whose events this connection receives"
example = "flux"
binds = "channel.ari-events.query.app"
level = "connection"

[[config]]
name = "subscribe_all"
label = "Subscribe to all applications"
help = "Whether ARI should deliver events for every application instead of only the named Stasis application"
example = "false"
required = false
default = "false"
binds = "channel.ari-events.query.subscribeAll"
level = "connection"

