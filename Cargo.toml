[workspace]
resolver = "2"
members = [
    "crates/connector-spec",
    "crates/connector-flux",
    "crates/connector-cli",
    "crates/catalog",
    "crates/connector-pack",
    "crates/connector-secrets",
]

[workspace.package]
edition = "2021"
version = "0.6.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/codewandler/flux-connectors"
homepage = "https://github.com/codewandler/flux-connectors"
rust-version = "1.87"

[workspace.dependencies]
# Internal crates.
connector-spec = { package = "codewandler-connector-spec", version = "0.6.0", path = "crates/connector-spec" }
connector-flux = { version = "0.6.0", path = "crates/connector-flux" }
# The catalog (C-38): generated data, and the crate a consumer adds to get it. Nothing in this
# workspace depends on it — it is the leaf the pipeline writes into — but it is listed here so that
# a consumer inside the workspace picks up the same pin as one outside it.
# Keyed `catalog`, not `connector-catalog`, and the difference is load-bearing. This crate sets
# `[lib] name = "catalog"`, so dependents `use catalog::`. Without a `package =` alias cargo binds
# the extern to the *lib* name; with one it binds to the *key*. Keying it `connector-catalog` here
# therefore renames the extern to `connector_catalog` and breaks every `use catalog::` in the tree.
catalog = { package = "codewandler-connector-catalog", version = "0.6.0", path = "crates/catalog" }
# The Tool pack (C-114): the flux interop layer. It is the one crate here that links flux's
# *runtime* — see the note under `flux-runtime` below for why that does not contradict
# "this repo compiles; flux executes".
connector-pack = { package = "codewandler-connector-pack", version = "0.6.0", path = "crates/connector-pack" }
# The secret store (C-91): a **host library**, not part of the compiler. It is a workspace member so
# that it is built and tested here, and nothing in the compile path may depend on it —
# `crates/connector-cli/tests/dependency_fence.rs` asserts that over the resolved dependency graph,
# because a Vault client reachable from `connector-cli` would quietly end the offline guarantee that
# `no_network.rs` exists to state.
connector-secrets = { package = "codewandler-connector-secrets", version = "0.6.0", path = "crates/connector-secrets" }

# Flux-Lang: the emit target. Pinned deliberately — bumping this is a reviewed change, and
# `flux-connectors check` verifies generated artifacts still match the pin (C-14).
#
# From crates.io, deliberately — not a git or path dependency (C-1):
#   - git: the flux remote is reached through a custom SSH host alias (`git@codewandler:…`) that
#     exists only in a developer's ssh config, so a git dep resolves locally and fails in CI.
#   - path (`../flux`): absent from a fresh clone, and would couple this repo to an unpublished
#     working tree rather than to a reviewed release.
# flux publishes flux-lang to crates.io, so the registry pin is the only form that resolves
# everywhere. The lib name stays `flux_lang`; only the *package* carries the vanity prefix.
flux-lang = { package = "codewandler-flux-lang", version = "0.41" }

# The flux *runtime* seam, used by `connector-pack` alone (C-114). AGENTS.md's "flux-connectors does
# not depend on the flux runtime" holds for the compiler — `connector-spec`, `connector-flux` and
# `connector-cli` still link none of this, and `connector-catalog` stays dependency-free. The pack is
# a **declaration** handed to a host that already runs flux: linking `ToolSpec` and the `Tool` trait
# is what lets a connector be gated individually by flux's own permission envelope. This repository
# still ships no runtime of its own.
#
# From crates.io for the same reasons flux-lang is. `flux-spec` has its own version line: it is the
# frozen wire vocabulary a guest plugin compiles against, so it moves independently of the runtime.
#
# It moved, and this requirement deliberately did not (C-192). crates.io is at 1.3.0, and both
# `flux-lang` and `flux-runtime` 0.41 require it as plain `"1"` — so a fresh resolve anywhere
# selects 1.3.0, and the committed lock does too. The requirement below stays `1.2` because it is a
# **floor**, not a pin: 1.3.0 is purely additive over 1.2.1 (it derives `JsonSchema` on `Effect`,
# `Risk`, `Idempotency`, `AccessKind` and `ToolSpec` and changes nothing else), so nothing here needs
# it. Raising the floor to `1.3` would narrow what a consumer may unify with, and buy nothing.
flux-core = { package = "codewandler-flux-core", version = "0.41" }
flux-runtime = { package = "codewandler-flux-runtime", version = "0.41" }
flux-spec = { package = "codewandler-flux-spec", version = "1.2" }
# A **dev-dependency of `connector-pack` only** (C-116). `ToolContext::new` takes an `Arc<System>`,
# and a `ToolContext` is the only way to reach the redactor — so without this, the one property this
# repository must prove about credentials (they never reach a surface) could not be driven through
# `Tool::execute` at all, and C-115 had to record `execute` as untested for exactly that reason. It
# is already in the lock as a transitive dependency of `flux-runtime`, so naming it here resolves
# nothing new; no non-test code links it.
flux-system = { package = "codewandler-flux-system", version = "0.41" }

# Shared third-party.
anyhow = "1"
async-trait = "0.1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
indexmap = { version = "2", features = ["serde"] }
jsonschema = { version = "0.49.2", default-features = false }

# Host-library only, reached exclusively from `connector-secrets` (C-91) and never from the
# compiler. `reqwest` is optional there and off by default; `default-features = false` keeps the
# tree to rustls and HTTP/1.1, which is all a Vault KV v2 call needs. `tokio` is a dev-dependency
# there, to drive the async trait in tests; the version already in the lock comes from flux's
# runtime, so this pin adds no resolution of its own.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", default-features = false }
