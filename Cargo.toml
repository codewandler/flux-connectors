[workspace]
# **MSRV-aware dependency resolution** (C-213). Under `resolver = "2"` cargo selected the newest
# semver-compatible release of every requirement and never looked at what Rust version it declared,
# so a caret `jsonwebtoken = "10.3"` resolved straight to 10.4.0 — `rust-version = 1.88.0` against
# this workspace's 1.87 — and nothing said so. It was caught by a person reading the lockfile.
# `resolver = "3"` picks the newest version whose declared `rust-version` this workspace satisfies,
# which turns that class of drift from a review finding into a resolution outcome. It needs cargo
# 1.84+; the MSRV below is 1.87, so every toolchain this workspace claims to support has it.
#
# **What it does not do**, because a partial guarantee read as a total one is worse than none:
#   - It is a *preference*, not a constraint. If a requirement's whole version range declares too
#     high an MSRV, cargo still resolves it and only warns. That case is what
#     `crates/connector-cli/tests/msrv_fence.rs` is for — the resolver avoids the breach, the fence
#     is what *fails* on one.
#   - It does not revisit an existing `Cargo.lock`. Versions already locked stay locked until
#     something re-resolves them, so switching the resolver moved nothing on its own.
#   - It reads *declarations*. A dependency using a 1.88 feature without raising its own
#     `rust-version`, or such a feature written here, is invisible to it.
#   - It does not build anything on the declared MSRV. CI installs one pinned toolchain (1.97.0)
#     and no job builds on 1.87, so the declared MSRV remains **untested** — see the fence's
#     `ci_pins_a_toolchain_far_above_the_declared_msrv`, which asserts that gap rather than letting
#     the resolver imply coverage that does not exist.
resolver = "3"
members = [
    "crates/connector-address",
    "crates/connector-spec",
    "crates/connector-flux",
    "crates/connector-cli",
    "crates/catalog",
    "crates/connector-pack",
    "crates/connector-secrets",
    # The reference host (C-200). `publish = false`, and a **leaf**: nothing in this workspace may
    # depend on it. It is the one crate here that opens sockets, binds ports and runs a loop, which
    # is why `crates/connector-cli/tests/dependency_fence.rs` names it in `NETWORK_CRATES` rather
    # than leaving the exception merely unexamined.
    "crates/connectors-api",
]

[workspace.package]
edition = "2021"
version = "0.18.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/codewandler/flux-connectors"
homepage = "https://github.com/codewandler/flux-connectors"
rust-version = "1.87"

[workspace.dependencies]
# Internal crates.
# The address vocabulary (C-407): pid/gid/oip and the credential path, and nothing else. It sits
# *below* the compiler rather than inside it, which is the whole reason it exists — `connector-spec`
# is the connector IR, both front-ends, validation and the lockfile writer, and one re-export of
# `CredentialRef` from `connector-secrets` was enough to drag all of it into the crates.io closure.
# `crates/connector-cli/tests/publish_closure.rs::no_machinery_crate_is_published` is what keeps that
# edge from growing back.
connector-address = { package = "codewandler-connector-address", version = "0.18.0", path = "crates/connector-address" }
connector-spec = { package = "codewandler-connector-spec", version = "0.18.0", path = "crates/connector-spec" }
connector-flux = { version = "0.18.0", path = "crates/connector-flux" }
# The catalog (C-38): generated data, and the crate a consumer adds to get it. Nothing in this
# workspace depends on it — it is the leaf the pipeline writes into — but it is listed here so that
# a consumer inside the workspace picks up the same pin as one outside it.
# Keyed `catalog`, not `connector-catalog`, and the difference is load-bearing. This crate sets
# `[lib] name = "catalog"`, so dependents `use catalog::`. Without a `package =` alias cargo binds
# the extern to the *lib* name; with one it binds to the *key*. Keying it `connector-catalog` here
# therefore renames the extern to `connector_catalog` and breaks every `use catalog::` in the tree.
catalog = { package = "codewandler-connector-catalog", version = "0.18.0", path = "crates/catalog" }
# The Tool pack (C-114): the flux interop layer. It is the one crate here that links flux's
# *runtime* — see the note under `flux-runtime` below for why that does not contradict
# "this repo compiles; flux executes".
connector-pack = { package = "codewandler-connector-pack", version = "0.18.0", path = "crates/connector-pack" }
# The secret store (C-91): a **host library**, not part of the compiler. It is a workspace member so
# that it is built and tested here, and nothing in the compile path may depend on it —
# `crates/connector-cli/tests/dependency_fence.rs` asserts that over the resolved dependency graph,
# because a Vault client reachable from `connector-cli` would quietly end the offline guarantee that
# `no_network.rs` exists to state.
connector-secrets = { package = "codewandler-connector-secrets", version = "0.18.0", path = "crates/connector-secrets" }

# **The engine line is recorded once, in `crates/connector-cli/tests/flux_engine_line.rs`** (C-403).
# `ENGINE_LINE` and `SPEC_LINE` there are the statement; the requirements below are required to
# agree with them, and the lock is required to carry one engine line rather than two. So a bump is a
# value change in one constant, and this test names every requirement still behind it.
#
# **The line is `0.54`, and it moves as one compatibility unit** (C-493). `connector-pack`
# hands a host `Arc<dyn flux_runtime::Tool>` and `flux_core::Result`; a `0.x` requirement is
# `>=0.N.0, <0.N+1.0` to cargo, so a pack built on 0.52 and a host on 0.54 are two unrelated traits in
# one graph. Staying a minor behind is therefore not a conservative choice, it is an unlinkable one —
# which is why every pin below moves together or none does.
#
# **What 0.54 changes at this boundary is measured, not inferred from a release headline**
# (C-493). It is the first line with the guarded WebSocket system that executes the generated
# channel plans this release publishes. The story records the registry preflight, one-line failure,
# lock census and workspace gate rather than assuming compatibility from the release headline.
#
# Flux-Lang: the emit target. Pinned deliberately — bumping this is a reviewed change, and
# `flux-connectors check` verifies generated artifacts still match the pin (C-14).
#
# From crates.io, deliberately — not a git or path dependency (C-1):
#   - git: the flux remote is reached through a custom SSH host alias (`git@codewandler:…`) that
#     exists only in a developer's ssh config, so a git dep resolves locally and fails in CI.
#   - path (`../flux`): absent from a fresh clone, and would couple this repo to an unpublished
#     working tree rather than to a reviewed release.
# flux publishes flux-lang to crates.io, so the registry pin is the only form that resolves
# everywhere. The lib name stays `flux_lang`; only the *package* carries the vanity prefix.
flux-lang = { package = "codewandler-flux-lang", version = "0.54" }

# The flux *runtime* seam, used by `connector-pack` alone (C-114). AGENTS.md's "flux-connectors does
# not depend on the flux runtime" holds for the compiler — `connector-spec`, `connector-flux` and
# `connector-cli` still link none of this, and `connector-catalog` stays dependency-free. The pack is
# a **declaration** handed to a host that already runs flux: linking `ToolSpec` and the `Tool` trait
# is what lets a connector be gated individually by flux's own permission envelope. This repository
# still ships no runtime of its own.
#
# From crates.io for the same reasons flux-lang is. `flux-spec` has its own version line: it is the
# frozen wire vocabulary a guest plugin compiles against, so it moves independently of the runtime.
#
# **`1.3`, and the two lines are not the same number** (C-403). C-192 left this at `1.2` on the
# reasoning that the requirement is a floor rather than a pin, that 1.3.0 is purely additive over
# 1.2.1 (it derives `JsonSchema` on `Effect`, `Risk`, `Idempotency`, `AccessKind` and `ToolSpec` and
# changes nothing else), and that raising it would narrow what a consumer may unify with while
# buying nothing. That trade is real and it is now overruled by a different property: the line this
# workspace is *on* has to be a stated fact, or "bump flux" is a reading exercise across six version
# strings and four paragraphs. `flux-spec` is on `1.3` because that is what resolves and what
# everything here is tested against — the committed lock already selected 1.3.0 under the old `1.2`
# floor, so this narrows the stated requirement and changes no resolution.
#
# What has not changed: `flux-spec` moves on its own `1.x` line and is **not** an engine crate. It is
# the frozen wire vocabulary a guest plugin compiles against, so `SPEC_LINE` is recorded beside
# `ENGINE_LINE` rather than derived from it.
flux-core = { package = "codewandler-flux-core", version = "0.54" }
flux-runtime = { package = "codewandler-flux-runtime", version = "0.54" }
flux-spec = { package = "codewandler-flux-spec", version = "1.3" }
# **The transport, and the only concrete `Egress` there is** (C-202). `flux-web` owns
# `http.request` — the tool `connector-pack`'s own doc-comments name and that nothing in this
# workspace could construct, because this crate was absent from `Cargo.lock` entirely.
#
# Reachable from `connectors-api` alone. It brings an HTTP client, a DNS resolver and an SSRF guard,
# which is exactly what `Egress`'s `dyn Tool` typing exists to keep out of `connector-pack` — the
# pack takes a transport, it does not link one. `dependency_fence.rs` holds the compiler crates away
# from it.
#
# On the engine line, matching `flux-runtime`: flux-web 0.54.0 requires its engine peers on 0.54,
# so it resolves inside the line this workspace pins and drags no off-line crate into the lock. That
# is checked rather than trusted: `the_lock_carries_one_engine_line` rejects a transitive second line
# (C-403), while C-493's targeted update proves the current resolved unit moves together.
#
# **flux-web 0.43 is the substantive break this pin absorbs.** `http.request`'s canonical `content`
# is now the record `{status, headers, body}` rather than one flat `HTTP {status}\n{headers}\n{body}`
# string, with the block kept as the model-facing `view`. `connector-pack` returns that result
# unchanged, so the shape a consumer sees changed with no compile error anywhere; it is pinned by
# `crates/connectors-api/tests/live_egress.rs::the_response_comes_back_as_a_record_not_a_flat_string`.
flux-web = { package = "codewandler-flux-web", version = "0.54" }

# `ToolContext::new` takes an `Arc<System>` (C-116). It was a **dev-dependency of `connector-pack`
# only**; `connectors-api` now needs it in shipped code, because a host that dispatches a tool must
# build the context it dispatches under.
#
# A `ToolContext` is also the only way to reach the redactor, so without this the one property this
# repository must prove about credentials (they never reach a surface) could not be driven through
# `Tool::execute` at all — C-115 had to record `execute` as untested for exactly that reason. It is
# already in the lock as a transitive dependency of `flux-runtime`, so naming it here resolves
# nothing new.
#
# **The "no non-test code links it" clause is gone, and its disappearance is the point.** It was
# true while this workspace had no host; C-202 gave it one, and leaving the claim standing would
# have made the manifest assert a fence the code no longer keeps.
flux-system = { package = "codewandler-flux-system", version = "0.54" }

# Shared third-party.
anyhow = "1"
async-trait = "0.1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
indexmap = { version = "2", features = ["serde"] }
# YAML, for OpenAPI ingest (C-4). Vendor specs are published as both JSON and YAML — every one of
# babelforce's five documents is YAML — and the spec cache is already extension-agnostic, so ingest
# has to read both. `serde_norway` rather than `serde_yaml`: the latter is unmaintained, and this
# exact version is already in `Cargo.lock` as a transitive dependency of the flux crates, so naming
# it here resolves nothing new.
serde_norway = "0.9"
jsonschema = { version = "0.49.2", default-features = false }

# Host-library only, reached exclusively from `connector-secrets` (C-91) and never from the
# compiler. `reqwest` is optional there and off by default; `default-features = false` keeps the
# tree to rustls and HTTP/1.1, which is all a Vault KV v2 call needs. `tokio` is a dev-dependency
# there, to drive the async trait in tests; the version already in the lock comes from flux's
# runtime, so this pin adds no resolution of its own.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", default-features = false }

# **The host's own server stack** (C-200), reached from `connectors-api` alone. `hyper`, `tower` and
# `tokio` are already in the lock as transitive dependencies of flux's runtime, so only `axum` is a
# genuinely new tree.
#
# `rand` is here for one job — session tokens, PKCE verifiers and OAuth `state`. Those are
# **security-relevant randomness**, so they come from the OS CSPRNG (`rand`'s `ThreadRng` is seeded
# from it) and never from a timestamp or a counter. `base64` encodes the PKCE challenge and the
# Basic-auth join the token endpoints want; `urlencoding` builds authorize URLs.
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
rand = "0.9"
base64 = "0.22"
urlencoding = "2"

# **Sign-in** (C-204), reached from `connectors-api` alone.
#
# `flux-credentials` is here because the story's first instruction is *not* to write a fourth PKCE
# implementation in this ecosystem. It already ships `generate_pkce()` (base64url of 32 bytes from
# the OS CSPRNG, S256 challenge), `generate_state()`, and `oauth_authorize_url()` — the generic
# RFC-6749 `authorization_code` + PKCE S256 builder — and flux's own CLI drives them three times
# over.
#
# **On the engine line, and C-204's careful exception to that is now spent** (C-403). C-204 held
# this at 0.41 while the story it implemented named 0.42.1, because `codewandler-flux-credentials`
# 0.42.1 required `flux-core ^0.42.1` and `flux-provider ^0.42.1` — semver-incompatible with the
# workspace's 0.41 pin, so cargo resolved *both* lines and a `cargo tree -d` showed two
# `flux-core`s, two `flux-provider`s and two `flux-credentials`. That reasoning was about the skew
# between this crate and the rest, not about this crate: with the whole workspace on one line the
# skew is gone, and holding this one behind would now *create* the split it was avoiding.
#
# It still resolves nothing new and adds no crate — `flux-web` pulls `flux-plugin`, which depends on
# it — and it still carries `generate_pkce()`, `generate_state()` and `oauth_authorize_url()`.
flux-credentials = { package = "codewandler-flux-credentials", version = "0.54" }

# **The `id_token` verifier.** The C-203 manifest recorded "no JWT library" as deliberate, on the
# reasoning that identity would be read from the userinfo endpoint over TLS. C-204 reverses that on
# purpose: its acceptance requires the `id_token`'s *signature* checked against Google's JWKS
# alongside `iss`, `aud`, `exp` and `nonce`, and a TLS-authenticated userinfo read proves none of
# those. Hand-rolling JWT parsing to avoid a dependency is the worse trade — `flux-credentials`'
# own `jwt_payload` is an unverified base64 decode, correct for reading a non-security-critical
# label off a token just received over TLS and useless as an authentication decision.
#
# **`~10.3.0`, and the tilde is doing real work.** Three versions were considered and the MSRV
# picked between them: 11.0.0 declares `rust-version = 1.88.0`, and so — measured after the fact,
# which is the whole reason for the tilde — does **10.4.0**. This workspace declares 1.87. A plain
# `"10.3"` is a caret requirement, so cargo resolved it straight to 10.4.0 and quietly made the
# workspace unbuildable on the toolchain it advertises; `resolver = "2"` did no MSRV-aware
# resolution, so nothing said so. `~10.3.0` is `>=10.3.0, <10.4.0`: patch releases of the 10.3 line
# — where a fix to a JWT verifier would land — still float in, and the MSRV bump does not.
#
# **The resolver now catches this too, and the tilde still earns its place** (C-213). Under
# `resolver = "3"` a caret `"10.3"` resolves to 10.3.0 and cargo reports `available: v10.4.0` —
# measured, by relaxing the requirement and re-resolving. That is the durable fix. The tilde stays
# because the resolver is a *preference* a `--ignore-rust-version` or a `--precise` overrides, and
# because a downstream consumer of the published crates resolves under its own settings, not this
# workspace's.
#
# **This is a pin against a version, not a decision that 1.87 is right.** Raising the workspace
# MSRV to 1.88 may well be correct, but it is a repository-wide change affecting four *published*
# crates, and taking it as a side effect of a sign-in story is how an MSRV moves without anyone
# deciding it should. Still open, and still the owner's: see
# `docs/stories/C-213-msrv-is-unenforced-and-was-caught-by-hand.md`, which carries the evidence. If
# it is taken, this requirement relaxes to `"10.3"` and **this whole comment goes with it** —
# `crates/connectors-api/Cargo.toml`'s `rust-version` override is the other half to delete.
#
# `default-features = false` drops `use_pem` (`pem` + `simple_asn1`): Google's JWKS gives RSA
# modulus/exponent components, never PEM, so `DecodingKey::from_jwk` is the only constructor used.
# The `aws_lc_rs` backend is chosen over `rust_crypto` because `aws-lc-rs` 1.17.3 is **already in
# the lock** under rustls, whereas `rust_crypto` would add `rsa`, `p256`, `p384`, `ed25519-dalek`
# and a second `hmac`.
jsonwebtoken = { version = "~10.3.0", default-features = false, features = ["aws_lc_rs"] }

# **Test-only.** Generating an RSA keypair per test run is what lets the `id_token` checks be
# asserted one at a time against a signature this repository actually produced, rather than against
# a committed key — a PEM private key in the tree is what GitHub push protection blocks, and a
# committed test key is a key that outlives the test. `aws-lc-rs` is already in the lock, so this is
# a name for something present rather than a new tree, and its C implementation makes 2048-bit
# keygen fast enough to sit in a unit test.
aws-lc-rs = "1.17"
