# C-505: the retained Flux native-adapter inventory.
#
# Rows never disappear when the legacy crate does. The offline migration check derives live
# presence from the supplied Flux checkout and admits an absent adapter only after both referenced
# evidence files validate. There are deliberately no authored present/published/conformant flags.
schema = 1
waves = ["C-499", "C-500", "C-501", "C-502", "C-503"]

[[adapters]]
id = "confluence"
flux_manifest = "plugins/confluence/Cargo.toml"
flux_binary = "flux-plugin-confluence"
legacy_contract = "plugins/confluence/src/main.rs"
connector = "confluence"
wave = "C-499"
conformance = "migration/conformance/confluence.json"
publication = "migration/publications/confluence.json"

