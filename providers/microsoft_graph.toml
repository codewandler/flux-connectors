# Microsoft Graph — eight stable inline operations plus four reads selected from first-party
# OpenAPI metadata, curated to the surface this pipeline can express honestly.
#
# Microsoft publishes one 38 MB v1.0 document. It is source evidence rather than the build input:
# `scripts/vendor-microsoft-graph-spec.py` verifies the complete first-party bytes at an immutable
# commit, then emits one reference-closed document for mail and one for calendar. The full upstream
# hash remains in both `[[spec]]` provenance entries and in `specs/microsoft_graph.provenance.toml`.
# Selection remains one exact `[[patch.operations]]` block per operation; pointing at the monolith
# never makes its unreviewed Microsoft 365 administration surface public.
#
# ---------------------------------------------------------------------------------------------
# C-108'S QUESTION: DOES A SERVICE STILL EARN ITS PLACE WHEN NEITHER HOST NOR VERSION DIFFERS?
# ---------------------------------------------------------------------------------------------
#
# `providers/google.toml` is this pipeline's first multi-service provider, and its three services
# justify themselves two ways at once: Gmail is served on a different host than Calendar and Drive
# (`gmail.googleapis.com` vs `www.googleapis.com`), and all three version independently (`v1`, `v3`,
# `v3`). That leaves an open question C-49's design flagged but could not settle with only one
# example: is `Service` a genuine addressing level, or was it always just Google's differing-host
# problem wearing a hat?
#
# Microsoft Graph is built to answer it, because Graph gives the opposite case for free. **Every
# operation below is served from `graph.microsoft.com` and versioned `v1.0`** — mail, calendar and
# files share both facts completely. So this file's three `[[services]]` entries cannot lean on a
# differing `base_url` or `api_version` the way Google's did; each one declares the *identical*
# value its siblings do (asserted directly:
# `crates/connector-flux/tests/microsoft_graph_connector.rs::graph_services_share_a_host_and_version_but_still_partition_cleanly`).
#
# **The finding: yes, the level still earns its place, and for a different reason than Google's.**
# What a service buys here is not routing (there is only ever one host to route to) or versioning
# (there is only ever one version to be at) — it is **the installable unit**. `AGENTS.md`'s service
# contract says a service is "the unit you address, version, select and install", and install is the
# operative word once routing and versioning stop varying: an operator who wants an agent to read and
# reply to mail, and nothing about calendars or files, installs `microsoft_graph-mail` and gets
# exactly those four operations in `microsoft_graph-mail.flux` — never `microsoft_graph-calendar.flux`
# or `microsoft_graph-files.flux`, and never a combined module carrying all twelve. `--service mail`
# on `build`/`diff` narrows to precisely that set (C-49). Google's case conflated three justifications
# — host, version, install-scope — into one connector; this one isolates the third and shows it holds
# on its own. That is the answer for C-49 this story exists to produce, not a shortcoming of Graph.
#
# One honest consequence of that isolation: **the `api_version` declared on each service below is
# inert metadata.** `Connector::api_version_of` only feeds `Connector::gid_of`
# (`crates/connector-spec/src/ir.rs`), and this connector declares no `authority`, so no `gid` ever
# renders (see below) — measured directly in `connector-flux/src/op.rs`, which builds the request URL
# from `connector.base_url_of(&operation.service)` (the host) and `operation.path` alone; `api_version`
# never reaches it. That is also why every `path` below still spells `/v1.0/` literally rather than
# leaving it to composition — the same shape `providers/shopify.toml`'s header comment records for
# the identical reason, and the same shape **`providers/google.toml` itself uses even though it does
# declare a real, varying `api_version`**: Gmail's paths still read `/gmail/v1/...` in full. Declaring
# `api_version = "v1.0"` here anyway keeps the three services' declarations shaped alike and keeps the
# value ready for the day an `authority` is minted.
#
# No `authority` is declared, for the same reason `providers/google.toml` gives: an address, once
# published, is never repointed (C-37), so choosing microsoft_graph's reverse-DNS spelling is a
# permanent decision this story does not get to make. `gid` is therefore `null` in
# `web/public/catalog.json`, the state most of this fleet is in.
#
# ---------------------------------------------------------------------------------------------
# AUTH: BEARER, ALREADY MINTED — COORDINATING WITH C-88 RATHER THAN DUPLICATING IT.
# ---------------------------------------------------------------------------------------------
#
# Every Graph call takes `Authorization: Bearer <token>`, where the token is a Microsoft Entra ID
# (formerly Azure AD) OAuth2 access token — delegated (a signed-in user, via an authorization-code or
# device-code grant) or application (client-credentials, for daemon access). The two are indistinguishable
# on the wire, exactly as Google's user-token-vs-service-account distinction is, so which one an
# operator supplies is configuration rather than connector shape — the same reasoning
# `providers/google.toml`'s header comment gives.
#
# [C-88](../docs/stories/C-88-prove-oauth2.md) is the story that proves `OAuth2Spec` — the
# `[auth.oauth2]` block — on a real provider, and as of this writing it is still `ready` and has
# already earmarked Slack or HubSpot as the provider to carry it, not this one. So this file does not
# duplicate that work: it takes the same already-minted-bearer-token shape `providers/google.toml`
# and `providers/zoom.toml` already ship, sourced from an environment variable, with no `[auth.oauth2]`
# block. If C-88 lands on a different connector before this one needs revisiting, this connector is a
# natural second candidate for the OAuth2 grant declaration — Entra ID's app-registration model is a
# textbook operator-level `client_id`/`client_secret` pair — but that is a follow-on, not this story's
# job.
#
# The access token Graph issues is short-lived (delegated tokens typically expire in about an hour,
# the same order of magnitude as Zoom's), and refreshing it is *effectful acquisition* that belongs to
# the host (C-21), never to generated Flux — see `providers/zoom.toml`'s header comment for the full
# reasoning, which applies here without change.
#
# ---------------------------------------------------------------------------------------------
# NO OPERATOR-PINNED TENANT VALUE IS NEEDED (C-187 DOES NOT APPLY HERE).
# ---------------------------------------------------------------------------------------------
#
# C-187 found that `[[config]]` can pin a base URL and nothing else, so a connector that needs an
# operator-scoped path segment (Cloudflare's `zone_id`) or query parameter (Vercel's `teamId`) cannot
# express it yet. This connector never hits that wall: every operation below addresses `/me/...`,
# which Graph resolves from the bearer token's own claims rather than from a path segment or query
# parameter a caller or an operator supplies. There is no tenant id, workspace id or account id
# anywhere in this file's request surface — the token *is* the tenant scope. So, unlike Cloudflare and
# Vercel, Microsoft Graph is a multi-tenant API this pipeline can already address correctly without
# C-187, precisely because Graph put tenant scoping in the credential rather than in the URL.
#
# ---------------------------------------------------------------------------------------------
# QUERY CURATION: INTEGER PAGING ONLY; STRING ODATA EXPRESSIONS REMAIN EXCLUDED (C-30).
# ---------------------------------------------------------------------------------------------
#
# Nothing in this pipeline percent-encodes a query value: the emitter interpolates it verbatim into a
# `fmt` template and flux registers no encoding op. `zendesk-ticket-search` is the standing
# demonstration AGENTS.md lists under *Intentional gaps* — a value carrying `&` does not filter, it
# injects a parameter. Graph's query surface is its OData system query options, and every one of them
# was checked against that trap. The four spec-backed collection reads keep only integer `$top` and
# `$skip`; the eight existing inline operations remain byte-identical and query-free:
#
# - **`$filter` and `$search`** — free-form OData filter expressions and full-text search strings,
#   exactly the shape that motivated the warning. `me/messages?$search="from:alice"` and
#   `me/events?$filter=start/dateTime ge '2026-01-01'` both carry spaces and quotes verbatim.
#   Excluded outright, the same reasoning `notion-database-query`'s `filter`/`sorts` and
#   `zendesk-ticket-search`'s `query` already carry.
# - **`$select`, `$expand`, `$orderby`** — comma-separated property-name lists and simple property
#   references. These do not carry spaces or quotes in the common case, but a display name or a
#   custom-extension property name legitimately can (`$orderby=displayName`), and nothing here
#   validates that the caller-supplied value is actually a property name rather than an arbitrary
#   string appended to the query. Excluded for the same reason `google.toml` excludes `fields=`: a
#   parameter that *usually* looks safe is still unencoded, and "usually" is not a property this
#   pipeline can check at compile time.
# - **`$top` and `$skip`** — plain integers whose decimal rendering cannot inject another query
#   pair. These are the only query arguments the four new reads expose. The connector still cannot
#   follow `@odata.nextLink` (a full absolute URL, while `Operation.path` is a compile-time template),
#   so callers can bound or offset a page but cannot consume the opaque continuation URL.
# - **`includeHiddenFolders`** on the mail-folder list — a plain boolean, excluded for the same
#   `$top`/`$skip` reasoning: harmless today, and the query-assembly path a future author reaches for
#   first.
#
# `includeHiddenMessages` is string-shaped in this source and is omitted with the OData strings.
# `$count` is boolean-shaped but also omitted: C-471's reviewed surface is integer paging only, so a
# later boolean or string addition must arrive as a visible patch change rather than by similarity.
#
# ---------------------------------------------------------------------------------------------
# SCHEMA GAP: NO OPTIONAL REQUEST-BODY FIELD CAN BE DECLARED (C-56).
# ---------------------------------------------------------------------------------------------
#
# The emitter binds every declared body field into the payload record unconditionally, so a caller
# who leaves an optional field alone sends an explicit `null`. Graph's write validators are not
# documented to accept `null` in place of an absent member. Until C-56 lands, this file declares
# required fields only, and what that costs is:
#
# - `microsoft_graph-mail-message-reply`: the `message` override Graph's own `reply` action accepts —
#   a `toRecipients`/`ccRecipients`/`bccRecipients` object that would let a caller redirect or widen
#   the reply's audience. Without it, every reply goes to exactly whoever Graph resolves
#   automatically (the original message's `replyTo`, or its `from` if none), which is the quiet
#   direction: nobody the caller did not already see in the thread is added.
# - `microsoft_graph-calendar-event-create`: `body`, `location`, `attendees`, `categories`,
#   `sensitivity`, `showAs`, `isReminderOn`, `reminderMinutesBeforeStart`, `recurrence`, and the
#   dedup-friendly `transactionId`. Losing `attendees` is what keeps this operation quiet — see its
#   own `risk` comment. `recurrence`'s absence is what keeps this operation to single-instance events;
#   Graph's `patternedRecurrence` object is itself deeply nested and out of scope for a first curated
#   set regardless.
# - `microsoft_graph-files-item-update`: every `DriveItem` field but `name` — `description`,
#   `parentReference` (which would *move* rather than rename the item), `fileSystemInfo`. The excluded
#   `parentReference` is the interesting one: Graph documents that PATCHing it moves the item, so its
#   absence is what keeps this operation to a pure rename rather than accidentally becoming a move,
#   the same reasoning that keeps `trashed` off `google-drive-file-update`.
#
# A second, narrower facet of the same gap: `comment` on the mail reply is declared **required**
# even though Graph's own reference marks it optional and states it "can be an empty string" — C-56
# forbids sending an optional field as `null`, so it is required here and an empty string remains a
# legitimate value a caller can supply. The alternative was an operation with no settable field at
# all, which is not an operation — the same choice `providers/google.toml` and `providers/zoom.toml`
# make of `summary` and `waiting_room` respectively.
#
# ---------------------------------------------------------------------------------------------
# NOT NEEDED HERE: C-185's array-of-objects decomposition.
# ---------------------------------------------------------------------------------------------
#
# Every body field below is a body-root scalar or nests under a `wire` object path
# (`start.dateTime`, `start.timeZone`) with no array anywhere in the tree — checked directly
# (`no_microsoft_graph_body_field_is_an_array`). Graph's `attendees` and `toRecipients` are exactly
# the SendGrid-shaped array-of-objects C-185 refuses, which is one more reason (beside C-56) neither
# is declared: even if C-56 landed tomorrow, an array of `{emailAddress: {address, name}}` objects
# would still need C-185.
#
# ---------------------------------------------------------------------------------------------
# CHECKED FOR A CREDENTIAL-SHAPED RESPONSE FIELD (`providers/zoom.toml`'s `start_url`,
# `providers/postmark.toml`'s `ApiTokens`) — AND FOUND NONE.
# ---------------------------------------------------------------------------------------------
#
# Every link Graph returns below — a message's `webLink`, an event's `webLink`, a file's `webUrl` —
# opens the item in a browser that still requires its own sign-in; none embeds a bearer-equivalent
# token the way Zoom's `start_url` does. Graph's Teams meeting join links (`onlineMeeting.joinUrl`)
# are exactly the shape that would need this treatment, which is one reason they are not declared
# here at all: this connector never sets `isOnlineMeeting`, so no operation below can return one.
#
# ---------------------------------------------------------------------------------------------
# PERSONAL DATA. Mail and calendar are, definitionally, about named people and their correspondence.
# ---------------------------------------------------------------------------------------------
#
# No example value, no fixture, and no literal name, email address or id appears anywhere in this
# file — every response below names *which* fields carry a person's name or address in its
# `description` without ever showing one. `from`, `toRecipients`, `organizer`, `attendees`,
# `createdBy` and `lastModifiedBy` are personal data throughout; treat them as such and repeat them no
# further than a task requires, the same convention `providers/shopify.toml`'s customer read and
# `providers/zoom.toml`'s user read already carry.
#
# ---------------------------------------------------------------------------------------------
# EXCLUDED, each for a stated reason
# ---------------------------------------------------------------------------------------------
#
# - **Sending new mail** (`POST /me/sendMail`) — its `toRecipients` is the array-of-objects C-185
#   refuses and C-56 could not fix alone. `microsoft_graph-mail-message-reply` ships instead, whose
#   recipients Graph resolves automatically and whose body is a body-root scalar.
# - **Opaque continuation paging** — four new reads take integer `$top`/`$skip`, but no operation
#   follows the absolute `@odata.nextLink` returned by Graph.
# - **Attachments, categories, delegation, mailbox rules, shared/delegate mailboxes, Teams, contacts,
#   the directory/user-administration surface, OneDrive sharing links, SharePoint sites, and every
#   `/users/{id}` form of these endpoints** (as opposed to `/me/...`) — out of scope for a first
#   curated set, not blocked by anything. The Notes below name the specific unverified candidates.
# - **File content download** (`GET /me/drive/items/{id}/content`) — a distinct endpoint from the
#   metadata read this file ships, returning a binary body rather than JSON; out of scope for a first
#   curated set, the same restraint `google-drive-file-get` takes of `alt=media` (there, blocked by
#   C-30; here, simply not attempted, since the endpoint needs no query parameter at all and a binary
#   response is its own, unexplored shape for this pipeline).

id = "microsoft_graph"
vendor = "Microsoft Graph"

# The reverse-DNS authority this connector publishes under (C-92). It leads every rendered address
# and every credential path — `tenants/<tenant>/com.microsoft.graph/<credential>` — and until it was
# declared `Credentials::reference` refused with `NoCredentialAddress`, so this connector could not
# authenticate at all.
#
# Graph publishes no domain of its own — there is no `graph.com` — so it takes Microsoft's with the
# product as the trailing label, which is the rule `providers/jira.toml` states and the same branch
# of it Jira falls into. Here that spelling is also the literal reverse of the API host, since
# `graph.microsoft.com` reversed is `com.microsoft.graph`, so the rule and the host agree. That is
# as much confirmation as an authority ever gets.
#
# Note the connector `id` above is `microsoft_graph` with an underscore and this is not: an
# authority label admits only lowercase ASCII letters, digits and `-`
# (`connector_spec::address::validate_authority`). No connector-level `api_version` either, because
# each service below already declares `v1.0`.
#
# **Never repointed once published** (`AGENTS.md`: "an address, once published, is not reused"). A
# different spelling mints a new address and deprecates this one, because tenants provision secrets
# under this path.
authority = "com.microsoft.graph"

# The one host every service resolves to. No tenant subdomain — unlike zendesk's `{subdomain}` and
# shopify's `{shop}`, Graph is multi-tenant through the bearer token alone, so `base_url` is a bound
# literal and `status.rs` reports no `unbound-base-url-template` issue.
base_url = "https://graph.microsoft.com"

description = "Microsoft Graph: read and reply to Outlook mail, inspect Outlook settings, read and create Calendar events, and read and rename OneDrive files"

# Every operation of every service authenticates the same way.
default_auth = [{ credentials = ["microsoft_graph.access_token"] }]

# A zero-argument, low-risk read: the signed-in user's own default calendar. Bounded (one object, no
# collection, no paging) and needs nothing a settings page cannot already supply.
verify = "microsoft_graph-calendar-calendar-get"

# ---------------------------------------------------------------------------------------------
# Services — three curated surfaces, one host, one version. See the header comment: the point of
# this connector is that all three facts below are identical across every entry.
# ---------------------------------------------------------------------------------------------

[[services]]
name = "mail"
tags = ["email"]
description = "Outlook Mail: read and list messages, reply to one, list mail folders"
api_version = "v1.0"

[[services]]
name = "calendar"
tags = ["scheduling"]
description = "Outlook Calendar and settings: read an event, create one, inspect the default calendar, categories, languages and time zones"
api_version = "v1.0"

[[services]]
name = "files"
tags = ["storage"]
description = "OneDrive: read and rename a file's metadata"
api_version = "v1.0"

# ---------------------------------------------------------------------------------------------
# First-party Microsoft Graph v1.0 OpenAPI — deterministic, reference-closed extracts (C-471).
#
# The immutable upstream document is 38,050,122 bytes and describes 16,702 operations. It is too
# broad to be a reviewable build input, so the vendor script retains only the selected operation
# objects and the components they reference. Its complete SHA-256 remains in
# `specs/microsoft_graph.provenance.toml`; the hashes here identify the exact extracted bytes the
# offline compiler ingests. The source server is `https://graph.microsoft.com/v1.0`, while this
# provider's stable base is `https://graph.microsoft.com`, so extraction materializes `/v1.0` onto
# every selected path key and tests prove the two absolute URLs are equal.
# ---------------------------------------------------------------------------------------------

[[spec]]
path = "specs/microsoft_graph/mail-2026-08-02.openapi.json"
service = "mail"
source_url = "https://raw.githubusercontent.com/microsoftgraph/msgraph-metadata/60b50e2e5b23612aac74ecdf65d35d566c5a4031/openapi/v1.0/openapi.yaml"
upstream_version = "v1.0"
fetched_at = "2026-08-02T11:24:27Z"
sha256 = "5fe57015831998550609994baa2436b80796a4d573c4e6b33198020679bb3f07"

[[spec]]
path = "specs/microsoft_graph/calendar-2026-08-02.openapi.json"
service = "calendar"
source_url = "https://raw.githubusercontent.com/microsoftgraph/msgraph-metadata/60b50e2e5b23612aac74ecdf65d35d566c5a4031/openapi/v1.0/openapi.yaml"
upstream_version = "v1.0"
fetched_at = "2026-08-02T11:24:27Z"
sha256 = "d3cf91ee72c4f23f7b1a80b5d7796462bef5ea448dd268d328233b8f0479f57a"

[patch.directions.calendar]
"me.outlook.ListMasterCategories" = "read"
"me.outlook.supportedLanguages" = "read"
"me.outlook.supportedTimeZones-5c4f" = "read"

[patch.directions.mail]
"me.ListMessages" = "read"


[[patch.operations]]
select = "me.ListMessages"
rename = "microsoft_graph-mail-message-list"
service = "mail"
description = "List Outlook messages visible to the signed-in user with the Microsoft Graph Mail.Read permission; returns personal correspondence, so treat subjects, senders, recipients and bodies as personal data"
risk = "low"
idempotency = "idempotent"
omit.query = [
  "includeHiddenMessages",
  "$search",
  "$filter",
  "$count",
  "$orderby",
  "$select",
  "$expand",
]

[[patch.operations]]
select = "me.outlook.ListMasterCategories"
rename = "microsoft_graph-calendar-category-list"
service = "calendar"
description = "List the signed-in user's Outlook master categories with the Microsoft Graph MailboxSettings.Read permission"
risk = "low"
idempotency = "idempotent"
omit.query = ["$search", "$filter", "$count", "$orderby", "$select", "$expand"]

[[patch.operations]]
select = "me.outlook.supportedTimeZones-5c4f"
rename = "microsoft_graph-calendar-time-zone-list"
service = "calendar"
description = "List the mailbox server's supported time zones with the Microsoft Graph MailboxSettings.Read permission"
risk = "low"
idempotency = "idempotent"
omit.query = ["$search", "$filter", "$count"]

[[patch.operations]]
select = "me.outlook.supportedLanguages"
rename = "microsoft_graph-calendar-language-list"
service = "calendar"
description = "List the mailbox server's supported languages and locales with the Microsoft Graph MailboxSettings.Read permission"
risk = "low"
idempotency = "idempotent"
omit.query = ["$search", "$filter", "$count"]

# ---------------------------------------------------------------------------------------------
# Credentials
# ---------------------------------------------------------------------------------------------

[[auth]]
name = "microsoft_graph.access_token"
scheme = "bearer"
# The sole secret. Gated and registered with flux's redactor by the host; its value is never read
# here and never reaches a generated artifact.
env = ["MICROSOFT_GRAPH_ACCESS_TOKEN"]
description = "Microsoft Entra ID OAuth2 access token sent as a bearer; short-lived, minted outside flux (delegated sign-in or application client-credentials), and refreshed by the host rather than by generated Flux"

# ---------------------------------------------------------------------------------------------
# Configuration — what a human supplies before any of this runs.
#
# One field: the token itself. `ConfigField::service` must name one declared service (a provider
# with named services has no implicit `default` for it to fall into either), even though the same
# token authenticates all three — there is no "shared across services" spelling, and declaring the
# field three times under three names would ask an operator to paste one token into three form
# fields, which is worse than picking one. Attached to `mail` because Outlook access is the surface
# an operator is most likely to configure this connector for first; the choice is otherwise arbitrary
# and does not narrow which services the token actually authenticates.
# ---------------------------------------------------------------------------------------------

[[config]]
name = "access_token"
service = "mail"
label = "Microsoft Graph access token"
help = "An OAuth2 access token for Microsoft Graph, minted through an Entra ID app registration with the delegated or application permissions the enabled operations need (Mail.Read and Mail.Send for mail, MailboxSettings.Read for Outlook settings, Calendars.ReadWrite for calendar, Files.ReadWrite for files). flux is handed an already-minted token; it does not perform the sign-in or client-credentials grant itself"
format = "token"
secret = true
docs_url = "https://learn.microsoft.com/en-us/graph/auth/auth-concepts"
binds = "credential.microsoft_graph.access_token"

# ---------------------------------------------------------------------------------------------
# Inline operations — 8 stable operations: three mail, three calendar, two files. The four
# spec-backed reads above join these during load; leaving the inline blocks untouched is what keeps
# every previously published Flux byte stable.
#
# Op ids carry the service — `microsoft_graph-mail-message-get`, not `microsoft_graph-message-get` —
# the same reasoning `providers/google.toml` gives: several of these are "get one thing by id" and
# would collide on shorter names, and the op id is what a model sees as a tool name. Ids are
# hyphen-separated, not dotted: flux-lang's `is_valid_decl_name` admits ASCII alphanumerics, `_` and
# `-` only.
# ---------------------------------------------------------------------------------------------

[[operations]]
id = "microsoft_graph-mail-message-get"
service = "mail"
method = "GET"
direction = "read"
path = "/v1.0/me/messages/{message_id}"
description = "Get one Outlook message by id: subject, sender, recipients, timestamps and the body — HTML by default. This is personal correspondence; treat the sender, recipients and body as personal data"
risk = "low"
idempotency = "idempotent"

[[operations.params.path]]
name = "message_id"
description = "The message's id, an opaque string Graph itself reports on a prior list or get — never invented. Excludes `/`, `?`, `#` and `&`, the four characters that could change the shape of the request; the emitted Flux does not enforce this, so it is a contract a model reads rather than a validator"
required = true
schema = { type = "string", pattern = "^[^/?#&]+$", minLength = 1 }

[operations.response_schema]
type = "object"
required = ["id", "subject"]
properties = { id = { type = "string", description = "The message's id — what this operation takes" }, subject = { type = "string" }, bodyPreview = { type = "string", description = "A plain-text extract of the body, truncated. Personal correspondence — never an example value here" }, body = { type = "object", description = "`{contentType, content}` — HTML by default. Send `Prefer: outlook.body-content-type=\"text\"` to get plain text instead, which this connector does not do: no header parameter is declared, so every body here arrives as HTML", properties = { contentType = { type = "string", enum = ["text", "html"] }, content = { type = "string" } } }, from = { type = "object", description = "`{emailAddress: {name, address}}` — the sender. Personal data, never an example value here", properties = { emailAddress = { type = "object", properties = { name = { type = "string" }, address = { type = "string" } } } } }, toRecipients = { type = "array", description = "Each `{emailAddress: {name, address}}`. Personal data, never an example value here", items = { type = "object" } }, receivedDateTime = { type = "string", format = "date-time" }, sentDateTime = { type = "string", format = "date-time" }, hasAttachments = { type = "boolean" }, isRead = { type = "boolean" }, isDraft = { type = "boolean" }, importance = { type = "string", enum = ["low", "normal", "high"] }, conversationId = { type = "string", description = "Groups messages in the same thread" }, internetMessageId = { type = "string", description = "The RFC 2822 `Message-ID`, distinct from Graph's own `id`" }, parentFolderId = { type = "string", description = "The mail folder this message currently lives in" }, webLink = { type = "string", format = "uri", description = "Opens the message in Outlook on the web. Requires the viewer's own sign-in session; does not itself carry a credential" } }

[operations.quirks.error_envelope]
message_pointer = "/error/message"
code_pointer = "/error/code"

# ---------------------------------------------------------------------------------------------

[[operations]]
id = "microsoft_graph-mail-message-reply"
service = "mail"
method = "POST"
direction = "write"
path = "/v1.0/me/messages/{message_id}/reply"
description = "Reply to a message. Graph resolves the recipients automatically — the original message's `replyTo` if it specifies one, otherwise its `from` — and this operation cannot override, widen or add to that audience (C-56 excludes the `message` override Graph's own reply action accepts). Delivered within seconds and cannot be recalled"
# Irreversible external delivery, the same reasoning `google-gmail-message-send` carries: the reply
# leaves the organization, is attributed to the token's own identity, and lands in an inbox within
# seconds. The one thing narrower than Gmail's send is that this operation cannot choose or widen the
# recipient list — but the delivery itself is just as final, so `high` rather than `medium`.
risk = "high"
# Graph documents no idempotency key on `message: reply`, so the same call posted twice sends two
# replies. `POST` is also refused `idempotent` by method regardless (C-186).
idempotency = "non_idempotent"

[[operations.params.path]]
name = "message_id"
description = "The id of the message being replied to"
required = true
schema = { type = "string", pattern = "^[^/?#&]+$", minLength = 1 }

# Graph's JSON reply body takes `comment` (a string, prepended above the quoted original) and an
# optional `message` object that can override the recipients — declaring the latter is exactly the
# array-of-objects C-185 refuses and C-56 could not fix alone, so only `comment` is declared. Graph
# itself marks `comment` optional and states it "can be an empty string"; it is required here because
# C-56 forbids sending an omitted optional field as `null`, and an empty string remains available as
# a real value a caller can supply.
[[operations.params.body]]
name = "comment"
description = "Text to prepend above the quoted original message. May be an empty string — Graph accepts that — but the field itself must always be sent"
required = true
schema = { type = "string" }

# Graph answers `202 Accepted` with an empty body — no `response_schema`, deliberately (C-126), the
# same honest-absence convention `zoom-meeting-delete` and `front-conversation-reply`'s queuing
# acknowledgement both carry. A `{}` here would assert a body that never arrives.

[operations.quirks.error_envelope]
message_pointer = "/error/message"
code_pointer = "/error/code"

