[[operations]]
id = "microsoft_graph-calendar-event-create"
service = "calendar"
method = "POST"
direction = "write"
path = "/v1.0/me/events"
description = "Create a single-instance event on the signed-in user's default calendar. No attendees can be declared yet (C-56), so nobody is invited and nobody is notified — the event appears only on the calendar it was created on"
# The same reasoning `google-calendar-event-insert` and `zoom-meeting-create` both carry: a new
# object on a calendar, but a quiet one, because `attendees` is not declarable yet and Graph sends no
# invitation without one. `medium` rather than `high`.
#
# WHEN C-56 LANDS AND `attendees` BECOMES DECLARABLE, REVISIT THIS. Adding an attendee sends a meeting
# request under the token owner's name, which is the `high` case.
risk = "medium"
# Graph documents `transactionId` as the client-supplied dedup key for this endpoint, and this
# connector does not declare it (C-56 would make it an always-sent required field, which defeats its
# own purpose as an idempotency key a caller opts into). Without it, the same body posted twice
# creates two events. `POST` is also refused `idempotent` by method regardless (C-186).
idempotency = "non_idempotent"

# Not vendor-required — Graph accepts an event with an empty subject — but C-56 forbids an optional
# field, and an event nobody can identify on a calendar grid is not worth creating. The same choice
# `google-calendar-event-insert`'s `summary` makes.
[[operations.params.body]]
name = "subject"
description = "The event's title, as it appears on the calendar grid"
required = true
schema = { type = "string", minLength = 1 }

# `start`/`end` are `DateTimeTimeZone` objects on the wire — `{"start": {"dateTime": ..., "timeZone":
# ...}, "end": {...}}` — hence the `wire` paths (C-29). Graph documents `timeZone` as optional,
# defaulting to UTC when omitted; declaring it required here costs nothing extra, because C-56
# forbids an optional field regardless, and stating it explicitly removes any ambiguity about which
# zone a bare `dateTime` is in.
[[operations.params.body]]
name = "start_date_time"
wire = "start.dateTime"
description = "When the event starts, as a local date-time with no UTC designator — `2026-01-30T09:00:00` — interpreted in `start_time_zone`"
required = true
schema = { type = "string" }

[[operations.params.body]]
name = "start_time_zone"
wire = "start.timeZone"
description = "The IANA or Windows time zone name `start_date_time` is expressed in, e.g. `UTC` or `Pacific Standard Time`"
required = true
schema = { type = "string", minLength = 1 }

[[operations.params.body]]
name = "end_date_time"
wire = "end.dateTime"
description = "When the event ends, in the same local, no-designator form as `start_date_time`. Must be after it; Graph rejects an end that precedes its start"
required = true
schema = { type = "string" }

[[operations.params.body]]
name = "end_time_zone"
wire = "end.timeZone"
description = "The time zone `end_date_time` is expressed in"
required = true
schema = { type = "string", minLength = 1 }

# The created Event — the same resource the get returns. `attendees` will be absent, because this
# operation cannot declare any (C-56) — which is the same thing as saying nobody was invited and
# nobody was notified, the same convention `google-calendar-event-insert`'s response carries.
[operations.response_schema]
type = "object"
required = ["id", "subject", "isCancelled"]
properties = { id = { type = "string", description = "The new event's id — the only handle on it, and what `microsoft_graph-calendar-event-get` reads back" }, subject = { type = "string", description = "Echoes the title that was sent" }, start = { type = "object", description = "`{dateTime, timeZone}` as created", properties = { dateTime = { type = "string" }, timeZone = { type = "string" } } }, end = { type = "object", description = "Same shape", properties = { dateTime = { type = "string" }, timeZone = { type = "string" } } }, isAllDay = { type = "boolean" }, isCancelled = { type = "boolean", description = "`false` on a freshly created event" }, organizer = { type = "object", description = "The token's own account. Personal data, never an example value here", properties = { emailAddress = { type = "object", properties = { name = { type = "string" }, address = { type = "string" } } } } }, attendees = { type = "array", description = "ABSENT on every event this operation creates: no attendee can be declared yet (C-56), so nobody was invited and nobody was notified", items = { type = "object" } }, iCalUId = { type = "string" }, webLink = { type = "string", format = "uri", description = "Opens the event in Outlook on the web. Requires the viewer's own sign-in session; does not itself carry a credential" } }

[operations.quirks.error_envelope]
message_pointer = "/error/message"
code_pointer = "/error/code"

