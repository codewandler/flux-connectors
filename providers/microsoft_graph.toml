type = "object"
required = ["id", "subject", "isCancelled"]
properties = { id = { type = "string", description = "The event's id — what this operation takes" }, subject = { type = "string", description = "Absent-titled events render as an empty string, not a missing member" }, bodyPreview = { type = "string" }, body = { type = "object", description = "`{contentType, content}` — HTML by default, the same convention as the mail body above", properties = { contentType = { type = "string", enum = ["text", "html"] }, content = { type = "string" } } }, start = { type = "object", description = "`{dateTime, timeZone}`. By default `dateTime` is UTC; a `Prefer: outlook.timezone` header (not sent here) would change it", properties = { dateTime = { type = "string" }, timeZone = { type = "string" } } }, end = { type = "object", description = "Same shape as `start`", properties = { dateTime = { type = "string" }, timeZone = { type = "string" } } }, isAllDay = { type = "boolean", description = "When true, `start`/`end` represent midnight in the stated time zone rather than a real time of day" }, isCancelled = { type = "boolean", description = "**A cancelled event is still returned by this operation**, with `isCancelled: true`. Check this before treating the event as live" }, location = { type = "object", description = "`{displayName, ...}` — free text, not a structured address", properties = { displayName = { type = "string" } } }, organizer = { type = "object", description = "`{emailAddress: {name, address}}` — who owns the event. Personal data, never an example value here", properties = { emailAddress = { type = "object", properties = { name = { type = "string" }, address = { type = "string" } } } } }, attendees = { type = "array", description = "Each `{type, status: {response, time}, emailAddress: {name, address}}`, where `status.response` is `none`, `accepted`, `declined` or `tentativelyAccepted`. Personal data throughout, never an example value here", items = { type = "object" } }, seriesMasterId = { type = "string", description = "Present when this event is one instance of a recurring series" }, showAs = { type = "string", enum = ["free", "tentative", "busy", "oof", "workingElsewhere", "unknown"] }, sensitivity = { type = "string", enum = ["normal", "personal", "private", "confidential"] }, iCalUId = { type = "string", description = "Identifies this event across calendars, distinct from Graph's own `id`" }, webLink = { type = "string", format = "uri", description = "Opens the event in Outlook on the web. Requires the viewer's own sign-in session; does not itself carry a credential" } }

