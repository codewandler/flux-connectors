[[operations]]
id = "microsoft_graph-files-item-update"
service = "files"
method = "PATCH"
direction = "write"
path = "/v1.0/me/drive/items/{item_id}"
description = "Rename a OneDrive item: sets its name and changes nothing else. Does not move it — moving is a PATCH to the separate parentReference field, which this operation deliberately does not declare (C-56)"
# A write visible to anyone with access to the item, the same reasoning `google-drive-file-update`
# carries: not `low` (the old name is not kept anywhere a caller can read it back), not `destructive`
# (the item, its content and its location all survive, and a human can rename it back).
risk = "medium"
# Graph documents no idempotency guarantee on this endpoint, and each PATCH bumps `eTag`/`cTag` and
# `lastModifiedDateTime`, so a retried rename is observably a second edit. `PATCH` is also refused
# `idempotent` by method regardless (C-186).
idempotency = "non_idempotent"

[[operations.params.path]]
name = "item_id"
description = "The item to rename"
required = true
schema = { type = "string", pattern = "^[^/?#&]+$", minLength = 1 }

# The wire body is flat — `{"name": "..."}` at the root, no envelope — so no `wire` path is needed.
# Not vendor-required (Graph's PATCH accepts a body touching only the fields it names, and an empty
# body changes nothing), but an operation with no settable field is not an operation, and `name` is
# the one field a rename needs. C-56 forbids declaring it optional.
[[operations.params.body]]
name = "name"
description = "The item's new name"
required = true
schema = { type = "string", minLength = 1 }

# The updated DriveItem, same shape as the get above. Reading `name` back is what distinguishes a
# rename that applied from one Graph silently ignored.
[operations.response_schema]
type = "object"
required = ["id", "name"]
properties = { id = { type = "string" }, name = { type = "string", description = "The name **after** the update. Compare it against what was sent" }, size = { type = "integer" }, webUrl = { type = "string", format = "uri", description = "Opens the item in a browser. Requires the viewer's own sign-in session; does not itself carry a credential" }, createdDateTime = { type = "string", format = "date-time" }, lastModifiedDateTime = { type = "string", format = "date-time", description = "Moves on an accepted rename" }, eTag = { type = "string", description = "Changes on an accepted rename" }, cTag = { type = "string" }, file = { type = "object", description = "Present when this item is a file rather than a folder", properties = { mimeType = { type = "string" } } }, folder = { type = "object", description = "Present when this item is a folder rather than a file", properties = { childCount = { type = "integer" } } }, parentReference = { type = "object", description = "Unchanged by this call — a rename never moves the item", properties = { driveId = { type = "string" }, id = { type = "string" }, path = { type = "string" } } } }

[operations.quirks.error_envelope]
message_pointer = "/error/message"
code_pointer = "/error/code"
