# same trap `google-calendar-event-get`'s `status` field records. `start`/`end` are `DateTimeTimeZone`
# objects (`{dateTime, timeZone}`) rather than the offset-carrying string Google Calendar uses;
# `isAllDay` is Graph's own discriminator for a day-long event rather than a `date`-vs-`dateTime`
# split.
