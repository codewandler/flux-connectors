# **The collision, broken.** Both `manager-2026-07-10` and `user-2026-06-25` declare `getUser`, as
# two different requests. The naming rule derives `babelforce-get-user` for both, and a collision
# refuses the build rather than silently making one of them unreachable under a name the other
# answers to. A `[patch.naming.pin]` cannot break the tie because it is keyed by `operationId`
# alone; a `[[patch.operations]]` block can, because it states a `service` — so the *user*
# document's one moves and the manager document's keeps the derived spelling.
#
# The `user` one moves rather than the manager one because it is the more specific of the two: it
# reads the signed-in user, not an arbitrary user by id, and `-me-` says so.
[[patch.operations]]
service = "user"
select = "getUser"
rename = "babelforce-user-me-get"

# `GET` describes the transport spelling, not the vendor-state effect. This endpoint flushes queued
# dialer tasks and is therefore an explicit write despite matching the broad manager GET selector.
[[patch.operations]]
service = "manager"
select = "flushDialer"
risk = "high"
idempotency = "non_idempotent"
