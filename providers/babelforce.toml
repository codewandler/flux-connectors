# Babelforce — **the canonical manager-sdk surface**, selected (C-417).
#
# This file was hand-authored from C-17 until 2026-08-01, then converted to `[spec]` plus nine
# `[[patch.operations]]` blocks by C-416, and now selects the whole surface manager-sdk covers.
# The sentence its first header ended on is executed rather than promised:
#
# > When the spec lands, this file becomes `[spec]` plus a `[[patch.operations]]` selection and the
# > operation set below is the selection to reproduce.
#
# **The scope is manager-sdk's, and nothing wider.** Owner-stated, 2026-08-01: *"only include things
# which are also included in manager-sdk itself"*. The five vendored documents declare **398**
# operations; the canonical surface is **397**, the 398 less `POST /api/v1/webhook/zendesk`
# (`operationId` `zendesk`), which is a receiver babelforce exposes for Zendesk to call rather than a
# call anyone here makes. It is excluded by *stating the prefix that holds its 30 siblings* rather
# than by listing it, so what this file says is what is wanted rather than what is not.
#
# **389 of those 397 are emitted, and the other eight are named — for two different reasons.**
#
#   * **Five cannot be expressed.** Ingest skips an operation whose request body is
#     `multipart/form-data`, with a diagnostic, rather than publishing it without its body:
#     `BodyEncoding` is `Json | Form` and this IR has no third value. Five manager operations are
#     file uploads. **C-426 established that this is not ours to close**: flux 0.46 cannot carry a
#     multipart body at all — `http.request`'s `body` is a string, and `parse`'s `as_type` is a
#     closed list of six the analyzer enforces, with no multipart among them. Describing the body in
#     the IR would produce a module that fails on a real call, so the five stay named. The fix is a
#     flux-side encoder, exactly as it is for the form/query gap.
#   * **Three are auth-flow endpoints, withheld by rule.** `POST /oauth/token`,
#     `GET /oauth/authorize` and `POST /oauth/revoke` describe **how to authenticate**. That is the
#     connector's authentication surface — `[[auth]]` below states it and the *host* performs it —
#     not something a caller invokes and reads a result from. Owner-stated 2026-08-01 and general
#     rather than a babelforce judgement; the rule and its reasoning are in `AGENTS.md`
#     § Authentication contract. The `auth` service therefore contributes **zero** operations.
#
# So `389 + 5 + 3 = 397`, three categories rather than two, and that accounting is checked rather
# than asserted:
# `crates/connector-spec/tests/babelforce_coverage.rs` reads the five documents, counts what they
# declare, compares it against what this connector emits, and **refuses a gap that carries no
# reason** — in both directions, so an allow-list entry cannot outlive the gap it explained.
#
# # What makes 397 operations a file a human reads
#
# Four declarations, and they are the whole epic's thesis:
#
#   * `[[spec]]` — five documents, one per service, each hash-checked against its own bytes (C-410).
#   * `[patch.naming]` — one rule, so 389 `rename =` lines become one line plus the nine pins that
#     hold a shipped op id still (C-412).
#   * `[[patch.select]]` — one statement per (document, method class), because `risk` is a damage
#     claim and the reads and the deletes under one prefix are not one claim (C-411, C-414).
#   * `[[patch.operations]]` — **the exceptions, and only the exceptions**: the nine curated
#     operations that reach a model, and the one `operationId` two documents both declare.
#
# # Exposure is what makes widening survivable
#
# `expose = false` on every selector. All 389 are catalogued, addressable and callable; **nine**
# reach a model as tools. 389 LLM tools is not a catalogue, it is a denial of service against a
# model's context, and C-413's field exists precisely so that the number of callable operations and
# the number of tools stop being the same number.

id = "babelforce"
vendor = "Babelforce"

# The reverse-DNS authority this connector publishes under (C-92). It leads every rendered address
# and every credential path — `tenants/<tenant>/com.babelforce.api/<credential>` — and until it was
# declared `Credentials::reference` refused with `NoCredentialAddress`, so this connector could not
# authenticate at all.
#
# **The first-party vendor in this catalogue, so this choice sets the precedent for the rest.** It
# is derived exactly as everybody else's is — `babelforce.com` reversed — and gets no special
# spelling for being ours. An authority like `com.babelforce.connectors` would make our own
# connector the one exception to the rule every other file here follows, and the rule is worth more
# than the distinction.
#
# **Never repointed once published** (`AGENTS.md`: "an address, once published, is not reused"). A
# different spelling mints a new address and deprecates this one, because tenants provision secrets
# under this path.
authority = "com.babelforce.api"

# The connector-wide default, and it stays `v2` — which is now a *decision* rather than the
# observation it used to be.
#
# This line used to say `v2` was "taken from the operations below — every one of their paths begins
# `/api/v2/`". That was true of nine operations and is not true of 391: `task-automation` and
# `task-schedule` are both `/api/v3`, and each states its own `api_version` below, which is what
# `Service::api_version` exists for. What is left here is the version of the surface this connector
# already published an address under, and it does not move: `com.babelforce.api:v2` is a rendered
# gid, and re-spelling it would deprecate every address a tenant has provisioned against.
#
# `auth` inherits it and is the one imperfect fit — `/oauth/token` carries no version segment at all.
# Inheriting is preferred to inventing a spelling the vendor does not publish.
api_version = "v2"

# Production, stated explicitly — and still stated explicitly now that five documents are pointed at.
#
# C-415's pull normalizes `servers:` to the public production host before anything is committed, and
# `manager-2026-07-10.openapi.yaml:26283-26285` declares exactly one server,
# `https://services.babelforce.com`, described as `Production`. The staging URL
# (`https://latest.dev.babelforce.com`) appears nowhere in the five documents.
#
# It stays declared here anyway, because agreeing with the document today is not the same as
# deferring to it. `Ingested::base_url()` is advisory by construction and the loader refuses an empty
# `base_url` precisely so that a vendor who reorders `servers` — or a re-vendor that skips the
# normalization — moves a reviewable line in this file instead of moving every request silently.
# **That argument got 391 times stronger with this story**: one wrong host is now one wrong host for
# the entire surface. Staging remains reachable through the operator's `BABELFORCE_URL` override.
#
# All five documents agree on this host, so no service declares its own `base_url`.
#
# SCHEMA GAP: as with the other two providers, nothing here declares that `BABELFORCE_URL` overrides
# this value; `base_url` is a plain string.
base_url = "https://services.babelforce.com"

# **What a model reads, so it describes the nine exposed tools and says the rest exist.** The
# catalogue blurb is not an inventory: naming 391 operations here would spend a model's attention on
# a surface it cannot call as tools anyway, and the operations it *can* call are the sentence.
description = "Babelforce voice platform: agent availability, live and reported calls, and the session variables a flow reads and writes. The full manager-sdk surface — agents, calls, sessions, outbound, phonebook, reporting, task automation and scheduling — is catalogued and callable; the operations above are the ones a model drives directly"

# The "Test connection" operation. Its own description already says it *"doubles as the
# verification operation"*; this is that sentence made machine-readable.
verify = "babelforce-agent-list"

# The manager document declares `security` once at the root and **zero of its 356 operations
# override it**, so one connector-wide default is the whole auth model
# (`manager-2026-07-10.openapi.yaml:26280-26282`), and the same holds for the other four.
#
# Every selected operation therefore inherits this and none of them states `auth`. That is a
# decision, not an omission: `OperationPatch::auth` exists so an overlay can narrow an operation's
# alternatives, and narrowing to the one alternative the documents already declare would be 391
# copies of a fact stated once. **Selection made that argument decisive** — it was nine copies
# before.
default_auth = [{ credentials = ["babelforce.access_token"] }]

# ---------------------------------------------------------------------------------------------
# Services — one per vendored document (C-410)
#
# A document is not a declaration of a service; it *joins* one, and these are the five it joins.
# The partition is what makes five documents one connector rather than five: it is what lets
# `getUser` mean two different requests without either of them being compiled by accident.
# ---------------------------------------------------------------------------------------------

[[services]]
name = "manager"
tags = ["telephony"]
description = "The manager API: agents, calls, sessions, outbound, phonebook, reporting and account administration"

# **There is deliberately no `[[services]]` entry for `auth`.** All three `/oauth/*` endpoints are
# withheld (see the block below the selectors), so the service would carry zero operations — and
# `crates/connector-spec/tests/services.rs` refuses that outright, because a build emits an empty
# module and an `operations = []` manifest for it. Measured: it did, until this entry was removed.
# The `[[spec]]` entry below **stays**, so ingest keeps reading the document, the three endpoints
# stay inside the coverage accounting rather than vanishing from both sides of it, and C-410's
# per-document `sha256` keeps watching it for drift.

[[services]]
name = "user"
tags = ["telephony"]
description = "The signed-in user and the accounts they can reach"

[[services]]
name = "task-automation"
tags = ["telephony"]
description = "Task automation: submission, scripts, secrets and metrics"
# `/api/v3`, not the connector's `v2`. Stated rather than inherited, because the gid a caller sees
# for this service should be the version the vendor actually serves it under.
api_version = "v3"

[[services]]
name = "task-schedule"
tags = ["telephony"]
description = "Scheduled tasks: creating, listing and cancelling a schedule"
api_version = "v3"

# ---------------------------------------------------------------------------------------------
# The vendored documents — five, each provenanced on its own (C-410)
# ---------------------------------------------------------------------------------------------
#
# `sha256` is **checked against the bytes ingested**, not copied past them: `load_with_spec` hashes
# each resolved document and refuses a build whose declaration disagrees. **Per document**, which is
# the reason this is a list of five and not one hash for the connector: the five were pulled on two
# different dates and three of them publish `info.version = "0.0.0-dev"`, so one hash could not say
# which of them moved — which is the only question a drift check is ever asked.
#
# `source_url` is **absent deliberately** on all five. The only URL there is to record points at an
# internal GitLab host, and `AGENTS.md` ("the pulled bytes come here, the configuration that pulled
# them does not") makes that omission the rule rather than an oversight. Identity is the pull date in
# each file name plus its hash; `specs/babelforce.provenance.toml` carries both, and the
# `upstream_sha256` there keeps C-14's drift detectable even though nothing here can re-fetch.
#
# `upstream_version` is the string each document actually declares, recorded as-is rather than
# corrected. Writing a version the vendor does not publish would be inventing provenance.

[[spec]]
path = "specs/babelforce/manager-2026-07-10.openapi.yaml"
service = "manager"
upstream_version = "0.0.0-dev"
fetched_at = "2026-07-10T12:24:21Z"
sha256 = "5728cd62a637e4b3fdd5fa1d376c0ebb478ad0c966922a9dd3fb0608918d739c"

# **`auth-2026-06-25.openapi.yaml` is deliberately not read here**, and this is the one document of
# the five with no `[[spec]]` entry. All three endpoints it declares are withheld by rule, so the
# `auth` service would carry zero operations — and a declared service with no operation emits an
# empty module and an `operations = []` manifest, which
# `crates/connector-spec/tests/services.rs` refuses. The loader also refuses a `[[spec]]` naming a
# service no `[[services]]` entry declares ("a document joins a service, it does not declare one"),
# so the service entry and the spec entry stand or fall together. Both fall.
#
# **Nothing is lost by not reading it.** Its identity and integrity are recorded independently in
# `specs/babelforce.provenance.toml`, whose `[[spec]] name = "auth"` entry carries both `sha256` and
# `upstream_sha256` and is checked against the file's actual bytes by
# `crates/connector-spec/tests/vendored_specs.rs` — that check reads the provenance file, never this
# one, so C-410's drift detection on this document is unaffected. Its three endpoints stay inside
# the coverage accounting by name, through `UNREAD` in
# `crates/connector-spec/tests/babelforce_coverage.rs`, so they are still counted and still carry a
# reason rather than vanishing from both sides of the gate.

[[spec]]
path = "specs/babelforce/user-2026-06-25.openapi.yaml"
service = "user"
upstream_version = "0.0.0-dev"
fetched_at = "2026-06-25T09:37:13Z"
sha256 = "0f98b94f138f52afb2030bc82a69fad7ace437c8d07fc47fb274d635a977ccd2"

[[spec]]
path = "specs/babelforce/task-automation-2026-06-25.openapi.yaml"
service = "task-automation"
upstream_version = "3.63.10"
fetched_at = "2026-06-25T09:37:14Z"
sha256 = "2d827090e3ec35e73cf0108f9b0b5c7f7ec5e335a5804b7e7d87fff15dcca989"

[[spec]]
path = "specs/babelforce/task-schedule-2026-06-25.openapi.yaml"
service = "task-schedule"
upstream_version = "3.63.10"
fetched_at = "2026-06-25T09:37:14Z"
sha256 = "031327359000bd70d6b2ab012868971cc834812e5f61f5157531e7cb5daa4d85"

# ---------------------------------------------------------------------------------------------
# Credentials
# ---------------------------------------------------------------------------------------------

[[auth]]
name = "babelforce.access_token"
scheme = "bearer"
env = ["BABELFORCE_ACCESS_TOKEN"]
# `env` stays, and is not a leftover. It is the arrangement where somebody pastes a token minted out
# of band; the `[auth.oauth2]` block below is the arrangement where the **host** obtains one. Both are
# real deployments of this connector and nothing here chooses between them.
description = "babelforce access token. Either supplied through the environment, or obtained by the host running one of the grants below"
# C-528, and the grant below is what settles it. The password grant takes `username` — "the user's
# email/username" (`specs/babelforce/auth-2026-06-25.openapi.yaml:235-240`) — and the resulting token
# acts as **that person**, bounded by their own permissions. The SSO-issued token in `env` is the same
# person's by another route. It is not an integration identity: a host that stored one at a
# tenant-wide address would let any member act as whoever authenticated.
subject = "user"
# C-440. The resource owner's own password reaches the host on the `password` grant, and a deployment
# refuses that by this declared property rather than by connector name. RFC 9700 §2.4 says the grant
# MUST NOT be used — it exposes the owner's credentials to the client, widens where they can leak, and
# cannot carry two-factor — RFC 6749 §4.3 makes discarding them a MUST for the client, and OAuth 2.1
# drops the grant entirely. It is declared rather than refused here because a babelforce user has an
# email address and a password, not a token, so this vendor offers this grant or nothing; knowing that
# and opting in is a decision for a deployment, which is what the word makes possible.
hazard = "resource_owner_secret_shared"

# **The host performs the grant; nothing this repository emits performs OAuth** (`AGENTS.md`
# § Authentication contract). The three `/oauth/*` paths stay withheld and are not operations — see
# the exclusion block further down — and a declaration emits no `.flux` module, so the withholding is
# untouched by this block and babelforce's `389 + 5 + 3 = 397` accounting is unchanged.
#
# `endpoint` is deliberately absent: all five documents declare the same server as the connector's own
# `base_url`, so the token exchange resolves against it and is inside the same egress allow-list as
# every other call. Naming a URL here would name a host nothing had admitted.
[auth.oauth2]
# `specs/babelforce/auth-2026-06-25.openapi.yaml:289-304` — `securitySchemes.oauth2.flows` declares
# `authorizationCode` (`authorizationUrl: /oauth/authorize`, `tokenUrl: /oauth/token`) and `password`
# (`tokenUrl: /oauth/token`), both with `refreshUrl: /oauth/token`. Every grant and every refresh
# POSTs to the one path.
token_path = "/oauth/token"
# The vendor publishes exactly one scope, `*` ("All Access"), on both flows — there is nothing here to
# narrow with, and requesting none would ask for less than the vendor's own document offers. **Raise a
# narrower scope vocabulary with the babelforce API owners**; a total scope is the gap, not the choice.
scopes = ["*"]
# **Two grants, and the omissions are the considered part.**
#
# `authorization_code` is a documented flow and is deliberately **not** declared, because `grants` is
# a permission list rather than a mirror of the document — a grant absent from it is one the host may
# not run, not one it may try anyway. Completing that flow needs an application this repository cannot
# describe: `OAuthTokenRequest` (`:211-258`) marks `client_id` "Required for `authorization_code`",
# `redirect_uri` "`authorization_code` only", and no vendored document says how a babelforce operator
# registers one or what redirect URIs it accepts. Declaring the grant would publish an operator
# experience nobody has verified exists, and `authorize_path` is omitted for the same reason: it would
# be an endpoint no declared grant reaches.
#
# `client_credentials` appears in that same `grant_type` enum and in **no** flow, so it is not a grant
# this connector allows either. Its measured behaviour is still recorded below, because a quirk records
# what the endpoint *does*, not what the connector permits.
#
# What is left is the pair a host can actually run from what an operator already has — a babelforce
# user's email address and password — which is the arrangement C-440 exists to make declarable, and
# the reason the `hazard` above is not optional.
grants = ["password", "refresh_token"]

# ---------------------------------------------------------------------------------------------
# Token-endpoint quirks — C-440, measured 2026-08-02
# ---------------------------------------------------------------------------------------------
#
# **Declarations, not behaviour.** Nothing reads these yet; they exist so that what was measured is
# written down where the next reader looks, with who measured it and when, rather than surviving in a
# story note. Each is asserted against babelforce's own token controller and **contradicted by
# babelforce's own document**, which is exactly why the attribution is required: a reader a year from
# now has to know which of the two this repository checked.
#
# The occasion was a token lifetime, and the answer was *no general knob*. `OAuthTokenRequest`
# (`specs/babelforce/auth-2026-06-25.openapi.yaml:211-258`) declares eleven properties — `grant_type`,
# `code`, `redirect_uri`, `code_verifier`, `refresh_token`, `username`, `password`, `client_id`,
# `client_secret`, `scope`, `access_type` — and **none of them is a lifetime**; `expires_in` appears
# only on the *response* (`:270-277`). The controller nonetheless reads it off the request, and reads
# it differently for every grant. One field, five behaviours, one vendor: a general `requested_ttl`
# would be a hard cap here, ignored there, and the difference between an hour and forever somewhere
# else, while inviting the other fifty-four providers to be assumed to honour something none of them
# declares. Owner-decided 2026-08-02, in flux-exchange: if it is not in the specification, it does not
# become a general thing.
#
# **This is the second documentation gap to raise with the babelforce API owners**, and unlike the
# `X-Auth-Access-Id` question above it has an answer attached. Beyond the request-side `expires_in` and
# `account_id` below, the token response carries `expire_time` (absolute UTC milliseconds) beside the
# standard `expires_in`, `GET /oauth/tokeninfo` exists, and `link` is a fifth `grant_type`. None of the
# five vendored documents declares any of them. A quirk that becomes spec should stop being a quirk.

[[auth.quirks.token_endpoint]]
grant = "client_credentials"
behaviour = "`expires_in` is read from the request and defaults to `-1`, which the service reads as *never expires*. An unattended caller that omits it therefore gets a non-expiring token rather than a short-lived one."
attribution = "babelforce's own `AuthController.token()`, read against `specs/babelforce/auth-2026-06-25.openapi.yaml`, which declares no request-side `expires_in`. Recorded from the owner's measurement in flux-exchange's credential-acquisition epic (C-440)."
measured = "2026-08-02"

[[auth.quirks.token_endpoint]]
grant = "password"
behaviour = "`expires_in` is read from the request when present, and the service default applies when it is absent."
attribution = "babelforce's own `AuthController.token()`, read against `specs/babelforce/auth-2026-06-25.openapi.yaml`, which declares no request-side `expires_in`. Recorded from the owner's measurement in flux-exchange's credential-acquisition epic (C-440)."
measured = "2026-08-02"

[[auth.quirks.token_endpoint]]
grant = "refresh_token"
behaviour = "`expires_in` is read from the request and passed into the refresh. Separately, `account_id` on the request **switches the account** the new token belongs to — nothing in RFC 6749 makes a refresh change whose token it is, so a host that rotates a credential without pinning `account_id` can silently move it to another account."
attribution = "babelforce's own `AuthController.token()`, read against `specs/babelforce/auth-2026-06-25.openapi.yaml`, which declares neither a request-side `expires_in` nor `account_id`. Recorded from the owner's measurement in flux-exchange's credential-acquisition epic (C-440)."
measured = "2026-08-02"

[[auth.quirks.token_endpoint]]
grant = "link"
behaviour = "A fifth `grant_type` that no vendored document declares at all. `expires_in` is read from the request and then clamped to **at most 60 seconds**, so a lifetime asked for here is a ceiling rather than a request."
attribution = "babelforce's own `AuthController.token()`, read against `specs/babelforce/auth-2026-06-25.openapi.yaml:211-220`, whose `grant_type` enum names four grants and not this one. Recorded from the owner's measurement in flux-exchange's credential-acquisition epic (C-440)."
measured = "2026-08-02"

[[auth.quirks.token_endpoint]]
grant = "authorization_code"
behaviour = "`expires_in` is **not read**. Only `access_type` is, defaulting to `offline`. This row is a measurement and not a gap: the one grant that ignores the field is the fact a reader most needs, because it is the one where asking for a lifetime silently does nothing."
attribution = "babelforce's own `AuthController.token()`, read against `specs/babelforce/auth-2026-06-25.openapi.yaml`, which declares no request-side `expires_in`. Recorded from the owner's measurement in flux-exchange's credential-acquisition epic (C-440)."
measured = "2026-08-02"

# `X-Auth-Access-Id` / `X-Auth-Access-Token`: **not declared by any of the five documents, so there
# is nothing here to exclude.**
#
# This block used to be a five-paragraph exclusion notice, and the premise under it did not survive
# contact with the vendored bytes. It said the document's `securitySchemes` offered a second option —
# two `apiKey` headers travelling as an AND-set — that was deprecated, being scrubbed upstream, and
# must not be emitted; and it instructed a future implementor that "ingest must keep *seeing* the
# pair" so drift-check keeps reporting on it, with the exclusion expressed as an explicit per-operation
# `auth`.
#
# C-415 measured it. `manager-2026-07-10.openapi.yaml:26270-26279` declares `securitySchemes` holding
# **`oauth2` alone**, and the same is true of all five documents. There is no header pair in the
# documents for an overlay to remove, no per-operation `auth` to write, and nothing for drift-check to
# report on — so the instruction that block left behind is not satisfiable against this spec version,
# and following it would have produced 391 `auth` lines defending against a scheme that is not there.
#
# Two readings fit and this repository cannot choose between them from the bytes: either the
# maintainers finished the scrubbing the inventory recorded as under way between the 0.7.0 document
# §5.1.3 was written against and the 2026-07-10 pull, or the documents §5.1.3 described were never
# these. **Confirm which with the babelforce API owners.** The distinction matters for exactly one
# reason: if the pair is still accepted on the wire but merely undocumented, then a *future* document
# that re-declares it is a re-declaration and not a new feature, and this comment is what tells that
# reviewer so.
#
# What does not depend on the answer: the pair stays unmodelled. It is a static, long-lived credential
# pair with no expiry and no rotation story, and both halves are secrets sent as raw headers, doubling
# the surface to gate and redact for no benefit over one bearer. If a future pull re-declares it,
# `OperationPatch::auth` is where the refusal goes, and it is still a refusal.
#
# Note that `accessId`/`accessToken` **do** still appear in the vendored documents, and that is a
# different thing: they are properties of an account payload schema, which
# `crates/connector-spec/tests/vendored_specs.rs::the_declarations_survive_the_scrub` asserts survive.
# A schema property is not a security scheme; do not read the one as evidence of the other.

# JWT is planned, and lands here without reshaping. A minted JWT still reaches the wire as
# `Authorization: Bearer <token>`, so `scheme` stays `bearer`; what changes is the token's
# *provenance*, which is the sibling axis `AuthMethod` already carries as `oauth2` and where a
# `jwt` block would go (§5.1.2, `crates/connector-spec/src/auth.rs:60-69`). Nothing in this file
# would change.
#
# **The password grant is now declared, and the paragraph that used to sit here was answered rather
# than overruled** (C-440). It read that the documents model the bearer as OAuth2 with a password
# grant at `/oauth/token` and that "we still do not implement it: it would require **flux** to hold a
# babelforce user password in order to mint tokens, which is strictly worse than holding the token".
# That objection was correct about flux and is why nothing here changed for a year: putting acquisition
# in a `.flux` module binds a raw token to a model-visible symbol, and holding a password to get there
# is worse again.
#
# What changed is *who performs it*. `AGENTS.md` § Authentication contract: the **host** resolves the
# credential and performs effectful acquisition such as OAuth2. A declaration is not an
# implementation — it emits no module, selects no operation, and reaches no `connector_pack::resolve`
# — so the objection's premise never applies to it. And the residual weakness the objection named is
# real, which is why it is not merely dropped but **stated**, as `hazard` above, so a deployment
# refuses it by property unless somebody opted in. The suggestion to "revisit only if babelforce
# publishes a client-credentials flow" is likewise settled: it publishes none — `client_credentials`
# is in the request enum and in no flow — and the grant is declared on the flows that exist.
#
# **This paragraph used to carry a second argument, and it is now moot.** It read that widening to
# the full surface makes `/oauth/token` itself a *selected, callable operation*, which "is not the
# same thing as flux performing the grant", and leaned on `expose = false` to keep a model away from
# it. The owner ruling of 2026-08-01 removed the premise: `/oauth/token` is **not selected at all**,
# and neither are its two siblings. An authentication endpoint is not an operation, so there is no
# longer a callable-but-unexposed `/oauth/*` operation to reason about. See the `auth` block below.

# ---------------------------------------------------------------------------------------------
# Naming — one rule, nine pins (C-412)
#
# The rule derives `listReportingCalls` into `babelforce-list-reporting-calls`, so a public op id
# exists for all 391 operations without 391 lines saying so. Collisions refuse rather than
# last-write-wins, and a derived id that is not a legal flux `decl_name` is reported by name.
#
# **The nine pins are the compatibility contract, and they are the reason this block is a pin table
# rather than a comment.** Those ids are what users and models already call; a rule arriving
# underneath them must not move them. `crates/connector-spec/tests/babelforce_spec_route.rs` holds
# each of the nine to its id, method, path, risk and idempotency, so this table cannot quietly stop
# being load-bearing.
#
# A pin is keyed by `operationId` alone, which is unique inside one document and nowhere else. All
# nine are the manager document's and no other document declares any of these ids, so nine pins are
# nine unambiguous statements. The one id two documents *do* share is handled below, by the only
# construct that can name a service.
# ---------------------------------------------------------------------------------------------

