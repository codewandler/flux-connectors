# ---------------------------------------------------------------------------------------------

[[operations]]
id = "sentry-issue-event-latest"
method = "GET"
direction = "read"
path = "/api/0/organizations/{organization_id_or_slug}/issues/{issue_id}/events/latest/"
# `latest` is a Sentry-defined path segment, not a parameter: the endpoint is
# `…/events/latest/` and there is a sibling `…/events/oldest/`. Modelling it as a path parameter
# would let a caller pass an arbitrary event id, which is a *different* endpoint with a different
# response, so the segment stays a literal.
description = "Get the most recent event of an issue — the actual occurrence, with its stack trace, breadcrumbs, request context and tags. This is what makes an issue diagnosable rather than merely countable; the event list itself is excluded because it pages with an opaque cursor"
risk = "low"
idempotency = "idempotent"

[[operations.params.path]]
name = "organization_id_or_slug"
description = "The organization's slug as it appears in a Sentry URL (`acme-inc`), or its numeric id"
required = true
schema = { type = "string", pattern = "^[a-zA-Z0-9_-]+$", minLength = 1 }

[[operations.params.path]]
name = "issue_id"
description = "The issue's numeric id"
required = true
schema = { type = "string", pattern = "^[0-9]+$", minLength = 1 }

# The event serializer (38 documented properties), read from the current reference — which addresses
# this endpoint as `…/events/{event_id}/` where `event_id` is an enum of `latest`, `oldest` and
# `recommended` **or** a real event id. So the literal `latest` segment this operation hard-codes is
# the documented spelling, not a shortcut.
#
# **`entries` is where the stack trace is, and the vendor declares it `{"type": "array", "items":
# {}}`** — an empty item schema. Its examples show `{type, data}` entries, and the item shape is
# genuinely undocumented, so it is declared as an untyped array with the discriminator described in
# prose. That is the honest form: a consumer learns where to look and is told that what it finds there
# is not specified, rather than being handed an item schema this repository made up.
#
# `id` and `eventID` are both present and both are the event's id — the same value in two members, one
# of Sentry's own redundancies. `groupID` is the issue, and it is nullable.
[operations.response_schema]
type = "object"
required = ["id", "eventID"]
properties = { id = { type = "string", description = "The event's id" }, eventID = { type = "string", description = "The same event id again, under Sentry's other spelling" }, groupID = { type = "string", description = "The issue this event belongs to — the `issue_id` that fetched it. Nullable in the vendor's schema" }, projectID = { type = "string" }, title = { type = "string", description = "The event's title, usually the same as the issue's" }, message = { type = "string", description = "The log message, or null for an exception-only event" }, platform = { type = "string", description = "The SDK platform that sent it" }, dateCreated = { type = "string", format = "date-time", description = "When the event occurred" }, dateReceived = { type = "string", format = "date-time", description = "When Sentry ingested it. Late-arriving events make these differ" }, culprit = { type = "string" }, tags = { type = "array", description = "The event's tags as `{key, value}` pairs — **an array, not a map**. `environment`, `release`, `server_name`, `url` and `level` all arrive here, so finding the environment means searching the array for `key == \"environment\"`", items = { type = "object", required = ["key", "value"], properties = { key = { type = "string" }, value = { type = "string" } } } }, entries = { type = "array", description = "THE INTERESTING PART, and undocumented: the stack trace, breadcrumbs, HTTP request and message are all entries here, each shown in Sentry's examples as `{type, data}` with `type` naming which (`exception`, `stacktrace`, `breadcrumbs`, `request`, `message`). The vendor's schema declares the item as an empty schema, so nothing is asserted about `data`", items = {} }, user = { type = "object", description = "Who hit it: `{id, email, username, ip_address, name, geo, data}`, or null. **Personal data** — an IP address and an email — so read it only when the task needs it" }, contexts = { type = "object", description = "Runtime context keyed by name (`browser`, `os`, `device`, `trace`). Free-form in the vendor's schema" }, sdk = { type = "object", description = "`{name, version}` of the SDK that reported it, or null" }, release = { type = "object", description = "The release the event came from, or null" }, size = { type = "integer", description = "The stored event's size in bytes, or null" }, errors = { type = "array", description = "Ingest-time problems with the event itself — a missing source map, an unparseable frame — each `{type, message, data}`. Not the error the event is about", items = { type = "object" } }, nextEventID = { type = "string", description = "The next event in the same issue, or null when this is the latest — which it is for this operation" }, previousEventID = { type = "string", description = "The preceding event in the same issue, or null" } }

[operations.quirks.error_envelope]
message_pointer = "/detail"
