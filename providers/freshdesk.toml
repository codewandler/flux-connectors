[[operations]]
id = "freshdesk-contact-get"
method = "GET"
direction = "read"
path = "/contacts/{id}"
description = "Get one contact"
risk = "low"
idempotency = "idempotent"

[[operations.params.path]]
name = "id"
description = "The contact id"
required = true
schema = { type = "string" }

# One contact, flat. Personal data about a named individual, said here because `risk` cannot say it:
# `Risk` grades what a call *changes*, so a read of a person's name, email, phone and mobile grades
# `low` on the same scale as reading a ticket count. Read it only when the task needs it.
#
# `avatar` and `devices` appear on a single read and not in a listing, so they are declared here and
# not there.
[operations.response_schema]
type = "object"
required = ["id"]
properties = { id = { type = "integer" }, name = { type = "string" }, email = { type = "string", format = "email" }, phone = { type = "string" }, mobile = { type = "string" }, address = { type = "string" }, description = { type = "string" }, company_id = { type = "integer" }, view_all_tickets = { type = "boolean", description = "True when this contact can see every ticket of their company, not only their own" }, active = { type = "boolean" }, contact_type = { type = "string" }, job_title = { type = "string" }, language = { type = "string" }, time_zone = { type = "string" }, twitter_id = { type = "string" }, other_emails = { type = "array", items = { type = "string", format = "email" } }, other_companies = { type = "array", description = "On a single read Freshdesk's example shows `{company_id, view_all_tickets}` objects; its listing example shows bare ids. No item schema is declared rather than picking one", items = { type = "object" } }, custom_fields = { type = "object", description = "The account's own contact fields, keyed by field name" }, tags = { type = "array", items = { type = "string" } }, avatar = { type = "object", description = "The contact's picture — `{avatar_url, content_type, id, name, size}` — or null" }, devices = { type = "array", description = "Known devices, each `{device_type, device_make, device_model, app_version, os, os_version}`", items = { type = "object" } }, created_at = { type = "string", format = "date-time" }, updated_at = { type = "string", format = "date-time" } }

