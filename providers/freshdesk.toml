[[operations]]
id = "freshdesk-ticket-get"
method = "GET"
direction = "read"
path = "/tickets/{id}"
description = "View one ticket"
risk = "low"
idempotency = "idempotent"

[[operations.params.path]]
name = "id"
description = "The ticket id"
required = true
schema = { type = "string" }

# The full ticket, flat, from the reference's "View a Ticket" example — and the field a consumer
# usually wants is `description_text` rather than `description`: the latter is HTML, and handing it to
# a model as if it were the customer's message means handing over the markup too.
[operations.response_schema]
type = "object"
required = ["id"]
properties = { id = { type = "integer" }, subject = { type = "string" }, description = { type = "string", description = "The requester's opening message as **HTML**" }, description_text = { type = "string", description = "The same message as plain text. This is the one to summarize or quote" }, structured_description = { type = "object", description = "The message again, as `{description_contents: [{type, data: {content}}]}` — Freshdesk's block form" }, status = { type = "integer", enum = [2, 3, 4, 5], description = "2 Open, 3 Pending, 4 Resolved, 5 Closed" }, priority = { type = "integer", enum = [1, 2, 3, 4], description = "1 Low, 2 Medium, 3 High, 4 Urgent" }, type = { type = "string", description = "The ticket type, e.g. `Question` or `Incident`. Null when unset" }, source = { type = "integer", enum = [1, 2, 3, 7, 9, 10], description = "1 Email, 2 Portal, 3 Phone, 7 Chat, 9 Feedback widget, 10 Outbound email" }, requester_id = { type = "integer" }, responder_id = { type = "integer", description = "The assigned agent; null when unassigned" }, group_id = { type = "integer" }, company_id = { type = "integer" }, product_id = { type = "integer" }, email_config_id = { type = "integer" }, spam = { type = "boolean" }, is_escalated = { type = "boolean" }, fr_escalated = { type = "boolean" }, tags = { type = "array", items = { type = "string" } }, cc_emails = { type = "array", items = { type = "string", format = "email" } }, fwd_emails = { type = "array", items = { type = "string", format = "email" } }, reply_cc_emails = { type = "array", items = { type = "string", format = "email" } }, custom_fields = { type = "object", description = "The account's own ticket fields, keyed by field name — an object, unlike zendesk's array of `{id, value}` pairs" }, attachments = { type = "array", items = { type = "object" } }, due_by = { type = "string", format = "date-time" }, fr_due_by = { type = "string", format = "date-time" }, created_at = { type = "string", format = "date-time" }, updated_at = { type = "string", format = "date-time" } }

