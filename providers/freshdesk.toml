[[operations]]
id = "freshdesk-ticket-note-add"
method = "POST"
path = "/tickets/{id}/notes"
description = "Add a note to a ticket; the note is private unless explicitly made public"
risk = "medium"
idempotency = "non_idempotent"

# §6.4: not marked required by the source (`yml:312`), same silent mis-request as above.
[[operations.params.path]]
name = "id"
description = "Id of the ticket"
required = true
schema = { type = "integer" }

# The source describes this parameter as "Requester ID" — a copy-paste error (`yml:318`, §6.4).
# Described correctly here.
[[operations.params.body]]
name = "body"
description = "Note body"
required = true
schema = { type = "string", minLength = 1 }

# The same safety posture as Zendesk's `public: false`: a note defaults to hidden from end users,
# and a generated op that inherited `false` would publish internal notes (§4.2).
[[operations.params.body]]
name = "private"
description = "Whether the note is hidden from end users"
required = false
schema = { type = "boolean", default = true }

[[operations.params.body]]
name = "incoming"
description = "Set true when the note originates from an external system"
required = false
schema = { type = "boolean", default = true }

[[operations.params.body]]
name = "notify_emails"
description = "Addresses to notify about the note"
required = false
schema = { type = "array", items = { type = "string", format = "email" } }

