[[operations]]
id = "freshdesk-ticket-create"
method = "POST"
direction = "write"
path = "/tickets"
description = "Create a ticket. The requester must be identified either by requester_id, or by phone together with name — Freshdesk states this only in prose and its required flags do not capture it"
risk = "medium"
idempotency = "non_idempotent"

# SCHEMA GAP: that requester constraint is an OR precondition ((phone AND name) OR requester_id,
# `yml:104-106`, §6.4). `Quirks` carries pagination, rate limits and error envelopes — there is no
# precondition field — so it survives only in the description above. The source's `required: true`
# on `phone` is *not* reproduced: it would refuse a perfectly legal create-by-requester_id.
#
# The source's defaults are action-proxy call-context interpolations (`{consumer.number}`,
# `{call.from}`) — babelforce telephony variables that mean nothing outside action-proxy. They are
# dropped (§4.2 note ²); a Flux flow supplies real values.
[[operations.params.body]]
name = "phone"
description = "Requester phone number. Supply with name, or supply requester_id instead"
required = false
schema = { type = "string" }

[[operations.params.body]]
name = "name"
description = "Requester name. Supply with phone, or supply requester_id instead"
required = false
schema = { type = "string" }

[[operations.params.body]]
name = "requester_id"
description = "Requester id. Supply this, or supply phone together with name"
required = false
schema = { type = "integer" }

[[operations.params.body]]
name = "subject"
description = "Ticket subject"
required = true
schema = { type = "string" }

[[operations.params.body]]
name = "description"
description = "Ticket description; HTML or long text"
required = true
schema = { type = "string" }

[[operations.params.body]]
name = "status"
description = "Ticket status: 2 open, 3 pending, 4 resolved, 5 closed"
required = true
schema = { type = "integer", enum = [2, 3, 4, 5], default = 2 }

[[operations.params.body]]
name = "priority"
description = "Ticket priority: 1 low, 2 medium, 3 high, 4 urgent"
required = true
schema = { type = "integer", enum = [1, 2, 3, 4], default = 2 }

[[operations.params.body]]
name = "source"
description = "Channel the ticket came in on"
required = false
schema = { type = "integer", enum = [1, 2, 3, 7, 8, 9, 10], default = 3 }

[[operations.params.body]]
name = "responder_id"
description = "Responding agent id"
required = false
schema = { type = "integer" }

[[operations.params.body]]
name = "type"
description = "Query type"
required = false
schema = { type = "string" }

[[operations.params.body]]
name = "email_config_id"
description = "Email config used for this ticket"
required = false
schema = { type = "integer" }

[[operations.params.body]]
name = "group_id"
description = "Group the ticket is assigned to"
required = false
schema = { type = "integer" }

[[operations.params.body]]
name = "product_id"
description = "Associated product"
required = false
schema = { type = "integer" }

[[operations.params.body]]
name = "tags"
description = "Ticket tags"
required = false
schema = { type = "array", items = { type = "string" } }

[[operations.params.body]]
name = "cc_emails"
description = "Addresses to copy on the ticket"
required = false
schema = { type = "array", items = { type = "string", format = "email" } }

[[operations.params.body]]
name = "custom_fields"
description = "Custom ticket field data"
required = false
schema = { type = "object", additionalProperties = { type = ["string", "integer"] } }

# The created ticket, flat, with `HTTP 201 Created` — the one success code Freshdesk documents, and it
# documents it for every POST at once rather than per endpoint ("POST requests will contain the
# Location Header in the response").
#
# `id` is why this schema matters: it is the only route to the new ticket's id, and every following
# call in a flow — note, update, get — addresses the ticket by it. `status` and `priority` come back
# as the numbers Freshdesk defaulted them to (2 Open, 1 Low) when the create did not set them, which
# is a caller's confirmation of a default it never stated.
[operations.response_schema]
type = "object"
required = ["id"]
properties = { id = { type = "integer", description = "The new ticket's id — the only place it is returned, and what every later call addresses" }, subject = { type = "string" }, description = { type = "string", description = "The opening message as HTML" }, description_text = { type = "string", description = "The opening message as plain text" }, status = { type = "integer", enum = [2, 3, 4, 5], description = "2 Open, 3 Pending, 4 Resolved, 5 Closed. Defaults to 2 when the create did not set it" }, priority = { type = "integer", enum = [1, 2, 3, 4], description = "1 Low, 2 Medium, 3 High, 4 Urgent. Defaults to 1" }, type = { type = "string" }, source = { type = "integer", enum = [1, 2, 3, 7, 9, 10], description = "1 Email, 2 Portal, 3 Phone, 7 Chat, 9 Feedback widget, 10 Outbound email" }, requester_id = { type = "integer", description = "Set even when the ticket was created by phone and name — Freshdesk resolves or creates the contact and reports which one it used" }, responder_id = { type = "integer" }, group_id = { type = "integer" }, company_id = { type = "integer" }, product_id = { type = "integer" }, spam = { type = "boolean" }, is_escalated = { type = "boolean" }, fr_escalated = { type = "boolean" }, tags = { type = "array", items = { type = "string" } }, cc_emails = { type = "array", items = { type = "string", format = "email" } }, due_by = { type = "string", format = "date-time" }, fr_due_by = { type = "string", format = "date-time" }, created_at = { type = "string", format = "date-time" }, updated_at = { type = "string", format = "date-time" } }

