[[operations]]
id = "freshdesk-contact-create"
method = "POST"
direction = "write"
path = "/contacts"
description = "Create a contact"
risk = "medium"
idempotency = "non_idempotent"

[[operations.params.body]]
name = "name"
description = "Contact name"
required = true
schema = { type = "string" }

[[operations.params.body]]
name = "email"
description = "Contact email"
required = false
schema = { type = "string", format = "email" }

[[operations.params.body]]
name = "phone"
description = "Contact phone number"
required = false
schema = { type = "string" }

# The created contact, flat, with the blanket `201 Created`. `id` is the point: it is the
# `requester_id` a following ticket create sends, and there is no other way to learn it.
[operations.response_schema]
type = "object"
required = ["id"]
properties = { id = { type = "integer", description = "The new contact's id — the `requester_id` for a following `freshdesk-ticket-create`" }, name = { type = "string" }, email = { type = "string", format = "email" }, phone = { type = "string" }, mobile = { type = "string" }, address = { type = "string" }, company_id = { type = "integer" }, view_all_tickets = { type = "boolean" }, active = { type = "boolean", description = "Whether the contact has an active portal account. Freshdesk's own create example returns `false`, so do not treat a create as producing an active contact" }, deleted = { type = "boolean" }, contact_type = { type = "string" }, job_title = { type = "string" }, language = { type = "string" }, time_zone = { type = "string" }, twitter_id = { type = "string" }, other_emails = { type = "array", items = { type = "string", format = "email" } }, tags = { type = "array", items = { type = "string" } }, avatar = { type = "object", description = "Null on a contact created through the API" }, created_at = { type = "string", format = "date-time" }, updated_at = { type = "string", format = "date-time" } }

# ---------------------------------------------------------------------------------------------
# Configuration
#
# One field, and its absence of a companion is the point: this connector declares no credential at
# all (see the header), so there is nothing to ask for beyond the host. A form generated from this
# is a single input, and the connector then fails closed with a 401 — which is honest, and visible,
# rather than a form that collects a key nothing would gate.
# ---------------------------------------------------------------------------------------------

[[config]]
name = "domain"
label = "Freshdesk domain"
help = "Your full Freshdesk host, as it appears in the address bar — `acme.freshdesk.com`, including the `.freshdesk.com` part"
example = "acme.freshdesk.com"
# `hostname`, not `subdomain`: freshdesk templates the whole host, so a user who typed only `acme`
# would produce `https://acme/api/v2`. The format is what lets a form catch that before a request.
format = "hostname"
docs_url = "https://support.freshdesk.com/en/support/solutions/articles/50000004820"
binds = "endpoint.domain"
