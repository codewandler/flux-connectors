# Freshdesk — hand-authored, no vendor spec.
#
# Transcribed from `docs/designs/provider-operation-inventory.md` §4, which derives the operation
# set from action-proxy's `freshdesk` collection (649 lines of YAML). action-proxy is mined for
# endpoint facts only; it is the problem statement, not the template. Freshdesk publishes no
# machine-readable description we know of (§1.2), so this file stays hand-authored and its drift is
# undetectable by machine (§6.7).
#
# Source defects in the collection are corrected here rather than reproduced — each correction is
# marked `§6.4` and is one of the rows in that table.

id = "freshdesk"
vendor = "Freshdesk"

# The reverse-DNS authority this connector publishes under (C-92). It leads every rendered address
# and every credential path — `tenants/<tenant>/com.freshdesk.api/<credential>` — and until it was
# declared `Credentials::reference` refused with `NoCredentialAddress`, so this connector could not
# authenticate at all.
#
# Derived from `freshdesk.com`, the vendor's own primary domain, in reverse-DNS form, with the
# trailing `api` label the already-shipped authorities carry (`com.slack.api`, `com.vercel.api`,
# `io.fly.api`).
#
# It is also `docs/designs/global-addressing.md`'s own worked example — the design writes
# `com.freshdesk.api:v2` throughout — so this spelling was fixed before the story was filed.
#
# **Never repointed once published** (`AGENTS.md`: "an address, once published, is not reused"). A
# different spelling mints a new address and deprecates this one, because tenants provision secrets
# under this path.
authority = "com.freshdesk.api"

# The vendor's own spelling, and it is already in `base_url` above: `/api/v2`. Recorded here so a
# `gid` renders (`com.freshdesk.api:v2`) — a credential path needs only the authority and
# deliberately carries no version, so a token survives the vendor's next one.
api_version = "v2"

# Every Freshdesk account lives on its own domain, recorded by the inventory as operator config in
# `FRESHDESK_DOMAIN`, e.g. `my-company.freshdesk.com` (§4.1). The `/api/v2` prefix is part of the
# base URL, so operation paths below are collection-relative.
#
# `{domain}` is bound by the `[[config]]` field at the end of this file. Unlike zendesk, freshdesk
# templates the *whole host* rather than one label, so the field's format is `hostname`.
base_url = "https://{domain}/api/v2"

description = "Freshdesk ticketing: list, read, create and update tickets and the contacts they belong to"

# The "Test connection" operation. Its description already said so — *"Verify credentials with a
# bounded contact read"* — in a field only a model reads.
verify = "freshdesk-test"

# ---------------------------------------------------------------------------------------------
# Credentials — DELIBERATELY ABSENT. Read this before adding one.
# ---------------------------------------------------------------------------------------------
#
# Freshdesk authenticates with `Authorization: Basic base64(<api_key>:X)` — the **secret occupies
# the username position** and the password is the literal constant `X` (§4.1,
# `freshdesk.yml:48-50`, `template.yml:15-20`). That shape is **not expressible** with today's
# schema, and every way of forcing it is worse than leaving it out:
#
#   - `scheme = "basic"` composes `base64(<user_env><user_suffix>:<env>)`. Putting
#     `FRESHDESK_API_KEY` in `user_env` would declare the API key as **non-secret config** —
#     `AuthMethod::user_env` is documented as "config rather than a gated secret" — which removes it
#     from flux's secret gating and from the redactor's `add_secret` registration. That is a
#     security regression, not a cosmetic mismatch (§6.2).
#   - `user_suffix` is the wrong half: it appends a literal to the *user*, and Freshdesk needs a
#     literal in the *password*. There is no `password_literal`, and no field says which half is
#     secret.
#   - `scheme = "header"` with `name = "Authorization"` would send the raw key with no `Basic ` and
#     no base64 — wrong on the wire, and it sends the credential anyway.
#
# So this connector declares **no credential and no `default_auth`**, which means its operations
# inherit "unauthenticated". That is wrong, and it is wrong in the fail-closed direction: every
# request 401s visibly instead of routing a live API key through a non-secret path. Nothing here is
# executable until the gap closes.
#
# The fix is C-16's to make, and §6.2 recommends option (1): let a Basic method declare **which
# position holds the secret**, the other position taking a literal constant. When that lands, add:
#
#     [[auth]]
#     name = "freshdesk.api_key"
#     scheme = "basic"
#     env = ["FRESHDESK_API_KEY"]      # still the secret, still gated
#     <the field that says the secret is the user half, password literal "X">
#
# and set `default_auth = [{ credentials = ["freshdesk.api_key"] }]`. The constant `X` is not a
# credential and must never be stored in an environment variable pretending to be one.
#
# WHAT THIS CONNECTOR IS, AS A STATE (C-235) — decided, not inherited.
#
# It is `no-credential` — *withheld* — and **not** `no-credential-required`. Declaring nothing here
# is the right thing to do and it is not the same statement as `auth = []` on an operation, which
# would say the vendor needs nothing. Freshdesk's vendor needs a great deal; this repository is what
# will not carry it.
#
# The distinction used to stop at the embedded catalogue, so `connectors-api` served freshdesk as
# `no-credential-required` — "nothing to supply" — which reads to an operator as *ready to use* and
# was wrong on every call. It now carries the reason, so the honest answer reaches the page:
# nothing to supply, nothing to do, and the calls are refused until C-16 lands. **Do not** add
# `auth = []` to these operations to make a check go green; that would state the opposite of what
# the block above spent forty lines establishing.

# ---------------------------------------------------------------------------------------------
# Operations — 9 of 16 (inventory §4.2). Selection is ticket-centric, plus the contact operations
# that make ticket work possible and one verification op. Excluded: `tickets.outbound_email` (sends
# mail as a side effect), the two agent-directory operations, and the four
# `babelforce.integration.*` forwarders, which are action-proxy's own capability contract rather
# than Freshdesk operations at all.
#
# Op ids are hyphen-separated — flux-lang admits alphanumerics, `_` and `-` only (C-8).
# ---------------------------------------------------------------------------------------------

# ---------------------------------------------------------------------------------------------
# RESPONSE SHAPES (C-126) — read from `developers.freshdesk.com/api/`, which is a single reference
# page covering every resource below.
#
# **`status` and `priority` are numbers, and that is the whole reason these schemas are worth
# declaring.** Freshdesk's own attribute tables type both as `number` and give the mappings:
#
#   status    2 Open · 3 Pending · 4 Resolved · 5 Closed          (no 1; default 2)
#   priority  1 Low · 2 Medium · 3 High · 4 Urgent                (default 1)
#   source    1 Email · 2 Portal · 3 Phone · 7 Chat · 9 Feedback widget · 10 Outbound email
#
# A flow that gates on "resolved" is comparing against `4`, not against a string, and zendesk's
# sibling connector in this same repository answers the same question with `"solved"`. Publishing the
# enum next to the field is what stops a consumer carrying one vendor's vocabulary into the other's.
# The values are enumerated with `enum` where the vendor enumerates them, which also makes the
# mapping machine-readable rather than prose.
#
# **There is no envelope anywhere.** A single-resource read returns the bare object and a list returns
# a bare JSON **array** — the top level is not an object at all, which is a shape nothing else in this
# fleet ships and which a consumer expecting `{"tickets": …}` would read as empty.
#
# Two documented facts constrain what is declared, and both are recorded rather than smoothed over:
#
# 1. **A list response is not a get response.** The reference notes that for accounts created after
#    2018-11-30 `description` is omitted from list responses unless `include` is passed, and its own
#    list examples also omit `tags` and `attachments`. So the list schemas below declare the fields
#    the list examples actually show, not the single-read field set.
# 2. **Freshdesk documents almost no success status codes.** Only the blanket "POST requests will
#    contain the Location Header … HTTP 201 Created" and DELETE's 204. Nothing here claims a code the
#    vendor does not state.
#
# `custom_fields` is an **object** keyed by field name here — the opposite of zendesk's array of
# `{id, value}` pairs. Two vendors, two shapes, one word; that is exactly what a published schema is
# for.
#
# As everywhere in this repository: this is what Freshdesk *sends*, not what a caller of the emitted
# `op` receives. `http.request` returns one flat string today (C-127,
# `docs/designs/member-io-schemas.md` §2).
# ---------------------------------------------------------------------------------------------

[[services]]
# C-153. `default` is the reserved implicit service, and a provider with one API surface
# declares no services at all — so this entry exists for exactly one reason: a tag attaches
# to a service, and there is no other service here to attach it to. It carries `tags` and
# nothing else, which is what keeps `default` implicit and this file emitting the same
# `freshdesk.flux` it emitted before.
name = "default"
tags = ["support"]

[[operations]]
id = "freshdesk-test"
method = "GET"
direction = "read"
path = "/contacts"
description = "Verify credentials with a bounded contact read"
risk = "low"
idempotency = "idempotent"

# Ours, not the source's: `yml:522-528` is an unbounded `GET /contacts`. Bounding a liveness check
# to one record is a deliberate addition (§4.2).
[[operations.params.query]]
name = "per_page"
description = "Records to fetch; one is enough to prove the credential works"
required = false
schema = { type = "integer", minimum = 1, default = 1 }

# A bare array — this operation is `GET /contacts` with a bound, so it answers with the contact list
# and there is no top-level object at all. That is the fact worth publishing on a verification
# operation: a caller proving liveness checks that the call succeeded, and must not expect a body it
# can key into.
[operations.response_schema]
type = "array"
description = "The contacts, as a bare JSON array. With `per_page = 1` it holds one element; an empty array is still a successful credential check, because an account may genuinely have no contacts"
items = { type = "object", properties = { id = { type = "integer" }, name = { type = "string" }, email = { type = "string", format = "email" }, active = { type = "boolean" } } }

# ---------------------------------------------------------------------------------------------

[[operations]]
id = "freshdesk-ticket-list"
method = "GET"
direction = "read"
path = "/tickets"
description = "List and filter tickets"
risk = "low"
idempotency = "idempotent"

# Every parameter of this operation is **renamed on the wire** (inventory §4.2 op 2, which records
# both columns). `name` is what a caller and a model see; `wire` is Freshdesk's own spelling, and it
# is what travels in the query string (C-29). Before `wire` existed the IR carried one name per
# parameter, so the caller-facing name was dropped and this comment was the only record of it.
[[operations.params.query]]
name = "req_id"
wire = "requester_id"
description = "Filter by requester"
required = false
schema = { type = "string" }

[[operations.params.query]]
name = "req_email"
wire = "email"
description = "Filter by requester email"
required = false
schema = { type = "string", format = "email" }

# The one parameter the source does not rename, so it declares no `wire`.
[[operations.params.query]]
name = "company_id"
description = "Filter by company id"
required = false
schema = { type = "string" }

# §6.4: the source marks this `required: true` (`yml:69-74`). That is an action-proxy UI constraint;
# Freshdesk's `GET /tickets` does not require `updated_since`. Recorded optional.
[[operations.params.query]]
name = "updated"
wire = "updated_since"
description = "Only tickets updated at or after this date"
required = false
schema = { type = "string", format = "date-time" }

# A bare array of tickets, and a **narrower** field set than `freshdesk-ticket-get` returns — see
# point 1 of the block comment above. `description`, `tags` and `attachments` are absent from the
# vendor's list examples and are documented as needing `include`, which this operation does not send,
# so they are not declared here: a consumer that read `description` off a listing would find nothing
# and could not tell a missing field from an empty one.
[operations.response_schema]
type = "array"
description = "The matching tickets, as a bare JSON array with no envelope. The ticket bodies (`description`, `description_text`) are NOT included in a listing — read one ticket with `freshdesk-ticket-get` to get its text"
items = { type = "object", properties = { id = { type = "integer" }, subject = { type = "string" }, status = { type = "integer", enum = [2, 3, 4, 5], description = "2 Open, 3 Pending, 4 Resolved, 5 Closed" }, priority = { type = "integer", enum = [1, 2, 3, 4], description = "1 Low, 2 Medium, 3 High, 4 Urgent" }, type = { type = "string", description = "The ticket type, e.g. `Question` or `Incident`. Null when unset" }, source = { type = "integer", enum = [1, 2, 3, 7, 9, 10], description = "How the ticket arrived: 1 Email, 2 Portal, 3 Phone, 7 Chat, 9 Feedback widget, 10 Outbound email" }, requester_id = { type = "integer", description = "The contact who asked" }, responder_id = { type = "integer", description = "The agent it is assigned to; null when unassigned" }, group_id = { type = "integer" }, company_id = { type = "integer" }, spam = { type = "boolean" }, is_escalated = { type = "boolean" }, fr_escalated = { type = "boolean", description = "True when the first-response SLA was breached" }, due_by = { type = "string", format = "date-time" }, fr_due_by = { type = "string", format = "date-time", description = "When a first response is due" }, created_at = { type = "string", format = "date-time" }, updated_at = { type = "string", format = "date-time" } } }

