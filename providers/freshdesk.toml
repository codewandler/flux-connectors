[[operations]]
id = "freshdesk-contact-list"
method = "GET"
direction = "read"
path = "/contacts"
description = "List and filter contacts, e.g. to resolve a caller before filing a ticket"
risk = "low"
idempotency = "idempotent"

[[operations.params.query]]
name = "phone"
description = "Filter by phone"
required = false
schema = { type = "string" }

[[operations.params.query]]
name = "email"
description = "Filter by email"
required = false
schema = { type = "string", format = "email" }

[[operations.params.query]]
name = "mobile"
description = "Filter by mobile number"
required = false
schema = { type = "string" }

[[operations.params.query]]
name = "company_id"
description = "Filter by company id"
required = false
schema = { type = "string" }

[[operations.params.query]]
name = "state"
description = "Filter by contact state"
required = false
schema = { type = "string", enum = ["blocked", "deleted", "unverified", "verified"] }

# A bare array of contacts. `id` is what this operation exists to produce — the `requester_id` a
# following `freshdesk-ticket-create` sends — which is why an empty array is the interesting outcome:
# it means the caller was not found and a ticket must be created by phone and name instead.
#
# `other_companies` is deliberately declared without an item schema. Freshdesk's own examples
# disagree with each other about it: the list example shows bare company ids (`[4, 9, 10]`) while the
# single-contact and create examples show objects (`{company_id, view_all_tickets}`). Recording one of
# the two as *the* shape would be a coin toss published as a contract.
[operations.response_schema]
type = "array"
description = "The matching contacts, as a bare JSON array with no envelope. Empty when nothing matched — which is a successful call, and the signal that the caller is not a known contact"
items = { type = "object", properties = { id = { type = "integer", description = "The contact id — this is the `requester_id` a ticket create takes" }, name = { type = "string" }, email = { type = "string", format = "email", description = "The primary address; further ones are in `other_emails`" }, phone = { type = "string" }, mobile = { type = "string" }, company_id = { type = "integer" }, active = { type = "boolean" }, deleted = { type = "boolean" }, contact_type = { type = "string" }, job_title = { type = "string" }, language = { type = "string" }, time_zone = { type = "string" }, twitter_id = { type = "string" }, other_emails = { type = "array", items = { type = "string", format = "email" } }, other_companies = { type = "array", description = "Freshdesk's own examples disagree about this member: bare company ids in a listing, `{company_id, view_all_tickets}` objects on a single read. No item schema is declared rather than guessing which" }, tags = { type = "array", items = { type = "string" } }, created_at = { type = "string", format = "date-time" }, updated_at = { type = "string", format = "date-time" } } }

