[[operations]]
id = "freshdesk-ticket-note-add"
method = "POST"
direction = "write"
path = "/tickets/{id}/notes"
description = "Add a note to a ticket; the note is private unless explicitly made public"
risk = "medium"
idempotency = "non_idempotent"

# §6.4: not marked required by the source (`yml:312`), same silent mis-request as above.
[[operations.params.path]]
name = "id"
description = "Id of the ticket"
required = true
schema = { type = "integer" }

# The source describes this parameter as "Requester ID" — a copy-paste error (`yml:318`, §6.4).
# Described correctly here.
[[operations.params.body]]
name = "body"
description = "Note body"
required = true
schema = { type = "string", minLength = 1 }

# The same safety posture as Zendesk's `public: false`: a note defaults to hidden from end users,
# and a generated op that inherited `false` would publish internal notes (§4.2).
[[operations.params.body]]
name = "private"
description = "Whether the note is hidden from end users"
required = false
schema = { type = "boolean", default = true }

[[operations.params.body]]
name = "incoming"
description = "Set true when the note originates from an external system"
required = false
schema = { type = "boolean", default = true }

[[operations.params.body]]
name = "notify_emails"
description = "Addresses to notify about the note"
required = false
schema = { type = "array", items = { type = "string", format = "email" } }

# The created note (Freshdesk calls it a conversation), flat, with the blanket `201 Created`.
#
# **`notify_emails` goes in and `notified_to` comes back.** The request field and the response field
# have different names for the same list, which is documented and is precisely the asymmetry a
# consumer cannot infer: reading `notify_emails` off this response yields nothing.
#
# `private` is the field to check rather than trust. It defaults to `true` — the safety posture this
# operation's parameter comment describes — and reading it back is how a flow confirms it did not just
# publish an internal note to the requester.
[operations.response_schema]
type = "object"
required = ["id"]
properties = { id = { type = "integer", description = "The note's own id, distinct from the ticket's" }, ticket_id = { type = "integer", description = "The ticket the note was added to" }, body = { type = "string", description = "The note as HTML" }, body_text = { type = "string", description = "The note as plain text" }, structured_body = { type = "object", description = "The note again, as `{body_contents: [{type, data: {content}}]}`" }, private = { type = "boolean", description = "True for a note only agents can see. Defaults to true — read it back before assuming a note was published" }, incoming = { type = "boolean", description = "True when the note represents something the customer sent in rather than an agent's own note" }, user_id = { type = "integer", description = "Who the note is attributed to" }, support_email = { type = "string", description = "The support address involved, or null" }, notified_to = { type = "array", description = "Who was notified — the response's name for the request's `notify_emails`", items = { type = "string", format = "email" } }, attachments = { type = "array", items = { type = "object" } }, created_at = { type = "string", format = "date-time" }, updated_at = { type = "string", format = "date-time" } }

