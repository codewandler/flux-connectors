# The updated ticket, flat — the whole resource, not a diff of what changed. So the response is how a
# caller confirms an update took: read back the field it set. Freshdesk documents no success status
# code for a `PUT`, and none is claimed here.
[operations.response_schema]
type = "object"
required = ["id"]
properties = { id = { type = "integer" }, subject = { type = "string" }, description = { type = "string", description = "The opening message as HTML — unchanged by an update, which never edits the first message" }, description_text = { type = "string", description = "The opening message as plain text" }, status = { type = "integer", enum = [2, 3, 4, 5], description = "2 Open, 3 Pending, 4 Resolved, 5 Closed — the value **after** this update" }, priority = { type = "integer", enum = [1, 2, 3, 4], description = "1 Low, 2 Medium, 3 High, 4 Urgent" }, type = { type = "string" }, source = { type = "integer", enum = [1, 2, 3, 7, 9, 10] }, requester_id = { type = "integer" }, responder_id = { type = "integer" }, group_id = { type = "integer" }, product_id = { type = "integer" }, spam = { type = "boolean" }, is_escalated = { type = "boolean" }, fr_escalated = { type = "boolean" }, tags = { type = "array", description = "The ticket's tag set after the update. Freshdesk documents no additive form of this field — unlike zendesk's `additional_tags` — so read it back rather than assuming earlier tags survived", items = { type = "string" } }, attachments = { type = "array", items = { type = "object" } }, due_by = { type = "string", format = "date-time" }, fr_due_by = { type = "string", format = "date-time" }, created_at = { type = "string", format = "date-time" }, updated_at = { type = "string", format = "date-time", description = "Moves on every accepted update, so it is the cheapest confirmation that the call changed something" } }

