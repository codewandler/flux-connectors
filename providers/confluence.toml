[[operations]]
id = "confluence-page-get"
method = "GET"
direction = "read"
path = "/api/v2/pages/{id}"
description = "Read one page's metadata by id — title, space, parent, author, creation time, current version number and the link to open it in Confluence. **The page body is not returned**: selecting a content format needs a query parameter this connector cannot send, so the `body` field comes back empty regardless of whether the page has content. Use this to resolve a page id to its title and URL, not to read what the page says"
risk = "low"
idempotency = "idempotent"

[[operations.params.path]]
name = "id"
description = "The page's id, from `confluence-space-pages`, from a space's `homepageId`, or from `confluence-page-create`'s response"
required = true
schema = { type = "string", minLength = 1 }

# `PageSingle`. `version` is present without any query parameter — the vendor's `include-version`
# defaults to `true`, which is the one expansion this connector gets for free and the reason this
# operation is worth shipping at all despite the empty body.
[operations.response_schema]
type = "object"
required = ["id", "title", "status"]
properties = { id = { type = "string", description = "The page's id, as a string" }, title = { type = "string", description = "The page's title — the only content-bearing field this operation returns" }, status = { type = "string", description = "`current` for a live page, or `archived`/`draft`/`trashed`. A trashed page still reads here" }, spaceId = { type = "string", description = "The space the page belongs to — pass it to `confluence-space-get` for the space's name and key" }, parentId = { type = "string", description = "The page this one sits under, or null for a top-level page" }, parentType = { type = "string", description = "What the parent is, e.g. `page`" }, position = { type = "integer", description = "Sort position among siblings, or null" }, authorId = { type = "string", description = "Account id of whoever created the page. An `accountId`, never a username — it identifies a named person, so read it for what the calling flow needs and do not persist it beyond that" }, ownerId = { type = "string", description = "Account id of the page's current owner" }, lastOwnerId = { type = "string", description = "Account id of the previous owner, or null" }, createdAt = { type = "string", format = "date-time" }, version = { type = "object", description = "The page's current version — returned without asking, because the vendor's `include-version` defaults to true. `number` is what an update would have to increment; this connector declares no update, and its notes say why", properties = { number = { type = "integer", description = "The current version number" }, createdAt = { type = "string", format = "date-time", description = "When this version was created — i.e. when the page was last edited" }, authorId = { type = "string", description = "Who made the most recent edit" }, minorEdit = { type = "boolean", description = "Whether the editor marked it a minor edit, suppressing notifications" }, message = { type = "string", description = "The edit comment, when the editor left one" } } }, body = { type = "object", description = "**EMPTY (`{}`).** Confluence populates this only when a `body-format` query parameter selects a representation (`storage`, `view`, `atlas_doc_format`…), and this connector sends none (C-30). An empty `body` here is a limitation of this connector and says nothing about the page — do not report the page as blank on the strength of it" }, _links = { type = "object", description = "`webui` is the page's path in the Confluence UI and `base` is the site URL — join them to give a human a link. `editui` and `tinyui` are the edit and short forms", properties = { webui = { type = "string", description = "The page's path, relative to `base`" }, editui = { type = "string" }, tinyui = { type = "string", description = "Confluence's short link form" }, base = { type = "string", format = "uri", description = "The site's base URL, to resolve the paths above against" } } } }

# ---------------------------------------------------------------------------------------------
# Writes — 2. Both `high`, and both `non_idempotent`.
#
# `high` matches `jira-issue-create` and `jira-issue-comment-add` rather than trello's `medium`, and
# the reason is the audience: a Confluence space is a shared document store that a whole
# organisation reads and that Confluence indexes for search and emails watchers about. A published
# page or comment cannot be un-seen, and deleting one needs a permission an integration usually
# lacks — this connector cannot delete at all.
#
# Neither is idempotent: Confluence offers no idempotency key on either endpoint, so posting twice
# publishes twice. This repository's convention (first written for `providers/asana.toml`) is that a
# write earns `idempotent` only from a vendor-documented guarantee, never from an accident of
# implementation.
#
# **Both bodies nest, and both nestings are objects rather than arrays** — `body.representation` and
# `body.value`. That is what C-29's `wire` paths express (`BodyNode` is `Leaf` or `Branch`), and it
# is precisely the thing Jira's v3 comment body could not be expressed as. Confluence's write shape
# is the well-behaved twin of the one that pushed jira to API v2.
# ---------------------------------------------------------------------------------------------

[[operations]]
id = "confluence-page-create"
method = "POST"
direction = "write"
path = "/api/v2/pages"
description = "Publish a new page in a space. The page is created live and visible to everyone who can see the space, is indexed for search, and notifies the space's watchers. It is created at the top level of the space unless the space's own structure places it otherwise, with no labels and no restrictions. Returns the new page's id, title and links. The content is sent as Confluence storage format — XHTML-like markup, e.g. `<p>text</p>` — not Markdown and not wiki markup"
risk = "high"
idempotency = "non_idempotent"

[[operations.params.body]]
name = "space_id"
wire = "spaceId"
description = "Id of the space to publish into, from `confluence-space-list`. The only field Confluence's schema strictly requires"
required = true
schema = { type = "string", minLength = 1 }

# Pinned, not asked for: this operation publishes, it does not draft. `status` is a two-valued vendor
# field (`current`/`draft`) whose other value would produce an invisible page that no operation here
# can then publish — a silent no-op from the caller's point of view. A JSON Schema `const` is sent as
# a literal and never declared as an argument (`crates/connector-flux/src/op.rs:486-494`), which is
# the mechanism `providers/intercom.toml` and `providers/cloudflare.toml` already use.
[[operations.params.body]]
name = "status"
description = "Constant `current` — not caller-supplied. This operation publishes a live page; a draft would be invisible and no operation here could publish it afterwards"
required = true
schema = { type = "string", const = "current" }

[[operations.params.body]]
name = "title"
description = "The page's title, as it will appear in the space and in search. Confluence requires titles to be unique within a space and rejects a duplicate with a `400`"
required = true
schema = { type = "string", minLength = 1 }

# Pinned for the same reason, and this one has a sharper failure mode than `status`. Confluence
# accepts three write representations (`storage`, `wiki`, `atlas_doc_format`) and **stores whatever
# it is told without validating that the value matches the label**. A model that sent Markdown or
# wiki markup labelled `storage` would get a `200` and a page rendering broken markup as literal
# text — a corrupted document, not an error anyone would see. Pinning removes the choice rather than
# documenting it; the `body` field below states the required format in its own description.
[[operations.params.body]]
name = "body_representation"
wire = "body.representation"
description = "Constant `storage` — not caller-supplied. It fixes how Confluence interprets the content sent below"
required = true
schema = { type = "string", const = "storage" }

[[operations.params.body]]
name = "body"
wire = "body.value"
description = "The page content, in **Confluence storage format**: XHTML-like markup such as `<p>A paragraph.</p><h2>A heading</h2><ul><li>An item</li></ul>`. Plain text is accepted and renders as a single unformatted run. Markdown is **not** converted — it would be stored and displayed literally, asterisks and all"
required = true
schema = { type = "string" }

# `PageSingle`, `200` — note **not** `201`, which is what this endpoint's sibling comment write
# answers with. The created page's `body` echoes what was sent, so it is the one place in this
# connector where a content body is legible; the reads cannot do the same.
[operations.response_schema]
type = "object"
required = ["id", "title", "status"]
properties = { id = { type = "string", description = "The new page's id — the only handle on it, and what `confluence-comment-add` and `confluence-page-get` address it by afterwards" }, title = { type = "string", description = "Echoes the title that was sent" }, status = { type = "string", description = "`current` on a page this operation created" }, spaceId = { type = "string", description = "The space the page was published into" }, parentId = { type = "string", description = "The page it was placed under, which Confluence resolves to the space's home page when none was requested" }, authorId = { type = "string", description = "The account the token belongs to — a published page is attributed to it, and that name is what other people in the space will see" }, ownerId = { type = "string" }, createdAt = { type = "string", format = "date-time" }, version = { type = "object", description = "`{number, createdAt, authorId, minorEdit, message}`, with `number` = 1 on a page just created", properties = { number = { type = "integer", description = "1 on creation" } } }, body = { type = "object", description = "Echoes the storage-format content that was sent, under `storage`. This is the one response in this connector that carries a page body — because it is the body the caller supplied, not one Confluence was asked to render" }, _links = { type = "object", description = "`webui` is the new page's path in the Confluence UI and `base` is the site URL; join them to give a human the link to what was just published" } }

# ---------------------------------------------------------------------------------------------

[[operations]]
id = "confluence-comment-add"
method = "POST"
direction = "write"
path = "/api/v2/footer-comments"
description = "Add a footer comment to a page — the comment thread at the bottom, not an inline annotation on selected text. The comment is visible to everyone who can see the page and notifies its watchers; it cannot be restricted to a subset of them. The content is sent as Confluence storage format (`<p>text</p>`), not Markdown. Note the page is named in the body rather than in the path, and that this connector cannot read a page's existing comments back"
risk = "high"
idempotency = "non_idempotent"

# **The page is a body field, not a path parameter** — the vendor's endpoint is the unscoped
# `/footer-comments` collection, and the parent is chosen by which of `pageId`, `blogPostId`,
# `attachmentId`, `customContentId` or `parentCommentId` is present. Only `pageId` is declared, so
# this operation comments on a page and nothing else: the vendor expresses the constraint in prose
# ("Do not provide if creating a reply") and its schema enforces nothing, so declaring the
# alternatives would hand a model five mutually exclusive fields with no way to state the exclusion.
# A reply to a comment is a different operation and is not declared.
[[operations.params.body]]
name = "page_id"
wire = "pageId"
description = "Id of the page to comment on, from `confluence-space-pages` or `confluence-page-create`. This creates a top-level footer comment on that page; replying to an existing comment is not supported by this operation"
required = true
schema = { type = "string", minLength = 1 }

# Pinned, exactly as on `confluence-page-create` and for the same reason — a mislabelled
# representation is stored verbatim and renders as broken markup with a `200`.
[[operations.params.body]]
name = "body_representation"
wire = "body.representation"
description = "Constant `storage` — not caller-supplied. It fixes how Confluence interprets the comment content sent below"
required = true
schema = { type = "string", const = "storage" }

[[operations.params.body]]
name = "body"
wire = "body.value"
description = "The comment text, in **Confluence storage format**: XHTML-like markup such as `<p>A comment.</p>`. Plain text is accepted and renders unformatted. Markdown is **not** converted and would be displayed literally"
required = true
schema = { type = "string", minLength = 1 }

# `FooterCommentModel`, `201 Created` — and it is a **bare comment**, not the page and not the
# `{results, _links}` envelope a comment list would return. A consumer that reused a list shape and
# read `results[0]` would find nothing.
[operations.response_schema]
type = "object"
required = ["id", "status"]
properties = { id = { type = "string", description = "The new comment's id, as a string" }, status = { type = "string", description = "`current` on a comment just created" }, title = { type = "string", description = "Confluence's own generated title for the comment, e.g. `Re: <page title>`. Not something the caller sets" }, pageId = { type = "string", description = "The page the comment was attached to — echoes what was sent, and worth checking, since the parent is chosen by which body field was present rather than by the path" }, parentCommentId = { type = "string", description = "Null on a top-level comment, which is all this operation creates" }, version = { type = "object", description = "`{number, createdAt, authorId, minorEdit, message}`, with `number` = 1 on a comment just created", properties = { number = { type = "integer", description = "1 on creation" } } }, body = { type = "object", description = "Echoes the storage-format content that was sent, under `storage`" }, _links = { type = "object", description = "Carries `webui`, the comment's anchored path in the Confluence UI — it opens the page scrolled to this comment — and `base`, the site URL to resolve it against" } }

# ---------------------------------------------------------------------------------------------
# Configuration — what a product asks a human for before any of the above can run.
#
# Three fields, and **the operator will have typed two of them before**, for Jira. That duplication
# is the probe's answer made visible in a settings form, and the `help` text says so plainly rather
# than letting someone wonder whether they have the right token. See the header for why the address
# does not resolve to the value they already supplied.
#
# The token field carries **no `example`**: a placeholder shaped like a real token is worse than
# none, because a user copies it, and one has already tripped GitHub's push protection in this
# repository's history. `confluence_connector.rs::no_secret_config_field_carries_an_example` asserts
# it for every secret field rather than for this one.
# ---------------------------------------------------------------------------------------------

[[config]]
name = "site"
label = "Atlassian site name"
help = "The part of your Confluence URL before `.atlassian.net` — if you sign in at `acme.atlassian.net/wiki`, this is `acme`. It is the same site name as your Jira connection, if you have one"
example = "acme"
format = "subdomain"
docs_url = "https://support.atlassian.com/confluence-cloud/docs/what-is-confluence-cloud/"
binds = "endpoint.site"

[[config]]
name = "email"
label = "Atlassian account email"
help = "The email of the account that minted the API token. It travels as the username half of the request"
example = "you@acme.com"
format = "email"
# Not secret — the same non-gated `user_env` path jira's and zendesk's account email take. As with
# jira there is no `user_suffix`, so the value is sent exactly as typed.
binds = "username.confluence.api_token"

[[config]]
name = "api_token"
label = "API token"
help = "Create one at id.atlassian.com under Security → API tokens. Atlassian shows it once. This is the same kind of token a Jira connection uses — and if you already made one for Jira, that token works here too, but it has to be pasted again: the two connections store it separately"
format = "token"
secret = true
docs_url = "https://id.atlassian.com/manage-profile/security/api-tokens"
binds = "credential.confluence.api_token"
