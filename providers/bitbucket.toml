[[operations]]
id = "bitbucket-pull-request-comment"
method = "POST"
direction = "write"
path = "/repositories/{workspace}/{repo_slug}/pullrequests/{pull_request_id}/comments"
description = "Add a top-level comment to a pull request. The comment is attributed to the account the token belongs to and notifies everyone participating; Bitbucket sends no un-notification, so a comment posted in error can be deleted but not un-seen. This posts a general comment on the pull request, never an inline comment on a line of the diff"
risk = "medium"
idempotency = "non_idempotent"

[[operations.params.path]]
name = "repo_slug"
description = "The repository's URL segment, from bitbucket-repository-list's `slug`"
required = true
schema = { type = "string", minLength = 1 }

[[operations.params.path]]
name = "pull_request_id"
description = "The pull request's number, from bitbucket-pull-request-list's `id`"
required = true
schema = { type = "integer", minimum = 1 }

# Nested, as above: Bitbucket's comment body is `{"content": {"raw": …}}`.
[[operations.params.body]]
name = "body"
wire = "content.raw"
description = "The comment text, as Markdown. Bitbucket renders it and returns the rendered HTML alongside the raw text"
required = true
schema = { type = "string", minLength = 1 }

[operations.response_schema]
type = "object"
required = ["id", "content"]
properties = { id = { type = "integer", description = "The comment's id within the pull request" }, content = { type = "object", description = "The comment as stored and as rendered", properties = { raw = { type = "string", description = "The Markdown that was sent" }, markup = { type = "string" }, html = { type = "string", description = "Bitbucket's rendering of it" } } }, user = { type = "object", description = "The account the comment is attributed to — the token's own. Identifies a named person; read it for what the calling flow needs and do not persist it beyond that" }, deleted = { type = "boolean" }, created_on = { type = "string", format = "date-time" }, updated_on = { type = "string", format = "date-time" }, links = { type = "object", description = "Bitbucket's hypermedia links, including `html.href` — the comment's anchor on the pull request page" } }

[operations.quirks.error_envelope]
message_pointer = "/error/message"

# ---------------------------------------------------------------------------------------------

# **`risk = "high"`, and it is the one declaration in this file worth arguing about.**
#
# Not `medium` ("limited blast radius") and not `destructive` (nothing is deleted; Bitbucket publishes
# a `DELETE` on the same path to withdraw an approval, deliberately not shipped here — see the header).
# `high` is "a write a reviewer would want to see first", and an approval is exactly that for a reason
# no other write in this file has: **it is a claim about a human process.** It records, under the
# token's own account, that this change was reviewed. In a repository with an approval merge check it
# is also the thing standing between a branch and the default branch, so an automated approval does not
# merely add a row — it can release a merge somebody configured a gate to hold. That is the same tier
# `providers/google.toml` gives an unrecallable Gmail send and `providers/asana.toml` a comment nobody
# can un-notify, and it is the tier that makes flux's approval gate stop for it.
#
# This operation sends no body: the approval is the `POST` itself, and the approver is whoever the
# token belongs to. A model calling it has nothing to choose beyond which pull request.
[[operations]]
id = "bitbucket-pull-request-approve"
method = "POST"
direction = "write"
path = "/repositories/{workspace}/{repo_slug}/pullrequests/{pull_request_id}/approve"
description = "Approve a pull request as the account this connection's token belongs to. This records a review that a human may not have performed, and in a repository with an approval merge check it can release a merge that gate was configured to hold — treat it as an assertion about a review, not as a bookmark. Bitbucket answers a repeat approval with 409 rather than approving twice. Sends no body: the approver is the token's own account"
risk = "high"
idempotency = "non_idempotent"

[[operations.params.path]]
name = "repo_slug"
description = "The repository's URL segment, from bitbucket-repository-list's `slug`"
required = true
schema = { type = "string", minLength = 1 }

[[operations.params.path]]
name = "pull_request_id"
description = "The pull request's number, from bitbucket-pull-request-list's `id`"
required = true
schema = { type = "integer", minimum = 1 }

[operations.response_schema]
type = "object"
required = ["approved"]
properties = { approved = { type = "boolean", description = "True once the approval landed" }, state = { type = "string", description = "approved, changes_requested, or null" }, role = { type = "string", description = "PARTICIPANT or REVIEWER — how the token's account relates to this pull request" }, user = { type = "object", description = "The account the approval is attributed to — the token's own. Identifies a named person; read it for what the calling flow needs and do not persist it beyond that" }, participated_on = { type = "string", format = "date-time", description = "When the approval was recorded" } }

[operations.quirks.error_envelope]
message_pointer = "/error/message"
