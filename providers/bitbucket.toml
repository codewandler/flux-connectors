# ---------------------------------------------------------------------------------------------

# **The three writes.**
#
# `bitbucket-pull-request-create` and `bitbucket-pull-request-comment` are `medium`: both are visible
# to everyone watching the repository and both notify people, but neither destroys anything and both
# are reversible in Bitbucket's own UI. `bitbucket-pull-request-approve` is `high`, and the reason is
# below it.
#
# All three are `non_idempotent`. For the two `POST`s that create something it is simply true —
# Bitbucket documents no idempotency key and calling either twice produces two of the thing. For the
# approval it is true as well: Bitbucket answers a repeat with `409`, not a repeat of the first `200`.
# `crates/connector-flux/src/op.rs`'s `check_write_metadata` also refuses `idempotent` on these
# authored writes, so no claim here is load-bearing on transport classification.
#
# **Required body fields only**, the call `providers/cloudflare.toml` makes and for the same reason: an
# optional body field is bound unconditionally by the emitter (C-56), so a caller who did not set it
# sends the vendor an explicit `null`, and this file has no evidence Bitbucket accepts `null` for
# `description`, `close_source_branch` or `reviewers` on a create. Those three are the obvious
# additions once C-56 lands.

[[operations]]
id = "bitbucket-pull-request-create"
method = "POST"
direction = "write"
path = "/repositories/{workspace}/{repo_slug}/pullrequests"
description = "Open a pull request from one branch to another in a repository of this connection's workspace. Both branches must already exist and be pushed. Bitbucket does not deduplicate: opening the same source-to-destination pull request twice creates two of them, and notifies the repository's watchers twice. The created pull request, with its assigned `id`, is in the response"
risk = "medium"
idempotency = "non_idempotent"

[[operations.params.path]]
name = "repo_slug"
description = "The repository's URL segment, from bitbucket-repository-list's `slug`"
required = true
schema = { type = "string", minLength = 1 }

[[operations.params.body]]
name = "title"
description = "The pull request's title, as it will read in the list. Bitbucket requires one"
required = true
schema = { type = "string", minLength = 1 }

# `source.branch.name` and `destination.branch.name` are nested wire paths — Bitbucket's body is
# `{"source": {"branch": {"name": …}}}`, and the flat spelling `{"source.branch.name": …}` is a request
# Bitbucket accepts and ignores. `wire` is what keeps the emitted record nested.
[[operations.params.body]]
name = "source_branch"
wire = "source.branch.name"
description = "The branch holding the change, exactly as it is named in the repository — the branch this pull request would merge from"
required = true
schema = { type = "string", minLength = 1 }

# Required rather than optional, and that is a deliberate departure from Bitbucket's own default.
# Omitting `destination` makes Bitbucket target the repository's main branch, which is usually right and
# is exactly the kind of "usually right" a model should not be left to assume: the destination is what
# decides where the change lands. bitbucket-repository-get returns `mainbranch.name` for a caller that
# wants the default, so naming it costs one read and removes a guess. It is also what avoids the C-56
# null hazard above, since an optional nested field would send `{"destination": {"branch": {"name":
# null}}}`.
[[operations.params.body]]
name = "destination_branch"
wire = "destination.branch.name"
description = "The branch the change would merge into. Bitbucket's own default is the repository's main branch, which bitbucket-repository-get returns as `mainbranch.name` — name it explicitly rather than assuming it"
required = true
schema = { type = "string", minLength = 1 }

[operations.response_schema]
type = "object"
required = ["id", "title", "state"]
properties = { id = { type = "integer", description = "The new pull request's number — what bitbucket-pull-request-comment and -approve address it by" }, title = { type = "string" }, description = { type = "string" }, state = { type = "string", description = "OPEN on a pull request just created" }, author = { type = "object", description = "The account the token belongs to. Identifies a named person — read it for what the calling flow needs and do not persist it beyond that" }, source = { type = "object", properties = { branch = { type = "object", properties = { name = { type = "string" } } } } }, destination = { type = "object", properties = { branch = { type = "object", properties = { name = { type = "string" } } } } }, close_source_branch = { type = "boolean", description = "False unless the repository defaults it otherwise; this connector does not set it" }, created_on = { type = "string", format = "date-time" }, updated_on = { type = "string", format = "date-time" }, links = { type = "object", description = "Bitbucket's hypermedia links, including `html.href` — the new pull request's page, the link to give a human" } }

[operations.quirks.error_envelope]
message_pointer = "/error/message"

