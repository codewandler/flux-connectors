[patch.naming]
rule = "kebab"
prefix = "asterisk-ari"

# All scalar-query REST calls are catalogued and callable. The broad method classes make the
# conservative safety decision reviewable in four blocks: reads are low/idempotent by construction,
# while POST, PUT and DELETE never invite an automatic replay against live PBX state. DELETE remains
# destructive.
# Only the bounded subset below reaches a model as tools.
[[patch.select]]
methods = ["GET"]
expose = false

[[patch.select]]
methods = ["POST"]
risk = "high"
idempotency = "non_idempotent"
expose = false

[[patch.select]]
methods = ["PUT"]
risk = "high"
idempotency = "non_idempotent"
expose = false

[[patch.select]]
methods = ["DELETE"]
risk = "destructive"
idempotency = "non_idempotent"
expose = false

# C-30: ARI documents these query values as arrays without saying whether the wire uses repeated
# keys, comma-separated values, brackets or JSON. Each block narrows the explicitly selected set;
# publishing one by guess would create a plausible request to a live PBX that ARI may misread.
[[patch.operations]]
select = "applications-subscribe"
defer = "The eventSource query array has no declared wire convention."

[[patch.operations]]
select = "applications-unsubscribe"
defer = "The eventSource query array has no declared wire convention."

[[patch.operations]]
select = "asterisk-getInfo"
defer = "The only query array has no declared wire convention."

[[patch.operations]]
select = "bridges-addChannel"
defer = "The channel query array has no declared wire convention."

[[patch.operations]]
select = "bridges-play"
defer = "The media query array has no declared wire convention."

[[patch.operations]]
select = "bridges-playWithId"
defer = "The media query array has no declared wire convention."

[[patch.operations]]
select = "bridges-removeChannel"
defer = "The channel query array has no declared wire convention."

[[patch.operations]]
select = "bridges-getBridgeVars"
defer = "The variables query array has no declared wire convention."

[[patch.operations]]
select = "channels-play"
defer = "The media query array has no declared wire convention."

[[patch.operations]]
select = "channels-playWithId"
defer = "The media query array has no declared wire convention."

[[patch.operations]]
select = "channels-getChannelVars"
defer = "The variables query array has no declared wire convention."

[[patch.operations]]
select = "events-userEvent"
defer = "The source query array has no declared wire convention."

# A useful bounded model surface. Named-operation callers retain the 96 operations whose query wire
# shape is modelled through connector-pack resolve; these fifteen are the common discovery/control
# actions advertised in a model prompt.
[[patch.operations]]
select = "applications-list"
expose = true

[[patch.operations]]
select = "asterisk-ping"
expose = true

[[patch.operations]]
select = "bridges-list"
expose = true

[[patch.operations]]
select = "bridges-create"
expose = true

[[patch.operations]]
select = "bridges-destroy"
expose = true

[[patch.operations]]
select = "channels-list"
expose = true

[[patch.operations]]
select = "channels-originate"
expose = true

[[patch.operations]]
select = "channels-hangup"
expose = true

[[patch.operations]]
select = "deviceStates-list"
expose = true

[[patch.operations]]
select = "endpoints-list"
expose = true

[[patch.operations]]
