type = "object"
required = ["sid"]
properties = { sid = { type = "string" }, parent_call_sid = { type = "string", description = "Set when this call is a child leg; null otherwise" }, account_sid = { type = "string" }, to = { type = "string", description = "The called party" }, to_formatted = { type = "string" }, from = { type = "string", description = "The calling party" }, from_formatted = { type = "string" }, phone_number_sid = { type = "string" }, status = { type = "string", enum = ["queued", "ringing", "in-progress", "completed", "busy", "failed", "no-answer", "canceled"] }, direction = { type = "string", enum = ["inbound", "outbound-api", "outbound-dial"] }, answered_by = { type = "string", description = "Set only when answering-machine detection ran; null otherwise" }, forwarded_from = { type = "string" }, caller_name = { type = "string", description = "CNAM lookup result, when requested; null otherwise" }, duration = { type = "string", description = "Seconds, sent as a numeric string; empty until the call completes" }, start_time = { type = "string", description = "RFC 2822, not ISO 8601" }, end_time = { type = "string", description = "RFC 2822, not ISO 8601; null until the call ends" }, price = { type = "string", description = "Sent as a numeric string; null until the call settles" }, price_unit = { type = "string" }, api_version = { type = "string" }, uri = { type = "string" }, subresource_uris = { type = "object", description = "Links to this call's recordings, notifications and other sub-resources" } }

# ---------------------------------------------------------------------------------------------
# Events — status callbacks. A fourth vendor for C-60's HMAC matrix, tabulated in prose below
# because it cannot be tabulated in `[channels.verification.hmac]` — see the block comment after.
#
# Twilio has no webhook-subscription API to select event types from, the way GitHub, Stripe or
# Slack's Events API do: a status callback is configured per-resource — a `StatusCallback` URL
# supplied when a message or call is created, or set on a phone number's messaging/voice
# configuration — all of which are writes this connector does not ship (see the header comment).
# So there is no `[[channels]] transport = "webhook"` `[channels.subscription]` here either; an
# operator wires the callback URL by hand, the same posture `providers/slack.toml`'s Events API
# binding records under `[channels.setup]` when this repository does add a channel for it.
# ---------------------------------------------------------------------------------------------

[[events]]
name = "message.status_callback"
description = "A message's delivery status changed. Twilio POSTs this, form-encoded, to the StatusCallback URL supplied when the message was created"
group = "Messaging"
schema = { type = "object", required = ["MessageSid", "MessageStatus"], properties = { MessageSid = { type = "string" }, MessageStatus = { type = "string", enum = ["accepted", "queued", "sending", "sent", "failed", "delivered", "undelivered", "receiving", "received", "read"] }, To = { type = "string", description = "The recipient" }, From = { type = "string", description = "The sender" }, ApiVersion = { type = "string" }, ErrorCode = { type = "string", description = "Present only when MessageStatus is failed or undelivered" } } }

[[events]]
name = "call.status_callback"
description = "A call's status changed. Twilio POSTs this, form-encoded, to the StatusCallback URL configured for the call or the answering number"
group = "Voice"
schema = { type = "object", required = ["CallSid", "CallStatus"], properties = { CallSid = { type = "string" }, CallStatus = { type = "string", enum = ["queued", "ringing", "in-progress", "completed", "busy", "failed", "no-answer", "canceled"] }, To = { type = "string", description = "The called party" }, From = { type = "string", description = "The calling party" }, Direction = { type = "string", enum = ["inbound", "outbound-api", "outbound-dial"] }, CallDuration = { type = "string", description = "Seconds, sent as a numeric string; present only once the call has ended" }, Timestamp = { type = "string", description = "RFC 2822, not ISO 8601" }, ApiVersion = { type = "string" } } }

# ---------------------------------------------------------------------------------------------
# Channels — the status-callback bindings. This file used to say, at length, that there could be
# no `[[channels]]` here; C-188 closed the gap it named, and the record of what it cost is worth
# keeping because the objection was a good one.
# ---------------------------------------------------------------------------------------------
#
# Twilio signs a status callback with `X-Twilio-Signature`: base64(HMAC-SHA1(AuthToken, signed)),
# where `signed` is the **full request URL** with every POST parameter's name and value — sorted by
# name, no delimiter between a pair or between pairs — appended directly after it
# (twilio.com/docs/usage/security#validating-requests). Two objections stood in the way, and only
# the first was really about the placeholder set:
#
#  1. **`{url}` was absent from the vocabulary**, and `{body}` names the raw request bytes verified
#     *before* parsing. Adding `{url}` is an ordinary widening — the URL is a fact the transport
#     supplies at request time, exactly as the body and the headers are, and no endpoint address
#     enters this repository.
#  2. **"A `signed` template concatenates fixed strings around two named values; it cannot re-sort N
#     form fields whose count and names vary per delivery."** That objection is correct and still
#     stands: the template sorts nothing. What the template gained is the *name* of a derivation —
#     `{sorted_form}` — that one function in the host performs identically for every vendor that
#     names it. The distinction is the whole of C-188: naming a derivation is a declaration, while
#     an expression capable of performing one would be the connector-specific DSL principle 2 keeps
#     out. `SIGNED_PLACEHOLDERS` stays a closed set, so an author still cannot write a derivation
#     nobody computes — the loader refuses the name.
#
# What did not need solving: the outbound form **encoder** gap (upstream flux `L-101`, and
# `BodyEncoding::Form`'s refusal of a nested body). That is about producing a form body from a
# nested structure with no agreed convention for the nesting. A callback arrives as a flat sequence
# of `name=value` pairs and this derivation only reads it. Opposite directions; they do not touch.
#
# Two bindings rather than one, because Twilio has no event discriminator to write. A status
# callback carries no field naming its own type — a message callback is recognised by carrying
# `MessageSid`, a call callback by carrying `CallSid` — and `[[channels]] discriminator` addresses
# one field, not a disjunction. It is not a gap: Twilio's callbacks are configured **per resource**,
# so the messaging `StatusCallback` URL and the voice one are separate URLs an operator wires
# separately. One binding per URL is what the vendor actually offers, and each carries exactly one
# event, so nothing needs discriminating.

[[channels]]
name = "message-status-callback"
transport = "webhook"
description = "Message delivery-status callbacks. Twilio POSTs form-encoded to the StatusCallback URL supplied when a message is created, signing the URL and the parameters with the Auth Token"
events = ["message.status_callback"]
# No `delivery_id`. Twilio sends no per-delivery identifier on a status callback, and the tempting
# stand-in is wrong: `MessageSid` identifies the *message*, so deduping on it would collapse the
# `queued` → `sent` → `delivered` sequence into one event. Twilio does retry, so a flow that must
# not act twice dedupes on `(MessageSid, MessageStatus)` itself; declaring a `delivery_id` that
# cannot do the job would read as though redelivery had been handled.

# Twilio's own published parameters (twilio.com/docs/usage/security). SHA-1 and base64 are the
# vendor's, not a choice — Twilio publishes no SHA-256 alternative for this header.
[channels.verification.hmac]
algorithm = "sha1"
encoding = "base64"
header = "X-Twilio-Signature"
# The URL Twilio was configured to call, query string included, then the POST parameters decoded,
# sorted by name and re-joined with no delimiter anywhere. `{sorted_form}` is what covers the
# payload here — `{body}` would not reproduce it, because the signed string carries `To+18005551212`
# where the wire carries `To=%2B18005551212`.
signed = "{url}{sorted_form}"
# No `timestamp` and therefore no `tolerance`: Twilio signs no timestamp and publishes no replay
# window. Stated here because its absence is the vendor's scheme rather than an unfinished
# declaration — a captured signature for a given URL and body stays valid, which is a property of
# `X-Twilio-Signature` an operator should know and cannot learn from silence.
secret = "twilio.webhook_signing_secret"

# Flat form fields, so every path is a top-level name.
[channels.payload]
message_sid = "MessageSid"
status = "MessageStatus"
to = "To"
sender = "From"
error_code = "ErrorCode"

# No subscription API to name: a `StatusCallback` URL is supplied per message, or configured on a
# phone number, and both are writes this connector does not ship (see the header comment). So the
# operator wires it, the same posture `providers/slack.toml`'s Events API binding takes.
[channels.setup]
docs_url = "https://www.twilio.com/docs/messaging/guides/track-outbound-message-status"
steps = [
  "Open console.twilio.com and choose the phone number or Messaging Service this connection sends from",
  "Paste the Request URL shown above into its status-callback field, exactly as shown — the signature covers the URL, so a redirect or a rewritten host breaks every delivery",
  "Or, if messages are created by another system, have it pass the same URL as the `StatusCallback` parameter",
  "Copy the Auth Token from the console into this connection's signing secret field — it is the same value as the Auth Token above",
]

# ---------------------------------------------------------------------------------------------

[[channels]]
name = "call-status-callback"
transport = "webhook"
description = "Call status callbacks. Twilio POSTs form-encoded to the StatusCallback URL configured for the call or the answering number, signed exactly as the messaging callback is"
events = ["call.status_callback"]

[channels.verification.hmac]
algorithm = "sha1"
encoding = "base64"
header = "X-Twilio-Signature"
signed = "{url}{sorted_form}"
secret = "twilio.webhook_signing_secret"

[channels.payload]
call_sid = "CallSid"
status = "CallStatus"
to = "To"
caller = "From"
direction = "Direction"
duration = "CallDuration"

[channels.setup]
docs_url = "https://www.twilio.com/docs/voice/twiml/number#attributes-statusCallback"
steps = [
  "Open console.twilio.com and choose the phone number this connection answers or dials on",
  "Paste the Request URL shown above into its call status-callback field, exactly as shown — the signature covers the URL",
  "Select the call events to report: initiated, ringing, answered, completed",
  "Copy the Auth Token from the console into this connection's signing secret field",
]

# ---------------------------------------------------------------------------------------------
# Configuration — what a product asks a human for before any operation above can run
#
# Two fields, matching the two halves of the Basic pair. Note what is *not* here: there is no third
# field for the Account SID's use as a path parameter — see the long comment above the operations for
# why that is a caller-facing duplication rather than a configuration-time one.
# ---------------------------------------------------------------------------------------------

[[config]]
name = "account_sid"
label = "Account SID"
help = "Copy this from the Twilio Console dashboard — it starts with AC and is the same value used to sign in to the API, not your login email"
example = "ACXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX"
format = "token"
docs_url = "https://www.twilio.com/docs/iam/api/account"
binds = "username.twilio.basic_auth"
also_binds = ["path.AccountSid"]

[[config]]
name = "auth_token"
label = "Auth Token"
help = "Your primary Auth Token from the Twilio Console dashboard. Twilio shows it masked by default — click to reveal it"
format = "token"
secret = true
docs_url = "https://www.twilio.com/docs/iam/api/account"
binds = "credential.twilio.basic_auth"
