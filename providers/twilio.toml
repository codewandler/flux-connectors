required = ["sid"]
properties = { sid = { type = "string" }, account_sid = { type = "string" }, messaging_service_sid = { type = "string", description = "Set when the message was sent through a Messaging Service; null otherwise" }, to = { type = "string", description = "The recipient, as an E.164 phone number or a channel address" }, from = { type = "string", description = "The sender, as an E.164 phone number, short code or alphanumeric sender id" }, body = { type = "string", description = "The message text, truncated by Twilio at 1600 characters" }, num_segments = { type = "string", description = "Sent as a numeric string" }, num_media = { type = "string", description = "Sent as a numeric string" }, status = { type = "string", enum = ["accepted", "scheduled", "queued", "sending", "sent", "failed", "delivered", "undelivered", "receiving", "received", "read", "canceled"] }, direction = { type = "string", enum = ["inbound", "outbound-api", "outbound-call", "outbound-reply"] }, api_version = { type = "string" }, price = { type = "string", description = "Sent as a numeric string; null until the message settles" }, price_unit = { type = "string" }, error_code = { type = "integer", description = "Null unless status is failed or undelivered" }, error_message = { type = "string", description = "Null unless status is failed or undelivered" }, date_created = { type = "string", description = "RFC 2822, not ISO 8601" }, date_updated = { type = "string", description = "RFC 2822, not ISO 8601" }, date_sent = { type = "string", description = "RFC 2822, not ISO 8601; null until Twilio actually sends it" }, uri = { type = "string" }, subresource_uris = { type = "object", description = "Links to this message's media and feedback sub-resources" } }

