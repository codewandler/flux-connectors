[[operations]]
id = "twilio-call-list"
method = "GET"
path = "/Accounts/{account_sid}/Calls.json"
description = "List calls made from or received by this account"
risk = "low"
idempotency = "idempotent"

[[operations.params.path]]
name = "account_sid"
description = "The Account SID — the same identifier entered as this connection's Basic-auth username"
required = true
schema = { type = "string" }

# `To`, `From`, `StartTime`/`StartTime<`/`StartTime>` and `EndTime`/`EndTime<`/`EndTime>` are excluded
# for exactly the reason `twilio-message-list`'s query comment records: phone numbers carry an
# unencoded `+`, and the range operators live in the parameter *name*. `Status` is a plain enum word
# with no character either gap touches, so it is declared alongside paging.
[[operations.params.query]]
name = "status"
wire = "Status"
description = "Filter by call status"
required = false
schema = { type = "string", enum = ["queued", "ringing", "in-progress", "completed", "busy", "failed", "no-answer", "canceled"] }

[[operations.params.query]]
name = "page"
wire = "Page"
description = "Page number, 0-based"
required = false
schema = { type = "integer", minimum = 0, default = 0 }

[[operations.params.query]]
name = "page_size"
wire = "PageSize"
description = "Calls per page; Twilio caps this at 1000"
required = false
schema = { type = "integer", minimum = 1, maximum = 1000, default = 50 }

[operations.quirks.pagination]
page = { page_param = "Page", size_param = "PageSize", page_size = 50, max_pages = 10 }

# developer reference: twilio.com/docs/voice/api/call-resource
[operations.response_schema]
type = "object"
required = ["calls"]
properties = { calls = { type = "array", items = { type = "object", required = ["sid"], properties = { sid = { type = "string" }, parent_call_sid = { type = "string", description = "Set when this call is a child leg (e.g. a conference or forwarded leg); null otherwise" }, account_sid = { type = "string" }, to = { type = "string", description = "The called party, as an E.164 phone number or SIP address" }, to_formatted = { type = "string", description = "A human-readable rendering of `to`" }, from = { type = "string", description = "The calling party" }, from_formatted = { type = "string", description = "A human-readable rendering of `from`" }, phone_number_sid = { type = "string", description = "The Twilio number involved, when one was" }, status = { type = "string", enum = ["queued", "ringing", "in-progress", "completed", "busy", "failed", "no-answer", "canceled"] }, direction = { type = "string", enum = ["inbound", "outbound-api", "outbound-dial"] }, answered_by = { type = "string", description = "Set only when answering-machine detection ran: human, machine_start, machine_end_beep, machine_end_silence, machine_end_other, or fax. Null otherwise" }, forwarded_from = { type = "string", description = "The number a carrier reports this call as forwarded from, when the carrier provides it" }, caller_name = { type = "string", description = "CNAM lookup result, when requested; null otherwise" }, duration = { type = "string", description = "Seconds, sent as a numeric string; empty until the call completes" }, start_time = { type = "string", description = "RFC 2822, not ISO 8601" }, end_time = { type = "string", description = "RFC 2822, not ISO 8601; null until the call ends" }, price = { type = "string", description = "Sent as a numeric string, negative for an outbound charge; null until the call settles" }, price_unit = { type = "string" }, api_version = { type = "string" }, uri = { type = "string" } } } }, page = { type = "integer" }, page_size = { type = "integer" }, first_page_uri = { type = "string" }, previous_page_uri = { type = "string", description = "Null on the first page" }, next_page_uri = { type = "string", description = "Null on the last page" }, uri = { type = "string" } }

