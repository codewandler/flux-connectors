# Slack Web API — hand-authored, no vendor spec.
#
# Slack publishes an OpenAPI 2.0 description of the Web API (`slack_web_openapi_v2.json`, linked
# from docs.slack.dev). It is not pointed at here for the same reason zendesk's is not: when C-14's
# fetch and drift-check land, this file should become a `[spec]` pointer plus a
# `[[patch.operations]]` selection over the vendored document, and until then a hand-authored
# selection is the shortest honest route to a module. Drift is undetectable by machine in the
# meantime (`docs/designs/provider-operation-inventory.md` §6.7).
#
# ---------------------------------------------------------------------------------------------
# EVERY OPERATION IS POST WITH A JSON BODY — INCLUDING THE READS. DO NOT "FIX" A READ INTO A GET.
# ---------------------------------------------------------------------------------------------
#
# Slack's Web API is method-style: the endpoint is `POST /api/<method>` and every argument travels
# in the body. Keeping the reads on POST is a *correctness* decision, not a stylistic one, and the
# reason is the emitter:
#
#   `connector-flux` interpolates a query value into the URL with `fmt` and percent-encodes
#   nothing, because flux registers no URL-encoding op (`crates/connector-flux/src/op.rs`, C-28,
#   C-30). Slack's `channel`, `user` and `timestamp` are opaque strings — `C0123ABCDEF`,
#   `U0123ABCDEF`, `1728394857.123456`. A read written as
#   `GET /api/conversations.history?channel={channel}` would therefore ship the same
#   unencodable-value defect `zendesk-ticket-search` carries, and `crates/connector-cli/src/status.rs`
#   would rightly publish it as broken. Written as a POST body it cannot: a JSON body is assembled
#   as a record and serialized by flux, so no value is spliced into a URL.
#
# So this connector declares **no query parameter anywhere**, which is what makes it the only
# shipped provider with no encoding gap at all. That is asserted, not merely intended:
# `crates/connector-flux/tests/slack_connector.rs` fails if any operation gains a query parameter,
# and fails again if an emitted module contains the emitter's `$sep` query-separator machinery.
#
# Vendor documentation — POST+JSON is documented as supported for all four methods, reads included:
#
# - The Web API overview (docs.slack.dev/apis/web-api) states that a JSON body requires the token to
#   travel as a bearer in the `Authorization` header — *"You must transmit your token as a bearer
#   token in the Authorization HTTP header"*, and *"you cannot send your token as part of the query
#   string or as an attribute in your posted JSON"*. That is why `scheme = "bearer"` below is what
#   makes this request shape legal at all, rather than an incidental choice.
# - Each of the four reference pages lists `application/json` under **Content types**.
# - Each of them, including the two reads, documents the error `invalid_post_type`: *"The method was
#   called via a `POST` request, but the specified `Content-Type` was invalid. Valid types are:
#   `application/json` …"*. A method that defines an error for POSTing with the *wrong* content type,
#   and names `application/json` among the right ones, is documenting POST+JSON as supported.
#
# Two things a later reader might mistake for evidence against this, so they are answered here:
#
# - The `GET https://slack.com/api/<method>` line on a reference page is that page's **sample
#   invocation**, not a constraint on the verb.
# - The overview's *"Most write methods allow arguments with `application/json` attributes"* is a
#   generalisation about the surface as a whole; the per-method pages are more specific and override
#   it for these four.
#
# What is *not* settled by documentation is practice — whether Slack behaves as documented on these
# exact methods. That is C-15's live end-to-end run, and it is the first thing that run should check.
# If a read were to reject POST despite the above, the fix is C-30's percent-encoding, **not** a GET
# with a raw `channel=` in the query string.
#
# ---------------------------------------------------------------------------------------------
# SCHEMA GAP: nothing expresses "the failure is in the body of a 200".
# ---------------------------------------------------------------------------------------------
#
# Slack signals failure with **HTTP 200** and `{"ok": false, "error": "channel_not_found"}`. A
# consumer that switches on the status code sees success on every failure, which is the single most
# consequential quirk of this API.
#
# `Quirks.error_envelope` cannot say that. `ErrorEnvelope` carries `message_pointer` and an optional
# `code_pointer` and nothing else, and its own documentation defines it as *"Where a vendor hides
# the real error inside a **non-2xx** response body"* (`crates/connector-spec/src/ir.rs`). There is
# no success predicate — no `ok_pointer`, no `success_when` — so the fact that the *status code is
# not the signal* has nowhere to live. `connector-flux`'s `description()` then appends a sentence
# beginning *"A non-2xx response is returned as data, not a failure…"*, which for Slack is true but
# beside the point and would leave a model checking the wrong thing.
#
# Two consequences, both deliberate:
#
#  1. The envelope *is* declared below, with `message_pointer = "/error"`, so the location is
#     machine-readable for C-12 rather than lost. A second, narrower facet of the same gap:
#     `message_pointer` is documented as the *human-readable message* and is mandatory, while Slack
#     publishes only a machine code at `/error` and no message field at all — so the required field
#     has to carry a code.
#  2. Because the schema cannot carry it, **each operation's own `description` states the `ok: false`
#     contract in prose**, which is the text that actually reaches the model as its tool contract.
#     That is a workaround, and it is written down as one. The fix is a success-predicate field on
#     `ErrorEnvelope` plus `http.request` returning a record instead of one flat string (the same
#     flux-side seam `op.rs` already records for envelope handling).
#
# SCHEMA GAP: cursor pagination is unexpressible for a POST+JSON API. `conversations.history` pages
# with an opaque `cursor`, but `Pagination::Cursor.cursor_param` is defined as *"The query parameter
# carrying the cursor"* — there is no body-field spelling. Declaring it would be declaring a query
# parameter, which is exactly what this connector must not do. Pagination is therefore left off
# `slack-conversations-history` entirely and bounded with `limit` instead; C-53 excludes cursor
# paging pending C-30, and closing it needs the quirk to admit a body-carried cursor.
#
# DIRECTION REVIEW: two read-shaped operations below remain conservatively authored as writes
# pending individual semantic review. `check_write_metadata` reads that authored direction and never
# their shared POST transport. A method-only vendor refresh therefore cannot reclassify them.

id = "slack"
vendor = "Slack"

# The address components. Absent until the channel binding below needed them: a binding's `reply`
# renders as an oip (`com.slack.api:v1#slack-chat-post-message`), and an address missing either half
# is not an address. `v1` is Slack's own spelling — the Web API has carried no version segment since
# it launched, and `slack.com/api/<method>` is v1 in the only sense the vendor uses.
authority = "com.slack.api"
api_version = "v1"

# One host for every workspace. Unlike zendesk there is no per-tenant subdomain, so `base_url`
# carries no `{placeholder}` for an operator to bind and `status.rs` reports no
# `unbound-base-url-template` issue: the connector already has a valid destination URL.
#
# `http_hosts` is `slack.com` and must never be widened. `files.slack.com` and
# `*.slack-edge.com` serve user content, `hooks.slack.com` is the unauthenticated webhook surface;
# none of them is reachable from the operations below and adding one would widen the egress
# allow-list for nothing. The manifest's real `http_hosts` field lands in C-10; today the host is
# derived from this URL (`crates/connector-cli/src/catalog.rs`, `host_of`).
base_url = "https://slack.com"

description = "Slack messaging: post messages, read conversation history, look up users, react"

# Every operation authenticates the same way, and a bearer is not merely one option among several
# here: it is what permits a JSON request body at all (see the header comment).
default_auth = [{ credentials = ["slack.bot_token"] }]

# ---------------------------------------------------------------------------------------------
# Credentials
# ---------------------------------------------------------------------------------------------

[[auth]]
name = "slack.bot_token"
scheme = "bearer"
# The bot user OAuth token, `xoxb-…`. Gated and registered with flux's redactor by the host; its
# value is never read here and never reaches a generated artifact.
#
# A bot token rather than a user token deliberately: a bot posts as the app, so a write is
# attributable to the integration rather than impersonating the operator, and the scopes below are
# grantable per workspace. Slack mints it through OAuth v2 at install time, which is why no
# `[auth.oauth2]` block appears — flux is handed an already-minted token through the environment and
# runs no grant, the same provenance babelforce's bearer has.
env = ["SLACK_BOT_TOKEN"]
# C-528: this token acts as the **integration**, not as a person. The whole paragraph above is that
# fact in prose — "a bot posts as the app, so a write is attributable to the integration rather than
# impersonating the operator" — and until C-528 there was no field to state it in, so a host reading
# the catalogue could not tell this apart from a token that impersonates whoever installed it.
subject = "app"
description = "Slack bot user OAuth token (xoxb-…) with chat:write, channels:history, users:read and reactions:write"

[[auth]]
name = "slack.signing_secret"
# `signing` — the one scheme that never reaches an outgoing request. It exists so that a webhook
# secret is a credential like any other and appears in the manifest's credential list, rather than
# living in a second namespace an operator would have to know about separately.
#
# Declared here even though the binding below uses Socket Mode and does not verify signatures, and
# that is deliberate rather than an oversight: an operator who runs Slack over the Events API instead
# needs exactly this credential, and the request-signing scheme (`v0:{timestamp}:{body}`, HMAC-SHA256,
# hex, `v0=`) is the row this repository's verification matrix was derived from. It is unreferenced
# until an `events-api` binding lands, which is why nothing yet points at it.
scheme = "signing"
# C-528: `app`, and the reasoning differs from the bot token's. A signing secret never travels
# outbound and acts as nobody — but it is issued to the *app* and is provisioned once per
# installation, so `app` is the honest answer to "who supplies this and whose it is". `user` would be
# a category error: no person has a signing secret of their own.
subject = "app"
env = ["SLACK_SIGNING_SECRET"]
description = "Slack app signing secret, used to verify inbound Events API requests. Never sent to Slack"

# ---------------------------------------------------------------------------------------------
# Operations — 4 of ~200 Web API methods
#
# Curated to what a support or notification flow executes at runtime: say something, read what was
# said, resolve who said it, acknowledge it. Everything administrative (`admin.*`, ~90 methods),
# every workspace-mutating create/invite/archive, and every file upload is excluded — the same
# selection principle babelforce's 9-of-163 follows
# (`docs/designs/provider-operation-inventory.md` §5.2).
#
# Op ids are hyphen-separated, not dotted: flux-lang's `is_valid_decl_name` admits ASCII
# alphanumerics, `_` and `-` only, so `op slack.chat.postMessage` is undeclarable (C-8, C-23). The
# *path* keeps Slack's own camelCase method name, because that is what the vendor routes on.
# ---------------------------------------------------------------------------------------------

[[services]]
# C-153. `default` is the reserved implicit service, and a provider with one API surface
# declares no services at all — so this entry exists for exactly one reason: a tag attaches
# to a service, and there is no other service here to attach it to. It carries `tags` and
# nothing else, which is what keeps `default` implicit and this file emitting the same
# `slack.flux` it emitted before.
name = "default"
tags = ["messaging"]

[[operations]]
id = "slack-chat-post-message"
method = "POST"
direction = "write"
path = "/api/chat.postMessage"
description = "Post a message to a Slack channel, visible to everyone in it. Slack answers HTTP 200 even on failure: check `ok` in the response body before treating the message as sent"
# A message in a shared channel is read by people, notifies them, and cannot be un-seen once posted.
# That is the "a reviewer would want to see this first" tier, and it is the one operation here that
# is unambiguously high.
risk = "high"
# Posting twice posts two messages. Slack offers no idempotency key on this method.
idempotency = "non_idempotent"

[[operations.params.body]]
name = "channel"
description = "Channel id (`C0123ABCDEF`) or name to post to. An id is preferred; a name resolves only for public channels"
required = true
schema = { type = "string", minLength = 1 }

# Slack requires one of `text`, `blocks` or `attachments`. This connector models only `text`, so
# `text` is required here — a `blocks` payload is a structured-body shape worth its own story rather
# than a free-form `Any` parameter a model would have to guess the schema of.
[[operations.params.body]]
name = "text"
description = "Message text, in Slack's mrkdwn syntax"
required = true
schema = { type = "string", minLength = 1 }

[[operations.params.body]]
name = "thread_ts"
description = "The `ts` of a parent message to reply to, threading the reply under it. Omit to post at channel level"
required = false
schema = { type = "string" }

# WHY THIS SCHEMA MODELS BOTH OUTCOMES IN ONE OBJECT.
#
# Every response shape in this file is taken from the "Example response" block of the method's own
# reference page — here `docs.slack.dev/reference/methods/chat.postMessage`, which documents the
# success body as `ok`/`channel`/`ts`/`message` and the failure body as `{"ok": false, "error": …}`.
# Both arrive with HTTP 200, which is the whole reason `ok` is the only required member: a schema
# describing the success case alone would tell a consumer that `ts` is there to read, and on a
# `channel_not_found` it simply is not. `error` is declared next to it rather than left to the error
# envelope because `ErrorEnvelope` says only *where* a message is, and has no way to say that the
# document it points into came back with a success status (C-126; the missing success predicate is
# recorded against `ErrorEnvelope` itself, not against this connector).
[operations.response_schema]
type = "object"
required = ["ok"]
properties = { ok = { type = "boolean", description = "False on failure, with HTTP still 200. Branch on this before reading anything else — it is the only member present in both outcomes" }, error = { type = "string", description = "Present only when `ok` is false: Slack's machine-readable failure code, such as `channel_not_found`, `not_in_channel` or `msg_too_long`" }, channel = { type = "string", description = "The channel the message landed in, always as an id (`C0123ABCDEF`) even when the request named it" }, ts = { type = "string", description = "The posted message's timestamp id, e.g. `1503435956.000247`. This is what addresses the message afterwards — `slack-reactions-add`'s `timestamp`, and `thread_ts` to reply under it" }, message = { type = "object", description = "The message as Slack stored it: `text`, `type`, `subtype`, `ts`, `bot_id`, `username`, and `attachments` when there are any" } }

[operations.quirks.error_envelope]
# See the header comment: this says *where* the error is, and cannot say that it arrives with a 200.
message_pointer = "/error"

# ---------------------------------------------------------------------------------------------

[[operations]]
id = "slack-conversations-history"
method = "POST"
direction = "write"
path = "/api/conversations.history"
description = "Read recent messages from a Slack channel, newest first. Slack answers HTTP 200 even on failure: check `ok` in the response body, where an error such as `channel_not_found` appears at `error`"
# Read-shaped, but conservatively authored `write`; see the review note in the header.
risk = "medium"
# The authored write direction refuses `idempotent` pending that same review.
idempotency = "non_idempotent"

[[operations.params.body]]
name = "channel"
description = "Channel id to read (`C0123ABCDEF`)"
required = true
schema = { type = "string", minLength = 1 }

# The bound that replaces pagination. `cursor` paging is deliberately absent because the quirk model
# can only express a cursor as a query parameter — see the header comment.
#
# `maximum = 999`, not 1000: the vendor's own wording is *"Maximum of 999"*, and its pagination note
# says *"To begin pagination, specify a `limit` value under `1000`"*
# (docs.slack.dev/reference/methods/conversations.history). An off-by-one here is not cosmetic — the
# schema is published verbatim to consumers in `web/public/catalog.json`, so a wrong bound is a wrong
# contract a model would try to satisfy.
[[operations.params.body]]
name = "limit"
description = "Maximum messages to return in one call, newest first. Slack's documented maximum is 999 and it advises far less"
required = false
schema = { type = "integer", minimum = 1, maximum = 999, default = 100 }

[[operations.params.body]]
name = "oldest"
description = "Only messages after this `ts`, e.g. `1728394857.123456`. Omit for no lower bound"
required = false
schema = { type = "string" }

[[operations.params.body]]
name = "latest"
description = "Only messages up to this `ts`. Omit for no upper bound"
required = false
schema = { type = "string" }

# `docs.slack.dev/reference/methods/conversations.history`, "Example response": `ok`, `messages`,
# `has_more`, `pin_count` and `response_metadata.next_cursor`. `messages` is declared as an array of
# objects rather than enumerated, because a Slack message is a union — a plain message, a
# `subtype`-carrying join/leave/bot message, or a thread parent — and the discriminating field set is
# per subtype. What a consumer cannot infer, and what is recorded here, is the *envelope*: that the
# messages are under `messages` and not at the top level, and that `next_cursor` is nested one level
# down.
[operations.response_schema]
type = "object"
required = ["ok"]
properties = { ok = { type = "boolean", description = "False on failure, with HTTP still 200. Branch on this first" }, error = { type = "string", description = "Present only when `ok` is false: `channel_not_found`, `not_in_channel` or `invalid_arguments`" }, messages = { type = "array", description = "The messages, newest first. Each carries at least `type`, `ts` and `text`; a user message also carries `user`, and a bot or system message carries a `subtype` instead", items = { type = "object" } }, has_more = { type = "boolean", description = "True when the channel holds older messages than this page returned. This connector cannot page — see the header comment on the missing cursor — so a true here means the caller is seeing a window, not the history" }, pin_count = { type = "integer" }, response_metadata = { type = "object", description = "Carries `next_cursor`, the cursor for the following page. It cannot be sent back by this connector (C-30)" } }

[operations.quirks.error_envelope]
message_pointer = "/error"

# ---------------------------------------------------------------------------------------------

[[operations]]
id = "slack-users-info"
method = "POST"
direction = "write"
path = "/api/users.info"
description = "Look up one Slack user by id — display name, real name, time zone and whether they are a bot. Slack answers HTTP 200 even on failure: check `ok` in the response body, where an error such as `user_not_found` appears at `error`"
# A read. `medium` for the same reason as above, not because looking up a user is risky.
risk = "medium"
idempotency = "non_idempotent"

[[operations.params.body]]
name = "user"
description = "User id to look up (`U0123ABCDEF`)"
required = true
schema = { type = "string", minLength = 1 }

[[operations.params.body]]
name = "include_locale"
description = "Also return the user's locale"
required = false
schema = { type = "boolean", default = false }

# `docs.slack.dev/reference/methods/users.info`, "Example response". `profile` is left as an object:
# it is where the display name, status and **email** live, and its member set varies with the
# workspace's own profile fields, so enumerating a subset would read as the whole of it.
#
# Said here because nothing else in this file can: `profile.email` is personal data, and it is
# returned only when the token carries `users:read.email`. `Risk` grades what a call *changes*, so it
# has no axis for what a read discloses — the same gap `providers/stripe.toml` records for its
# customer read.
[operations.response_schema]
type = "object"
required = ["ok"]
properties = { ok = { type = "boolean", description = "False on failure, with HTTP still 200. Branch on this first" }, error = { type = "string", description = "Present only when `ok` is false: typically `user_not_found`" }, user = { type = "object", description = "The user: `id`, `team_id`, `name`, `real_name`, `deleted`, `tz`, `tz_label`, `tz_offset`, `is_bot`, `is_admin`, `is_owner`, `updated`, and `profile` — which holds the display name, status and, with `users:read.email`, the email address" } }

[operations.quirks.error_envelope]
message_pointer = "/error"

# ---------------------------------------------------------------------------------------------

[[operations]]
id = "slack-reactions-add"
method = "POST"
direction = "write"
path = "/api/reactions.add"
description = "Add an emoji reaction to a message, visible to everyone in the channel. Slack answers HTTP 200 even on failure: check `ok` in the response body, where an error such as `already_reacted` appears at `error`"
# A visible write to a shared workspace, but a small and trivially reversible one — an emoji next to
# a message, attributable to the bot. `medium` rather than `high`; that it collides with the two
# conservatively authored read-shaped operations is the review state, not shared transport semantics.
risk = "medium"
# Repeating it does not add a second reaction — Slack answers `already_reacted` — but that is the
# vendor refusing the duplicate, not the call being idempotent; the authored write direction refuses
# `idempotent`.
idempotency = "non_idempotent"

[[operations.params.body]]
name = "channel"
description = "Channel id containing the message (`C0123ABCDEF`)"
required = true
schema = { type = "string", minLength = 1 }

[[operations.params.body]]
name = "timestamp"
description = "The `ts` of the message to react to, e.g. `1728394857.123456`"
required = true
schema = { type = "string", minLength = 1 }

# The bare emoji name, with no surrounding colons: Slack rejects `:thumbsup:` here.
[[operations.params.body]]
name = "name"
description = "Emoji name without colons, e.g. `thumbsup` or `white_check_mark`"
required = true
schema = { type = "string", minLength = 1 }

# `docs.slack.dev/reference/methods/reactions.add` documents the success body as exactly `{"ok":
# true}` — nothing identifies the reaction afterwards — and the failure body as the same `ok`/`error`
# pair, again with HTTP 200. So on this operation the response schema is not a convenience: it is the
# only way a consumer learns that `ok` is *all* there is to check, and that `already_reacted` arrives
# looking like a success.
[operations.response_schema]
type = "object"
required = ["ok"]
properties = { ok = { type = "boolean", description = "True when the reaction was added. There is no other member on success — Slack returns no id for a reaction" }, error = { type = "string", description = "Present only when `ok` is false, with HTTP still 200: `already_reacted`, `message_not_found`, `invalid_name`, `channel_not_found` or `thread_locked`" } }

[operations.quirks.error_envelope]
message_pointer = "/error"

# ---------------------------------------------------------------------------------------------
# Inbound — the events Slack sends us
#
# Names are Slack's own (`app_mention`, not `app-mention`). An event keeps its vendor name for the
# same reason an operation does: respelling it would be this repository renaming someone else's API,
# and the name is what an operator writes in `trigger on "…"`.
#
# Only the two message-shaped events are declared. Slack publishes ~80 event types, and the same
# selection principle that takes 4 of ~200 Web API methods applies here — an event nobody triggers on
# is a schema to maintain and a drift check to satisfy for nothing.
# ---------------------------------------------------------------------------------------------

[[events]]
name = "app_mention"
description = "Someone @-mentioned the app in a channel it is a member of"
group = "Messages"
# Slack's Events API wraps every event in an envelope: `{type: "event_callback", event: {…}}`. The
# schema below describes the inner `event` object, which is what the payload map addresses.
schema = { type = "object", properties = { type = { const = "app_mention" }, user = { type = "string" }, text = { type = "string" }, channel = { type = "string" }, ts = { type = "string" }, thread_ts = { type = "string" } }, required = [
  "type",
  "user",
  "text",
  "channel",
  "ts",
] }

[[events]]
name = "message"
description = "A message was posted in a channel the app is a member of. Fires for every human message, so a program that triggers on it should expect volume"
# Off by default, and this is the field that finally makes the volume warning above actionable rather
# than decorative: a product that defaulted this on would turn every connection into a firehose, and
# until now the only place that risk was recorded was the prose a model reads.
default = false
group = "Messages"
# `bot_id` and `subtype` are the loop guard: flux's Slack adapter drops any message carrying either,
# because replying to our own post would recurse. They are declared here so that the condition is
# visible in the schema rather than only in adapter code.
schema = { type = "object", properties = { type = { const = "message" }, subtype = { type = "string" }, bot_id = { type = "string" }, user = { type = "string" }, text = { type = "string" }, channel = { type = "string" }, ts = { type = "string" }, thread_ts = { type = "string" } }, required = [
  "type",
  "channel",
  "ts",
] }

# ---------------------------------------------------------------------------------------------
# Channel bindings — the two ways Slack delivers those events
#
# Slack offers both, and which one an operator runs is a deployment decision: Socket Mode needs no
# public URL and no signature, the Events API needs both. Declaring both is what makes "inbound is an
# abstraction over transports" a claim this file demonstrates rather than asserts — same two events,
# same payload map, same reply, two transports.
#
# SCHEMA GAP: the conversation fallback is not expressible. flux keys a session on `thread_ts` when
# present and on `channel` otherwise (`conversation_id` in its Slack adapter). A payload map binds one
# symbol to one path and has no `coalesce`, so `conversation` below names `event.thread_ts` and a
# channel-level message binds it to nothing. Adding a fallback spelling is a real gap; inventing one
# here without deciding it in the IR would be the homegrown DSL the north star forbids.
# ---------------------------------------------------------------------------------------------

[[channels]]
name = "socket"
transport = "socket"
description = "Socket Mode — flux opens an outbound WebSocket and Slack pushes events down it. No public URL, and no signature: the connection is authenticated by the app-level token that opened it"
events = ["app_mention", "message"]
# No `verification`: nothing arrives unsolicited over a socket we opened and authenticated.
discriminator = { source = "body", name = "event.type" }
delivery_id = { source = "body", name = "event_id" }

[channels.payload]
text = "event.text"
user = "event.user"
channel = "event.channel"
thread = "event.thread_ts"
conversation = "event.thread_ts"

[channels.reply]
operation = "slack-chat-post-message"
# `text` carries what the journey computed, which no path into the inbound event can reach. This one
# line is `flux-channels/src/adapters/slack.rs` joining its `JourneyRun` results and passing them to
# `with_text` — the hand-written half of that adapter, declared.
result = "text"

[channels.reply.bind]
channel = "channel"
thread_ts = "thread"

# ---------------------------------------------------------------------------------------------

[[channels]]
name = "events-api"
transport = "webhook"
description = "The Events API — Slack POSTs to an endpoint the operator exposes, signing each request. Use it when an outbound WebSocket is not an option; it needs a public URL and the signing secret"
events = ["app_mention", "message"]
discriminator = { source = "body", name = "event.type" }
# `event_id` is Slack's own delivery identifier and is stable across its retries, which is what makes
# it usable for dedupe. `X-Slack-Retry-Num` counts attempts and is deliberately not used here: it
# distinguishes the retries of one delivery rather than identifying the delivery.
delivery_id = { source = "body", name = "event_id" }

# The row this repository's verification matrix was derived from, in the vendor's own parameters
# (docs.slack.dev/authentication/verifying-requests-from-slack). Every value here is published by
# Slack; none of it is a convention this repository invented.
[channels.verification.hmac]
algorithm = "sha256"
encoding = "hex"
header = "X-Slack-Signature"
prefix = "v0="
# `v0` is Slack's signature-version marker, part of the signed string itself and not a separator.
signed = "v0:{timestamp}:{body}"
timestamp = { source = "header", name = "X-Slack-Request-Timestamp" }
secret = "slack.signing_secret"
# Slack documents five minutes, and states the reason plainly: a captured request older than that is
# assumed to be a replay.
tolerance = "5m"

[channels.payload]
text = "event.text"
user = "event.user"
channel = "event.channel"
thread = "event.thread_ts"
conversation = "event.thread_ts"

[channels.reply]
operation = "slack-chat-post-message"
result = "text"

[channels.reply.bind]
channel = "channel"
thread_ts = "thread"

# Slack publishes **no Web API method that registers an Events API endpoint** — there is no
# `events.subscribe`. Somebody opens the app configuration page and pastes a URL, and that work does
# not stop existing because nothing declared it; it just moves into a support article that goes stale.
# So this binding carries `[channels.setup]` rather than `[channels.subscription]`, and the loader
# requires one of the two: a product that knows a callback URL and nothing about what to do with it
# cannot finish an installation.
#
# The socket binding above needs none of this, which is the clearest statement of the tradeoff
# between the two transports that this file can make.
[channels.setup]
docs_url = "https://docs.slack.dev/apis/events-api/"
steps = [
  "Open your app at api.slack.com/apps, or create one for this workspace",
  "Under Event Subscriptions, turn on Enable Events",
  "Paste the Request URL shown above and wait for Slack's `url_verification` challenge to pass",
  "Under Subscribe to bot events, add the events you selected here",
  "Copy the Signing Secret from Basic Information into this connection's signing secret field",
  "Reinstall the app to the workspace so the new event scopes take effect",
]
