# GitHub REST API — five hand-authored public contracts plus four exact selections from GitHub's
# first-party OpenAPI document. The five existing operations stay inline because their ids and Flux
# bytes are already published; the document is upstream evidence for the new collection reads, not
# permission to expose its 1,216 operations. Each addition is therefore one `[[patch.operations]]`
# block and `patch.select` remains empty.
#
# ---------------------------------------------------------------------------------------------
# `Accept: application/vnd.github+json` is declared below, in `[const_headers]`.
#
# This was a SCHEMA GAP until C-55: no field could express a constant, non-credential request
# header, so the requirement survived only as a comment. Pinning a `params.header` with a JSON
# Schema `const` — the trick that works for a constant *body* field, as `ticket.safe_update` does in
# `providers/zendesk.toml` — did not work here: the emitter filtered `constant(...)` out of the
# declared parameter list for body params only, so a `const`-pinned header stayed a caller-supplied
# argument with the constraint silently dropped. C-55 refuses that spelling outright and adds
# `const_headers` as the honest one.
#
# What this buys is an explicit media type, not dated API-version pinning. GitHub serves requests
# with no `Accept` header by defaulting to this value, so the operations below were well-formed
# without it; the explicit header protects the representation contract if that default changes.
# The generated module currently sends no `X-GitHub-Api-Version`; C-477 owns the compatibility
# decision because adding it would intentionally move already-published request bytes.
#
# `content-type: application/json` remains hard-coded in the emitter and is still not declarable;
# C-144 tracks the related gap that no connector can send a non-JSON body at all.
# ---------------------------------------------------------------------------------------------

id = "github"
vendor = "GitHub"

# The reverse-DNS authority this connector publishes under (C-92). It leads every rendered address
# and every credential path — `tenants/<tenant>/com.github.api/<credential>` — and until it was
# declared `Credentials::reference` refused with `NoCredentialAddress`, so this connector could not
# authenticate at all.
#
# Derived from `github.com`, the vendor's own primary domain, in reverse-DNS form, with the trailing
# `api` label the already-shipped authorities carry (`com.slack.api`, `com.vercel.api`,
# `io.fly.api`).
#
# **Never repointed once published** (`AGENTS.md`: "an address, once published, is not reused"). A
# different spelling mints a new address and deprecates this one, because tenants provision secrets
# under this path.
authority = "com.github.api"

# **No `api_version`: this vendor puts no version segment in the URL at all.** Every operation path
# below is unversioned (`/repos/{owner}/{repo}`) — GitHub versions its REST API by the `X-GitHub-
# Api-Version` header and by `Accept` media type, neither of which is a path segment, so there is
# nothing the file itself spells and nothing to record without asserting a vendor fact from outside
# it. A `pid` and a credential path render without one; only a `gid` needs both halves.

# One tenant-independent host, so no templating and no endpoint override: `api.github.com` serves
# every user and organisation. (GitHub Enterprise Server lives at a customer host under a `/api/v3`
# prefix, which is a different connector rather than an override of this one — the paths differ, not
# just the authority.) `http_hosts` derives from this single value and is therefore exactly
# `api.github.com`, never widened.
base_url = "https://api.github.com"

# C-55: the vendor-constant header, emitted as a literal rather than a caller-supplied argument.
# An inline table deliberately — a `[const_headers]` section header would scope every provider
# scalar after it into that table.
const_headers = { "Accept" = "application/vnd.github+json" }

description = "GitHub REST API: read repositories, commits, issues, pull requests and Actions workflow runs, and write issues and issue comments"

# One credential covers the whole selection. GitHub Apps' installation tokens, fine-grained personal
# access tokens and classic PATs all present identically as `Authorization: Bearer <token>`, so the
# token *type* is operator configuration rather than connector shape; what differs between them is
# which scopes the token carries, which is not something this file can or should assert.
default_auth = [{ credentials = ["github.token"] }]

# ---------------------------------------------------------------------------------------------
# First-party REST OpenAPI — pinned, scrubbed and provenanced by C-469.
#
# The source bytes are GitHub's commit-pinned `api.github.com.2022-11-28.json`. The vendor script
# removes every `example`/`examples` value, so a future credential, personal address or telephone
# example is scrubbed by default while paths, schemas and GitHub's MIT license declaration remain.
# The complete upstream and vendored hashes live in `specs/github.provenance.toml`; this pointer
# carries the hash of the exact bytes the offline build ingests.
# ---------------------------------------------------------------------------------------------

[spec]
path = "specs/github/api.github.com.2022-11-28-2026-08-02.openapi.json"
source_url = "https://raw.githubusercontent.com/github/rest-api-description/5e28810649ba41b5483753ba74f976f83856a504/descriptions/api.github.com/api.github.com.2022-11-28.json"
upstream_version = "1.1.4"
fetched_at = "2026-08-02T00:00:00Z"
sha256 = "a7a3293268f062d09eb576806f0e5af271c039b9427f9852c8280c8fecc692e7"

# Only integer pagination is caller-visible. Query values are not percent-encoded yet, so every
# string, array and boolean filter is explicitly omitted and an upstream rename fails closed.
[[patch.operations]]
select = "issues/list-for-repo"
direction = "read"
rename = "github-issue-list"
description = "List a repository's issues and pull requests with bounded integer pagination"
risk = "low"
idempotency = "idempotent"
omit.query = [
  "milestone",
  "state",
  "assignee",
  "type",
  "creator",
  "mentioned",
  "issue_field_values",
  "labels",
  "sort",
  "direction",
  "since",
]

[[patch.operations]]
select = "pulls/list-files"
direction = "read"
rename = "github-pull-files-list"
description = "List the files changed by one pull request with bounded integer pagination"
risk = "low"
idempotency = "idempotent"

[[patch.operations]]
select = "actions/list-workflow-runs-for-repo"
direction = "read"
rename = "github-workflow-run-list"
description = "List a repository's GitHub Actions workflow runs with bounded integer pagination"
risk = "low"
idempotency = "idempotent"
omit.query = [
  "actor",
  "branch",
  "event",
  "status",
  "created",
  "exclude_pull_requests",
  "check_suite_id",
  "head_sha",
]

[[patch.operations]]
select = "repos/list-commits"
direction = "read"
rename = "github-commit-list"
description = "List commits in a repository with bounded integer pagination"
risk = "low"
idempotency = "idempotent"
omit.query = ["sha", "path", "author", "committer", "since", "until"]

# ---------------------------------------------------------------------------------------------
# Credentials
# ---------------------------------------------------------------------------------------------

[[auth]]
name = "github.token"
scheme = "bearer"
# The sole secret. Gated and registered with flux's redactor by the host; never read here.
env = ["GITHUB_TOKEN"]
description = "GitHub token sent as a bearer — a GitHub App installation token, a fine-grained PAT, or a classic PAT"

# ---------------------------------------------------------------------------------------------
# Operations — 9: five established calls plus four spec-backed collection reads
#
# WHY THERE IS NO CALLER-SUPPLIED STRING QUERY. Nothing in this pipeline percent-encodes a query
# value: the emitter interpolates it verbatim into a `fmt` template and flux registers no
# URL-encoding op (C-30 is unimplemented; `crates/connector-flux/src/op.rs`).
# `zendesk-ticket-search` is the standing demonstration and AGENTS.md lists it under *Intentional
# gaps* — a value carrying `&` does not filter, it injects a parameter. The new repository-scoped
# issue list therefore omits `state`, `labels`, `assignee` and every other string filter while
# retaining only integer `per_page` and `page`. Pull-request collections and every search endpoint
# remain excluded pending C-30.
#
# The path surface, by contrast, is genuinely safe rather than merely untested: `{owner}` and
# `{repo}` are GitHub names restricted to `[A-Za-z0-9._-]`, and `{issue_number}` / `{pull_number}`
# are integers. None of those can carry a character that changes the shape of the request. That
# asymmetry is the whole selection principle for this connector.
#
# `crates/connector-flux/tests/github_connector.rs` asserts those omissions on both the IR and the
# emitted URL, so this stays a property of the connector rather than of this comment.
#
# Op ids are hyphen-separated, not dotted: flux-lang's `is_valid_decl_name` admits ASCII
# alphanumerics, `_` and `-` only (C-8, C-23).
# ---------------------------------------------------------------------------------------------

[[services]]
# C-153. `default` is the reserved implicit service, and a provider with one API surface
# declares no services at all — so this entry exists for exactly one reason: a tag attaches
# to a service, and there is no other service here to attach it to. It carries `tags` and
# nothing else, which is what keeps `default` implicit and this file emitting the same
# `github.flux` it emitted before.
name = "default"
tags = ["source-control", "issue-tracking"]

[[operations]]
id = "github-repo-get"
method = "GET"
direction = "read"
path = "/repos/{owner}/{repo}"
description = "Get one repository's metadata, including its default branch, visibility and permissions"
risk = "low"
idempotency = "idempotent"

[[operations.params.path]]
name = "owner"
description = "The repository owner — a user or organisation login"
required = true
schema = { type = "string", minLength = 1 }

[[operations.params.path]]
name = "repo"
description = "The repository name, without the owner prefix"
required = true
schema = { type = "string", minLength = 1 }

# ---------------------------------------------------------------------------------------------
# RESPONSE SHAPES (C-126) — from GitHub's own REST reference, per endpoint:
#
#   docs.github.com/en/rest/repos/repos#get-a-repository
#   docs.github.com/en/rest/issues/issues#get-an-issue
#   docs.github.com/en/rest/issues/issues#create-an-issue
#   docs.github.com/en/rest/pulls/pulls#get-a-pull-request
#   docs.github.com/en/rest/issues/comments#create-an-issue-comment
#
# Every field declared below is in the schema those pages publish (`full-repository`, `issue`,
# `pull-request`, `issue-comment`). Three deliberate omissions, because each one would be an
# invention:
#
# - **`assignee`, singular.** The live API returns it and the *webhook* payload schema documents it,
#   but the REST issue schema on the page above does not, so only the documented `assignees` array is
#   declared. This is the smallest and most tempting guess in the file, and it is the one to refuse.
# - **A closed enum on `visibility`.** The page documents `public` and `private` only, while an
#   enterprise repository is `internal`. A closed enum built from an incomplete list would reject a
#   real value, so the member is typed `string` and the values live in its description.
# - **Nullability of `pushed_at` and `merge_commit_sha`.** Not stated on either page. Left unstated
#   here rather than asserted in either direction.
#
# GitHub returns very large objects — a repository has upwards of a hundred members — so what is
# enumerated is the identity, the state and the fields a flow branches on. A JSON Schema `properties`
# map does not claim to be exhaustive, and none of these declares `additionalProperties: false`.
# ---------------------------------------------------------------------------------------------

# The repository. `default_branch` and `permissions` are what a flow actually needs before it acts:
# the first is where a change would land, and the second is whether this token could make one at all —
# a token with `pull` only reads, and finding that out from `permissions.push` is cheaper than finding
# it out from a 403 on a write.
[operations.response_schema]
type = "object"
required = ["id", "name", "full_name", "private", "owner"]
properties = { id = { type = "integer", description = "The repository's global id, stable across renames" }, node_id = { type = "string" }, name = { type = "string" }, full_name = { type = "string", description = "`owner/repo`, which is how every other operation here addresses it" }, private = { type = "boolean" }, visibility = { type = "string", description = "`public` or `private` per the reference; an enterprise repository can also be `internal`, so this is deliberately not a closed enum" }, owner = { type = "object", description = "The owning user or organisation: `login`, `id`, `type` (`User` or `Organization`), `avatar_url`, `html_url`" }, html_url = { type = "string", format = "uri" }, description = { type = "string", description = "Null when the repository has none" }, fork = { type = "boolean" }, archived = { type = "boolean", description = "An archived repository is read-only — a write against it fails, so check this before `github-issue-create`" }, disabled = { type = "boolean" }, default_branch = { type = "string" }, language = { type = "string", description = "The dominant language, or null" }, open_issues_count = { type = "integer", description = "Open issues **and** open pull requests, since GitHub counts a PR as an issue" }, stargazers_count = { type = "integer" }, pushed_at = { type = "string", format = "date-time" }, permissions = { type = "object", description = "What the authenticated token can do here: `admin`, `push` and `pull` are always present, `maintain` and `triage` only sometimes. Absent entirely for an unauthenticated read" } }

# ---------------------------------------------------------------------------------------------

[[operations]]
id = "github-issue-get"
method = "GET"
direction = "read"
path = "/repos/{owner}/{repo}/issues/{issue_number}"
# Worth stating on the contract a model reads: GitHub models a pull request as an issue, so this
# endpoint answers for a PR number too, returning the issue view of it (with a `pull_request` key).
# It is not an error and not a redirect — `github-pull-get` is the endpoint that returns the diff,
# merge state and review metadata.
description = "Get one issue by number. GitHub treats a pull request as an issue, so a PR number returns that PR's issue view; use github-pull-get for its merge and review state"
risk = "low"
idempotency = "idempotent"

[[operations.params.path]]
name = "owner"
description = "The repository owner — a user or organisation login"
required = true
schema = { type = "string", minLength = 1 }

[[operations.params.path]]
name = "repo"
description = "The repository name, without the owner prefix"
required = true
schema = { type = "string", minLength = 1 }

[[operations.params.path]]
name = "issue_number"
description = "The issue number within the repository — the number in its URL, not its global id"
required = true
schema = { type = "integer", format = "uint64", minimum = 1 }

# `pull_request` IS THE MEMBER THAT MATTERS HERE, and GitHub documents it in those terms: "'Issues'
# endpoints may return both issues and pull requests in the response. You can identify pull requests
# by the `pull_request` key. Be aware that the id of a pull request returned from 'Issues' endpoints
# will be an issue id."
#
# So the response is a **discriminated** shape and the discriminator is the *presence* of an optional
# member — which is exactly the fact this operation's `description` states in prose and which nothing
# machine-readable said until now. A flow that treats every answer as an issue will treat a PR as one
# too, and will do it while holding an `id` that addresses neither the PR resource nor anything else
# useful.
#
# `state` plus `state_reason` is the other pair worth having: `closed` alone does not say whether the
# issue was fixed or dismissed, and `not_planned` versus `completed` is the difference.
[operations.response_schema]
type = "object"
required = ["id", "number", "state", "title", "labels"]
properties = { id = { type = "integer", description = "The issue's global id. For a pull request read through this endpoint it is an **issue** id and does not address the PR resource" }, node_id = { type = "string" }, number = { type = "integer", description = "The per-repository number — what this operation's `issue_number` takes" }, state = { type = "string", description = "`open` or `closed`" }, state_reason = { type = "string", description = "Why it closed: `completed`, `not_planned`, `duplicate` or `reopened`. Null on an open issue, and the difference between a fixed issue and a dismissed one" }, title = { type = "string" }, body = { type = "string", description = "The issue body as Markdown; null when the author wrote none" }, user = { type = "object", description = "Who opened it: `login`, `id`, `type`" }, labels = { type = "array", description = "The applied labels, each `{id, name, color, description}`", items = { type = "object" } }, assignees = { type = "array", description = "Everyone assigned. The reference's issue schema documents this array and does **not** document a singular `assignee`, so none is declared here even though the API returns one", items = { type = "object" } }, milestone = { type = "object", description = "The milestone, or null" }, comments = { type = "integer", description = "How many comments it has — a count, not the comments" }, locked = { type = "boolean" }, draft = { type = "boolean" }, html_url = { type = "string", format = "uri" }, created_at = { type = "string", format = "date-time" }, updated_at = { type = "string", format = "date-time" }, closed_at = { type = "string", format = "date-time", description = "Null while open" }, pull_request = { type = "object", description = "PRESENT ONLY IF THIS IS A PULL REQUEST — `{url, html_url, diff_url, patch_url, merged_at}`. Its presence is how GitHub says the answer is a PR; read its merge and review state with `github-pull-get`, and note that `merged_at` here is null for an open or closed-unmerged PR" } }

# ---------------------------------------------------------------------------------------------

[[operations]]
id = "github-pull-get"
method = "GET"
direction = "read"
path = "/repos/{owner}/{repo}/pulls/{pull_number}"
description = "Get one pull request by number, with its merge state, head and base refs and review counts"
risk = "low"
idempotency = "idempotent"

[[operations.params.path]]
name = "owner"
description = "The repository owner — a user or organisation login"
required = true
schema = { type = "string", minLength = 1 }

[[operations.params.path]]
name = "repo"
description = "The repository name, without the owner prefix"
required = true
schema = { type = "string", minLength = 1 }

[[operations.params.path]]
name = "pull_number"
description = "The pull request number within the repository"
required = true
schema = { type = "integer", format = "uint64", minimum = 1 }

# `mergeable` IS THREE-VALUED, and the reference says why: "If the value is null, then GitHub has
# started a background job to compute the mergeability. After giving the job time to complete,
# resubmit the request."
#
# That is the single most consequential fact in this file for a flow author. `null` is not "no": a
# gate written as `mergeable == false → refuse` and `else → merge` sends the *unknown* case down the
# merge path on the first read of any recently pushed PR, because the first read is the one that
# triggers the computation. Publishing the member as a plain boolean would hide that; publishing it
# with this description is the whole value of the schema.
#
# `merged` is the one to branch on for "did this land" — it is a settled boolean, unlike `mergeable`,
# and unlike `state`, which reads `closed` whether a PR was merged or abandoned.
[operations.response_schema]
type = "object"
required = ["id", "number", "state", "title"]
properties = { id = { type = "integer", description = "The pull request's own id — distinct from the issue id `github-issue-get` returns for the same number" }, number = { type = "integer" }, state = { type = "string", description = "`open` or `closed`. A merged PR is `closed`, so this cannot distinguish merged from abandoned — read `merged`" }, title = { type = "string" }, body = { type = "string", description = "The description as Markdown, or null" }, draft = { type = "boolean" }, merged = { type = "boolean", description = "Whether it landed. This is the settled answer; `mergeable` below is about whether it *could*" }, mergeable = { type = "boolean", description = "THREE-VALUED: true, false, or **null meaning not yet computed** — GitHub starts a background job on first read and the reference says to resubmit the request. Treat null as unknown, never as false" }, mergeable_state = { type = "string", description = "GitHub's word for the merge situation, e.g. `clean`, `dirty`, `blocked`, `behind`, `unknown`" }, merged_at = { type = "string", format = "date-time", description = "When it merged, or null" }, merge_commit_sha = { type = "string", description = "The resulting commit once merged. Its nullability before a merge is not documented, so nothing is asserted here" }, head = { type = "object", description = "The source of the change: `{ref, sha, label, repo}` — `repo` is a different repository for a fork PR" }, base = { type = "object", description = "Where it would land: `{ref, sha, label, repo}`" }, additions = { type = "integer" }, deletions = { type = "integer" }, changed_files = { type = "integer" }, commits = { type = "integer" }, review_comments = { type = "integer", description = "Line-level review comments. Conversation comments are counted separately and are what `github-issue-comment-add` writes" }, user = { type = "object", description = "Who opened it" }, html_url = { type = "string", format = "uri" } }

# ---------------------------------------------------------------------------------------------
# The two writes. **Both publish to a surface the world can read**, and their `risk` says so.
#
# `risk = "high"` — "writes a reviewer would want to see first" — rather than the `medium` the
# zendesk writes carry, and the difference is not cosmetic. A zendesk comment defaults to an
# internal note (`public = false`); a GitHub issue or comment is visible to anyone who can see the
# repository the moment it is created, is attributed to whoever owns the token, and immediately
# emails and notifies every subscriber and every account it mentions. Deleting it afterwards does
# not unsend that. On a public repository the audience is everyone. flux's approval gate reads this
# field, so `medium` here would mean an agent posting publicly under a maintainer's name without a
# human seeing it first; `high` is the honest setting and the fail-safe direction.
#
# `idempotency = "non_idempotent"` because it is the truth and because a retry around either of
# these would otherwise be sound-looking and wrong: replaying a create makes a second issue, not the
# same one. GitHub offers no idempotency key on these endpoints, so `conditional` would be a claim
# with nothing behind it. (The emitter also refuses an authored write that declares itself
# `idempotent` or `risk = "low"` — `check_write_metadata`.)
# ---------------------------------------------------------------------------------------------

[[operations]]
id = "github-issue-create"
method = "POST"
direction = "write"
path = "/repos/{owner}/{repo}/issues"
description = "Open a new issue on a repository. The issue is immediately visible to everyone who can see the repository and notifies its subscribers"
risk = "high"
idempotency = "non_idempotent"

[[operations.params.path]]
name = "owner"
description = "The repository owner — a user or organisation login"
required = true
schema = { type = "string", minLength = 1 }

[[operations.params.path]]
name = "repo"
description = "The repository name, without the owner prefix"
required = true
schema = { type = "string", minLength = 1 }

# The body is flat — GitHub takes these at the root of the JSON object — so no `wire` path is needed
# on any of them. Contrast zendesk, whose every write field declares one.
[[operations.params.body]]
name = "title"
description = "The issue title; the only required field"
required = true
schema = { type = "string", minLength = 1 }

[[operations.params.body]]
name = "body"
description = "The issue body as GitHub-flavoured Markdown"
required = false
schema = { type = "string" }

# GitHub accepts `labels` as either an array of names or an array of objects, and `assignees` as an
# array of logins. Only the array-of-names form is declared: it is the one a caller means, and a
# `oneOf` would land on Flux's `Any` (`crates/connector-flux/src/types.rs`), which would type the
# parameter as "anything at all" in the op signature for no gain. A label that does not exist on the
# repository is created by this call rather than rejected.
[[operations.params.body]]
name = "labels"
description = "Label names to apply; a name the repository does not have yet is created"
required = false
schema = { type = "array", items = { type = "string", minLength = 1 } }

[[operations.params.body]]
name = "assignees"
description = "User logins to assign; GitHub silently drops any login without push access to the repository"
required = false
schema = { type = "array", items = { type = "string", minLength = 1 } }

# `201 Created`, and the body is the same issue object `github-issue-get` returns. Two members carry
# the weight: `number`, which is how everything afterwards addresses the issue — including this
# connector's own `github-issue-comment-add` — and `html_url`, which is the link a human is given.
#
# `assignees` is also the confirmation of a silent failure documented on the parameter above: GitHub
# drops a login without push access rather than refusing the call, so an issue created "assigned to
# someone" can arrive assigned to nobody, with HTTP 201 and no error. Reading it back is the only way
# to know.
[operations.response_schema]
type = "object"
required = ["id", "number", "state", "title"]
properties = { id = { type = "integer", description = "The new issue's global id" }, node_id = { type = "string" }, number = { type = "integer", description = "The per-repository number to address it by afterwards" }, state = { type = "string", description = "`open` on a freshly created issue" }, title = { type = "string" }, body = { type = "string" }, user = { type = "object", description = "The account the token belongs to — a created issue is attributed to it, not to whoever asked for it" }, labels = { type = "array", description = "The labels that were applied. A name the repository did not have is created by this call and appears here", items = { type = "object" } }, assignees = { type = "array", description = "Who was actually assigned. GitHub silently drops a login without push access, so compare this against what was requested rather than assuming it took", items = { type = "object" } }, comments = { type = "integer" }, html_url = { type = "string", format = "uri", description = "The issue's page — the link to give a human" }, created_at = { type = "string", format = "date-time" }, updated_at = { type = "string", format = "date-time" } }

# ---------------------------------------------------------------------------------------------

[[operations]]
id = "github-issue-comment-add"
method = "POST"
direction = "write"
path = "/repos/{owner}/{repo}/issues/{issue_number}/comments"
# The same endpoint comments on a pull request, for the same reason `github-issue-get` reads one:
# GitHub's issue and PR numbering is one sequence and PR conversation comments *are* issue comments.
# A review comment on a specific line is a different endpoint and is not in this selection.
description = "Add a comment to an issue or pull request. The comment is public to everyone who can see the repository and notifies its participants; GitHub has no private or internal comment here"
risk = "high"
idempotency = "non_idempotent"

[[operations.params.path]]
name = "owner"
description = "The repository owner — a user or organisation login"
required = true
schema = { type = "string", minLength = 1 }

[[operations.params.path]]
name = "repo"
description = "The repository name, without the owner prefix"
required = true
schema = { type = "string", minLength = 1 }

[[operations.params.path]]
name = "issue_number"
description = "The issue or pull request number to comment on"
required = true
schema = { type = "integer", format = "uint64", minimum = 1 }

# No `public` flag and no default to get wrong: unlike zendesk's comment-add, which defaults to an
# internal note, GitHub has no non-public comment on this endpoint. The description says so because
# a model that assumed a zendesk-like default would be assuming a privacy setting that does not
# exist.
[[operations.params.body]]
name = "body"
description = "The comment text as GitHub-flavoured Markdown; must not be blank"
required = true
schema = { type = "string", minLength = 1 }

# `201 Created`, and the body is the issue-comment object. `html_url` is the deep link to the comment
# itself rather than to the issue, which is what a flow reports back after posting; `issue_url` is the
# API URL of what was commented on, and it is the only member that names the target.
#
# `author_association` is included because it is the one thing here a reviewer of an automated comment
# wants: `OWNER`, `MEMBER`, `COLLABORATOR`, `CONTRIBUTOR` or `NONE` says what standing the token's
# account has in this repository, which is what makes a bot comment read as authoritative or not.
[operations.response_schema]
type = "object"
required = ["id", "body"]
properties = { id = { type = "integer", description = "The comment's own id — not the issue's" }, node_id = { type = "string" }, body = { type = "string", description = "The comment as posted" }, user = { type = "object", description = "The commenting account, which is whoever the token belongs to" }, author_association = { type = "string", description = "The commenter's standing in the repository: `OWNER`, `MEMBER`, `COLLABORATOR`, `CONTRIBUTOR`, `NONE` and so on" }, html_url = { type = "string", format = "uri", description = "Link to this comment, anchored — not to the issue" }, issue_url = { type = "string", format = "uri", description = "API URL of the issue or pull request that was commented on" }, url = { type = "string", format = "uri" }, created_at = { type = "string", format = "date-time" }, updated_at = { type = "string", format = "date-time" }, reactions = { type = "object", description = "Reaction rollup counts, all zero on a new comment" } }
