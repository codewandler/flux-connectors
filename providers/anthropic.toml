# is no path-shaped route to a user by address. Recorded rather than worked around.

# Every field naming or contacting a person carries the sentence, including `id` — see the header
# comment's PERSONAL DATA section for why the id is on that list.
[operations.response_schema]
type = "object"
required = ["data"]
properties = { data = { type = "array", description = "One entry per member of the organization", items = { type = "object", required = ["id", "type"], properties = { id = { type = "string", description = "The member's stable user id, and what anthropic-organization-member-get and anthropic-workspace-member-get address them by. Identifies a named person — read it for what the calling flow needs and do not persist it beyond that" }, name = { type = "string", description = "The member's name as Anthropic holds it. Identifies a named person — read it for what the calling flow needs and do not persist it beyond that" }, email = { type = "string", description = "The member's email address. Identifies a named person — read it for what the calling flow needs and do not persist it beyond that" }, role = { type = "string", description = "The member's organization role — one of admin, billing, claude_code_user, developer, managed, membership_admin, owner, primary_owner, user. An open set in practice: Anthropic has added to it and this connector does not constrain the value" }, added_at = { type = "string", format = "date-time", description = "When the member joined the organization" }, type = { const = "user" } } } }, first_id = { type = "string", description = "First id in `data`. This connector cannot use it as `before_id` — no query parameter is encodable (C-30)" }, last_id = { type = "string", description = "Last id in `data`, likewise unusable as `after_id` here" }, has_more = { type = "boolean", description = "True when the organization has more members than this unpaginated call returned" } }

[operations.quirks.error_envelope]
