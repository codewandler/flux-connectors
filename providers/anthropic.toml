[[operations]]
id = "anthropic-workspace-get"
service = "admin"
method = "GET"
path = "/v1/organizations/workspaces/{workspace_id}"
description = "Retrieve one workspace by id, including its name, creation date, whether it is archived, and its data-residency configuration. Unlike anthropic-workspaces-list this reaches an archived workspace, since the id is given rather than filtered for"
risk = "low"
idempotency = "idempotent"
auth = [{ credentials = ["anthropic.admin_key"] }]

# Safe to interpolate for the reason the header comment records: a workspace id is a vendor-minted
# opaque handle of the form `wrkspc_01JwQvzr7…`, drawn from `[A-Za-z0-9_]`.
[[operations.params.path]]
name = "workspace_id"
description = "The workspace id, as returned in `id` by anthropic-workspaces-list"
required = true
schema = { type = "string", minLength = 1 }

# No personal data here — a workspace is a container, not a person. `external_key_id` names a
# customer-managed encryption key *configuration*; it is an identifier and never key material, so it
# is no more a secret than `partial_key_hint` on anthropic-api-keys-list is.
[operations.response_schema]
type = "object"
required = ["id", "type"]
properties = { id = { type = "string", description = "The workspace id, echoed back" }, name = { type = "string" }, type = { const = "workspace" }, created_at = { type = "string", format = "date-time" }, archived_at = { type = "string", format = "date-time", description = "When the workspace was archived, or null if it is not archived" }, display_color = { type = "string", description = "The hex colour the Anthropic Console shows this workspace in" }, data_residency = { type = "object", description = "Where this workspace's data is stored and which inference geos it permits", properties = { workspace_geo = { type = "string", description = "The region this workspace's data is stored in. Immutable after creation" }, default_inference_geo = { type = "string", description = "The inference geo applied when a request names none" }, allowed_inference_geos = { description = "The permitted inference geos: either an array of geo names or the string `unrestricted`. Left untyped rather than given a type, because the vendor documents it as either shape and this file states only what it can name with confidence" } } }, tags = { type = "object", description = "User-defined string key-value tags on the workspace. Keys may not begin with `anthropic`. Left otherwise untyped — the keys are the operator's own" }, compartment_id = { type = "string", description = "This workspace's encryption-compartment identifier, referenced in a customer-managed KMS key policy on AWS. An identifier, never key material" }, external_key_id = { type = "string", description = "The customer-managed encryption key configuration attached to this workspace, when one is. An identifier, never key material" } }

[operations.quirks.error_envelope]
message_pointer = "/error/message"
code_pointer = "/error/type"

