[[operations]]
id = "anthropic-invites-list"
service = "admin"
method = "GET"
direction = "read"
path = "/v1/organizations/invites"
description = "List the organization's invites, with the email address invited, the role offered, and whether the invite is still pending. Returns personal data — an email address for a real person. Unpaginated and unfiltered by status, so a `pending` invite must be selected from the returned entries rather than asked for"
risk = "low"
idempotency = "idempotent"
auth = [
    { credentials = ["anthropic.admin_key"] },
    { credentials = ["anthropic.console_oauth_admin"] },
]
# No parameters. The vendor declares three optional query filters — `after_id`, `before_id` and
# `limit` — all excluded; see the header comment. There is no `status` filter to lose: the vendor
# publishes none, which is why the description tells a caller to filter `status` themselves.

# `email` is the field that reaches a person here. An invite `id` addresses the invitation rather
# than the invitee, so it does not carry the sentence — see the header comment's PERSONAL DATA
# section for where that line is drawn.
[operations.response_schema]
type = "object"
required = ["data"]
properties = { data = { type = "array", description = "One entry per invite, in whatever status the vendor holds it", items = { type = "object", required = ["id", "type", "status"], properties = { id = { type = "string", description = "The invite's own id — an identifier for the invitation, not for the person" }, type = { const = "invite" }, email = { type = "string", description = "The email address the invitation was sent to. Identifies a named person — read it for what the calling flow needs and do not persist it beyond that" }, role = { type = "string", description = "The organization role the invitee is offered — one of admin, billing, claude_code_user, developer, managed, membership_admin, owner, primary_owner, user" }, status = { type = "string", description = "One of accepted, deleted, expired, pending. This call cannot filter on it" }, invited_at = { type = "string", format = "date-time", description = "When the invite was created" }, expires_at = { type = "string", format = "date-time", description = "When the invite expires" }, accepted_at = { type = "string", format = "date-time", description = "When the invite was accepted, or null if it has not been" }, rbac_group_ids = { type = "array", items = { type = "string" }, description = "RBAC group ids to assign on acceptance, `[]` when none. A Claude Enterprise beta field; present but empty on organizations not using it" } } } }, first_id = { type = "string", description = "First id in `data`. This connector cannot use it as `before_id` — no query parameter is encodable (C-30)" }, last_id = { type = "string", description = "Last id in `data`, likewise unusable as `after_id` here" }, has_more = { type = "boolean", description = "True when the organization has more invites than this unpaginated call returned" } }

[operations.quirks.error_envelope]
message_pointer = "/error/message"
code_pointer = "/error/type"
