[[operations]]
id = "anthropic-api-keys-list"
service = "admin"
method = "GET"
direction = "read"
path = "/v1/organizations/api_keys"
description = "List the organization's API keys, with each key's name, status and a redacted hint — never the key itself. Unpaginated and unfiltered"
risk = "low"
idempotency = "idempotent"
auth = [
    { credentials = ["anthropic.admin_key"] },
    { credentials = ["anthropic.console_oauth_admin"] },
]
# No parameters. The vendor declares six optional query filters — `after_id`, `before_id`, `limit`,
# `status`, `workspace_id`, `created_by_user_id` — all excluded; see the header comment.

# `partial_key_hint` is Anthropic's own redacted display value, not a secret — it is exactly what
# this connector must never treat as one. No key material of any shape appears in this schema.
[operations.response_schema]
type = "object"
required = ["data"]
properties = { data = { type = "array", description = "One entry per API key: `id`, `name`, `status` (`active`, `inactive`, `archived` or `expired`), `type: \"api_key\"`, `created_at`, `expires_at` (absent for a key that never expires), `partial_key_hint` (a partially redacted display string, safe to show in a UI — never the key), `workspace_id` (absent for a key on the default workspace), and `created_by`/`principal` objects each `{id, type}`", items = { type = "object", required = ["id", "type", "status"], properties = { id = { type = "string" }, name = { type = "string" }, type = { const = "api_key" }, status = { type = "string", description = "One of active, inactive, archived, expired" }, created_at = { type = "string", format = "date-time" } } } }, first_id = { type = "string", description = "First id in `data`. This connector cannot use it as `before_id` — no query parameter is encodable (C-30)" }, last_id = { type = "string", description = "Last id in `data`, likewise unusable as `after_id` here" }, has_more = { type = "boolean" } }

[operations.quirks.error_envelope]
message_pointer = "/error/message"
code_pointer = "/error/type"

