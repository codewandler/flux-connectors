[[operations]]
id = "google-calendar-event-get"
service = "calendar"
method = "GET"
direction = "read"
path = "/calendar/v3/calendars/{calendarId}/events/{eventId}"
description = "Get one calendar event: its summary, start and end, organizer, attendee list and status. Needs the `calendar.events.readonly` scope (or `calendar.readonly`)"
risk = "low"
idempotency = "idempotent"

[[operations.params.path]]
name = "calendar_id"
wire = "calendarId"
description = "The calendar the event is on: the literal `primary` for the token owner's own calendar, or a calendar address such as `team@group.calendar.google.com`"
required = true
schema = { type = "string", pattern = "^(primary|[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,})$", minLength = 3 }

[[operations.params.path]]
name = "event_id"
description = "The event's id, as Calendar's own listings report it. A recurring event's single instance carries a `_`-suffixed id (`abc123_20260130T090000Z`)"
wire = "eventId"
required = true
schema = { type = "string", pattern = "^[A-Za-z0-9_-]+$", minLength = 1 }

# The Event resource, no envelope.
#
# **`start` and `end` are objects, and which member they carry is the discriminator between a timed
# event and an all-day one**: `dateTime` (RFC 3339) for a timed event, `date` (`yyyy-mm-dd`) for an
# all-day event, never both. A consumer reading `start.dateTime` unconditionally gets nothing for every
# all-day event in the calendar — a whole class of events, silently. `timeZone` may accompany either and
# is what resolves an offset-less `dateTime`.
#
# The other documented fact worth publishing: `end` is **exclusive**, and for a recurring event `start`
# and `end` describe the *first* instance rather than the one that was asked for.
#
# `status` matters for the same reason: a cancelled event is still returned by this endpoint, with
# `status: "cancelled"`, so "the call succeeded" does not mean "the meeting is happening".
[operations.response_schema]
type = "object"
required = ["id", "status"]
properties = { kind = { const = "calendar#event" }, etag = { type = "string", description = "The resource's ETag, as a quoted string" }, id = { type = "string", description = "The event id — what this operation takes" }, status = { type = "string", enum = ["confirmed", "tentative", "cancelled"], description = "**A cancelled event is still returned here**, with `cancelled`. Check this before treating the event as live" }, htmlLink = { type = "string", format = "uri", description = "The event's page in Google Calendar — the link to give a human" }, created = { type = "string", format = "date-time" }, updated = { type = "string", format = "date-time" }, summary = { type = "string", description = "The title. Absent on an event created without one, which Calendar renders as \"(No title)\"" }, description = { type = "string" }, location = { type = "string", description = "Free text, not a structured address" }, start = { type = "object", description = "WHEN IT STARTS, as an object: `dateTime` (RFC 3339) for a timed event **or** `date` (`yyyy-mm-dd`) for an all-day event — never both — plus an optional IANA `timeZone`. Reading `start.dateTime` unconditionally misses every all-day event" }, end = { type = "object", description = "Same shape, and **exclusive**: an all-day event on the 30th has `end.date` of the 31st. For a recurring event this describes the first instance" }, recurringEventId = { type = "string", description = "Present on an instance of a recurring event: the id of the series it belongs to" }, organizer = { type = "object", description = "`{email, displayName, self}` — who owns the event. `self` is true when it is the token's own calendar" }, creator = { type = "object", description = "Same shape; the creator need not still be the organizer" }, attendees = { type = "array", description = "Each `{email, displayName, organizer, self, optional, responseStatus}`, where `responseStatus` is `needsAction`, `declined`, `tentative` or `accepted` — this is how attendance is read. Absent entirely on an event with no attendees, such as every event `google-calendar-event-insert` creates. Personal data: it is a list of named people's addresses", items = { type = "object" } }, hangoutLink = { type = "string", format = "uri", description = "The Google Meet join link, when the event has a conference. **Anyone holding it can join the meeting**, so treat it as sensitive rather than as an ordinary URL" }, conferenceData = { type = "object", description = "The conference in full: `entryPoints` with join URLs and dial-in numbers, plus a `conferenceId`. Contains the same joinable links as `hangoutLink`" } }

[operations.quirks.error_envelope]
message_pointer = "/error/message"
code_pointer = "/error/status"

