[[operations]]
id = "google-calendar-event-insert"
service = "calendar"
method = "POST"
direction = "write"
path = "/calendar/v3/calendars/{calendarId}/events"
description = "Create a timed event on a calendar. No attendees can be declared yet, so nobody is invited and no notification is sent; invite people in Calendar afterwards. Needs the `calendar.events` scope"
# A new object on a calendar other people may be watching, but a quiet one: with no `attendees`
# declarable (C-56) and `sendUpdates` unavailable (C-30) the event notifies nobody, appears only on the
# named calendar, and is trivially deletable by a human. `medium` — "writes with limited blast radius"
# — rather than the `high` that the mail send carries.
#
# WHEN C-56 LANDS AND `attendees` BECOMES DECLARABLE, REVISIT THIS. Adding an attendee emails an
# invitation, which turns this into the `high` case.
risk = "medium"
# Calendar documents no idempotency key on `events.insert` — the request-scoped `iCalUID` de-duplication
# it does support belongs to `events.import`, not here — so the same body posted twice creates two
# events. A retry duplicates.
idempotency = "non_idempotent"

[[operations.params.path]]
name = "calendar_id"
wire = "calendarId"
description = "The calendar to create the event on: the literal `primary` for the token owner's own calendar, or a calendar address the token can write to"
required = true
schema = { type = "string", pattern = "^(primary|[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,})$", minLength = 3 }

# Not vendor-required: Calendar accepts an event with no summary and renders it as "(No title)". It is
# declared required here because C-56 forbids an optional body field, and an event nobody can identify
# in a calendar grid is not worth creating. See the header comment.
[[operations.params.body]]
name = "summary"
description = "The event's title, as it appears in the calendar grid"
required = true
schema = { type = "string", minLength = 1 }

# `start` and `end` are the two fields Calendar genuinely requires, and each is an `EventDateTime`
# object rather than a scalar — hence the `wire` paths. The `timeZone` half of each is not declarable
# (C-56), which is why both values must carry a UTC offset: `dateTime` with no offset *and* no
# `timeZone` is the one combination Google rejects, with `400 Missing time zone definition`.
#
# An all-day event uses `start.date`/`end.date` instead, which would be a second pair of body fields
# for the same wire object and therefore a second operation. Not shipped: the two cannot coexist here,
# because both would be required and Calendar rejects an `EventDateTime` carrying both.
[[operations.params.body]]
name = "start_time"
wire = "start.dateTime"
description = "When the event starts, RFC 3339 **with a UTC offset** — `2026-01-30T09:00:00+01:00` or `2026-01-30T08:00:00Z`. An offset-less value is rejected, because the `timeZone` field that would resolve it is not declarable yet"
required = true
schema = { type = "string", format = "date-time" }

[[operations.params.body]]
name = "end_time"
wire = "end.dateTime"
description = "When the event ends, RFC 3339 with a UTC offset. Must be after `start_time`; Calendar rejects an end that precedes its start"
required = true
schema = { type = "string", format = "date-time" }

# The created Event — the same resource the get returns, and Google states no status code for an insert
# any more than for a read.
#
# `id` and `htmlLink` are what this response is for: the id is how the event is addressed afterwards
# (nothing else here identifies it) and `htmlLink` is the link a human is given. `attendees` will be
# absent, because this operation cannot declare any (C-56) — which is the same thing as saying nobody
# was invited and nobody was emailed.
[operations.response_schema]
type = "object"
required = ["id", "status"]
properties = { kind = { const = "calendar#event" }, etag = { type = "string" }, id = { type = "string", description = "The new event's id — the only handle on it, and what `google-calendar-event-get` reads back" }, status = { type = "string", enum = ["confirmed", "tentative", "cancelled"], description = "`confirmed` on a freshly created event" }, htmlLink = { type = "string", format = "uri", description = "The event's page in Google Calendar — the link to give a human" }, created = { type = "string", format = "date-time" }, updated = { type = "string", format = "date-time" }, summary = { type = "string", description = "Echoes the title that was sent" }, start = { type = "object", description = "`{dateTime, timeZone}` as created. Calendar resolves the offset that was sent into its own representation, so this may not be the literal string that was sent" }, end = { type = "object", description = "Same shape, and exclusive" }, organizer = { type = "object", description = "`{email, displayName, self}` — the calendar the event was created on" }, creator = { type = "object", description = "The token's own account" }, attendees = { type = "array", description = "ABSENT on every event this operation creates: no attendee can be declared yet (C-56), so nobody was invited and nobody was notified", items = { type = "object" } }, iCalUID = { type = "string", description = "The RFC 5545 UID, which is what identifies this event across calendars — distinct from `id`" }, sequence = { type = "integer", description = "The iCalendar revision number, `0` on creation" } }

[operations.quirks.error_envelope]
message_pointer = "/error/message"
code_pointer = "/error/status"

