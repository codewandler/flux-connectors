[[operations]]
id = "google-drive-file-get"
service = "drive"
method = "GET"
direction = "read"
path = "/drive/v3/files/{fileId}"
description = "Get one Drive file's metadata — its id, name and MIME type. This never returns file content: downloading needs `alt=media`, which is a query parameter and therefore unavailable (C-30). Needs the `drive.metadata.readonly` scope (or `drive.readonly`)"
risk = "low"
idempotency = "idempotent"

[[operations.params.path]]
name = "file_id"
wire = "fileId"
description = "The file's id — the base64url-ish string in its Drive URL after `/d/`. A folder is a file too, with the folder MIME type"
required = true
schema = { type = "string", pattern = "^[A-Za-z0-9_-]+$", minLength = 1 }

# NO `response_schema`, DELIBERATELY (C-126) — and this is the clearest honest-absence case in the
# whole catalogue, so it is worth writing down in full.
#
# Drive v3 returns a *projection*: the `fields` parameter decides which members of the File resource
# come back, and without it Google returns "a default set of fields specific to the method". This
# connector cannot send `fields` (C-30, a query parameter), so what arrives is exactly that default —
# and **Google does not document what the default is for `files.get`.**
#
# The temptation, and why it was refused. The fields guide states the default for `files.list` as
# `kind`, `id`, `name`, `mimeType`, and this operation's own `description` above says "its id, name and
# MIME type", so `{kind, id, name, mimeType}` looks like a safe four-field schema. Three problems:
# the guide documents that set for `list`, not for `get`; it explicitly says the `permissions.get`
# default differs, so per-method defaults are real rather than uniform; and Drive's search guide states
# the `list` default as **five** fields including `resourceKey`, contradicting the fields guide on the
# very endpoint both describe. Two vendor pages disagreeing about the one method whose default is
# written down is not a foundation for asserting an *undocumented* one.
#
# So this operation publishes absence. `{}` or `{"type": "object"}` would count as coverage while saying
# nothing, and a guessed four-field schema would be worse still: it would look authoritative, and a
# consumer that trusted it would find `webViewLink` or `parents` missing and have no way to tell
# whether the field was absent from the response or absent from the schema.
#
# Closing this properly means C-30 plus an explicit `fields` value on the operation, at which point the
# response schema is derivable rather than guessed — because the caller states it.

[operations.quirks.error_envelope]
message_pointer = "/error/message"
code_pointer = "/error/status"

# ---------------------------------------------------------------------------------------------

[[operations]]
id = "google-drive-file-update"
service = "drive"
method = "PATCH"
direction = "write"
path = "/drive/v3/files/{fileId}"
description = "Rename a Drive file: sets its name and changes nothing else. It does not move, share, trash or replace the file's content. Needs the `drive.file` scope for files this token created, or `drive` for any other"
# A write everyone with access to the file sees, and the old name is not kept anywhere a caller can
# read it back — so it is not `low`. It is not `destructive` either: the file, its content, its
# sharing and its revision history all survive, and a human can rename it back. `medium`.
#
# WHEN C-56 LANDS, `trashed` BECOMES DECLARABLE AND WOULD CHANGE THIS TIER. A field that can bin a
# file belongs to a `destructive` operation, which means a second operation rather than a wider body
# on this one.
risk = "medium"
# Drive documents no idempotency guarantee on `files.update`, and the call is observably not
# idempotent even when it is semantically repeatable: each PATCH bumps the file's `version` and
# `modifiedTime` and writes a revision-history entry, so a retried rename is visible as two edits.
# `idempotent` would be a claim Google does not make (C-69's acceptance rules that out), so the
# direction is fail-closed: flux forgoes a safe retry.
idempotency = "non_idempotent"

[[operations.params.path]]
name = "file_id"
wire = "fileId"
description = "The file to rename"
required = true
schema = { type = "string", pattern = "^[A-Za-z0-9_-]+$", minLength = 1 }

# Not vendor-required — `files.update` accepts an empty body and changes nothing — but an operation
# with no settable field is not an operation, and `name` is the one field a rename needs. C-56 forbids
# declaring it optional. See the header comment.
[[operations.params.body]]
name = "name"
description = "The file's new name. Drive does not require names to be unique within a folder, so this can collide with a sibling"
required = true
schema = { type = "string", minLength = 1 }

# NO `response_schema`, DELIBERATELY (C-126) — the same reason as `google-drive-file-get`, and if
# anything a weaker footing: `files.update`'s reference says only "the response body contains an
# instance of File" and its page makes **no statement at all** about a default field set. So a caller
# cannot even confirm the rename from a documented member, and declaring `{name}` here would be
# asserting exactly the thing the vendor declines to.
#
# Read the file back with `google-drive-file-get` — whose default projection is also undocumented,
# which is the honest state of this service until C-30 makes `fields` sendable.

[operations.quirks.error_envelope]
message_pointer = "/error/message"
code_pointer = "/error/status"
