[[operations]]
id = "google-calendar-calendar-get"
service = "calendar"
method = "GET"
direction = "read"
path = "/calendar/v3/calendars/{calendarId}"
description = "Get one calendar's own metadata — its summary, description, location and time zone. This is the calendar, not its events: use `google-calendar-event-get` for one of those. Needs the `calendar.readonly` scope"
risk = "low"
idempotency = "idempotent"

[[operations.params.path]]
name = "calendar_id"
wire = "calendarId"
description = "The calendar to read: the literal `primary` for the token owner's own calendar, or a calendar address"
required = true
schema = { type = "string", pattern = "^(primary|[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,})$", minLength = 3 }

# The Calendars resource — a small, fully documented object, and `timeZone` is the reason to read it.
# Every event this connector creates must carry a UTC offset because `start.timeZone` is not declarable
# (C-56); this operation is how a flow learns which zone the calendar actually keeps, so that a local
# wall-clock time can be turned into the right offset rather than guessed at.
#
# `id` is resolved here too: asking for `primary` returns the calendar's real address, which is what a
# multi-calendar flow should hold afterwards.
[operations.response_schema]
type = "object"
required = ["id", "summary"]
properties = { kind = { const = "calendar#calendar" }, etag = { type = "string" }, id = { type = "string", description = "The calendar's address, e.g. `you@example.com` or `team@group.calendar.google.com`. Asking for `primary` resolves to this" }, summary = { type = "string", description = "The calendar's title" }, description = { type = "string" }, location = { type = "string", description = "Free-text geographic location of the calendar" }, timeZone = { type = "string", description = "The calendar's own IANA time zone, e.g. `Europe/Berlin`. **This is what an event's offset should be computed from** — `google-calendar-event-insert` cannot send a `timeZone`, so the caller has to apply the right offset itself" }, conferenceProperties = { type = "object", description = "`{allowedConferenceSolutionTypes}` — which conferencing this calendar permits (`hangoutsMeet`, `eventHangout`, `eventNamedHangout`)" } }

[operations.quirks.error_envelope]
message_pointer = "/error/message"
code_pointer = "/error/status"

