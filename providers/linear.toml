# ---------------------------------------------------------------------------------------------
# The one destructive operation. Archiving is Linear's delete: the issue leaves every list and every
# board. It is reversible in Linear's UI, which is why this is `destructive` rather than being left
# out — but a model should not reach it without a human, and `destructive` is what says so.
# ---------------------------------------------------------------------------------------------

[[operations]]
id = "linear-issue-archive"
method = "POST"
path = "/graphql"
description = "Archive an issue. It leaves every list, board and search in Linear and stops appearing to the team. This is Linear's form of deletion; it can be undone from Linear's own UI but not by this connector, which declares no unarchive operation. Linear answers every failure with HTTP 200 and an `errors` array beside a null `data`, so check `errors` and the payload's `success` flag before treating the issue as archived"
risk = "destructive"
idempotency = "non_idempotent"

[[operations.params.body]]
name = "query"
required = true
description = "The pinned GraphQL document. Constant — not caller-supplied, and absent from this operation's signature"

[operations.params.body.schema]
type = "string"
const = """
mutation IssueArchive($id: String!) {
  issueArchive(id: $id) {
    success
  }
}
"""

[[operations.params.body]]
name = "id"
wire = "variables.id"
required = true
description = "The issue's UUID or its human identifier such as ENG-42. Read it with linear-issue-get first — this is the one operation here a human cannot undo from this connector"

[operations.params.body.schema]
type = "string"
minLength = 1

[operations.response_schema]
type = "object"
required = ["data"]
properties = { data = { type = "object", description = "The GraphQL data envelope. Null when `errors` is present", properties = { issueArchive = { type = "object", description = "Linear's archive payload", properties = { success = { type = "boolean", description = "Whether the issue was archived. Check this as well as `errors`" } } } } } }
