# Linear GraphQL API — hand-authored, curated to the surface this pipeline can express honestly.
#
# WHY THIS IS NOT A `[spec]` POINTER. Linear publishes a GraphQL schema by introspection and a
# developer-portal reference (linear.app/developers/graphql) rather than an OpenAPI document vendored
# under `specs/`, and no C-4 ingest run has selected it — the same route trello, babelforce, postmark,
# zendesk, github, notion, datadog and bitbucket already take. **Drift against the vendor's own schema
# is therefore undetectable by machine** (`docs/designs/provider-operation-inventory.md` §6.7). Every
# field, argument and response shape below was read from linear.app/developers/graphql on
# **2026-07-31**.
#
# ---------------------------------------------------------------------------------------------
# WHAT THIS CONNECTOR IS FOR: IT IS C-110'S ANSWER TO "CAN A CONNECTOR DESCRIBE A VENDOR WITH ONE
# ENDPOINT AND A QUERY LANGUAGE?" — AND THE ANSWER IS YES, WITH TWO MEASURED COSTS.
# ---------------------------------------------------------------------------------------------
#
# Every provider in this fleet before Linear was REST: an operation was a method and a path, and the
# path is what distinguished it. Linear has **one** endpoint, `POST /graphql`, and eight operations
# that are told apart by nothing on the wire except the body. C-110 filed this as a probe that could
# legitimately end in a documented refusal. It did not, and `crates/connector-flux/tests/
# linear_connector.rs` asserts every claim below rather than leaving it as prose.
#
# FOUR THINGS WORKED, AND THREE OF THEM WORKED WITHOUT ANY NEW MECHANISM:
#
#  1. **Nothing in this repository keys an operation by its path.** Operation identity is `id` and
#     only `id` — the uniqueness pass in `connector_spec::provider` is over ids, and
#     `catalog::Operation` carries no `path` field at all. `providers/zendesk.toml` has shipped three
#     operations on one `PUT` path since long before this file, so eight on one `POST` path is a
#     difference of degree and not of kind. This was the finding most likely to sink the story and it
#     turned out to be a non-event.
#
#  2. **The query document is a vendor constant, and C-55's mechanism already covered it** rather
#     than merely resembling the case, which is what C-110's note asked to be checked.
#     `crates/connector-flux/src/op.rs`'s `constant` is a bare `schema.get("const")` with no type,
#     length or newline restriction, and the emitter filters constants out of the operation's
#     parameter list. So each `query` below is *sent on every call and declarable by nobody* — which
#     is precisely the property this connector needs, and it needed no widening to get it.
#
#  3. **A multi-line document survives the emitter.** flux-lang formats a newline-bearing literal as
#     a verbatim `"""…"""` block and the CST formatter never reaches inside one. No provider had
#     exercised that path before; the query documents below are written the way a human reads them
#     rather than folded onto one line, and `a_multiline_query_document_round_trips_through_the_emitter`
#     is the first test in the repository to prove it.
#
#  4. **The `data.<field>` envelope is declarable.** Every `[operations.response_schema]` below is
#     `{data: {<rootField>: …}}`. C-110 predicted response schemas would be the weak point and hoped
#     they would instead be *stronger* than REST, because the query is fixed at build time. They are:
#     the shape under `data` is not a guess about what the vendor might return, it is a consequence of
#     the document pinned a few lines above it, and the test asserts the two agree.
#
# ---------------------------------------------------------------------------------------------
# COST 1: EVERY OPERATION IS FORCED TO `risk >= medium` AND `idempotency = non_idempotent`,
# INCLUDING THE READS. THIS IS REAL AND IT IS NOT PAPERED OVER.
# ---------------------------------------------------------------------------------------------
#
# `check_write_metadata` (`crates/connector-flux/src/op.rs`) derives write-ness from the HTTP verb: a
# `POST` may not declare `risk = "low"` and may not declare itself idempotent. That rule is correct
# for REST and it is the most load-bearing safety check in the emitter — it is what stops a write
# being waved through flux's approval gate. But its *premise* is that the verb distinguishes a read
# from a write, and GraphQL does not satisfy that premise: `linear-viewer` reads the current user's
# name and is a `POST`, exactly like `linear-issue-archive`.
#
# The consequences, stated rather than absorbed:
#
#   - **The risk floor rises from `low` to `medium` for the whole connector.** `linear-viewer`,
#     `linear-team-list`, `linear-issue-get` and `linear-issue-list` are all plain reads and all
#     declare `medium`, because `low` does not compile.
#   - **`idempotency` carries no authored information at all.** Every operation below says
#     `non_idempotent`. A GraphQL *query* is idempotent and none of the four reads can say so, so the
#     field is not a statement about Linear — it is the only value that compiles.
#
# **This connector ships anyway, and the direction is the reason.** The forced value is
# *conservative*: a read is over-stated as `medium`, never a write under-stated as `low`, so a host's
# approval gate errs toward asking a human rather than toward acting. And gradation above the floor
# survives — the reads are `medium`, `linear-issue-archive` is `destructive` — so the axis is
# **compressed, not erased**. A connector whose risk metadata was uniformly meaningless would not have
# been worth shipping; one whose floor is a notch too high is.
#
# The narrow fix, if one is ever wanted, is not to weaken `check_write_metadata` — it should stay
# exactly as strict as it is for REST. It is for the operation to be able to declare that its verb is
# a transport detail rather than a semantic one. Nothing in the IR says that today.
#
# ---------------------------------------------------------------------------------------------
# COST 2 (SAFETY-RELEVANT): A FAILED LINEAR CALL ARRIVES AS HTTP 200, AND NOTHING IN THIS
# REPOSITORY CAN SAY SO. THIS IS C-57'S EXACT CASE.
# ---------------------------------------------------------------------------------------------
#
# Linear answers a validation error, a permission denial, an unknown field and an expired key alike
# with **HTTP 200**, a `null` `data` and an `errors` array. This repository's success signal is the
# transport's: flux-web hardcodes `is_error: false` for any completed request, the emitted Flux
# asserts nothing on status, and `connector-pack` passes the result through unshaped. **So every
# Linear failure reads as a success to anything switching on status.**
#
# `ErrorEnvelope` cannot express this. It has no success predicate, and its own documentation scopes
# it to a *non-2xx* body — [C-57](../docs/stories/C-57-quirks-beyond-http-shape.md) is the story that
# would add `ok_pointer`/`success_when`, and it is `ready` and not started. Slack has the same defect
# (`{"ok": false}` at 200) and shipped with it; the difference here is one of coverage rather than
# kind, and it is total: there is no Linear call whose failure is signalled by status.
#
# **So this connector declares no `[operations.quirks.error_envelope]` anywhere**, unlike every REST
# connector in the fleet — and that absence is a decision, not an oversight. Declaring one would make
# `connector_flux`'s `description()` append the sentence *"A non-2xx response is returned as data, not
# a failure…"* to the contract a model reads. For Linear that sentence is not merely unhelpful, it is
# **false**, and it points a model at a branch that never occurs. The choice available today is
# between no machine-readable envelope and a machine-readable one that lies, and this file takes the
# first. `no_operation_declares_an_error_envelope_because_the_prose_it_emits_would_be_false` pins the
# decision together with its reason, so closing C-57 breaks the test and forces a revisit instead of
# leaving the absence to rot.
#
# The only mitigation available is prose on the one surface a model actually reads, so **every
# description below ends with the same sentence** about checking `errors` before `data`. That is a
# weaker guarantee than a declared predicate and it is stated as such.
#
# ---------------------------------------------------------------------------------------------
# A THIRD, SMALLER FINDING: CURSOR PAGINATION IS UNDECLARABLE HERE FOR THE SAME REASON.
# ---------------------------------------------------------------------------------------------
#
# `linear-issue-list` takes an `after` cursor and returns `pageInfo.endCursor`, so it pages properly.
# It declares no `[operations.quirks.pagination]`, because it cannot: `Pagination::Cursor`'s
# `cursor_param` is documented as *"The query parameter carrying the cursor"*, and a GraphQL cursor is
# a **body variable**. This is the fourth acceptance item of C-57, which names it as unexpressible for
# any POST+JSON API, and Linear is the second provider to hit it after Slack. Recorded here rather
# than approximated with a quirk that names the wrong request component.
#
# ---------------------------------------------------------------------------------------------

id = "linear"
vendor = "Linear"
base_url = "https://api.linear.app"

# Reverse-DNS of the API host, `api.linear.app`, the same derivation every other provider here uses
# (`com.zendesk.api`, `io.fly.api`, `us.zoom.api`, `ai.openrouter.api`). It is the `<authority>`
# segment of `tenants/<tenant>/<authority>/<service>/<credential>`, so **it is never repointed once
# published** (AGENTS.md: "an address, once published, is not reused"): a different spelling mints a
# new address and deprecates this one, and tenants have provisioned secrets under this path.
authority = "app.linear.api"

# No `api_version`. Linear's GraphQL API is unversioned — there is no version segment in the URL and
# no version header — and eleven providers here already omit the field. Rendered addresses read
# `app.linear.api#linear-issue-get`. Inventing a `v1` would put a version into a published address
# that the vendor does not have and could not honour.

description = "Linear issue tracking over its GraphQL API: read the current user and the workspace's teams, read, list, create and update issues, comment on one, and archive one. Every operation is a POST to a single /graphql endpoint with a query document fixed at build time"

# The "Test connection" button: read the identity the API key belongs to. It takes no parameters at
# all — its pinned document declares no variables — so pressing it proves the key resolves and reports
# whose it is.
#
# `verify` is also the one rule in this repository that reads risk *without* reference to the HTTP
# method: the loader refuses a `high` or `destructive` verify on the operation's own declared risk. A
# method-based rule would have refused every GraphQL operation as a verify candidate, and this
# connector would have had no Test-connection button at all.
verify = "linear-viewer"

default_auth = [{ credentials = ["linear.api_key"] }]

# ---------------------------------------------------------------------------------------------
# Credentials
# ---------------------------------------------------------------------------------------------

[[auth]]
name = "linear.api_key"
scheme = "bearer"
# The sole secret. Gated and registered with flux's redactor by the host; its value is never read here
# and never reaches a generated artifact.
env = ["LINEAR_API_KEY"]
description = "Linear personal API key, sent as a bearer token. It carries the full permissions of the human who created it — Linear personal keys are not scopeable — so the connection's blast radius is that person's own access to the workspace"

# ---------------------------------------------------------------------------------------------
# Configuration — what a human supplies before any of this runs.
# ---------------------------------------------------------------------------------------------

[[config]]
name = "api_key"
label = "Linear API key"
help = "Create one in Linear under Settings -> Security & access -> Personal API keys. Linear shows the key once. It inherits your own permissions in the workspace and cannot be narrowed, so create it from an account whose access matches what this connection should be able to do"
# No `example`, deliberately. A Linear personal key is a long opaque string with a recognisable
# prefix, and a plausible-looking placeholder is matched by secret scanners on shape alone —
# `providers/trello.toml`, `providers/notion.toml`, `providers/shopify.toml` and
# `providers/bitbucket.toml` each record a release this repository actually lost that way.
format = "token"
secret = true
docs_url = "https://linear.app/developers/graphql#authentication"
binds = "credential.linear.api_key"

# ---------------------------------------------------------------------------------------------
# Operations — 8. Every one is `POST /graphql`; the path is identical throughout and identifies
# nothing. What distinguishes them is the pinned `query` document, which is why each one is written
# out in full below rather than assembled.
#
# The shape of every operation is the same three parts:
#   - `query`   — a body field pinned with a JSON Schema `const`. Sent on every call, declarable by
#                 nobody. This is the whole reason the connector is typed rather than being a remote
#                 expression evaluator.
#   - `variables.*` — the caller's real, typed arguments, each one a GraphQL variable the pinned
#                 document declares.
#   - `response_schema` — the `data.<rootField>` envelope the document's own selection set produces.
#
# Op ids are hyphen-separated, not dotted: flux-lang's `is_valid_decl_name` admits ASCII
# alphanumerics, `_` and `-` only (C-8, C-23).
# ---------------------------------------------------------------------------------------------

# ---------------------------------------------------------------------------------------------
# Identity. The verify operation, and the only one with no variables at all.
# ---------------------------------------------------------------------------------------------

[[operations]]
id = "linear-viewer"
method = "POST"
path = "/graphql"
description = "Read the Linear user this connection's API key belongs to: their id, name, email and admin flag. Takes no arguments. Use it to confirm the key works and to learn whose access this connection actually has, since a Linear personal key cannot be narrowed below its owner's permissions. Also this connector's verify operation. Linear answers every failure with HTTP 200 and an `errors` array beside a null `data`, so check `errors` before reading `data`"
risk = "medium"
idempotency = "non_idempotent"

[[operations.params.body]]
name = "query"
required = true
description = "The pinned GraphQL document. Constant — not caller-supplied, and absent from this operation's signature"

[operations.params.body.schema]
type = "string"
const = """
query Viewer {
  viewer {
    id
    name
    displayName
    email
    admin
  }
}
"""

[operations.response_schema]
type = "object"
required = ["data"]
properties = { data = { type = "object", description = "The GraphQL data envelope. Null when `errors` is present", properties = { viewer = { type = "object", description = "The user the API key belongs to", properties = { id = { type = "string", description = "The user's stable UUID" }, name = { type = "string", description = "The user's full name" }, displayName = { type = "string", description = "The short name Linear shows in the UI" }, email = { type = "string", format = "email" }, admin = { type = "boolean", description = "Whether this user administers the workspace" } } } } } }

# ---------------------------------------------------------------------------------------------
# Teams. A team id is the argument `linear-issue-create` needs and cannot guess.
# ---------------------------------------------------------------------------------------------

[[operations]]
id = "linear-team-list"
method = "POST"
path = "/graphql"
description = "List the teams in this workspace with each one's id, key and name. The `id` returned here is what linear-issue-create takes as `teamId`, and the `key` is the prefix in an issue's identifier — the ENG in ENG-42. Returns the first page only; raise `first` to widen it. Linear answers every failure with HTTP 200 and an `errors` array beside a null `data`, so check `errors` before reading `data`"
risk = "medium"
idempotency = "non_idempotent"

[[operations.params.body]]
name = "query"
required = true
description = "The pinned GraphQL document. Constant — not caller-supplied, and absent from this operation's signature"

[operations.params.body.schema]
type = "string"
const = """
query Teams($first: Int!) {
  teams(first: $first) {
    nodes {
      id
      key
      name
      description
    }
  }
}
"""

[[operations.params.body]]
name = "first"
wire = "variables.first"
required = true
description = "How many teams to return, 1 to 250. Most workspaces have fewer than 25"

[operations.params.body.schema]
type = "integer"
minimum = 1
maximum = 250

[operations.response_schema]
type = "object"
required = ["data"]
properties = { data = { type = "object", description = "The GraphQL data envelope. Null when `errors` is present", properties = { teams = { type = "object", description = "The team connection", properties = { nodes = { type = "array", description = "One entry per team", items = { type = "object", properties = { id = { type = "string", description = "The team's UUID — pass this as `teamId` to linear-issue-create" }, key = { type = "string", description = "The team's short prefix, e.g. ENG" }, name = { type = "string" }, description = { type = "string" } } } } } } } } }

# ---------------------------------------------------------------------------------------------
# Issues — reads.
# ---------------------------------------------------------------------------------------------

[[operations]]
id = "linear-issue-get"
method = "POST"
path = "/graphql"
description = "Read one issue by its id or by its human identifier such as ENG-42, including its title, description, priority, state, assignee, team and URL. Use it to confirm an issue exists and to read its current state before updating it. Linear answers every failure with HTTP 200 and an `errors` array beside a null `data`, so check `errors` before reading `data`; a missing issue comes back that way rather than as a 404"
risk = "medium"
idempotency = "non_idempotent"

[[operations.params.body]]
name = "query"
required = true
description = "The pinned GraphQL document. Constant — not caller-supplied, and absent from this operation's signature"

[operations.params.body.schema]
type = "string"
const = """
query Issue($id: String!) {
  issue(id: $id) {
    id
    identifier
    title
    description
    url
    priority
    createdAt
    updatedAt
    state {
      id
      name
      type
    }
    assignee {
      id
      name
    }
    team {
      id
      key
    }
  }
}
"""

[[operations.params.body]]
name = "id"
wire = "variables.id"
required = true
description = "The issue's UUID, or its human identifier such as ENG-42. Linear accepts either here"

[operations.params.body.schema]
type = "string"
minLength = 1

[operations.response_schema]
type = "object"
required = ["data"]
properties = { data = { type = "object", description = "The GraphQL data envelope. Null when `errors` is present", properties = { issue = { type = "object", description = "The issue, or null when no issue matches", properties = { id = { type = "string", description = "The issue's UUID" }, identifier = { type = "string", description = "The human identifier, e.g. ENG-42" }, title = { type = "string" }, description = { type = "string", description = "The issue body, in Markdown" }, url = { type = "string", format = "uri", description = "The page to give a human" }, priority = { type = "integer", description = "0 none, 1 urgent, 2 high, 3 normal, 4 low" }, createdAt = { type = "string", format = "date-time" }, updatedAt = { type = "string", format = "date-time" }, state = { type = "object", description = "The workflow state", properties = { id = { type = "string" }, name = { type = "string" }, type = { type = "string", description = "backlog, unstarted, started, completed or canceled" } } }, assignee = { type = "object", description = "The assigned user, null when unassigned", properties = { id = { type = "string" }, name = { type = "string" } } }, team = { type = "object", properties = { id = { type = "string" }, key = { type = "string" } } } } } } } }

[[operations]]
id = "linear-issue-list"
method = "POST"
path = "/graphql"
description = "List issues in the workspace, most recently updated first, with a page cursor. Pass `after` with the previous response's `pageInfo.endCursor` to get the next page, and stop when `pageInfo.hasNextPage` is false. Note that the cursor travels as a GraphQL variable rather than a query parameter, so this connector declares no pagination quirk and a host cannot page it automatically. Linear answers every failure with HTTP 200 and an `errors` array beside a null `data`, so check `errors` before reading `data`"
risk = "medium"
idempotency = "non_idempotent"

[[operations.params.body]]
name = "query"
required = true
description = "The pinned GraphQL document. Constant — not caller-supplied, and absent from this operation's signature"

[operations.params.body.schema]
type = "string"
const = """
query Issues($first: Int!, $after: String) {
  issues(first: $first, after: $after, orderBy: updatedAt) {
    nodes {
      id
      identifier
      title
      url
      priority
      updatedAt
      state {
        name
        type
      }
      assignee {
        id
        name
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}
"""

[[operations.params.body]]
name = "first"
wire = "variables.first"
required = true
description = "How many issues to return, 1 to 250"

[operations.params.body.schema]
type = "integer"
minimum = 1
maximum = 250

[[operations.params.body]]
name = "after"
wire = "variables.after"
description = "The previous response's `pageInfo.endCursor`. Omit it for the first page"

[operations.params.body.schema]
type = "string"
minLength = 1

[operations.response_schema]
type = "object"
required = ["data"]
properties = { data = { type = "object", description = "The GraphQL data envelope. Null when `errors` is present", properties = { issues = { type = "object", description = "The issue connection", properties = { nodes = { type = "array", description = "One entry per issue", items = { type = "object", properties = { id = { type = "string" }, identifier = { type = "string", description = "The human identifier, e.g. ENG-42" }, title = { type = "string" }, url = { type = "string", format = "uri" }, priority = { type = "integer", description = "0 none, 1 urgent, 2 high, 3 normal, 4 low" }, updatedAt = { type = "string", format = "date-time" }, state = { type = "object", properties = { name = { type = "string" }, type = { type = "string" } } }, assignee = { type = "object", properties = { id = { type = "string" }, name = { type = "string" } } } } } }, pageInfo = { type = "object", description = "The cursor for the following page", properties = { hasNextPage = { type = "boolean" }, endCursor = { type = "string", description = "Pass this back as `after`" } } } } } } } }

# ---------------------------------------------------------------------------------------------
# Issues — writes. All `medium`: they change what a team sees and they notify people, and Linear
# sends no un-notification. None can be `low` and none could have been marked idempotent even if
# Linear deduplicated them, which it does not.
# ---------------------------------------------------------------------------------------------

[[operations]]
id = "linear-issue-create"
method = "POST"
path = "/graphql"
description = "Create an issue on a team. Linear does not deduplicate: creating the same title twice makes two issues and notifies the team twice. The created issue, with its assigned identifier and URL, is in the response. `teamId` comes from linear-team-list. Linear answers every failure with HTTP 200 and an `errors` array beside a null `data`, so check `errors` and the payload's `success` flag before treating the issue as created"
risk = "medium"
idempotency = "non_idempotent"

[[operations.params.body]]
name = "query"
required = true
description = "The pinned GraphQL document. Constant — not caller-supplied, and absent from this operation's signature"

[operations.params.body.schema]
type = "string"
const = """
mutation IssueCreate($teamId: String!, $title: String!, $description: String, $priority: Int, $assigneeId: String) {
  issueCreate(
    input: {teamId: $teamId, title: $title, description: $description, priority: $priority, assigneeId: $assigneeId}
  ) {
    success
    issue {
      id
      identifier
      title
      url
    }
  }
}
"""

[[operations.params.body]]
name = "teamId"
wire = "variables.teamId"
required = true
description = "The team's UUID, from linear-team-list's `id`. Not the team key — ENG is the key, not the id"

[operations.params.body.schema]
type = "string"
minLength = 1

[[operations.params.body]]
name = "title"
wire = "variables.title"
required = true
description = "The issue's title, as it will read in the team's list. Linear requires one"

[operations.params.body.schema]
type = "string"
minLength = 1

[[operations.params.body]]
name = "description"
wire = "variables.description"
description = "The issue body, in Markdown"

[operations.params.body.schema]
type = "string"

[[operations.params.body]]
name = "priority"
wire = "variables.priority"
description = "0 none, 1 urgent, 2 high, 3 normal, 4 low. Omit to leave it unset"

[operations.params.body.schema]
type = "integer"
minimum = 0
maximum = 4

[[operations.params.body]]
name = "assigneeId"
wire = "variables.assigneeId"
description = "The user's UUID to assign it to, from linear-viewer's `id` for the connection's own user. Omit to leave it unassigned"

[operations.params.body.schema]
type = "string"
minLength = 1

[operations.response_schema]
type = "object"
required = ["data"]
properties = { data = { type = "object", description = "The GraphQL data envelope. Null when `errors` is present", properties = { issueCreate = { type = "object", description = "Linear's issue payload", properties = { success = { type = "boolean", description = "Whether the issue was created. Check this as well as `errors`" }, issue = { type = "object", description = "The created issue", properties = { id = { type = "string", description = "The new issue's UUID" }, identifier = { type = "string", description = "The new issue's human identifier, e.g. ENG-42" }, title = { type = "string" }, url = { type = "string", format = "uri", description = "The page to give a human" } } } } } } } }

[[operations]]
id = "linear-issue-update"
method = "POST"
path = "/graphql"
description = "Change an existing issue's title, description, priority, workflow state or assignee. Every argument except `id` is optional and only the ones supplied are changed. Reassigning or moving an issue notifies the people watching it. Read the issue first with linear-issue-get if the current values matter. Linear answers every failure with HTTP 200 and an `errors` array beside a null `data`, so check `errors` and the payload's `success` flag before treating the change as applied"
risk = "medium"
idempotency = "non_idempotent"

[[operations.params.body]]
name = "query"
required = true
description = "The pinned GraphQL document. Constant — not caller-supplied, and absent from this operation's signature"

[operations.params.body.schema]
type = "string"
const = """
mutation IssueUpdate($id: String!, $title: String, $description: String, $priority: Int, $stateId: String, $assigneeId: String) {
  issueUpdate(
    id: $id
    input: {title: $title, description: $description, priority: $priority, stateId: $stateId, assigneeId: $assigneeId}
  ) {
    success
    issue {
      id
      identifier
      title
      url
      priority
      state {
        id
        name
      }
    }
  }
}
"""

[[operations.params.body]]
name = "id"
wire = "variables.id"
required = true
description = "The issue's UUID or its human identifier such as ENG-42, from linear-issue-get or linear-issue-list"

[operations.params.body.schema]
type = "string"
minLength = 1

[[operations.params.body]]
name = "title"
wire = "variables.title"
description = "A new title. Omit to leave it unchanged"

[operations.params.body.schema]
type = "string"
minLength = 1

[[operations.params.body]]
name = "description"
wire = "variables.description"
description = "A new body, in Markdown. This replaces the whole description rather than appending to it — to add a note without losing the existing text, use linear-comment-create"

[operations.params.body.schema]
type = "string"

[[operations.params.body]]
name = "priority"
wire = "variables.priority"
description = "0 none, 1 urgent, 2 high, 3 normal, 4 low. Omit to leave it unchanged"

[operations.params.body.schema]
type = "integer"
minimum = 0
maximum = 4

[[operations.params.body]]
name = "stateId"
wire = "variables.stateId"
description = "The workflow state's UUID to move the issue to, from linear-issue-get's `state.id` on an issue already in the target state. Omit to leave it unchanged"

[operations.params.body.schema]
type = "string"
