[[operations]]
id = "mailchimp-audience-member-get"
method = "GET"
direction = "read"
path = "/lists/{list_id}/members/{subscriber_hash}"
description = "Get one contact in an audience, including its subscription status and opt-in record. The contact is addressed by a hash of its own address, not by the address — see `subscriber_hash`. Returns personal data"
risk = "low"
idempotency = "idempotent"

[[operations.params.path]]
name = "list_id"
description = "The audience id, from mailchimp-audience-list's `id`"
required = true
schema = { type = "string", minLength = 1 }

# The parameter this connector cannot make easy, stated in full rather than left to a 404. Nothing
# in Flux hashes, so the caller computes this; `mailchimp-audience-member-list` returns it as each
# contact's `id`, which is the one route that needs no hashing at all.
[[operations.params.path]]
name = "subscriber_hash"
description = "The MD5 hash of the contact's email address, lowercased first — Mailchimp's own addressing scheme for contacts. It is NOT the email address, and passing one answers 404. Compute it caller-side, or read it from mailchimp-audience-member-list, where it is each contact's `id`"
required = true
schema = { type = "string", minLength = 1 }

[operations.response_schema]
type = "object"
required = ["id", "email_address", "status", "list_id"]
properties = { id = { type = "string", description = "The MD5 hash of the lowercase email address — the `subscriber_hash` this operation and the upsert take" }, email_address = { type = "string", description = "The contact's address. Personal data" }, unique_email_id = { type = "string", description = "A stable id for the address across the account" }, contact_id = { type = "string", description = "Mailchimp's newer per-contact identifier" }, full_name = { type = "string", description = "The contact's name, if the account collects one. Personal data" }, web_id = { type = "integer", description = "The id in Mailchimp's own web UI" }, email_type = { type = "string", description = "`html` or `text`" }, status = { type = "string", description = "`subscribed`, `unsubscribed`, `cleaned`, `pending`, `transactional` or `archived`. `cleaned` means Mailchimp stopped sending after hard bounces" }, merge_fields = { type = "object", description = "The account's own merge tags and their values. Account-defined, so left untyped rather than enumerated. Frequently personal data" }, interests = { type = "object", description = "Interest-group membership, keyed by group id. Left untyped rather than enumerated" }, stats = { type = "object", description = "Open and click rates for this contact. Left untyped rather than enumerated" }, ip_signup = { type = "string", description = "The IP the contact signed up from. Personal data; read it only if the flow genuinely needs it" }, timestamp_signup = { type = "string" }, ip_opt = { type = "string", description = "The IP the contact confirmed opt-in from. Personal data" }, timestamp_opt = { type = "string", description = "When the contact confirmed opt-in — the record that a double opt-in happened" }, member_rating = { type = "integer", description = "Mailchimp's 1-5 engagement rating for this contact" }, last_changed = { type = "string", description = "When this contact record last changed" }, language = { type = "string" }, vip = { type = "boolean" }, location = { type = "object", description = "Approximate latitude, longitude and timezone. Left untyped rather than enumerated" }, tags = { type = "array", items = { type = "object" }, description = "The tags applied to this contact. Left untyped rather than enumerated" }, list_id = { type = "string", description = "The audience this contact belongs to" } }

# ---------------------------------------------------------------------------------------------

# **The one write, and the only operation here that is not `low`.**
#
# `risk = "high"` — "writes a reviewer would want to see first" — rather than `medium`, and the
# reason is not the size of the blast radius but who absorbs it. Setting `status = "subscribed"` on
# an address puts a real person on a marketing list, and in most of the world that is lawful only
# with a consent record this call does not carry. Mailchimp itself draws the line here: its own
# documentation restricts `status_if_new = "subscribed"` to addresses whose consent the account
# already holds, and `"pending"` is the value that makes Mailchimp send its own confirmation email
# and record the opt-in. The damage from getting this wrong lands on someone who is not the
# operator, is not undone by a second API call, and is the kind of thing a regulator asks about — so
# it goes in front of an approval gate. `providers/postmark.toml` records the same reasoning for the
# one operation of its own that reaches a stranger's inbox.
#
# `idempotency = "idempotent"`: `PUT` is idempotent under RFC 9110 §9.2.2, and this call is a field
# replacement addressed by a hash of the address itself — sending the same body twice leaves the
# contact in the state it was already in. It is *not* "safe": the first call may create.
[[operations]]
id = "mailchimp-audience-member-upsert"
method = "PUT"
direction = "write"
path = "/lists/{list_id}/members/{subscriber_hash}"
description = "Add a contact to an audience, or update the one already there. Creating with `status_if_new = \"pending\"` makes Mailchimp send its own opt-in confirmation and record the consent; creating with \"subscribed\" asserts that the account already holds that consent and sends nothing. Setting `status` on an existing contact changes whether they receive mail. This writes personal data about a third party and is not undone by calling it again"
risk = "high"
idempotency = "non_idempotent"

[[operations.params.path]]
name = "list_id"
description = "The audience id, from mailchimp-audience-list's `id`"
required = true
schema = { type = "string", minLength = 1 }

[[operations.params.path]]
name = "subscriber_hash"
description = "The MD5 hash of the contact's email address, lowercased first. It is NOT the email address. Compute it caller-side from the same address passed as `email_address`, or read it from mailchimp-audience-member-list, where it is each contact's `id`. A hash that does not match `email_address` addresses a different contact"
required = true
schema = { type = "string", minLength = 1 }

[[operations.params.body]]
name = "email_address"
description = "The contact's email address. Must be the address `subscriber_hash` was computed from — Mailchimp addresses the record by the hash and takes this as the address to store"
required = true
schema = { type = "string", format = "email" }

[[operations.params.body]]
name = "status_if_new"
description = "The status to give a contact this call creates; ignored when the contact already exists. \"pending\" makes Mailchimp send its own opt-in confirmation email and record the consent, and is the correct value unless the account already holds documented consent for this address; \"subscribed\" asserts that it does and sends nothing"
required = true
schema = { type = "string", enum = ["subscribed", "unsubscribed", "cleaned", "pending"] }

[[operations.params.body]]
name = "status"
description = "The status to set on a contact that already exists. \"unsubscribed\" stops mail to them; \"subscribed\" resumes it and carries the same consent obligation as creating one. \"cleaned\" is Mailchimp's own marker for an address it gave up on and is not a value to set by hand"
required = false
schema = { type = "string", enum = ["subscribed", "unsubscribed", "cleaned", "pending"] }

[operations.response_schema]
type = "object"
required = ["id", "email_address", "status", "list_id"]
properties = { id = { type = "string", description = "The MD5 hash of the lowercase email address — echo it back to confirm the call addressed the contact it meant to" }, email_address = { type = "string", description = "The contact's address as stored. Personal data" }, unique_email_id = { type = "string" }, contact_id = { type = "string", description = "Mailchimp's newer per-contact identifier" }, full_name = { type = "string", description = "The contact's name, if the account collects one. Personal data" }, web_id = { type = "integer" }, email_type = { type = "string", description = "`html` or `text`" }, status = { type = "string", description = "The contact's status after this call — `pending` means Mailchimp has sent a confirmation and is waiting for the person to answer it, so the write is not yet a subscription" }, merge_fields = { type = "object", description = "The account's own merge tags and their values. Account-defined, so left untyped rather than enumerated" }, interests = { type = "object", description = "Interest-group membership, keyed by group id. Left untyped rather than enumerated" }, stats = { type = "object", description = "Open and click rates for this contact. Left untyped rather than enumerated" }, ip_signup = { type = "string", description = "The IP the contact signed up from. Personal data" }, timestamp_signup = { type = "string" }, ip_opt = { type = "string", description = "The IP the contact confirmed opt-in from. Personal data" }, timestamp_opt = { type = "string", description = "When the contact confirmed opt-in — the consent record this call may have just created" }, member_rating = { type = "integer" }, last_changed = { type = "string", description = "When this contact record last changed, which this call has just set" }, language = { type = "string" }, vip = { type = "boolean" }, location = { type = "object", description = "Approximate latitude, longitude and timezone. Left untyped rather than enumerated" }, tags = { type = "array", items = { type = "object" }, description = "The tags applied to this contact. Left untyped rather than enumerated" }, list_id = { type = "string", description = "The audience the contact was written to" } }

# ---------------------------------------------------------------------------------------------
# Operations — campaigns. One read, `low`. Nothing here sends anything; see the header comment for
# why `POST /campaigns/{id}/actions/send` is out of a first curated set.
#
# `recipients`, `settings`, `tracking`, `report_summary` and `_links` are left untyped for the reason
# the audience `stats` is.
# ---------------------------------------------------------------------------------------------

[[operations]]
id = "mailchimp-campaign-list"
method = "GET"
direction = "read"
path = "/campaigns"
description = "List the campaigns in the account — drafts, scheduled, sending and sent alike. Returns Mailchimp's default first page only, and this connector declares no status or date filter, so compare the number of entries against `total_items` before treating the result as complete"
risk = "low"
idempotency = "idempotent"

[operations.response_schema]
type = "object"
required = ["campaigns", "total_items"]
properties = { campaigns = { type = "array", description = "The campaigns on this page", items = { type = "object", required = ["id", "status"], properties = { id = { type = "string", description = "The campaign id" }, web_id = { type = "integer", description = "The id in Mailchimp's own web UI" }, type = { type = "string", description = "`regular`, `plaintext`, `absplit`, `rss` or `variate`" }, create_time = { type = "string", description = "When the campaign was created" }, send_time = { type = "string", description = "When it was sent, or absent if it has not been" }, status = { type = "string", description = "`save`, `paused`, `schedule`, `sending` or `sent` — a draft and a delivered campaign are told apart here" }, emails_sent = { type = "integer", description = "How many emails this campaign has delivered so far" }, archive_url = { type = "string", format = "uri", description = "The campaign's public archive page — a link to give a human" }, long_archive_url = { type = "string", format = "uri" }, content_type = { type = "string", description = "How the campaign's content was authored — `template`, `html` or `multichannel`" }, recipients = { type = "object", description = "The audience and segment this campaign targets; `list_id` and `recipient_count` are the fields most callers want. Left untyped rather than enumerated in full" }, settings = { type = "object", description = "Subject line, title, from-name, reply-to and authoring options. Left untyped rather than enumerated in full" }, tracking = { type = "object", description = "Which opens, clicks and third-party analytics this campaign records. Left untyped rather than enumerated" }, report_summary = { type = "object", description = "Headline delivery statistics for a sent campaign — opens, clicks, unique rates. Absent on a campaign that has not been sent. Left untyped rather than enumerated" } } } }, total_items = { type = "integer", description = "How many campaigns exist in total, which is how a caller sees that this page is a prefix" } }

# ---------------------------------------------------------------------------------------------
# Configuration — what a product asks a human for before any of the above can run. Two fields, both
# connection level: one per Mailchimp account, supplied by whoever connects it.
#
# The datacentre label is NOT secret and structurally cannot be — it binds `endpoint.dc`, and
# `Binding::is_secret` answers `false` for that unconditionally. The API key is, for the mirror-image
# reason: it binds `credential.*`. Neither classification is a judgement call this file gets to make,
# and the header comment says why that is the point rather than a limitation.
#
# The key carries no `example`. A placeholder shaped like a real key is worse than none, and one has
# already tripped GitHub's push protection in this repository's history. The datacentre label does
# carry one, because `us14` is a two-letter region and a number — it is not credential-shaped, it is
# validated against `format = "subdomain"`, and it is the single most useful thing a form can show
# for a field most operators have never heard of.
# ---------------------------------------------------------------------------------------------

[[config]]
name = "server_prefix"
label = "Mailchimp datacentre"
help = "The short region code in front of `api.mailchimp.com` for your account, like us14 or us6. Find it three ways, whichever is easiest: it is the first part of the URL on your Mailchimp API keys page; it is the last part of your API key, after the final - character; or, on an OAuth connection, the OAuth metadata endpoint returns it. Enter the code alone, not a full URL"
example = "us14"
format = "subdomain"
docs_url = "https://mailchimp.com/developer/marketing/docs/fundamentals/"
binds = "endpoint.dc"

[[config]]
name = "api_key"
label = "Mailchimp API key"
help = "Generate one under Account & billing, Extras, API keys in your Mailchimp account. It grants everything your Mailchimp user can do, so treat it as a password. Copy the datacentre code above from the same page before you leave it"
format = "token"
secret = true
docs_url = "https://mailchimp.com/developer/marketing/guides/quick-start/"
binds = "credential.mailchimp.api_key"
