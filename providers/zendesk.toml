# C-487 retires the original seven hand-authored Support operations in favour of the five vendor
# operations they actually represented. The official paths omit the historical `.json` suffix and
# the official schemas carry their own requiredness; this greenfield connector accepts both as the
# source contract. In particular, the three former ticket-update/comment/tag aliases were all the
# same `UpdateTicket` request and are now one honest operation.
[[patch.operations]]
select = "ShowCurrentUser"
service = "default"
rename = "zendesk-test"
risk = "low"
idempotency = "idempotent"
omit.query = ["include"]

[[patch.operations]]
select = "ListSearchResults"
service = "default"
rename = "zendesk-ticket-search"
risk = "low"
idempotency = "idempotent"
omit.query = ["sort_by", "sort_order", "include"]

[[patch.operations]]
select = "ShowTicket"
service = "default"
rename = "zendesk-ticket-show"
risk = "low"
idempotency = "idempotent"
omit.query = ["include", "reduced_payload_size", "remove_duplicate_fields"]

[[patch.operations]]
select = "ListTicketComments"
service = "default"
rename = "zendesk-ticket-comment-list"
risk = "low"
idempotency = "idempotent"
omit.query = ["include", "sort_order", "page"]

[[patch.operations]]
select = "UpdateTicket"
service = "default"
rename = "zendesk-ticket-update"
risk = "medium"
idempotency = "non_idempotent"
omit.body = ["system_metadata"]

