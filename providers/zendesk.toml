# ---------------------------------------------------------------------------------------------
# First-party Messaging OpenAPI — Sunshine Conversations, published as the `messaging` service.
#
# The app id is connection configuration and is omitted from every caller signature. The document
# declares Basic and bearer alternatives with account/app/integration scopes; this tranche chooses
# one app-scoped Basic key explicitly on every operation. The current IR has no scope consumer, so
# `app` remains a reviewed comment rather than an invented field (C-443).
#
# Create/Get/Update/List webhook operations are absent because their response schemas return the
# live webhook signing secret. DeleteWebhook stays with that withheld lifecycle rather than shipping
# as an orphaned destructive call. Deep-object pagination and optional `brandId` queries are also
# omitted because the current query emitter cannot encode them structurally.
# ---------------------------------------------------------------------------------------------

[[spec]]
path = "specs/zendesk/messaging-2026-08-02.openapi.yaml"
service = "messaging"
source_url = "https://raw.githubusercontent.com/zendesk/sunshine-conversations-api-spec/master/openapi.yaml"
upstream_version = "17.12.1"
fetched_at = "2026-08-02T08:47:26Z"
sha256 = "cde5a1f4d54038bb4d52df965f0eb7824c2074be2a5a36835dfc20c82f121da6"

[[patch.operations]]
select = "CreateConversation"
service = "messaging"
rename = "zendesk-messaging-conversation-create"
description = "Create an empty SDK group conversation in the configured Zendesk Messaging app"
risk = "high"
idempotency = "non_idempotent"
auth = [{ credentials = ["zendesk.messaging_key"] }]
omit.path = ["appId"]
omit.body = ["participants", "displayName", "description", "iconUrl", "metadata"]

# Pin the only supported conversation kind. `personal` requires exactly one participant by prose;
# `sdkGroup` explicitly permits no participants, so the narrowed one-field body remains useful and
# cannot become a vacuous create.
[[patch.operations.params]]
name = "type"
position = "body"
required = true
schema = { type = "string", const = "sdkGroup" }

[[patch.operations]]
select = "GetConversation"
service = "messaging"
rename = "zendesk-messaging-conversation-get"
description = "Get one conversation by id; this bounded read is the Messaging service's diagnostic operation"
risk = "low"
idempotency = "idempotent"
auth = [{ credentials = ["zendesk.messaging_key"] }]
omit.path = ["appId"]

[[patch.operations]]
select = "UpdateConversation"
service = "messaging"
rename = "zendesk-messaging-conversation-update"
description = "Set one conversation's display name to an absolute non-empty value"
risk = "medium"
idempotency = "non_idempotent"
auth = [{ credentials = ["zendesk.messaging_key"] }]
omit.path = ["appId"]
omit.body = ["description", "iconUrl", "metadata"]

# Zendesk's source body has zero required members. Requiring `displayName` turns the PATCH into a
# nonvacuous absolute target-state write. The emitted request replays byte-identically, but Flux
# still classifies PATCH as non-idempotent because `idempotent` also licenses cached substitution.
[[patch.operations.params]]
name = "displayName"
position = "body"
required = true
schema = { type = "string", minLength = 1, maxLength = 100 }

[[patch.operations]]
select = "ListParticipants"
service = "messaging"
rename = "zendesk-messaging-participant-list"
description = "List the participants of one conversation without exposing deep-object pagination"
risk = "low"
idempotency = "idempotent"
auth = [{ credentials = ["zendesk.messaging_key"] }]
omit.path = ["appId"]
omit.query = ["page"]

[[patch.operations]]
select = "CreateUser"
service = "messaging"
rename = "zendesk-messaging-user-create"
description = "Create a Zendesk Messaging user with one required external id"
risk = "medium"
idempotency = "non_idempotent"
auth = [{ credentials = ["zendesk.messaging_key"] }]
omit.path = ["appId"]
omit.body = ["brandId", "signedUpAt", "toBeRetained", "profile", "metadata"]

# The vendor permits an empty object. `externalId` is the stable customer-owned identity this
# operation exists to establish, and requiring it prevents a no-op-shaped create.
[[patch.operations.params]]
name = "externalId"
position = "body"
required = true

[[patch.operations]]
select = "GetUser"
service = "messaging"
rename = "zendesk-messaging-user-get"
description = "Get one Zendesk Messaging user by its vendor id or external id"
risk = "low"
idempotency = "idempotent"
auth = [{ credentials = ["zendesk.messaging_key"] }]
omit.path = ["appId"]
omit.query = ["brandId"]

[[patch.operations]]
select = "UpdateUser"
service = "messaging"
rename = "zendesk-messaging-user-update"
description = "Set whether one Zendesk Messaging user is retained after becoming inactive"
risk = "medium"
idempotency = "non_idempotent"
auth = [{ credentials = ["zendesk.messaging_key"] }]
omit.path = ["appId"]
omit.query = ["brandId"]
omit.body = ["signedUpAt", "profile", "metadata"]

# The source body has zero required members. Requiring this boolean makes the PATCH a nonvacuous
# absolute target-state write whose identical replay produces the same retention setting. It stays
# conservatively non-idempotent because Flux never grants PATCH its stronger cache license.
[[patch.operations.params]]
name = "toBeRetained"
position = "body"
required = true
schema = { type = "boolean" }

# ---------------------------------------------------------------------------------------------
# Credentials
# ---------------------------------------------------------------------------------------------

[[auth]]
name = "zendesk.api_token"
scheme = "basic"
# The sole secret. Gated and registered with flux's redactor by the host; never read here.
env = ["ZENDESK_API_TOKEN"]
# The non-secret identity half: the agent's email address, on its own.
user_env = ["ZENDESK_USER"]
# Zendesk's `<email>/token` form. The literal `/token` is what tells Zendesk the password is an API
# token rather than a password — it is public API syntax, not a credential, which is why it is
# declared here instead of being baked into `ZENDESK_USER`. Pre-composing it would store a value in
# `ZENDESK_USER` that is not the thing the variable is named after and that nothing can validate
# (`docs/designs/auth-seam.md` §7.5).
user_suffix = "/token"
description = "Zendesk API token; the user half is the agent email with Zendesk's /token marker"

[[auth]]
name = "zendesk.messaging_key"
scheme = "basic"
env = ["ZENDESK_MESSAGING_KEY_SECRET"]
user_env = ["ZENDESK_MESSAGING_KEY_ID"]
description = "App-scoped Zendesk Messaging API key id and secret"

# ---------------------------------------------------------------------------------------------
# Operations — 7 of 7 (inventory §3.2)
#
# Op ids are hyphen-separated, not dotted. flux-lang's `is_valid_decl_name` admits ASCII
# alphanumerics, `_` and `-` only, so `op zendesk.ticket.show` is undeclarable and a dotted `$a.b`
# in expression position is field-access sugar rather than a name (C-8,
# `crates/connector-flux/src/names.rs`). C-23 settles the canonical rule; this file follows the
# form C-8's golden modules already emit.
# ---------------------------------------------------------------------------------------------

# ---------------------------------------------------------------------------------------------
# RESPONSE SHAPES (C-126) — where they come from, and the one thing they all have in common.
#
# Every schema below is read from Zendesk's own API reference, per resource:
#
#   users               developer.zendesk.com/api-reference/ticketing/users/users/
#   search              developer.zendesk.com/api-reference/ticketing/ticket-management/search/
#   tickets             developer.zendesk.com/api-reference/ticketing/tickets/tickets/
#   ticket comments     developer.zendesk.com/api-reference/ticketing/tickets/ticket_comments/
#
# **Zendesk envelopes everything, and that is what a consumer cannot infer.** A ticket read answers
# `{"ticket": {…}}`, a comment list answers `{"comments": […]}`, and — the one that actually surprises
# people — a ticket *update* answers `{"ticket": {…}, "audit": {…}}`. The reference is explicit: "An
# `audit` object is generated and included in the response when you update a ticket." Every write
# below is a `PUT` on the same ticket resource, so every one of them returns that pair.
#
# Three fields are deliberately declared with a type looser than a reader might expect, because the
# vendor's own table is looser:
#
# - `tags` on a ticket: Zendesk's field table leaves the type cell **empty**. Every documented example
#   shows an array of strings, so `array` is recorded and `items` is not invented.
# - `facets` on a search: the table says *string*, the example shows `null`. Recorded as neither —
#   only that the member exists.
# - `satisfaction_rating`: documented as an object, but the prose says it may instead hold the state
#   `"offered"`/`"unoffered"` and is null on plans without CSAT. Left off rather than typed wrongly.
#
# These schemas describe what Zendesk *sends*. They are not the operations' output type: `http.request`
# returns one flat string today, so `.ticket.id` against the emitted Flux resolves to nothing. C-127
# owns that distinction — see `docs/designs/member-io-schemas.md` §2.
# ---------------------------------------------------------------------------------------------

[[services]]
# C-458's explicit legacy marker is what lets the already-published, address-elided Support service
# coexist with Help Center. `service = "default"` serializes back to the same operation ownership;
# the hash fence in `zendesk_help_center.rs` proves its unsuffixed artifacts do not move.
name = "default"
legacy = true
tags = ["support"]

[[services]]
name = "help-center"
description = "Zendesk Help Center knowledge base: read categories, sections, articles and translations, and publish articles"
base_url = "https://{subdomain}.zendesk.com"
api_version = "v2"
tags = ["knowledge-base"]

[[services]]
name = "messaging"
description = "Zendesk Messaging conversations, messages, participants and users"
base_url = "https://{subdomain}.zendesk.com/sc"
api_version = "v2"
tags = ["messaging"]

# The source response graph for both message endpoints is recursive:
# `message -> quotedMessage -> quotedMessageMessage -> message`. OpenAPI ingest deliberately skips a
# schema with no finite resolved form, so these two operations use the supported mixed front-end:
# paths, methods, bodies and bounded response members are transcribed from the pinned document while
# the seven cycle-free siblings remain exact `[[patch.operations]]` selections. The bounded message
# shape stops before `quotedMessage`; no credential-shaped member is omitted.

[[operations]]
id = "zendesk-messaging-message-create"
service = "messaging"
method = "POST"
path = "/v2/apps/{appId}/conversations/{conversationId}/messages"
description = "Send an externally visible text message to one conversation as the stated author"
risk = "high"
idempotency = "non_idempotent"
auth = [{ credentials = ["zendesk.messaging_key"] }]

[[operations.params.path]]
name = "conversationId"
description = "The conversation id; caller values containing a path delimiter are refused"
required = true
schema = { type = "string" }

[[operations.params.body]]
name = "author"
description = "The message author; business sends on behalf of the business and user identifies an end user"
required = true
schema = { type = "object", required = ["type"], properties = { type = { type = "string", enum = ["business", "user"] } } }

[[operations.params.body]]
name = "content"
description = "A non-empty text message"
required = true
schema = { type = "object", required = ["type", "text"], properties = { type = { type = "string", const = "text" }, text = { type = "string", minLength = 1, maxLength = 4096 } } }

[operations.response_schema]
type = "object"
properties = { messages = { type = "array", description = "Messages created by this request", items = { type = "object", properties = { id = { type = "string" }, received = { type = "string", format = "date-time" }, author = { type = "object" }, content = { type = "object" }, deleted = { type = "boolean" } } } } }

[[operations]]
id = "zendesk-messaging-message-list"
service = "messaging"
method = "GET"
path = "/v2/apps/{appId}/conversations/{conversationId}/messages"
description = "List messages in one conversation without exposing deep-object cursor pagination"
risk = "low"
idempotency = "idempotent"
auth = [{ credentials = ["zendesk.messaging_key"] }]

[[operations.params.path]]
name = "conversationId"
description = "The conversation id; caller values containing a path delimiter are refused"
required = true
schema = { type = "string" }

[operations.response_schema]
type = "object"
properties = { messages = { type = "array", description = "Messages in this page, without recursively expanding quoted messages", items = { type = "object", properties = { id = { type = "string" }, received = { type = "string", format = "date-time" }, author = { type = "object" }, content = { type = "object" }, deleted = { type = "boolean" } } } }, meta = { type = "object" }, links = { type = "object" } }

[[operations]]
id = "zendesk-test"
service = "default"
method = "GET"
path = "/api/v2/users/me.json"
description = "Verify credentials by fetching the authenticated Zendesk user"
risk = "low"
idempotency = "idempotent"

# `{"user": {…}}`. The reference for this endpoint says it "returns user information and an
# `authenticity_token`" — a member no other user read carries, and one nothing here should ever log:
# it is a CSRF token for Zendesk's own web session, not a credential this connector uses.
#
# `role` is the field a flow branches on when it needs to know whether the token is an agent's or an
# end user's, and it is the reason this operation is the verify: a 200 with `role: "end-user"` means
# the credentials work and cannot read a ticket.
[operations.response_schema]
type = "object"
required = ["user"]
properties = { user = { type = "object", required = ["id"], properties = { id = { type = "integer", description = "The authenticated user's id" }, name = { type = "string" }, email = { type = "string" }, role = { type = "string", description = "`admin`, `agent` or `end-user`. An end-user token authenticates successfully and can read almost nothing" }, active = { type = "boolean" }, suspended = { type = "boolean" }, verified = { type = "boolean" }, organization_id = { type = "integer" }, time_zone = { type = "string" }, locale = { type = "string" }, created_at = { type = "string", format = "date-time" }, updated_at = { type = "string", format = "date-time" }, url = { type = "string" }, authenticity_token = { type = "string", description = "A CSRF token for Zendesk's own web session, returned only by this endpoint. It is not a credential for this API and must not be stored or logged" } } } }

