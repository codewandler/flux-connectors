# Zendesk Support — hand-authored, no vendor spec.
#
# Transcribed from `docs/designs/provider-operation-inventory.md` §3, which derives the operation
# set from `../flux/plugins/zendesk/src/main.rs` (687 lines). The plugin *is* the requirement: a
# connector replaces it only if it covers the same surface, so all 7 of its operations are taken.
#
# Zendesk publishes OpenAPI descriptions on developer.zendesk.com. When C-14's fetch lands, this
# file should become a `[spec]` pointer plus a `[[patch.operations]]` selection over the vendored
# document rather than an inline list (§1.2). Until then drift is undetectable by machine (§6.7).

id = "zendesk"
vendor = "Zendesk"

# The reverse-DNS authority this connector publishes under (C-92). It leads every rendered address
# and every credential path — `tenants/<tenant>/com.zendesk.api/<credential>` — and until it was
# declared `Credentials::reference` refused with `NoCredentialAddress`, so this connector could not
# authenticate at all.
#
# Derived from `zendesk.com`, the vendor's own primary domain, in reverse-DNS form, with the
# trailing `api` label the already-shipped authorities carry (`com.slack.api`, `com.vercel.api`,
# `io.fly.api`).
#
# Pinned in three places before this story landed: `global-addressing.md` uses `com.zendesk.api` as
# its running example, `crates/connector-spec/tests/credential_paths.rs` renders it, and
# `crates/connector-pack` addresses this connector's api token under it. Declaring anything else
# here would have contradicted all three.
#
# **Never repointed once published** (`AGENTS.md`: "an address, once published, is not reused"). A
# different spelling mints a new address and deprecates this one, because tenants provision secrets
# under this path.
authority = "com.zendesk.api"

# The vendor's own spelling, taken from the operations below — every one of their paths begins
# `/api/v2/`. Recorded here so a `gid` renders (`com.zendesk.api:v2`); a credential path needs only
# the authority and deliberately carries no version, so a token survives Zendesk's next one.
api_version = "v2"

# Every Zendesk account lives on its own subdomain, so there is no tenant-independent base URL.
# The inventory records the endpoint as operator config in `ZENDESK_URL` (§3.1), e.g.
# `https://company.zendesk.com`.
#
# `{subdomain}` is bound by the `[[config]]` field at the end of this file, which is what a product
# asks a user for before this connector has a destination URL at all. The loader refuses a template
# variable nothing binds, so the gap this comment used to record cannot reopen silently.
base_url = "https://{subdomain}.zendesk.com"

description = "Zendesk Support ticketing: search, read, update tickets and their comments"
# The "Test connection" operation: a bounded read of the authenticated user. It existed already —
# `zendesk-test` is named for it — but nothing declared which op played the role, so no host could
# find it.
verify = "zendesk-test"

# Every operation authenticates the same way — the inventory records requirement-set shape `single`
# identically for all 7 (§3.1).
default_auth = [{ credentials = ["zendesk.api_token"] }]

# ---------------------------------------------------------------------------------------------
# Credentials
# ---------------------------------------------------------------------------------------------

[[auth]]
name = "zendesk.api_token"
scheme = "basic"
# The sole secret. Gated and registered with flux's redactor by the host; never read here.
env = ["ZENDESK_API_TOKEN"]
# The non-secret identity half: the agent's email address, on its own.
user_env = ["ZENDESK_USER"]
# Zendesk's `<email>/token` form. The literal `/token` is what tells Zendesk the password is an API
# token rather than a password — it is public API syntax, not a credential, which is why it is
# declared here instead of being baked into `ZENDESK_USER`. Pre-composing it would store a value in
# `ZENDESK_USER` that is not the thing the variable is named after and that nothing can validate
# (`docs/designs/auth-seam.md` §7.5).
user_suffix = "/token"
description = "Zendesk API token; the user half is the agent email with Zendesk's /token marker"

# ---------------------------------------------------------------------------------------------
# Operations — 7 of 7 (inventory §3.2)
#
# Op ids are hyphen-separated, not dotted. flux-lang's `is_valid_decl_name` admits ASCII
# alphanumerics, `_` and `-` only, so `op zendesk.ticket.show` is undeclarable and a dotted `$a.b`
# in expression position is field-access sugar rather than a name (C-8,
# `crates/connector-flux/src/names.rs`). C-23 settles the canonical rule; this file follows the
# form C-8's golden modules already emit.
# ---------------------------------------------------------------------------------------------

# ---------------------------------------------------------------------------------------------
# RESPONSE SHAPES (C-126) — where they come from, and the one thing they all have in common.
#
# Every schema below is read from Zendesk's own API reference, per resource:
#
#   users               developer.zendesk.com/api-reference/ticketing/users/users/
#   search              developer.zendesk.com/api-reference/ticketing/ticket-management/search/
#   tickets             developer.zendesk.com/api-reference/ticketing/tickets/tickets/
#   ticket comments     developer.zendesk.com/api-reference/ticketing/tickets/ticket_comments/
#
# **Zendesk envelopes everything, and that is what a consumer cannot infer.** A ticket read answers
# `{"ticket": {…}}`, a comment list answers `{"comments": […]}`, and — the one that actually surprises
# people — a ticket *update* answers `{"ticket": {…}, "audit": {…}}`. The reference is explicit: "An
# `audit` object is generated and included in the response when you update a ticket." Every write
# below is a `PUT` on the same ticket resource, so every one of them returns that pair.
#
# Three fields are deliberately declared with a type looser than a reader might expect, because the
# vendor's own table is looser:
#
# - `tags` on a ticket: Zendesk's field table leaves the type cell **empty**. Every documented example
#   shows an array of strings, so `array` is recorded and `items` is not invented.
# - `facets` on a search: the table says *string*, the example shows `null`. Recorded as neither —
#   only that the member exists.
# - `satisfaction_rating`: documented as an object, but the prose says it may instead hold the state
#   `"offered"`/`"unoffered"` and is null on plans without CSAT. Left off rather than typed wrongly.
#
# These schemas describe what Zendesk *sends*. They are not the operations' output type: `http.request`
# returns one flat string today, so `.ticket.id` against the emitted Flux resolves to nothing. C-127
# owns that distinction — see `docs/designs/member-io-schemas.md` §2.
# ---------------------------------------------------------------------------------------------

[[operations]]
id = "zendesk-test"
method = "GET"
path = "/api/v2/users/me.json"
description = "Verify credentials by fetching the authenticated Zendesk user"
risk = "low"
idempotency = "idempotent"

# `{"user": {…}}`. The reference for this endpoint says it "returns user information and an
# `authenticity_token`" — a member no other user read carries, and one nothing here should ever log:
# it is a CSRF token for Zendesk's own web session, not a credential this connector uses.
#
# `role` is the field a flow branches on when it needs to know whether the token is an agent's or an
# end user's, and it is the reason this operation is the verify: a 200 with `role: "end-user"` means
# the credentials work and cannot read a ticket.
[operations.response_schema]
type = "object"
required = ["user"]
properties = { user = { type = "object", required = ["id"], properties = { id = { type = "integer", description = "The authenticated user's id" }, name = { type = "string" }, email = { type = "string" }, role = { type = "string", description = "`admin`, `agent` or `end-user`. An end-user token authenticates successfully and can read almost nothing" }, active = { type = "boolean" }, suspended = { type = "boolean" }, verified = { type = "boolean" }, organization_id = { type = "integer" }, time_zone = { type = "string" }, locale = { type = "string" }, created_at = { type = "string", format = "date-time" }, updated_at = { type = "string", format = "date-time" }, url = { type = "string" }, authenticity_token = { type = "string", description = "A CSRF token for Zendesk's own web session, returned only by this endpoint. It is not a credential for this API and must not be stored or logged" } } } }

# ---------------------------------------------------------------------------------------------

[[operations]]
id = "zendesk-ticket-search"
method = "GET"
path = "/api/v2/search.json"
description = "Search tickets with Zendesk search syntax, e.g. `type:ticket status:new`"
risk = "low"
idempotency = "idempotent"

# KNOWN NON-FUNCTIONAL until C-28 resolves it. Zendesk search expressions are colon-heavy and the
# plugin percent-encodes them strictly — spaces as `%20` never `+`, colons as `%3A`
# (`main.rs:426-441`, inventory §3.3.5). The emitted URL is assembled with `fmt`, which does no
# percent-encoding, and flux has no op that does. The operation is declared because dropping it
# would leave the connector short of the plugin it replaces; it is expected to mis-query until the
# encoding gap is closed.
[[operations.params.query]]
name = "query"
description = "Zendesk search expression"
required = true
schema = { type = "string" }

[[operations.params.query]]
name = "page"
description = "Page number, 1-based"
required = false
schema = { type = "integer", minimum = 1, default = 1 }

[[operations.params.query]]
name = "per_page"
description = "Results per page; Zendesk caps this at 100"
required = false
schema = { type = "integer", minimum = 1, maximum = 100, default = 100 }

# The search envelope. `results` is the only heterogeneous collection in this connector: Zendesk
# documents it as "tickets, users, groups, or organizations, as specified by the `result_type`
# property in each result object", so the discriminator is the thing worth recording. A consumer that
# assumed tickets — which is what this operation's own `query` is meant to ask for — would be right
# only for as long as the query says `type:ticket`, and this operation cannot reliably encode a query
# at all (see above).
[operations.response_schema]
type = "object"
required = ["results"]
properties = { results = { type = "array", description = "The matches, heterogeneous: each item carries a `result_type` naming what it is — `ticket`, `user`, `group` or `organization` — and its remaining fields are that resource's. Read `result_type` before reading anything else", items = { type = "object" } }, count = { type = "integer", description = "Total matches across all pages, not the size of this page" }, next_page = { type = "string", description = "URL of the following page, or null on the last page" }, previous_page = { type = "string", description = "URL of the preceding page, or null on the first page" }, facets = { description = "Present in every response and effectively unusable: Zendesk's own field table types it as a string while its example shows null, so no type is declared here rather than one of the two being guessed at" } }

[operations.quirks.pagination]
page = { page_param = "page", size_param = "per_page", page_size = 100, max_pages = 10 }

# ---------------------------------------------------------------------------------------------

[[operations]]
id = "zendesk-ticket-show"
method = "GET"
path = "/api/v2/tickets/{ticket_id}.json"
description = "Show one ticket"
risk = "low"
idempotency = "idempotent"

[[operations.params.path]]
name = "ticket_id"
description = "The ticket id"
required = true
schema = { type = "integer", format = "uint64", minimum = 1 }

# `{"ticket": {…}}`, from the tickets reference. The enumerated subset is what a support flow reads or
# branches on; `status` and `priority` carry their documented enums, because a flow gating on
# "solved" needs to know the vendor's spelling and that `closed` is a different, terminal state.
#
# `custom_fields` is an **array** of `{id, value}` pairs, not an object keyed by field name. That is
# the single most likely thing for a consumer to get wrong here, and reading it wrongly silently
# yields nothing rather than failing.
[operations.response_schema]
type = "object"
required = ["ticket"]
properties = { ticket = { type = "object", required = ["id"], properties = { id = { type = "integer" }, subject = { type = "string" }, description = { type = "string", description = "The first comment's text, as plain text. It is the ticket's opening message and does not change when later comments are added" }, status = { type = "string", description = "One of `new`, `open`, `pending`, `hold`, `solved`, `closed`. `closed` is terminal — a closed ticket cannot be updated, which is what `zendesk-ticket-update` fails on" }, priority = { type = "string", description = "One of `urgent`, `high`, `normal`, `low`. May be absent on a ticket that never had one set" }, type = { type = "string", description = "One of `problem`, `incident`, `question`, `task`" }, requester_id = { type = "integer", description = "The end user who asked" }, assignee_id = { type = "integer", description = "The agent it is assigned to, absent when unassigned" }, group_id = { type = "integer" }, organization_id = { type = "integer" }, tags = { type = "array", description = "The ticket's tags. Zendesk's own field table leaves this type blank; every documented example shows an array of strings, so no `items` is declared here" }, custom_fields = { type = "array", description = "An array of `{id, value}` pairs — NOT an object keyed by field name. The `id` is the numeric ticket-field id, which is per-account", items = { type = "object" } }, via = { type = "object", description = "How the ticket reached Zendesk: `{channel, source}`, where channel is `email`, `web`, `api`, `voice` and so on" }, created_at = { type = "string", format = "date-time" }, updated_at = { type = "string", format = "date-time" }, url = { type = "string" } } } }

# ---------------------------------------------------------------------------------------------

[[operations]]
id = "zendesk-ticket-comment-list"
method = "GET"
path = "/api/v2/tickets/{ticket_id}/comments.json"
description = "List a ticket's comments"
risk = "low"
idempotency = "idempotent"

[[operations.params.path]]
name = "ticket_id"
description = "The ticket id"
required = true
schema = { type = "integer", format = "uint64", minimum = 1 }

[[operations.params.query]]
name = "page"
description = "Page number, 1-based"
required = false
schema = { type = "integer", minimum = 1, default = 1 }

[[operations.params.query]]
name = "per_page"
description = "Comments per page; Zendesk caps this at 100"
required = false
schema = { type = "integer", minimum = 1, maximum = 100, default = 100 }

# `{"comments": […]}`, from the ticket-comments reference — and **only** that key. The reference
# documents both offset and cursor pagination for this endpoint, yet its response example carries no
# `next_page`, `count` or `meta`, so none is declared: the page above declares the `page`/`per_page`
# quirk because the *request* takes them, and a paging consumer that expected a `next_page` here to
# read back would find nothing. Declaring one on the strength of the sibling endpoints would be
# exactly the plausible invention this schema exists to prevent.
#
# `public` is the field a support flow branches on and the one the connector's own
# `zendesk-ticket-comment-add` sets deliberately: a `false` comment is an internal note the end user
# never sees, so a summary that repeats one to a requester leaks agent-only context.
[operations.response_schema]
type = "object"
required = ["comments"]
properties = { comments = { type = "array", description = "The ticket's comments, oldest first. The first entry is the ticket's `description`", items = { type = "object", required = ["id"], properties = { id = { type = "integer" }, type = { type = "string", description = "`Comment`, or `VoiceComment` for a call recording" }, author_id = { type = "integer", description = "Who wrote it — an agent or the requester" }, body = { type = "string", description = "The comment as plain text" }, html_body = { type = "string", description = "The same comment as HTML" }, plain_body = { type = "string", description = "The comment with quoted-reply chains and signatures stripped, which is usually the text worth summarizing" }, public = { type = "boolean", description = "False for an internal note the end user cannot see. Check it before repeating a comment to a requester" }, audit_id = { type = "integer" }, created_at = { type = "string", format = "date-time" }, attachments = { type = "array", description = "Uploaded files, each with `file_name`, `content_type`, `content_url` and `size`", items = { type = "object" } }, via = { type = "object", description = "How the comment arrived: `{channel, source}`" }, metadata = { type = "object", description = "Zendesk's own audit metadata for the comment — the submitter's IP, client and custom flags" } } } } }

[operations.quirks.pagination]
page = { page_param = "page", size_param = "per_page", page_size = 100, max_pages = 10 }

# ---------------------------------------------------------------------------------------------
# Operations 5, 6 and 7 are all `PUT /api/v2/tickets/{ticket_id}.json`, distinguished *only* by
# request body (inventory §3.3.1). The wire body nests —
# `{"ticket": {"updated_stamp": …, "comment": {"body": …}}}` — and every field below declares the
# JSON path it occupies with `wire` (C-29). That is a contract codegen compiles, not prose: before
# `wire` existed the path lived in each `description` and all three operations emitted a **flat**
# body, which Zendesk accepts, ignores, and answers 200 to.
#
# `ticket.safe_update = true` is a *constant* the plugin always sends, not a caller-supplied
# parameter (§3.3.2). It is pinned with a JSON Schema `const`, which already means "this value and
# no other": codegen sends it and keeps it out of the op signature, so no model has to guess it.
#
# SCHEMA GAP, still open: the plugin's preflight — at least one mutable field must be non-null
# (`main.rs:201-209`) — has no representation. `Quirks` carries pagination, rate limits and error
# envelopes, not preconditions.
# ---------------------------------------------------------------------------------------------

[[operations]]
id = "zendesk-ticket-update"
method = "PUT"
path = "/api/v2/tickets/{ticket_id}.json"
description = "Safe-update selected ticket fields against the caller's updated_stamp; at least one of status, priority, assignee_id, group_id or type must be supplied"
risk = "medium"
# Optimistic concurrency: the same call replayed after the ticket moved is rejected by Zendesk
# rather than applied, so repeating is safe only under the caller-supplied stamp.
idempotency = "conditional"

[[operations.params.path]]
name = "ticket_id"
description = "The ticket id"
required = true
schema = { type = "integer", format = "uint64", minimum = 1 }

[[operations.params.body]]
name = "updated_stamp"
wire = "ticket.updated_stamp"
description = "Optimistic-concurrency stamp: Zendesk rejects the update if the ticket moved since this stamp"
required = true
schema = { type = "string" }

[[operations.params.body]]
name = "safe_update"
wire = "ticket.safe_update"
description = "Constant `true` — not caller-supplied; it is what makes updated_stamp binding. Dropping it turns every write into a last-write-wins race"
required = true
schema = { type = "boolean", const = true }

[[operations.params.body]]
name = "status"
wire = "ticket.status"
description = "The ticket's status"
required = false
schema = { type = "string" }

[[operations.params.body]]
name = "priority"
wire = "ticket.priority"
description = "The ticket's priority"
required = false
schema = { type = "string" }

[[operations.params.body]]
name = "assignee_id"
wire = "ticket.assignee_id"
description = "The agent the ticket is assigned to"
required = false
schema = { type = "integer", format = "uint64" }

[[operations.params.body]]
name = "group_id"
wire = "ticket.group_id"
description = "The group the ticket belongs to"
required = false
schema = { type = "integer", format = "uint64" }

[[operations.params.body]]
name = "type"
wire = "ticket.type"
description = "The ticket's type"
required = false
schema = { type = "string" }

# THE AUDIT IS THE HALF OF THIS RESPONSE THAT MATTERS, and it is the reason all three writes below
# declare a response shape at all.
#
# The tickets reference states it plainly: "An `audit` object is generated and included in the
# response when you update a ticket." So a `PUT` answers with **two** top-level keys, `ticket` and
# `audit`, and a consumer expecting the bare ticket this connector's *read* returns would be reading
# the wrong document.
#
# Its value here is diagnostic. The failure mode this connector's `wire` paths exist to prevent — a
# **flat** body, which Zendesk accepts, ignores, and answers `200` to (see the block comment above) —
# produces a success indistinguishable from a real update by status code alone. `audit.events` names
# the fields that actually changed, so it is the one place in the response where "we changed nothing"
# and "we changed what you asked" look different.
#
# `events[].value` is left untyped deliberately: Zendesk's own example shows it holding a string
# (`"open"`) for one event and an integer (`123`) for the next, so it is genuinely polymorphic and any
# declared type here would be wrong half the time.
[operations.response_schema]
type = "object"
required = ["ticket", "audit"]
properties = { ticket = { type = "object", description = "The ticket **after** the update, in the same shape `zendesk-ticket-show` returns — including the new `updated_at`, which is the stamp a following safe update must send" }, audit = { type = "object", description = "What this call actually did. Its `events` array holds one entry per change, each `{id, type, field_name, value}` — and `value` is polymorphic across entries, a string for `status` and an integer for an id. An update that was accepted but changed nothing is visible here and nowhere else" } }

# ---------------------------------------------------------------------------------------------

[[operations]]
id = "zendesk-ticket-comment-add"
method = "PUT"
path = "/api/v2/tickets/{ticket_id}.json"
description = "Add a comment to a ticket; the comment is an internal note unless public is explicitly true"
risk = "medium"
idempotency = "conditional"

[[operations.params.path]]
name = "ticket_id"
description = "The ticket id"
required = true
schema = { type = "integer", format = "uint64", minimum = 1 }

[[operations.params.body]]
name = "updated_stamp"
wire = "ticket.updated_stamp"
description = "Optimistic-concurrency stamp"
required = true
schema = { type = "string" }

[[operations.params.body]]
name = "safe_update"
wire = "ticket.safe_update"
description = "Constant `true` — not caller-supplied"
required = true
schema = { type = "boolean", const = true }

[[operations.params.body]]
name = "body"
wire = "ticket.comment.body"
description = "The comment text; must not be blank"
required = true
schema = { type = "string", minLength = 1 }

# The safety default the plugin sets (`main.rs:79`): a generated op that inherited a "sensible"
# default of `true` would leak internal notes to end users (inventory §3.3.4).
[[operations.params.body]]
name = "public"
wire = "ticket.comment.public"
description = "False (an internal note) unless explicitly set true"
required = false
schema = { type = "boolean", default = false }

# The same `{ticket, audit}` pair every `PUT` on this resource returns — see the long comment on
# `zendesk-ticket-update`. Note what is *not* here: the created comment. Zendesk returns the ticket
# and the audit, and the comment appears only as an event inside `audit.events`, so a caller that
# needs the comment's id has to read it from there rather than from a top-level member.
[operations.response_schema]
type = "object"
required = ["ticket", "audit"]
properties = { ticket = { type = "object", description = "The ticket after the comment was added, in the shape `zendesk-ticket-show` returns" }, audit = { type = "object", description = "The change this call made. The added comment is an event inside `events`, carrying its own `id` and `body` — it is not returned as a top-level member" } }

# ---------------------------------------------------------------------------------------------

[[operations]]
id = "zendesk-ticket-tag-add"
method = "PUT"
path = "/api/v2/tickets/{ticket_id}.json"
description = "Add tags to a ticket without replacing the tags it already has"
risk = "medium"
idempotency = "conditional"

[[operations.params.path]]
name = "ticket_id"
description = "The ticket id"
required = true
schema = { type = "integer", format = "uint64", minimum = 1 }

[[operations.params.body]]
name = "updated_stamp"
wire = "ticket.updated_stamp"
description = "Optimistic-concurrency stamp"
required = true
schema = { type = "string" }

[[operations.params.body]]
name = "safe_update"
wire = "ticket.safe_update"
description = "Constant `true` — not caller-supplied"
required = true
schema = { type = "boolean", const = true }

# `ticket.additional_tags`, never `ticket.tags`: sending `tags` *replaces* the ticket's tags, which
# silently destroys data (inventory §3.3.3). The additive field is the whole point of this
# operation, and the `wire` path below is the only thing that makes it so.
[[operations.params.body]]
name = "tags"
wire = "ticket.additional_tags"
description = "Tags to add; additive, so existing tags survive. Must be non-empty with no blank entries"
required = true
schema = { type = "array", minItems = 1, items = { type = "string", minLength = 1 } }

# `{ticket, audit}` again. This is the operation where reading the response actually matters: the
# additive `ticket.additional_tags` path is what stops this call from *replacing* the ticket's tags,
# and `ticket.tags` in the response is the only place a caller can confirm the surviving set is the
# union it expected rather than the two tags it just sent.
[operations.response_schema]
type = "object"
required = ["ticket", "audit"]
properties = { ticket = { type = "object", description = "The ticket after tagging. Its `tags` member is the full resulting set — read it to confirm the existing tags survived, which is the entire behaviour `additional_tags` buys" }, audit = { type = "object", description = "The change this call made, with the tag change as an event in `events`" } }

# ---------------------------------------------------------------------------------------------
# Configuration — what a product asks a human for before any of the above can run
#
# Three fields, which is the whole "Connect Zendesk" form. Note that all three are *connection*
# level, derived from what they bind: every one is per-tenant, and this connector has no
# operator-level registration because it uses no OAuth app.
#
# The labels and help text are separate from the credential's `description` on purpose. That
# description is the text a *model* receives as part of the tool contract; these are the words a
# *person* reads while looking at an empty input box. One string cannot serve both without serving
# each badly.
# ---------------------------------------------------------------------------------------------

[[config]]
name = "subdomain"
label = "Zendesk subdomain"
help = "The part of your Zendesk URL before `.zendesk.com` — if you sign in at `acme.zendesk.com`, this is `acme`"
example = "acme"
format = "subdomain"
docs_url = "https://support.zendesk.com/hc/en-us/articles/4409381383578"
binds = "endpoint.subdomain"

[[config]]
name = "email"
label = "Agent email"
help = "The email of the Zendesk agent whose API token you are using. Zendesk sends it as the username half of the request, with its own `/token` marker appended — you do not type that part"
example = "agent@acme.com"
format = "email"
# Not secret, and the distinction is load-bearing rather than pedantic: this half travels through the
# non-gated `user_env` path, so it may appear where the token beside it may not.
binds = "username.zendesk.api_token"

[[config]]
name = "api_token"
label = "API token"
help = "Create one under Admin Center → Apps and integrations → Zendesk API. Zendesk shows it once"
format = "token"
