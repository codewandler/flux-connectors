# Zendesk Support, Help Center, and Messaging — every operation is selected explicitly from a
# pinned first-party OpenAPI document. The connector is curated rather than exhaustive: vendoring a
# document makes its operations available for review and exposes none by itself.

id = "zendesk"
vendor = "Zendesk"

# The reverse-DNS authority this connector publishes under (C-92). It leads every rendered address
# and every credential path — `tenants/<tenant>/com.zendesk.api/<credential>` — and until it was
# declared `Credentials::reference` refused with `NoCredentialAddress`, so this connector could not
# authenticate at all.
#
# Derived from `zendesk.com`, the vendor's own primary domain, in reverse-DNS form, with the
# trailing `api` label the already-shipped authorities carry (`com.slack.api`, `com.vercel.api`,
# `io.fly.api`).
#
# Pinned in three places before this story landed: `global-addressing.md` uses `com.zendesk.api` as
# its running example, `crates/connector-spec/tests/credential_paths.rs` renders it, and
# `crates/connector-pack` addresses this connector's api token under it. Declaring anything else
# here would have contradicted all three.
#
# **Never repointed once published** (`AGENTS.md`: "an address, once published, is not reused"). A
# different spelling mints a new address and deprecates this one, because tenants provision secrets
# under this path.
authority = "com.zendesk.api"

# The vendor's own spelling, taken from the operations below — every one of their paths begins
# `/api/v2/`. Recorded here so a `gid` renders (`com.zendesk.api:v2`); a credential path needs only
# the authority and deliberately carries no version, so a token survives Zendesk's next one.
api_version = "v2"

# Every Zendesk account lives on its own subdomain, so there is no tenant-independent base URL.
# The inventory records the endpoint as operator config in `ZENDESK_URL` (§3.1), e.g.
# `https://company.zendesk.com`.
#
# `{subdomain}` is bound by the `[[config]]` field at the end of this file, which is what a product
# asks a user for before this connector has a destination URL at all. The loader refuses a template
# variable nothing binds, so the gap this comment used to record cannot reopen silently.
base_url = "https://{subdomain}.zendesk.com"

description = "Zendesk Support ticketing: search, read and update tickets and comments; inspect audits, incremental exports and custom-object definitions"
# The "Test connection" operation: a bounded read of the authenticated user. It existed already —
# `zendesk-test` is named for it and selects the vendor's `ShowCurrentUser` operation directly.
verify = "zendesk-test"

# Every operation authenticates the same way — the inventory records requirement-set shape `single`
# identically for all 7 (§3.1).
default_auth = [{ credentials = ["zendesk.api_token"] }]

# ---------------------------------------------------------------------------------------------
# First-party Ticketing OpenAPI — vendored, scrubbed and provenanced by C-459.
#
# This is evidence, not an exposure list. The full document publishes nothing by default; the
# nineteen exact `[[patch.operations]]` blocks below are the entire selected Support surface.
# `upstream_sha256` belongs in
# `specs/zendesk.provenance.toml`; this pointer carries the public `SpecSource` fields and the hash
# of the scrubbed bytes builds actually ingest.
# ---------------------------------------------------------------------------------------------

[[spec]]
path = "specs/zendesk/ticketing-2026-08-02.openapi.yaml"
service = "default"
source_url = "https://developer.zendesk.com/zendesk/oas.yaml"
upstream_version = "2.0.0"
fetched_at = "2026-08-02T08:47:26Z"
sha256 = "338adeada0fc0e95bf1cea37320698e5a283fab9f48f496c28ab3bbac9ad0f88"

# The first selected read is intentionally query-free. Zendesk declares seven optional query
# parameters, including a page value that is either an integer or a deep object and an array-valued
# `filter_events`. Until Flux gains the structured query encoding C-28 specifies, publishing any of
# them would let a caller assemble an ambiguous or injectable URL. Every omission is named, so an
# upstream rename fails rather than quietly bringing the argument back.
[patch.directions.default]
"IncrementalOrganizationExport" = "read"
"IncrementalTicketEvents" = "read"
"IncrementalTicketExportTime" = "read"
"IncrementalUserExportTime" = "read"
"ListAuditsForTicket" = "read"
"ListCustomObjects" = "read"
"ListCustomStatuses" = "read"
"ListGroups" = "read"
"ListRecentTickets" = "read"
"ListSearchResults" = "read"
"ListTicketComments" = "read"
"ListTicketFields" = "read"
"ListTicketForms" = "read"
"ListTicketsFromView" = "read"
"ShowCurrentUser" = "read"
"ShowOrganization" = "read"
"ShowTicket" = "read"
"ShowUser" = "read"
"UpdateTicket" = "write"

[patch.directions.help-center]
"CreateArticleBySection" = "write"
"ListArticlesIncremental" = "read"
"ListArticlesNoLocale" = "read"
"ListCategoriesNoLocale" = "read"
"ListSectionsNoLocale" = "read"
"ListTranslations" = "read"
"ShowArticleNoLocale" = "read"

[patch.directions.messaging]
"CreateConversation" = "write"
"CreateUser" = "write"
"GetConversation" = "read"
"GetUser" = "read"
"ListMessages" = "read"
"ListParticipants" = "read"
"PostMessage" = "write"
"UpdateConversation" = "write"
"UpdateUser" = "write"


[[patch.operations]]
select = "ListAuditsForTicket"
service = "default"
rename = "zendesk-ticket-audit-list"
description = "List the read-only audit history for one ticket, including field changes, comments and notifications"
risk = "low"
idempotency = "idempotent"
omit.query = [
  "page",
  "sort",
  "include",
  "include_boundary_indicators",
  "include_item_cursors",
  "filter_events",
  "sort_order",
]

# Time-based incremental exports retain only integer cursors and page sizes. Zendesk's optional
# `support_type_scope` and event `include` values are free-form strings; query interpolation does
# not percent-encode them, so each is omitted explicitly and an upstream rename fails closed.
[[patch.operations]]
select = "IncrementalTicketExportTime"
service = "default"
rename = "zendesk-incremental-ticket-list"
description = "Incrementally export tickets updated at or after a required Unix start time"
risk = "low"
idempotency = "idempotent"
omit.query = ["support_type_scope"]

[[patch.operations]]
select = "IncrementalUserExportTime"
service = "default"
rename = "zendesk-incremental-user-list"
description = "Incrementally export users updated at or after a required Unix start time with an optional integer page size"
risk = "low"
idempotency = "idempotent"

[[patch.operations]]
select = "IncrementalOrganizationExport"
service = "default"
rename = "zendesk-incremental-organization-list"
description = "Incrementally export organizations updated at or after a required Unix start time with an optional integer page size"
risk = "low"
idempotency = "idempotent"

[[patch.operations]]
select = "IncrementalTicketEvents"
service = "default"
rename = "zendesk-incremental-ticket-event-list"
description = "Incrementally export ticket audit events at or after a required Unix start time"
risk = "low"
idempotency = "idempotent"
omit.query = ["include", "support_type_scope"]

# This exposes custom-object definitions only. Record reads require a caller-chosen object key in
# the path and remain withheld until that segment can be encoded safely; multipart record
# attachments remain withheld until C-426.
[[patch.operations]]
select = "ListCustomObjects"
service = "default"
rename = "zendesk-custom-object-list"
description = "List custom-object definitions, optionally including each definition's UI path"
risk = "low"
idempotency = "idempotent"

# C-466 adds the remaining inventory-approved Support foundations as eight exact, query-free reads.
# Every optional query parameter is named below; retaining none avoids publishing raw string query
# interpolation, ambiguous paging dialects, or filters whose safe wire encoding Flux cannot yet
# express. The pinned response envelopes are carried as documented without inventing required fields.
[[patch.operations]]
select = "ListRecentTickets"
service = "default"
rename = "zendesk-ticket-recent-list"
description = "List the account's most recently created or updated tickets"
risk = "low"
idempotency = "idempotent"

[[patch.operations]]
select = "ListTicketsFromView"
service = "default"
rename = "zendesk-view-ticket-list"
description = "List tickets from one numeric or built-in Zendesk view"
risk = "low"
idempotency = "idempotent"
omit.query = ["sort_by", "sort_order"]

# The source permits either a numeric id or one of three built-in string ids. That union lowers to
# Flux `Any`, whose synthetic rehearsal value is an object and cannot form a path segment. Publish
# the useful, closed built-in set; account-specific numeric views can join when Flux represents the
# union without losing its input contract.
[[patch.operations.params]]
name = "view_id"
position = "path"
required = true
schema = { type = "string", enum = ["incoming", "my", "my_groups"] }

[[patch.operations]]
select = "ShowUser"
service = "default"
rename = "zendesk-user-show"
description = "Get one Zendesk user by numeric id"
risk = "low"
idempotency = "idempotent"
omit.query = ["include"]

[[patch.operations]]
select = "ShowOrganization"
service = "default"
rename = "zendesk-organization-show"
description = "Get one Zendesk organization by numeric id"
