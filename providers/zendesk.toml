# ---------------------------------------------------------------------------------------------
# First-party Messaging OpenAPI — Sunshine Conversations, published as the `messaging` service.
#
# The app id is connection configuration and is omitted from every caller signature. The document
# declares Basic and bearer alternatives with account/app/integration scopes; this tranche chooses
# one app-scoped Basic key explicitly on every operation. The current IR has no scope consumer, so
# `app` remains a reviewed comment rather than an invented field (C-443).
#
# Create/Get/Update/List webhook operations are absent because their response schemas return the
# live webhook signing secret. DeleteWebhook stays with that withheld lifecycle rather than shipping
# as an orphaned destructive call. Deep-object pagination and optional `brandId` queries are also
# omitted because the current query emitter cannot encode them structurally.
# ---------------------------------------------------------------------------------------------

[[spec]]
path = "specs/zendesk/messaging-2026-08-02.openapi.yaml"
service = "messaging"
source_url = "https://raw.githubusercontent.com/zendesk/sunshine-conversations-api-spec/master/openapi.yaml"
upstream_version = "17.12.1"
fetched_at = "2026-08-02T08:47:26Z"
sha256 = "cde5a1f4d54038bb4d52df965f0eb7824c2074be2a5a36835dfc20c82f121da6"

[[patch.operations]]
select = "CreateConversation"
service = "messaging"
rename = "zendesk-messaging-conversation-create"
description = "Create an empty SDK group conversation in the configured Zendesk Messaging app"
risk = "high"
idempotency = "non_idempotent"
auth = [{ credentials = ["zendesk.messaging_key"] }]
omit.path = ["appId"]
omit.body = ["participants", "displayName", "description", "iconUrl", "metadata"]

# Pin the only supported conversation kind. `personal` requires exactly one participant by prose;
# `sdkGroup` explicitly permits no participants, so the narrowed one-field body remains useful and
# cannot become a vacuous create.
[[patch.operations.params]]
name = "type"
position = "body"
required = true
schema = { type = "string", const = "sdkGroup" }

[[patch.operations]]
select = "GetConversation"
service = "messaging"
rename = "zendesk-messaging-conversation-get"
description = "Get one conversation by id; this bounded read is the Messaging service's diagnostic operation"
risk = "low"
idempotency = "idempotent"
auth = [{ credentials = ["zendesk.messaging_key"] }]
omit.path = ["appId"]

[[patch.operations]]
select = "UpdateConversation"
service = "messaging"
rename = "zendesk-messaging-conversation-update"
description = "Set one conversation's display name to an absolute non-empty value"
risk = "medium"
idempotency = "non_idempotent"
auth = [{ credentials = ["zendesk.messaging_key"] }]
omit.path = ["appId"]
omit.body = ["description", "iconUrl", "metadata"]

# Zendesk's source body has zero required members. Requiring `displayName` turns the PATCH into a
# nonvacuous absolute target-state write. The emitted request replays byte-identically, but Flux
# still classifies PATCH as non-idempotent because `idempotent` also licenses cached substitution.
[[patch.operations.params]]
name = "displayName"
position = "body"
required = true
schema = { type = "string", minLength = 1, maxLength = 100 }

[[patch.operations]]
select = "ListParticipants"
service = "messaging"
rename = "zendesk-messaging-participant-list"
description = "List the participants of one conversation without exposing deep-object pagination"
risk = "low"
idempotency = "idempotent"
auth = [{ credentials = ["zendesk.messaging_key"] }]
omit.path = ["appId"]
omit.query = ["page"]

# Both message responses recurse through
# `message -> quotedMessage -> quotedMessageMessage -> message`. OpenAPI ingest retains the useful
# first occurrence and bounds the repeated continuation with JSON Schema `true`, so the request and
# every non-recursive response member now come directly from the pinned first-party document.
[[patch.operations]]
select = "PostMessage"
service = "messaging"
rename = "zendesk-messaging-message-create"
risk = "high"
idempotency = "non_idempotent"
auth = [{ credentials = ["zendesk.messaging_key"] }]
omit.path = ["appId"]
omit.body = ["destination", "metadata", "override", "schema"]

[[patch.operations]]
select = "ListMessages"
service = "messaging"
rename = "zendesk-messaging-message-list"
risk = "low"
idempotency = "idempotent"
auth = [{ credentials = ["zendesk.messaging_key"] }]
omit.path = ["appId"]
omit.query = ["page"]

[[patch.operations]]
select = "CreateUser"
service = "messaging"
rename = "zendesk-messaging-user-create"
description = "Create a Zendesk Messaging user with one required external id"
risk = "medium"
idempotency = "non_idempotent"
auth = [{ credentials = ["zendesk.messaging_key"] }]
omit.path = ["appId"]
omit.body = ["brandId", "signedUpAt", "toBeRetained", "profile", "metadata"]

# The vendor permits an empty object. `externalId` is the stable customer-owned identity this
# operation exists to establish, and requiring it prevents a no-op-shaped create.
[[patch.operations.params]]
name = "externalId"
position = "body"
required = true

[[patch.operations]]
select = "GetUser"
service = "messaging"
rename = "zendesk-messaging-user-get"
description = "Get one Zendesk Messaging user by its vendor id or external id"
risk = "low"
idempotency = "idempotent"
auth = [{ credentials = ["zendesk.messaging_key"] }]
omit.path = ["appId"]
omit.query = ["brandId"]

[[patch.operations]]
select = "UpdateUser"
service = "messaging"
rename = "zendesk-messaging-user-update"
description = "Set whether one Zendesk Messaging user is retained after becoming inactive"
risk = "medium"
idempotency = "non_idempotent"
auth = [{ credentials = ["zendesk.messaging_key"] }]
omit.path = ["appId"]
omit.query = ["brandId"]
omit.body = ["signedUpAt", "profile", "metadata"]

# The source body has zero required members. Requiring this boolean makes the PATCH a nonvacuous
# absolute target-state write whose identical replay produces the same retention setting. It stays
# conservatively non-idempotent because Flux never grants PATCH its stronger cache license.
[[patch.operations.params]]
name = "toBeRetained"
position = "body"
required = true
schema = { type = "boolean" }

# ---------------------------------------------------------------------------------------------
# Credentials
# ---------------------------------------------------------------------------------------------

[[auth]]
name = "zendesk.api_token"
scheme = "basic"
# The sole secret. Gated and registered with flux's redactor by the host; never read here.
env = ["ZENDESK_API_TOKEN"]
# The non-secret identity half: the agent's email address, on its own.
user_env = ["ZENDESK_USER"]
# Zendesk's `<email>/token` form. The literal `/token` is what tells Zendesk the password is an API
# token rather than a password — it is public API syntax, not a credential, which is why it is
# declared here instead of being baked into `ZENDESK_USER`. Pre-composing it would store a value in
# `ZENDESK_USER` that is not the thing the variable is named after and that nothing can validate
# (`docs/designs/auth-seam.md` §7.5).
user_suffix = "/token"
description = "Zendesk API token; the user half is the agent email with Zendesk's /token marker"

[[auth]]
name = "zendesk.messaging_key"
scheme = "basic"
env = ["ZENDESK_MESSAGING_KEY_SECRET"]
user_env = ["ZENDESK_MESSAGING_KEY_ID"]
description = "App-scoped Zendesk Messaging API key id and secret"

# ---------------------------------------------------------------------------------------------
# Services and configuration
# ---------------------------------------------------------------------------------------------
[[services]]
# C-458's explicit legacy marker is what lets the already-published, address-elided Support service
# coexist with Help Center. `service = "default"` serializes back to the same operation ownership;
# the hash fence in `zendesk_help_center.rs` proves its unsuffixed artifacts do not move.
name = "default"
legacy = true
tags = ["support"]

[[services]]
name = "help-center"
description = "Zendesk Help Center knowledge base: read categories, sections, articles and translations, and publish articles"
base_url = "https://{subdomain}.zendesk.com"
api_version = "v2"
tags = ["knowledge-base"]

[[services]]
name = "messaging"
description = "Zendesk Messaging conversations, messages, participants and users"
base_url = "https://{subdomain}.zendesk.com/sc"
api_version = "v2"
tags = ["messaging"]

# Configuration — what a product asks a human for before any of the above can run
#
# Three fields, which is the whole "Connect Zendesk" form. Note that all three are *connection*
# level, derived from what they bind: every one is per-tenant, and this connector has no
# operator-level registration because it uses no OAuth app.
#
# The labels and help text are separate from the credential's `description` on purpose. That
# description is the text a *model* receives as part of the tool contract; these are the words a
# *person* reads while looking at an empty input box. One string cannot serve both without serving
# each badly.
# ---------------------------------------------------------------------------------------------

[[config]]
name = "subdomain"
service = "default"
label = "Zendesk subdomain"
help = "The part of your Zendesk URL before `.zendesk.com` — if you sign in at `acme.zendesk.com`, this is `acme`"
example = "acme"
format = "subdomain"
docs_url = "https://support.zendesk.com/hc/en-us/articles/4409381383578"
binds = "endpoint.subdomain"

[[config]]
name = "email"
service = "default"
label = "Agent email"
help = "The email of the Zendesk agent whose API token you are using. Zendesk sends it as the username half of the request, with its own `/token` marker appended — you do not type that part"
example = "agent@acme.com"
format = "email"
# Not secret, and the distinction is load-bearing rather than pedantic: this half travels through the
# non-gated `user_env` path, so it may appear where the token beside it may not.
binds = "username.zendesk.api_token"

[[config]]
name = "api_token"
service = "default"
label = "API token"
help = "Create one under Admin Center → Apps and integrations → Zendesk API. Zendesk shows it once"
format = "token"
secret = true
docs_url = "https://support.zendesk.com/hc/en-us/articles/4408889192858"
binds = "credential.zendesk.api_token"

# Help Center reuses the same account host and Basic credential contract. Configuration is
# service-addressed at runtime, so these named declarations bind the same three destinations under
# `help-center`; the credential itself remains the one connector-level `zendesk.api_token` address.
[[config]]
name = "help_center_subdomain"
service = "help-center"
label = "Zendesk subdomain"
help = "The part of your Zendesk URL before `.zendesk.com` — the same account subdomain used by Support"
example = "acme"
format = "subdomain"
docs_url = "https://support.zendesk.com/hc/en-us/articles/4409381383578"
binds = "endpoint.subdomain"

[[config]]
name = "help_center_email"
service = "help-center"
label = "Agent email"
help = "The Zendesk agent email used by the shared Support and Help Center API token; Zendesk appends `/token` on the wire"
example = "agent@acme.com"
format = "email"
binds = "username.zendesk.api_token"

[[config]]
name = "help_center_api_token"
service = "help-center"
label = "API token"
help = "Reuse the Zendesk API token created under Admin Center → Apps and integrations → Zendesk API"
format = "token"
secret = true
docs_url = "https://support.zendesk.com/hc/en-us/articles/4408889192858"
binds = "credential.zendesk.api_token"

# Messaging uses the same Zendesk tenant host but a distinct app-scoped Sunshine Conversations
# Basic credential. `appId` is pinned into every selected path and never caller-controlled.
[[config]]
name = "messaging_subdomain"
service = "messaging"
label = "Zendesk subdomain"
help = "The part of your Zendesk URL before `.zendesk.com` — the same account subdomain used by Support"
example = "acme"
format = "subdomain"
docs_url = "https://support.zendesk.com/hc/en-us/articles/4409381383578"
binds = "endpoint.subdomain"

[[config]]
name = "messaging_app_id"
service = "messaging"
label = "Messaging app id"
help = "The Sunshine Conversations app id this connection manages, as one path-safe identifier"
example = "app_123"
docs_url = "https://developer.zendesk.com/api-reference/apps/apps-api/apps/"
binds = "path.appId"

[[config]]
name = "messaging_key_id"
service = "messaging"
label = "Messaging key id"
help = "The id half of an app-scoped Sunshine Conversations API key"
example = "key_123"
binds = "username.zendesk.messaging_key"

[[config]]
name = "messaging_key_secret"
service = "messaging"
label = "Messaging key secret"
help = "The secret half of the app-scoped Sunshine Conversations API key; Zendesk shows it only when the key is created"
format = "token"
secret = true
docs_url = "https://developer.zendesk.com/documentation/conversations/getting-started/using-the-api/"
binds = "credential.zendesk.messaging_key"
