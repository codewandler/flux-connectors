[[operations]]
id = "zendesk-ticket-search"
service = "default"
method = "GET"
path = "/api/v2/search.json"
description = "Search tickets with Zendesk search syntax, e.g. `type:ticket status:new`"
risk = "low"
idempotency = "idempotent"

# KNOWN NON-FUNCTIONAL until C-28 resolves it. Zendesk search expressions are colon-heavy and the
# plugin percent-encodes them strictly — spaces as `%20` never `+`, colons as `%3A`
# (`main.rs:426-441`, inventory §3.3.5). The emitted URL is assembled with `fmt`, which does no
# percent-encoding, and flux has no op that does. The operation is declared because dropping it
# would leave the connector short of the plugin it replaces; it is expected to mis-query until the
# encoding gap is closed.
[[operations.params.query]]
name = "query"
description = "Zendesk search expression"
required = true
schema = { type = "string" }

[[operations.params.query]]
name = "page"
description = "Page number, 1-based"
required = false
schema = { type = "integer", minimum = 1, default = 1 }

[[operations.params.query]]
name = "per_page"
description = "Results per page; Zendesk caps this at 100"
required = false
schema = { type = "integer", minimum = 1, maximum = 100, default = 100 }

# The search envelope. `results` is the only heterogeneous collection in this connector: Zendesk
# documents it as "tickets, users, groups, or organizations, as specified by the `result_type`
# property in each result object", so the discriminator is the thing worth recording. A consumer that
# assumed tickets — which is what this operation's own `query` is meant to ask for — would be right
# only for as long as the query says `type:ticket`, and this operation cannot reliably encode a query
# at all (see above).
[operations.response_schema]
type = "object"
required = ["results"]
properties = { results = { type = "array", description = "The matches, heterogeneous: each item carries a `result_type` naming what it is — `ticket`, `user`, `group` or `organization` — and its remaining fields are that resource's. Read `result_type` before reading anything else", items = { type = "object" } }, count = { type = "integer", description = "Total matches across all pages, not the size of this page" }, next_page = { type = "string", description = "URL of the following page, or null on the last page" }, previous_page = { type = "string", description = "URL of the preceding page, or null on the first page" }, facets = { description = "Present in every response and effectively unusable: Zendesk's own field table types it as a string while its example shows null, so no type is declared here rather than one of the two being guessed at" } }

[operations.quirks.pagination]
page = { page_param = "page", size_param = "per_page", page_size = 100, max_pages = 10 }

