# PagerDuty — hand-authored, no vendored OpenAPI spec.
#
# Transcribed by hand from PagerDuty's published REST API v2 reference
# (developer.pagerduty.com/api-reference), rather than vendored, consistent with how zendesk.toml,
# freshdesk.toml, github.toml, notion.toml, launchdarkly.toml and twilio.toml are authored today
# (§1.2 in `docs/designs/provider-operation-inventory.md`). Drift is therefore undetectable by
# machine until a `[spec]` pointer replaces this list.
#
# ---------------------------------------------------------------------------------------------
# THE FINDING THIS CONNECTOR WAS FILED FOR, AND HOW IT TURNED OUT
# ---------------------------------------------------------------------------------------------
#
# C-162 was chosen for `Authorization: Token token=<key>`, and its story called the credential a
# "substructure of the header value, not a suffix" — the vendor that would argue for a richer
# placement axis than a prefix. **It argued for one and then did not need it.**
#
# C-161 measured three blocked vendors side by side (Okta `SSWS <token>`, Statuspage
# `OAuth <key>`, PagerDuty `Token token=<key>`) and found one shape, not three: in every one, the
# credential **ends** the header value. `Token token=` reads like structured syntax, but the value is
# a fixed literal followed directly by the raw key, and `=` is just a character in a prefix. C-184
# then built exactly that axis — `AuthScheme::Header { name, prefix }` — deliberately with **no
# `suffix` and no value template**, because a single-substitution template can spell a header with
# zero substitution points (the credential silently dropped, the request unauthenticated, every
# artifact claiming otherwise), with two (the secret sent twice), or with text after the credential
# that no vendor pins. A prefix makes all three unspellable rather than merely refused.
# `docs/designs/unified-auth.md` §"The prefix axis, as built" records it, and
# `crates/connector-spec/tests/auth_prefix.rs::a_prefix_may_carry_punctuation_and_still_be_a_prefix`
# pins this exact spelling.
#
# So this connector needed no change to `connector-spec`: it is the first shipped provider to use the
# prefix axis, and it uses it in one line.
#
# ---------------------------------------------------------------------------------------------
# THE SECOND FINDING: `From` is a required *operation parameter*, because it cannot be anything else
# ---------------------------------------------------------------------------------------------
#
# PagerDuty requires a `From` header on an incident write, carrying the login address of the
# PagerDuty user the action is taken on behalf of. A general-access REST API key has no user context
# of its own, so PagerDuty answers 400 without it.
#
# It is emphatically **not a credential**: it authenticates nothing, gates nothing, and is not
# secret. The story asks which of the two remaining readings is right — operator configuration or a
# caller argument — and the model answers it rather than leaving it to taste:
#
#   - `ConfigField::binds` (`crates/connector-spec/src/config.rs:239-267`) admits exactly five
#     destinations: `endpoint.<variable>`, `credential.<name>`, `username.<name>`,
#     `oauth.client_id`, `oauth.client_secret`. **There is no `header.*` binding.** A configured
#     `From` is not merely unwise here, it is unspellable — a collected value has nowhere to go.
#   - Nor can it be smuggled in as a vendor-fixed `const_headers` entry: a constant reaches the
#     request as a literal, and this value is neither constant nor authorable. It identifies a
#     *person*, and this repository authors no personal data (see the note at the foot of this file).
#
# What is left is a caller-facing `params.header`, which is exactly what it is: the acting user is a
# fact about the call, not about the connection. `providers/stripe.toml:411`'s `Idempotency-Key` is
# the same shape — a required header a caller supplies per request. It is declared on the two writes
# only; PagerDuty does not require it on a read, and a read demanding somebody's address to fetch a
# list would be collecting a personal identifier it has no use for.
#
# ---------------------------------------------------------------------------------------------
# THE THIRD FINDING: NO OPERATION DECLARES A PAGINATION QUIRK, AND THAT IS THE ANSWER
# ---------------------------------------------------------------------------------------------
#
# PagerDuty pages every collection with `limit`/`offset`. `Pagination`
# (`crates/connector-spec/src/ir.rs:355-378`) has exactly two variants and **neither is that shape**:
#
#   - `Page { page_param, size_param, page_size, max_pages }` describes a page *number*, which the
#     next request increments by one. `offset` is not a page number — it is a row count that the next
#     request advances by `limit` — so `page_param = "offset"` would record a claim about PagerDuty
#     that is simply false, while compiling clean and reading correctly to a reviewer.
#   - `Cursor { cursor_param, next_cursor_pointer, max_pages }` needs the response to carry the next
#     cursor. PagerDuty's list responses carry `limit`, `offset`, `more` and `total` — a *flag*, not
#     a cursor — so there is no pointer to name.
#
# **Nothing emits a pagination loop today**, so the harm is latent rather than live: `Pagination` is a
# declaration and no more (`crates/connector-spec/src/ir.rs:352`, "Compiling this into Flux control
# flow is C-12; this is only its declaration"), and `connector-flux` reads only
# `quirks.error_envelope`. That is exactly why declaring one falsely is worth refusing *now*: C-12
# compiles these into control flow, and at that point a `Page` declared over an offset becomes a loop
# that re-reads all but one row of each window. It would not run forever — `max_pages` is mandatory on
# every variant precisely so a loop is bounded (`ir.rs:350-353`) — it would just be silently wrong
# until the cap, which is the more expensive failure to notice.
#
# The parameters are therefore declared and the quirk is not, following the call
# `providers/launchdarkly.toml:123` already made for the identical vendor shape: a caller pages by
# incrementing `offset` by `limit` itself. `crates/connector-flux/tests/pagerduty_connector.rs::no_pagerduty_operation_declares_a_pagination_quirk`
# pins the absence, so that it cannot later be "completed" into a false declaration by someone who
# reads the missing quirk as an oversight. A `limit`/`offset` variant is a real gap in `Pagination`;
# it is a change to the IR that a connector story does not get to make on its way past.
#
# ---------------------------------------------------------------------------------------------
# EXCLUDED, deliberately, rather than guessed at:
# ---------------------------------------------------------------------------------------------
#
# - **`since` / `until` on `/incidents` and `/oncalls`.** Both take an ISO 8601 instant, whose `:`
#   and `+` are precisely the characters this emitter's query assembly does not percent-encode
#   (C-29, `zendesk-ticket-search`). A `+05:00` offset would arrive form-decoded as a space. Left out
#   rather than declared with a `pattern` narrow enough to dodge the gap, because the useful values
#   are the ones that trip it.
# - **Every `[]` array filter** — `statuses[]`, `service_ids[]`, `team_ids[]`, `urgencies[]`,
#   `user_ids[]`, `include[]`. The brackets live in the parameter *name*, which is the same class of
#   defect `providers/twilio.toml` records for Twilio's `DateSent<` range operators: `[` and `]` are
#   reserved in a URL query component and this emitter does not encode a parameter name at all.
# - **`sort_by` on `/incidents`.** Its value is `field:direction` (`created_at:desc`); the `:` has
#   the same encoding problem, and without it the parameter is half a feature.
# - **`query` on `/services`.** A free-text service-name search, which is the exact shape of
#   `zendesk-ticket-search`'s open defect: an unencoded `&` or `#` in the search text corrupts the
#   request and can inject a parameter.
# - **Creating, merging, snoozing or reassigning an incident, and anything under alerts, log entries,
#   escalation policies, schedules, users or webhook subscriptions.** Not guessed at. A confident six
#   beats a plausible twenty, and a hallucinated path ships as a 404 no contract test can catch.
# - **A `[[channels]]` webhook binding.** PagerDuty v3 webhook subscriptions sign deliveries with
#   `X-PagerDuty-Signature`, and this file declares no `[[events]]` and no signing credential rather
#   than describing a verification scheme it has not verified against the vendor. That is a separate
#   story's work, not a line to add here on the way past.
#
# ---------------------------------------------------------------------------------------------
# NO PERSONAL DATA. PagerDuty's on-call and incident payloads are full of it — a user reference
# carries a person's display name, and the `From` header carries their login address. Nothing below
# names a person, and no field carries an `example`. The shapes are described; no value is authored.
# ---------------------------------------------------------------------------------------------

id = "pagerduty"
vendor = "PagerDuty"

# The reverse-DNS authority this connector publishes under (C-92). It leads every rendered address
# and every credential path — `tenants/<tenant>/com.pagerduty.api/<credential>` — and until it was
# declared `Credentials::reference` refused with `NoCredentialAddress`, so this connector could not
# authenticate at all.
#
# Derived from `pagerduty.com`, the vendor's own primary domain, in reverse-DNS form, with the
# trailing `api` label the already-shipped authorities carry (`com.slack.api`, `com.vercel.api`,
# `io.fly.api`).
#
# **Never repointed once published** (`AGENTS.md`: "an address, once published, is not reused"). A
# different spelling mints a new address and deprecates this one, because tenants provision secrets
# under this path.
authority = "com.pagerduty.api"

# **No `api_version`: this vendor puts no version segment in the URL at all.** Every operation path
# below is unversioned (`/incidents`, `/oncalls`), so there is nothing the file itself spells and
# nothing to record without asserting a vendor fact from outside it. A `pid` and a credential path
# render without one; only a `gid` needs both halves.

# One host for every account. PagerDuty has no per-tenant API subdomain the way zendesk and freshdesk
# do (its `*.pagerduty.com` subdomains are the web UI, not the API), so `base_url` is a bound literal
# with no `{placeholder}` and there is no `[[config]] binds = "endpoint.*"` field.
base_url = "https://api.pagerduty.com"

description = "PagerDuty incident response: read incidents, services and who is on call, and acknowledge or resolve an incident"

# The "Test connection" operation: a bounded read taking no required argument, which is what lets a
# settings page call it unattended.
verify = "pagerduty-service-list"

# Every operation authenticates the same way.
default_auth = [{ credentials = ["pagerduty.api_token"] }]

# The one header PagerDuty fixes and every request needs. It is a *constant*, so it is declared here
# and emitted as a literal rather than as a `params.header` a caller could override — C-55's finding,
# the same one `providers/github.toml` and `providers/notion.toml` record for their own vendor
# version headers. Pinning v2 is what stops a future default on PagerDuty's side from changing every
# response shape declared below without a diff in this repository.
#
# An inline table deliberately: a `[const_headers]` section header would scope every provider scalar
# written after it.
const_headers = { "Accept" = "application/vnd.pagerduty+json;version=2" }

# ---------------------------------------------------------------------------------------------
# Credentials
# ---------------------------------------------------------------------------------------------

[[auth]]
name = "pagerduty.api_token"
# THE PREFIX AXIS, USED FOR THE FIRST TIME BY A SHIPPED PROVIDER. See the header comment: the
# credential ends the header value, so `Token token=` is the whole of what precedes it. There is no
# trailing space — PagerDuty's key follows the `=` directly — and there is deliberately no `suffix`
# and no template for anything to follow it with.
scheme = { header = { name = "Authorization", prefix = "Token token=" } }
env = ["PAGERDUTY_API_TOKEN"]
description = "PagerDuty REST API access key, sent as the Authorization header after the literal `Token token=`. A read-only key satisfies the four read operations; the two incident writes need a full-access key"

# ---------------------------------------------------------------------------------------------
# Operations — 6: four reads, and two writes that are one vendor endpoint split in two.
#
# `limit` and `offset` appear on every list and **no operation declares a pagination quirk** — see
# the third finding in the header comment. A caller pages by adding `limit` to `offset` itself.
# ---------------------------------------------------------------------------------------------

[[services]]
# C-153. `default` is the reserved implicit service, and a provider with one API surface
# declares no services at all — so this entry exists for exactly one reason: a tag attaches
# to a service, and there is no other service here to attach it to. It carries `tags` and
# nothing else, which is what keeps `default` implicit and this file emitting the same
# `pagerduty.flux` it emitted before.
name = "default"
tags = ["incident-response"]

[[operations]]
id = "pagerduty-incident-list"
method = "GET"
direction = "read"
path = "/incidents"
description = "List the incidents this key can see, across every service it has access to. Returns one page; read `more` to learn whether another page exists, and page by adding `limit` to `offset`. No status, service, team or time filter is offered by this connector — see pagerduty-incident-get to inspect one incident in full"
risk = "low"
idempotency = "idempotent"

[[operations.params.query]]
name = "limit"
description = "Maximum number of incidents to return in this page. PagerDuty caps this at 100"
required = false
schema = { type = "integer", minimum = 1, maximum = 100 }

[[operations.params.query]]
name = "offset"
description = "Number of incidents to skip before this page begins. To read the next page, add the `limit` just used to the `offset` just used — this is not a page number"
required = false
schema = { type = "integer", minimum = 0 }

# developer reference: developer.pagerduty.com/api-reference — List incidents.
#
# `service`, `escalation_policy`, `teams` and `priority` are PagerDuty *reference* objects: each is
# `{id, type, summary, self, html_url}` where `summary` is a human-readable label. They are described
# rather than enumerated here because `summary` on a user reference is a person's name, and this file
# does not model personal data in more detail than a caller needs to pass an id back.
[operations.response_schema]
type = "object"
required = ["incidents"]
properties = { incidents = { type = "array", description = "This page's incidents", items = { type = "object", required = ["id", "type", "status"], properties = { id = { type = "string", description = "The incident's own id — pass this as `id` to pagerduty-incident-get, -acknowledge or -resolve" }, type = { const = "incident" }, summary = { type = "string", description = "A short human-readable label for the incident, usually its title" }, self = { type = "string", description = "The API URL of this incident" }, html_url = { type = "string", description = "The PagerDuty web UI URL a human would open" }, incident_number = { type = "integer", description = "The account-scoped sequence number PagerDuty displays, distinct from `id`" }, title = { type = "string" }, description = { type = "string" }, status = { type = "string", enum = ["triggered", "acknowledged", "resolved"], description = "triggered means nobody has taken it; acknowledged means somebody is working it and escalation has paused; resolved is terminal" }, urgency = { type = "string", enum = ["high", "low"], description = "Whether the service's escalation policy pages immediately (high) or notifies without paging (low)" }, incident_key = { type = "string", description = "The deduplication key the triggering integration supplied, when it supplied one" }, created_at = { type = "string", format = "date-time" }, updated_at = { type = "string", format = "date-time" }, last_status_change_at = { type = "string", format = "date-time" }, resolved_at = { type = "string", format = "date-time", description = "Null until the incident is resolved" }, service = { type = "object", description = "A reference to the service this incident is on: `{id, type, summary, self, html_url}`. Pass its `id` to nothing here — pagerduty-service-list returns the full representation" }, escalation_policy = { type = "object", description = "A reference to the escalation policy governing this incident" }, teams = { type = "array", description = "References to the teams the incident is visible to", items = { type = "object" } }, priority = { type = "object", description = "A reference to the account's configured priority level, when the account uses priorities; null otherwise" }, assignments = { type = "array", description = "Who the incident is currently assigned to, each `{at, assignee}` where `assignee` is a user reference", items = { type = "object" } }, acknowledgements = { type = "array", description = "Who has acknowledged the incident and when, each `{at, acknowledger}`. Empty unless status is acknowledged", items = { type = "object" } }, alert_counts = { type = "object", description = "How many alerts rolled up into this incident, `{all, triggered, resolved}`" } } } }, limit = { type = "integer", description = "The limit this page was read with" }, offset = { type = "integer", description = "The offset this page was read from" }, more = { type = "boolean", description = "True when another page exists past this one. This is the only continuation signal PagerDuty sends — there is no cursor" }, total = { type = "integer", description = "The total matching incidents. Null unless the request asked for it, which this connector does not" } }

# ---------------------------------------------------------------------------------------------

[[operations]]
id = "pagerduty-incident-get"
method = "GET"
direction = "read"
path = "/incidents/{id}"
description = "Fetch one incident in full, including its current status, urgency, service, assignments and acknowledgements. Read this before acknowledging or resolving, because PagerDuty refuses a status change that does not follow from the incident's current status"
risk = "low"
idempotency = "idempotent"

[[operations.params.path]]
name = "id"
description = "The incident's own id, from pagerduty-incident-list's `id` field. Not the `incident_number` PagerDuty's web UI displays"
required = true
schema = { type = "string", minLength = 1 }

# developer reference: developer.pagerduty.com/api-reference — Get an incident. The incident is
# wrapped in a single-key envelope, unlike the flat top-level object twilio and launchdarkly return.
[operations.response_schema]
type = "object"
required = ["incident"]
properties = { incident = { type = "object", required = ["id", "type", "status"], description = "The incident, in the same shape pagerduty-incident-list's array carries", properties = { id = { type = "string" }, type = { const = "incident" }, summary = { type = "string" }, self = { type = "string" }, html_url = { type = "string" }, incident_number = { type = "integer" }, title = { type = "string" }, description = { type = "string" }, status = { type = "string", enum = ["triggered", "acknowledged", "resolved"] }, urgency = { type = "string", enum = ["high", "low"] }, incident_key = { type = "string" }, created_at = { type = "string", format = "date-time" }, updated_at = { type = "string", format = "date-time" }, last_status_change_at = { type = "string", format = "date-time" }, resolved_at = { type = "string", format = "date-time", description = "Null until the incident is resolved" }, resolve_reason = { type = "object", description = "Why the incident was resolved, when it was resolved by being merged into another; null otherwise" }, service = { type = "object", description = "A reference to the service this incident is on" }, escalation_policy = { type = "object" }, teams = { type = "array", items = { type = "object" } }, priority = { type = "object", description = "Null unless the account uses priorities" }, assignments = { type = "array", description = "Each `{at, assignee}`, where `assignee` is a user reference", items = { type = "object" } }, acknowledgements = { type = "array", description = "Each `{at, acknowledger}`. Empty unless status is acknowledged", items = { type = "object" } }, alert_counts = { type = "object", description = "`{all, triggered, resolved}`" }, first_trigger_log_entry = { type = "object", description = "A reference to the log entry that opened the incident" } } } }

