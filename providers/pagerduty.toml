required = false
schema = { type = "integer", minimum = 1, maximum = 100 }

[[operations.params.query]]
name = "offset"
description = "Number of services to skip before this page begins. To read the next page, add the `limit` just used to the `offset` just used"
required = false
schema = { type = "integer", minimum = 0 }

# developer reference: developer.pagerduty.com/api-reference — List services.
[operations.response_schema]
type = "object"
required = ["services"]
properties = { services = { type = "array", description = "This page's services", items = { type = "object", required = ["id", "type", "name"], properties = { id = { type = "string", description = "The service's own id" }, type = { const = "service" }, summary = { type = "string" }, self = { type = "string" }, html_url = { type = "string" }, name = { type = "string" }, description = { type = "string" }, status = { type = "string", enum = ["active", "warning", "critical", "maintenance", "disabled"], description = "The service's current health as PagerDuty sees it: active means no open incidents, warning and critical mean open incidents of increasing urgency, maintenance means a maintenance window is in effect, disabled means the service accepts no new incidents" }, created_at = { type = "string", format = "date-time" }, last_incident_timestamp = { type = "string", format = "date-time", description = "When this service last opened an incident; null if it never has" }, auto_resolve_timeout = { type = "integer", description = "Seconds after which an unacknowledged incident auto-resolves. Null when the service never auto-resolves" }, acknowledgement_timeout = { type = "integer", description = "Seconds after which an acknowledged incident re-triggers. Null when an acknowledgement never expires" }, escalation_policy = { type = "object", description = "A reference to the escalation policy this service pages through" }, teams = { type = "array", items = { type = "object" } }, integrations = { type = "array", description = "References to the integrations that can open incidents on this service", items = { type = "object" } } } } }, limit = { type = "integer" }, offset = { type = "integer" }, more = { type = "boolean", description = "True when another page exists past this one" }, total = { type = "integer", description = "Null unless the request asked for it, which this connector does not" } }

