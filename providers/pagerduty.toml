[[operations]]
id = "pagerduty-oncall-list"
method = "GET"
direction = "read"
path = "/oncalls"
description = "List who is currently on call, as one entry per escalation policy, escalation level and user. An entry with no `schedule` is a user attached directly to an escalation level rather than through a rotation. Time filtering is not offered by this connector, so this answers `who is on call now`"
risk = "low"
idempotency = "idempotent"

[[operations.params.query]]
name = "limit"
description = "Maximum number of on-call entries to return in this page. PagerDuty caps this at 100"
required = false
schema = { type = "integer", minimum = 1, maximum = 100 }

[[operations.params.query]]
name = "offset"
description = "Number of on-call entries to skip before this page begins. To read the next page, add the `limit` just used to the `offset` just used"
required = false
schema = { type = "integer", minimum = 0 }

# developer reference: developer.pagerduty.com/api-reference — List all of the on-calls.
#
# `user` is a reference whose `summary` is a person's name. It is described, not exemplified: the
# field is what makes the answer useful, and no value for it is authored anywhere in this repository.
[operations.response_schema]
type = "object"
required = ["oncalls"]
properties = { oncalls = { type = "array", description = "This page's on-call entries. One user can appear more than once — once per escalation policy and level they cover", items = { type = "object", properties = { escalation_policy = { type = "object", description = "A reference to the escalation policy this entry covers: `{id, type, summary, self, html_url}`" }, escalation_level = { type = "integer", description = "Which level of that policy this entry sits at. Level 1 is paged first" }, schedule = { type = "object", description = "A reference to the on-call schedule that placed this user here. Null when the user is attached to the escalation level directly rather than through a rotation" }, user = { type = "object", description = "A reference to the person on call: `{id, type, summary, self, html_url}`, where `summary` is their display name" }, start = { type = "string", format = "date-time", description = "When this on-call period began. Null for a permanent, non-rotating assignment" }, end = { type = "string", format = "date-time", description = "When this on-call period ends. Null for a permanent, non-rotating assignment" } } } }, limit = { type = "integer" }, offset = { type = "integer" }, more = { type = "boolean", description = "True when another page exists past this one" }, total = { type = "integer", description = "Null unless the request asked for it, which this connector does not" } }

# ---------------------------------------------------------------------------------------------
# THE TWO WRITES. PagerDuty exposes **one** endpoint for both — `PUT /incidents/{id}` with
# `incident.status` — and this connector deliberately declares it twice.
#
# A single operation taking a `status` enum would need a single `risk` covering both outcomes, and
# the only honest value would be the higher of the two. That is coarser than the facts:
#
#   - **Acknowledging says a human is on it.** It stops the escalation clock and takes the incident
#     off the next responder's page. It is reversible in the sense that matters — the incident is
#     still open, still assigned, still on every dashboard — and its blast radius is one rotation's
#     paging. `risk = "medium"`.
#   - **Resolving closes the incident.** It comes off the open-incident view, the notifications stop,
#     and if the underlying condition is still live the next alert opens a *new* incident with a new
#     number and no history of this one. An agent resolving an incident nobody actually fixed is the
#     failure worth putting a reviewer in front of. `risk = "high"`.
#
# Neither is `destructive`: nothing is deleted, and a resolved incident can be reopened by
# re-triggering. Both are `PUT`s carrying a pinned constant status, so neither takes a caller-supplied
# `status` — the operation *is* the status, which is also what keeps a model from acknowledging when
# it meant to resolve by passing the wrong enum word.
#
# `idempotency = "idempotent"`: `PUT` is idempotent under RFC 9110 §9.2.2, and repeating either call
# lands the incident in the same state it was already in.
#
# Both require `From`. See the second finding in the header comment for why it is a caller-facing
# header parameter and not configuration.
# ---------------------------------------------------------------------------------------------

[[operations]]
id = "pagerduty-incident-acknowledge"
method = "PUT"
direction = "write"
path = "/incidents/{id}"
description = "Acknowledge one incident, on behalf of a named PagerDuty user. This stops the escalation clock and tells the rotation that somebody is working the incident; it does not close it. PagerDuty refuses the change if the incident is already resolved, and answers that as data rather than as a failure"
risk = "medium"
idempotency = "non_idempotent"

[[operations.params.path]]
name = "id"
description = "The incident's own id, from pagerduty-incident-list's `id` field"
required = true
schema = { type = "string", minLength = 1 }

# The `From` header. Required by PagerDuty, supplied by the caller, and modelled as a header
# parameter because there is no other honest place for it — see the header comment. No `example`: the
# value is a person's login address.
[[operations.params.header]]
name = "from_email"
wire = "From"
description = "The login address of the PagerDuty user this acknowledgement is recorded against. It must belong to a user in this PagerDuty account; PagerDuty answers 400 otherwise. A REST API key carries no user identity of its own, which is why this cannot be inferred"
required = true
schema = { type = "string", format = "email", minLength = 3 }

# The body is `{"incident": {"type": "incident_reference", "status": "acknowledged"}}` and every part
# of it is fixed. Both fields are pinned with a JSON Schema `const`, which already means "this value
# and no other": codegen sends them and keeps them out of the op signature (C-8,
# `connector-flux`'s `constant`), so no model is asked to retype the operation's own name.
[[operations.params.body]]
name = "incident_type"
wire = "incident.type"
description = "Constant `incident_reference` — PagerDuty's discriminator for a partial incident object in a write. Not caller-supplied"
required = true
schema = { type = "string", const = "incident_reference" }

[[operations.params.body]]
name = "status"
wire = "incident.status"
description = "Constant `acknowledged` — not caller-supplied. Resolving is pagerduty-incident-resolve, a separate operation with its own risk classification"
required = true
schema = { type = "string", const = "acknowledged" }

# developer reference: developer.pagerduty.com/api-reference — Update an incident. The updated
# incident comes back in the same single-key envelope pagerduty-incident-get returns.
[operations.response_schema]
type = "object"
required = ["incident"]
properties = { incident = { type = "object", required = ["id", "status"], description = "The incident after the update, in the shape pagerduty-incident-get returns. Read `status` back to confirm the acknowledgement took effect", properties = { id = { type = "string" }, type = { const = "incident" }, incident_number = { type = "integer" }, title = { type = "string" }, status = { type = "string", enum = ["triggered", "acknowledged", "resolved"], description = "`acknowledged` after a successful call" }, urgency = { type = "string", enum = ["high", "low"] }, html_url = { type = "string" }, updated_at = { type = "string", format = "date-time" }, last_status_change_at = { type = "string", format = "date-time" }, service = { type = "object" }, acknowledgements = { type = "array", description = "Each `{at, acknowledger}`; the acknowledger is the user named by the From header", items = { type = "object" } } } } }

# ---------------------------------------------------------------------------------------------

[[operations]]
id = "pagerduty-incident-resolve"
method = "PUT"
direction = "write"
path = "/incidents/{id}"
description = "Resolve one incident, on behalf of a named PagerDuty user. This closes it: it leaves the open-incident view and notifications stop. If the underlying condition is still live, the next alert opens a brand-new incident rather than reopening this one, so resolve only what is actually fixed"
risk = "high"
idempotency = "non_idempotent"

[[operations.params.path]]
name = "id"
description = "The incident's own id, from pagerduty-incident-list's `id` field"
required = true
schema = { type = "string", minLength = 1 }

[[operations.params.header]]
name = "from_email"
wire = "From"
description = "The login address of the PagerDuty user this resolution is recorded against. It must belong to a user in this PagerDuty account; PagerDuty answers 400 otherwise. A REST API key carries no user identity of its own, which is why this cannot be inferred"
required = true
schema = { type = "string", format = "email", minLength = 3 }

[[operations.params.body]]
name = "incident_type"
wire = "incident.type"
description = "Constant `incident_reference` — PagerDuty's discriminator for a partial incident object in a write. Not caller-supplied"
required = true
schema = { type = "string", const = "incident_reference" }

[[operations.params.body]]
name = "status"
wire = "incident.status"
description = "Constant `resolved` — not caller-supplied. Acknowledging is pagerduty-incident-acknowledge, a separate operation with a lower risk classification"
required = true
schema = { type = "string", const = "resolved" }

# developer reference: developer.pagerduty.com/api-reference — Update an incident.
[operations.response_schema]
type = "object"
required = ["incident"]
properties = { incident = { type = "object", required = ["id", "status"], description = "The incident after the update. Read `status` back to confirm the resolution took effect", properties = { id = { type = "string" }, type = { const = "incident" }, incident_number = { type = "integer" }, title = { type = "string" }, status = { type = "string", enum = ["triggered", "acknowledged", "resolved"], description = "`resolved` after a successful call" }, urgency = { type = "string", enum = ["high", "low"] }, html_url = { type = "string" }, updated_at = { type = "string", format = "date-time" }, last_status_change_at = { type = "string", format = "date-time" }, resolved_at = { type = "string", format = "date-time" }, service = { type = "object" } } } }

# ---------------------------------------------------------------------------------------------
# Configuration — what a product asks a human for before any of the above can run.
#
# Exactly one field. There is no per-tenant host to configure, and `From` is not here: it has no
# binding to reach (`parse_binding` has no `header.*` destination) and it is a per-call fact rather
# than a per-connection one.
# ---------------------------------------------------------------------------------------------

[[config]]
name = "api_token"
label = "PagerDuty API access key"
help = "Create a REST API key in PagerDuty under Integrations, then API Access Keys. A read-only key is enough to list incidents, services and on-calls; acknowledging or resolving an incident needs a full-access key. PagerDuty shows the key once, when it is created"
format = "token"
secret = true
docs_url = "https://developer.pagerduty.com/docs/authentication"
binds = "credential.pagerduty.api_token"
