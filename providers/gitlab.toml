# ---------------------------------------------------------------------------------------------
# The one write. **Publishes to a surface project members (and, on a public project, the world) can
# read**, exactly the reasoning `providers/github.toml` states for its own issue-create: `risk =
# "high"`, not `medium`, because a reviewer would want to see this before it happens, and
# `idempotency = "non_idempotent"` because GitLab issues no idempotency key on this endpoint and a
# retry creates a second issue, not the same one.
# ---------------------------------------------------------------------------------------------

[[operations]]
service = "default"
id = "gitlab-issue-create"
method = "POST"
direction = "write"
path = "/projects/{project_id}/issues"
description = "Open a new issue on a project. Visible immediately to everyone with access to the project (the whole world, if the project is public) and notifies its watchers"
risk = "high"
idempotency = "non_idempotent"

[[operations.params.path]]
name = "project_id"
description = "The project's numeric id. GitLab also accepts a URL-encoded namespaced path (`group%2Fproject`) on this same segment, but this pipeline has no percent-encoder, so only the numeric id is accepted here"
required = true
schema = { type = "integer", minimum = 1 }

[[operations.params.body]]
name = "title"
description = "The issue title; the only required field"
required = true
schema = { type = "string", minLength = 1 }

[[operations.params.body]]
name = "description"
description = "The issue body as Markdown"
required = false
schema = { type = "string" }

[[operations.params.body]]
name = "labels"
description = "Comma-separated label names, e.g. \"bug,urgent\" — GitLab's issue-create endpoint takes labels as one comma-separated string, not an array. A name the project does not have yet is created"
required = false
schema = { type = "string" }

[operations.response_schema]
type = "object"
required = ["id", "iid", "project_id", "title", "state"]
properties = { id = { type = "integer", description = "The new issue's global id" }, iid = { type = "integer", description = "The project-scoped number to address it by afterwards, with gitlab-issue-get" }, project_id = { type = "integer" }, title = { type = "string" }, description = { type = "string" }, state = { type = "string", description = "`opened` on a freshly created issue" }, labels = { type = "array", description = "The labels that were applied; a name the project did not have is created by this call", items = { type = "string" } }, author = { type = "object", description = "The account the token belongs to — a created issue is attributed to it" }, web_url = { type = "string", format = "uri", description = "The issue's page — the link to give a human" }, created_at = { type = "string", format = "date-time" } }

