type = "object"
required = ["id", "project_id", "status", "ref"]
properties = { id = { type = "integer", description = "The pipeline's own id, what this operation takes" }, iid = { type = "integer", description = "The project-scoped pipeline number, distinct from `id`" }, project_id = { type = "integer" }, sha = { type = "string", description = "The commit SHA the pipeline ran against" }, ref = { type = "string", description = "The branch or tag name that triggered it" }, status = { type = "string", enum = ["created", "waiting_for_resource", "preparing", "pending", "running", "success", "failed", "canceled", "skipped", "manual", "scheduled"] }, source = { type = "string", description = "What triggered it, e.g. `push`, `web`, `schedule`, `api`, `merge_request_event`" }, web_url = { type = "string", format = "uri" }, created_at = { type = "string", format = "date-time" }, updated_at = { type = "string", format = "date-time" }, started_at = { type = "string", format = "date-time", description = "Null before it starts running" }, finished_at = { type = "string", format = "date-time", description = "Null while still running" }, duration = { type = "integer", description = "Run time in seconds, null while not yet finished" } }

# ---------------------------------------------------------------------------------------------

[[operations]]
service = "default"
id = "gitlab-branch-list"
method = "GET"
direction = "read"
path = "/projects/{project_id}/repository/branches"
description = "List a project's repository branches"
risk = "low"
idempotency = "idempotent"

[[operations.params.path]]
name = "project_id"
description = "The project's numeric id. GitLab also accepts a URL-encoded namespaced path (`group%2Fproject`) on this same segment, but this pipeline has no percent-encoder, so only the numeric id is accepted here"
required = true
schema = { type = "integer", minimum = 1 }

[[operations.params.query]]
name = "page"
description = "1-based page number"
required = false
schema = { type = "integer", minimum = 1 }

[[operations.params.query]]
name = "per_page"
description = "Results per page"
required = false
schema = { type = "integer", minimum = 1, maximum = 100 }

[operations.response_schema]
type = "array"
description = "The project's branches"
items = { type = "object", required = ["name", "commit"], properties = { name = { type = "string" }, merged = { type = "boolean", description = "Whether this branch has been merged into the project's default branch" }, protected = { type = "boolean" }, default = { type = "boolean", description = "Whether this is the project's default branch" }, developers_can_push = { type = "boolean" }, developers_can_merge = { type = "boolean" }, can_push = { type = "boolean", description = "Whether the authenticated token's user can push to this branch" }, web_url = { type = "string", format = "uri" }, commit = { type = "object", description = "The branch tip: `{id, short_id, title, author_name, authored_date, message}`" } } }

# ---------------------------------------------------------------------------------------------
# Configuration — what a human supplies before any of the above runs
#
# One field, because one value is all this connector needs: gitlab.com is a fixed host with no
# tenant subdomain and no OAuth app to register.
# ---------------------------------------------------------------------------------------------

[[config]]
name = "origin"
service = "default"
# **One deployment, one origin question** (C-529). The API surface and the OAuth surface are the same
# GitLab server, so they are the same fact — and asking twice is not merely redundant. Two slots that
# must agree and are not forced to is how a token exchange gets pointed at a host the API never
# approved, which is the whole reason `approval = "operator"` is below. The head service keeps the
# address; `login` resolves `{origin}` from this same value, under this same approval.
also_services = ["login"]
label = "GitLab origin"
help = "The HTTPS origin only, without `/api/v4` or another path. Leave the default for GitLab.com; a self-managed origin requires deployment/operator approval before it becomes active"
example = "https://gitlab.company.example"
format = "origin"
required = false
default = "https://gitlab.com"
approval = "operator"
docs_url = "https://docs.gitlab.com/administration/"
binds = "endpoint.origin"

# ---------------------------------------------------------------------------------------------
# The OAuth application, registered once by whoever runs the product (C-530).
#
# These are **operator** level and the level is derived, never authored: it is a consequence of
# binding `oauth.*`. That derivation is the thing protecting an end user here — asking a tenant for a
# client secret would hand them the product's own credential, which the configuration contract calls
# out as a real defect in both directions.
#
# The client id is public by specification (RFC 6749 §2.2) and the secret is not, which is the whole
# difference between the two declarations below.
# ---------------------------------------------------------------------------------------------

[[config]]
name = "oauth_client_id"
service = "default"
label = "GitLab OAuth application id"
help = "Create an application under Admin -> Applications (self-managed) or User Settings -> Applications (gitlab.com), with the redirect URI your deployment serves. This is the application id, which is public"
example = "a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2"
format = "text"
required = false
docs_url = "https://docs.gitlab.com/integration/oauth_provider/"
binds = "oauth.client_id"

[[config]]
name = "oauth_redirect_uri"
service = "default"
label = "GitLab OAuth redirect URI"
help = "The callback address this deployment serves, registered as a redirect URI on the application above. GitLab matches it exactly, so it must be the same string in both places — including the scheme, any port, and no trailing slash"
example = "https://exchange.internal/api/oauth/callback"
format = "url"
required = false
docs_url = "https://docs.gitlab.com/integration/oauth_provider/"
binds = "oauth.redirect_uri"

[[config]]
name = "oauth_client_secret"
service = "default"
label = "GitLab OAuth application secret"
help = "The application secret issued beside the id above. Supplied once by whoever runs this deployment, never by an end user"
format = "token"
secret = true
required = false
docs_url = "https://docs.gitlab.com/integration/oauth_provider/"
binds = "oauth.client_secret"

[[config]]
name = "token"
service = "default"
label = "GitLab personal access token"
help = "Create one in the selected GitLab installation's User Settings -> Access Tokens. Grant read_api for every read below, or api if you also want gitlab-issue-create to work"
format = "token"
secret = true
docs_url = "https://docs.gitlab.com/ee/user/profile/personal_access_tokens.html"
binds = "credential.gitlab.token"
