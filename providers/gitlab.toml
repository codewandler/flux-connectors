description = "Limit to projects the authenticated user owns"
required = false
schema = { type = "boolean" }

[[operations.params.query]]
name = "min_access_level"
description = "Only projects where the user has at least this access level. GitLab's scale: 10 guest, 20 reporter, 30 developer, 40 maintainer, 50 owner"
required = false
schema = { type = "integer", enum = [10, 20, 30, 40, 50] }

[[operations.params.query]]
name = "page"
description = "1-based page number"
required = false
schema = { type = "integer", minimum = 1 }

[[operations.params.query]]
name = "per_page"
description = "Results per page, at most 100"
required = false
schema = { type = "integer", minimum = 1, maximum = 100 }

[operations.response_schema]
type = "array"
items = { type = "object", required = ["id", "name", "path_with_namespace"], properties = { id = { type = "integer", description = "The project's numeric id — this is the `project_id` every other operation in this connector takes" }, name = { type = "string" }, path = { type = "string" }, path_with_namespace = { type = "string", description = "The namespaced path, `group/subgroup/project`. Human-facing only: it cannot be passed as `project_id`" }, description = { type = "string" }, default_branch = { type = "string" }, visibility = { type = "string", description = "`private`, `internal` or `public`" }, web_url = { type = "string", format = "uri" }, http_url_to_repo = { type = "string", format = "uri", description = "The HTTPS clone URL. Cloning is not a connector operation — this is the address a git client is given" }, last_activity_at = { type = "string", format = "date-time" } } }

